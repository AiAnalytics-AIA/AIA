# Local development dependencies only. The application itself runs on the host
# (uvicorn / next dev) so that reloads stay fast; this file provides the backing
# services that must behave like production.
#
#   docker compose up -d      start Postgres and object storage
#   make migrate              apply schema migrations
#   make dev                  run the API and web client
services:
  postgres:
    # Pinned to the production major version: a migration that works on 16 and
    # fails on 17 must fail in development, not in a deploy.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aia
      POSTGRES_PASSWORD: aia_local_dev
      POSTGRES_DB: aia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aia -d aia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No queue or cache service, deliberately. PostgreSQL is both the authoritative
  # store and the v0.1 queue -- workers claim with FOR UPDATE SKIP LOCKED -- so
  # there is nothing a broker or Redis would solve here. See
  # docs/architecture/adr/0002-postgresql-authoritative-store.md.

  minio:
    # S3-compatible artifact storage, so the storage adapter exercises the real
    # API locally instead of a filesystem stub that hides bugs.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aia_local
      MINIO_ROOT_PASSWORD: aia_local_dev
      # Local synthetic data only. The static test key lets MinIO honor the
      # application's SSE-S3 writes without changing production storage rules.
      MINIO_KMS_SECRET_KEY: local-dev-only:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  minio_data:
