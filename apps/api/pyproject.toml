[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aia-api"
version = "0.1.0"
description = "AIA HTTP API"
requires-python = ">=3.12"
dependencies = [
    "aia-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    # Cognito JWT validation. The [crypto] extra pulls in `cryptography`, which
    # is required for RS256 -- without it every token verification fails at
    # import time rather than with a useful error.
    "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.28,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    # The vertical-slice test drives a real worker over the API's database with
    # the real executor registry. Test-time only; the API's source imports
    # neither, and tools/layer_check.sh keeps it that way.
    "aia-worker",
    "aia-executors",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aia_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL instance via DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818 requires an "Error" suffix on every exception. Our exception names are
# domain vocabulary that reads better as-is -- `raise ScopeDenied(...)`,
# `except ExpiredToken` -- and they match the terms used in the architecture
# docs. Renaming them to ScopeDeniedError / ExpiredTokenError would make the
# code read worse for no safety gain.
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
