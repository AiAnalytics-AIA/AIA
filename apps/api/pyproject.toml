[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aia-api"
version = "0.1.0"
description = "AIA HTTP API"
requires-python = ">=3.12"
dependencies = [
    "aia-core",
    "fastapi>=0.121.1,<1",  # get_session's scope="function": 0.121.0, fixed in 0.121.1
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    # Cognito JWT validation. The [crypto] extra pulls in `cryptography`, which
    # is required for RS256 -- without it every token verification fails at
    # import time rather than with a useful error.
    "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.28,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    # The vertical-slice test drives a real worker over the API's database with
    # the real executor registry. Test-time only; the API's source imports
    # neither, and tools/layer_check.sh keeps it that way.
    "aia-worker",
    "aia-executors",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aia_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL instance via DATABASE_URL",
]

[tool.ruff]
# One lint configuration for every Python tree: the root pyproject.toml's. Ruff reads
# the nearest [tool.ruff], so a copy here would silently shadow a rule added there
# (the network-egress ban, TID251, is the one that made this matter).
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
