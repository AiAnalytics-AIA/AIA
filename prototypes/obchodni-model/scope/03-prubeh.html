<section class="chapter" id="prubeh">
  <p class="chapter-label">03 · Hlavní průběh</p>
  <h1>Osm kroků jedné studie</h1>
  <p class="lede">Studie jde vždy stejnou cestou. Pravidlo rozhodnutí se zapíše v&nbsp;prvním kroku a&nbsp;použije v&nbsp;šestém.</p>

        <rect x="430" y="4" width="78" height="34" rx="3" class="bxa"/><text x="469" y="26" class="stpw" text-anchor="middle">Výsledky</text>
        <rect x="516" y="4" width="78" height="34" rx="3" class="bx"/><text x="555" y="26" class="stp" text-anchor="middle">Mapy</text>
        <rect x="602" y="4" width="78" height="34" rx="3" class="bx"/><text x="641" y="26" class="stp" text-anchor="middle">Zpráva</text>

        <text x="211" y="58">veřejné</text><text x="211" y="74">zdroje</text>
        <text x="297" y="58">rozsah</text><text x="297" y="74">a&nbsp;ručitel</text>

      <path d="M39 86 V98 H469 V86" class="ar"/><text x="254" y="116" class="s" text-anchor="middle">pravidlo se zapíše zde a&nbsp;použije zde, beze změny</text>

  <p>AI asistent nic nerozhoduje a&nbsp;nic nepočítá. Každý jeho návrh čeká na schválení analytika. Výpočty dělá kód; stejný kód odmítne číslo, které nemá zdroj.</p>
