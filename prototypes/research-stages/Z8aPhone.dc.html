<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Zadání – začátek na telefonu</title>
<script src="./support.js"></script>
<script src="assets/thinking-orbs.js"></script>
<link rel="stylesheet" href="assets/aia-core.css"><link rel="stylesheet" href="assets/aia-study.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--signal);text-decoration:none}a:hover{color:var(--shover);text-decoration:underline}
.sec.need{border-color:var(--you);box-shadow:inset 3px 0 0 var(--you)}
.zlead{display:flex;flex-direction:column;gap:2px}
.zrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;align-items:baseline;font-size:13px}
.zrow>.zk{color:var(--muted);font-size:12px;font-weight:500}
.zrow>.zv{min-width:0}
.zgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.zgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zcard{border:1px solid var(--border);border-radius:8px;background:var(--raised);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.zcard.on{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--stint)}
.zcard h3{margin:0;font-size:14px;font-weight:600}
.zcard p{margin:0;font-size:13px}
.zq{border:1px solid var(--border);border-radius:8px;background:var(--raised);padding:10px 12px;display:flex;gap:10px;font-size:13px}
.zq .n{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none;width:18px}
.zq .why{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.zflag{display:flex;flex-direction:column;gap:6px;border:1px solid var(--you);background:var(--youwash);border-radius:6px;padding:10px 12px;font-size:13px}
.zflag .was{color:var(--faint);text-decoration:line-through}
.zword{background:var(--youwash);box-shadow:inset 0 -2px 0 var(--you);padding:0 2px}
.zt{width:100%;border-collapse:collapse;font-size:13px}
.zt th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);background:var(--sunken);padding:8px 10px;border-bottom:1px solid var(--border)}
.zt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.zt tr.miss td{background:var(--youwash)}
.zt td.num{font-family:var(--mono);font-size:12px;white-space:nowrap}
.zarrow{color:var(--faint);font-size:12px;display:flex;align-items:center;gap:6px}
.zhand{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;background:var(--surface);border:1px dashed var(--strong);font-size:13px}
.zm{box-shadow:inset 3px 0 0 var(--shviolet)}
.ztag-m{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:6px;background:var(--sunken);color:var(--ink);font-size:11px;font-weight:500}
.ztag-m::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--ink)}
.ztag-r{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:6px;background:var(--sunken);color:var(--ink);font-size:11px;font-weight:500}
.ztag-r::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--signal)}
.zseq{display:flex;align-items:center;gap:8px;padding:10px 24px;border-top:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted)}
.zseq a{font-weight:500}
.zstate{display:flex;align-items:center;gap:10px;padding:8px 24px;background:var(--sunken);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.zbox{font-family:inherit;width:100%;box-sizing:border-box;min-height:120px;font-size:15px;line-height:22px;padding:12px 14px}
.zdrawer{width:360px;flex:none;border-left:1px solid var(--border);background:var(--raised);display:flex;flex-direction:column}
.zdrawer .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.zdrawer .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.zrub{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.zrub>div{display:grid;grid-template-columns:22px 28px minmax(0,1fr);gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:start;font-size:13px;background:var(--raised)}
.zrub>div:last-child{border-bottom:0}
.zrub>div.miss{background:var(--youwash)}
.zrub .i{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
.zrub .how{display:block;font-size:12px;color:var(--muted)}

.ph390{width:390px;min-height:844px;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);font-size:14px}
.ph390 .tb{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--raised);border-bottom:1px solid var(--border)}
.ph390 .tb .crumb{font-size:11px}
.ph390 .stg-m{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--raised);border-bottom:1px solid var(--border);font-size:13px}
.ph390 .bd{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px}
.ph390 .bd .sec .sb{padding:12px}
.ph390 .bd .sh{padding:10px 12px}
.ph390 .bb{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--raised);border-top:1px solid var(--border)}
.ph390 .btn{min-height:44px}
.ph390 .chip{height:32px}
.ph390 .zcard{cursor:pointer}
</style>
</helmet>
<div class="aia" data-theme="{{theme}}" style="display: block; width: 390px"><div class="ph390">
<div class="tb"><button class="btn quiet ic" type="button" aria-label="Menu" style="min-width: 44px"><i class="ph ph-list"></i></button><div class="grow"><div class="crumb">Klienti / Domácí dílna Vrba</div><b style="font-size: 14px">Nová studie</b></div><button class="btn quiet ic" type="button" aria-label="Přehled studie" style="min-width: 44px"><i class="ph ph-squares-four"></i></button></div>
<button class="stg-m" type="button" style="border: 0; border-bottom: 1px solid var(--border); width: 100%; text-align: left; font: inherit; color: inherit; min-height: 44px"><span class="stg sm youq" aria-hidden="true"><i class="ph ph-pause"></i></span><b>Zadání</b><span class="muted">· Čeká na vás</span><span class="grow"></span><span class="cap" style="margin: 0">další kroky podle cesty</span><i class="ph ph-caret-down s"></i></button>
<div class="bd">
  <section class="sec"><div class="sh"><h2 style="font-size: 15px">Co potřebujete rozhodnout?</h2></div>
    <div class="sb"><label class="lbl" for="p-box">Vlastními slovy: mezi čím se rozhodujete, kdo rozhoduje a do kdy.</label>
      <textarea class="ta zbox" id="p-box" style="min-height: 180px" value="{{text}}" onChange="{{setText}}" placeholder="Např. Nevíme, jestli zdražit náš ležák o 3 Kč…"></textarea>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="row" style="gap: 6px"><sc-for list="{{starts}}" as="d" hint-placeholder-count="3"><button class="chip" type="button" onClick="{{d.use}}">{{d.l}}</button></sc-for></div></sc-if></div></section>
  <section class="sec"><div class="sh"><h2 style="font-size: 15px">Podklady</h2><span class="grow"></span><span class="cap" style="margin: 0">volitelné</span></div>
    <div class="sb"><sc-if value="{{typed}}" hint-placeholder-val="{{ true }}"><div class="li"><i class="ph ph-file-text" style="margin-top: 2px"></i><div class="tx">objednavky_2025.xlsx<span class="cap" style="display: block">412 380 řádků · přečteno</span></div></div><div class="li"><i class="ph ph-file-text" style="margin-top: 2px"></i><div class="tx">faktury_3PL_2025.pdf<span class="cap" style="display: block">38 stran · přečteno</span></div></div><div class="li"><i class="ph ph-file-text" style="margin-top: 2px"></i><div class="tx">nabidka_hala.pdf<span class="cap" style="display: block">6 stran · přečteno</span></div></div></sc-if>
      <button class="btn" type="button"><i class="ph ph-upload-simple s"></i>Přidat podklady</button></div></section>
  <sc-if value="{{typed}}" hint-placeholder-val="{{ true }}"><a class="btn primary" href="Z8bPhone.dc.html" style="justify-content: center">Pokračovat · Ada navrhne cestu<i class="ph ph-caret-right s"></i></a></sc-if>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><button class="btn primary" type="button" disabled style="justify-content: center">Pokračovat</button></sc-if>
  <div class="row" style="gap: 6px; justify-content: center"><span class="cap" style="margin: 0">Ukázka</span><span class="seg sm" role="radiogroup" aria-label="Stav ukázky"><sc-for list="{{states}}" as="s" hint-placeholder-count="2"><button class="{{s.cls}}" type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}">{{s.l}}</button></sc-for></span></div>
</div>
<div class="bb"><span class="lav" aria-hidden="true"><i class="ph ph-sparkle"></i></span><div class="grow"><b style="font-size: 13px">Ada</b><div class="cap" style="margin: 0">Napište, co rozhodujete; navrhnu cestu.</div></div><button class="btn sm" type="button">Otevřít chat</button></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'typed', text: null }; }
renderVals() {
  const s = this.state, T = 'Nevíme, jestli rozšířit náš sklad o 2 000 m², nebo dál platit externí logistiku. Rozhoduje ředitel provozu do poloviny prosince. Chceme to výrazně levněji, ale bojíme se, že delší doručení odradí zákazníky.';
  const text = s.mode === 'empty' ? (s.text || '') : (s.text == null ? T : s.text), typed = text.trim().length > 0;
  return {
    theme: this.props.theme ?? 'light', text, setText: (e) => this.setState({ text: e.target.value }), typed, empty: !typed,
    states: [['empty', 'Prázdné'], ['typed', 'Vyplněné']].map(([k, l]) => ({ l, on: s.mode === k, cls: s.mode === k ? 'on' : '', pick: () => this.setState({ mode: k, text: k === 'empty' ? '' : null }) })),
    starts: [['Investice, nebo služba', 'Nevíme, jestli rozšířit vlastní sklad, nebo dál platit externí logistiku.'], ['Cena', 'Nevíme, jestli zdražit náš ležák o 3 Kč.'], ['Kampaň', 'Vybíráme mezi dvěma kreativami.']].map(([l, t]) => ({ l, use: () => this.setState({ mode: 'typed', text: t }) }))
  };
}
}
</script>
</body>
</html>
