const nodeOf=id=>NODES.find(x=>x.id===id);
const nodeName=id=>{const n=nodeOf(id);return n.n?`${n.n} ${n.name}`:n.name};
const colOf=id=>({g0:"var(--world)",g1:"var(--v1)",g2:"var(--v3)",g3:"var(--v4)",g4:"var(--v2)",g5:"var(--v6)"})[nodeOf(id).g];
function hopChip(id){const n=nodeOf(id);return n.n?`<button class="hop ${n.g}" data-stage="${id}" title="Open step ${n.n}">${ico(n.icon,"ico sm")}${n.n} ${esc(n.name)}</button>`:`<span class="hop src ${n.g}">${ico(n.icon,"ico sm")}${esc(n.name)}</span>`}
function artCard(a,dir){const k="art:"+a.id;return `<div class="art${itemCls(k)}" style="--ac:${colOf(a.from)}" title="${esc(a.plain)}"><span class="row" style="gap:8px"><b>${esc(a.name)}</b>${stancePill(k)}</span><div class="hops"><span class="cap">${dir==="in"?"from":"goes to"}</span>${(dir==="in"?[a.from]:a.to).map(hopChip).join("")}</div>${marksHtml(k)}${noteHtml(k)}</div>`}
function renderIPO(){
  const v=$("#v-ipo"), sel=state.ipoSel||null;
  const W=1600, base=360, N=NODES.length, dx=W/N, X=i=>dx*(i+.5), idx=Object.fromEntries(NODES.map((n,i)=>[n.id,i]));
  const edges=[];ARTS.forEach(a=>a.to.forEach(t=>edges.push({a,from:a.from,to:t})));
  // One arrow per pair of steps: 35 hand-offs share 25 pairs, and drawing each one stacked them on top of each other.
  // Above the boxes: what feeds the calculation. Below: what goes to the report outline and on to the client.
  // Each box spreads its arrows along its edge, those coming in on the left and those going out on the right, and
  // orders them by distance so that arcs nest instead of crossing where they meet the box.
  const T=x=>LANG==="cs"?tr(x):x, LOW=new Set(["osnova","zprava","out"]);
  const pairs={};edges.forEach(e=>{const k=e.from+">"+e.to;(pairs[k]=pairs[k]||{from:e.from,to:e.to,arts:[]}).arts.push(e.a)});
  const P=Object.values(pairs).map(p=>({...p,i:idx[p.from],j:idx[p.to],span:idx[p.to]-idx[p.from],side:LOW.has(p.to)?1:-1}));
  const BH=84, top=base-14, bot=top+BH, lft=i=>X(i)-dx/2+6, rgt=i=>X(i)+dx/2-6;
  const outs={},ins={};P.forEach(p=>{(outs[p.from+p.side]=outs[p.from+p.side]||[]).push(p);(ins[p.to+p.side]=ins[p.to+p.side]||[]).push(p)});
  Object.values(outs).forEach(l=>l.sort((x,y)=>y.span-x.span));
  Object.values(ins).forEach(l=>l.sort((x,y)=>x.span-y.span));
  const port=(i,dir,p)=>{const id=NODES[i].id,li=ins[id+p.side]||[],lo=outs[id+p.side]||[],all=li.concat(lo),k=dir==="in"?li.indexOf(p):li.length+lo.indexOf(p);
    const a=lft(i)+14,b=rgt(i)-14;return all.length===1?X(i):a+(b-a)*(k+.5)/all.length};
  const paths=P.sort((x,y)=>y.span-x.span).map(p=>{const x1=port(p.i,"out",p),x2=port(p.j,"in",p);
    const y=p.side<0?top:bot, h=(34+(p.span-1)*24)*p.side, on=!sel||p.from===sel||p.to===sel, g=nodeOf(p.from).g, col=colOf(p.from);
    const names=p.arts.map(a=>T(a.name)), mx=(x1+x2)/2, my=y+h*.75;
    return `<g opacity="${on?1:.1}"><path d="M${x1},${y} C${x1},${y+h} ${x2},${y+h} ${x2},${y+2*p.side}" fill="none" stroke="${col}" stroke-width="${sel&&on?4:2.5}" marker-end="url(#ah-${g})"><title>${esc(names.join(" · "))}: ${esc(T(nodeName(p.from)))} → ${esc(T(nodeName(p.to)))}</title></path>${names.length>1?`<circle cx="${mx}" cy="${my}" r="12" fill="var(--raised)" stroke="${col}" stroke-width="2"/><text x="${mx}" y="${my+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${col}">${names.length}</text>`:""}</g>`}).join("");
  const marks_=["g0","g1","g2","g3","g4","g5"].map(g=>`<marker id="ah-${g}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${{g0:"var(--world)",g1:"var(--v1)",g2:"var(--v3)",g3:"var(--v4)",g4:"var(--v2)",g5:"var(--v6)"}[g]}"/></marker>`).join("");
  const nodes=NODES.map((n,i)=>{const on=!sel||n.id===sel||edges.some(e=>(e.from===sel&&e.to===n.id)||(e.to===sel&&e.from===n.id));const col=colOf(n.id);const words=n.name.split(" ");const l1=n.n?`Step ${n.n}`:"";
    return `<g data-ipo="${n.id}" style="cursor:pointer" opacity="${on?1:.35}"><rect x="${lft(i)}" y="${top}" width="${dx-12}" height="${BH}" rx="12" fill="${n.id===sel?col:"var(--raised)"}" fill-opacity="${n.id===sel?.18:1}" stroke="${col}" stroke-width="${n.id===sel?3:1.5}"/>
      ${l1?`<text x="${X(i)}" y="${base+16}" text-anchor="middle" font-size="15" font-weight="600" fill="${col}">${l1}</text>`:""}
      <text x="${X(i)}" y="${base+(l1?40:26)}" text-anchor="middle" font-size="18" font-weight="600" fill="var(--ink)">${words.length>1&&n.name.length>12?`<tspan x="${X(i)}">${esc(words[0])}</tspan><tspan x="${X(i)}" dy="21">${esc(words.slice(1).join(" "))}</tspan>`:esc(n.name)}</text></g>`}).join("");
  const selN=sel&&nodeOf(sel);
  const selHtml=sel?`<div class="two" style="margin-top:16px"><div class="panel ${selN.g}"><div class="ph">${ico("arrow")}<h3>Into ${esc(nodeName(sel))}</h3><span class="chip">${inputsOf(sel).length}</span></div><div class="pb">${inputsOf(sel).map(a=>artCard(a,"in")).join("")||'<p class="empty">Nothing comes in: this is where material starts.</p>'}</div></div>
     <div class="panel ${selN.g}"><div class="ph">${ico("arrow")}<h3>Out of ${esc(nodeName(sel))}</h3><span class="chip">${outputsOf(sel).length}</span></div><div class="pb">${outputsOf(sel).map(a=>artCard(a,"out")).join("")||'<p class="empty">Nothing goes further: this is where it ends.</p>'}</div></div></div>`
    :``;
  const row=s=>`<tr class="${s.g}"><td class="stp"><span class="badge" style="width:40px;height:40px;margin-bottom:6px">${ico(s.icon)}</span><span class="cap">Step ${s.n}</span><b>${esc(s.name)}</b>${s.model?'<span class="model-only cap" style="color:var(--you)">needs a calculation</span>':""}</td>
    <td>${inputsOf(s.id).map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">from</span>${hopChip(a.from)}</div></div>`).join("")}</td>
    <td>${SPEC[s.id]?(()=>{const g={};SPEC[s.id].process.forEach(p=>(g[p.phase]=g[p.phase]||[]).push(p.action));return Object.entries(g).map(([ph,xs])=>`<div class="ia"><b>${esc(ph)}</b><div class="cap">${xs.map(x=>esc(LANG==="cs"?tr(x):x)).join(" · ")}</div></div>`).join("")})():`<ol>${s.does.map(d=>`<li>${esc(d[0])}</li>`).join("")}</ol>`}</td>
    <td>${outputsOf(s.id).map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">to</span>${a.to.map(hopChip).join("")}</div></div>`).join("")}</td>
    <td class="gt">${ico("flag","ico sm")} ${esc(GATES[s.id])}</td></tr>`;
  v.innerHTML=`<h2>Inputs and outputs</h2><p class="lede">Each arrow runs from the step that makes something to a step that uses it. Click a step to see only what goes into it and out of it. Use it to check that nothing is made that nobody uses, and nothing is used that nobody makes.</p>
  <div class="arcbox"><svg viewBox="0 190 ${W} 400" role="img" aria-label="Hand-offs between the steps"><defs>${marks_}</defs>${paths}${nodes}</svg></div>
  <p class="cap" style="margin-top:8px">Above the steps: what goes into the calculation. Below the steps: what goes into the report outline and on to the client. A number on an arrow is how many hand-offs it carries; click a step to see their names.</p>
  ${selHtml}
  <div class="section"><h2>As a table</h2>
   <div class="tscroll panel"><table class="ipo"><thead><tr><th>Step</th><th>Inputs, and where they come from</th><th>What happens</th><th>Outputs, and where they go</th><th>Before it moves on</th></tr></thead><tbody>
   <tr><td class="stp g0"><b>Sources</b></td><td>—</td><td></td><td>${["client","public"].flatMap(outputsOf).map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">to</span>${a.to.map(hopChip).join("")}</div></div>`).join("")}</td><td class="gt">—</td></tr>
   ${STAGES.map(row).join("")}
   <tr><td class="stp g0"><b>Client receives</b></td><td>${inputsOf("out").map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">from</span>${hopChip(a.from)}</div></div>`).join("")}</td><td colspan="3"></td></tr>
   </tbody></table></div></div>`;
}

function label(id){
  if(id.startsWith("chunk:")){const [,p,c]=id.split(":");const ch=(PLANS[p]||[]).find(x=>x.id===c);return `${p}#${c} — ${ch?ch.text.slice(0,140):""}`}
  if(id.startsWith("dec:")){const d=DECISIONS.find(x=>"dec:"+x[0]===id);return d?`${d[0]} — ${d[2]}`:id}
  if(id.startsWith("q:")){const d=QUESTIONS.find(x=>"q:"+x[0]===id);return d?`Open: ${d[2]}`:id}
  if(id.startsWith("acc:")){const a=ACCEPT.find(x=>"acc:"+x[0]===id);return a?`Acceptance ${a[0]} — ${a[2]}`:id}
  if(id.startsWith("aq:")){const a=AQ.find(x=>"aq:"+x[0]===id);return `Methodology Q${a[0]} — ${a[1]}`}
  if(id.startsWith("view:")){const w=VIEWS.find(x=>"view:"+x.id===id);return `Map view — ${w?w.name:id}`}
  if(id.startsWith("mode:")){const m=MODES.find(x=>"mode:"+x.id===id);return `Map type — ${m?m.name:id}`}
  if(id.startsWith("pipe:")){const p=PIPE.find(x=>"pipe:"+x.n===id);return `Map step ${p.n} — ${p.t}`}
  if(id.startsWith("does:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — ${st.does[+i][0]}`}
  if(id.startsWith("lane:")){const [,l,i]=id.split(":");const ln=LANES.find(x=>x.id===l);return `${ln.name} — ${ln.items[+i]}`}
  if(id.startsWith("idea:")){const v=ideas[id.slice(5)];return v?`New ${v.kind} (${STAGES.find(s=>s.id===v.stage).name}) — ${v.text}`:id}
  if(id.startsWith("ml:")){const a=ML.find(x=>"ml:"+x.id===id),b=ML_LATER.find(x=>"ml:"+x[0]===id);return `Machine learning — ${a?a.name:b?b[1]:id}`}
  if(id.startsWith("proc:")){const [,s,n]=id.split(":");const p=(SPEC[s]?.process||[]).find(x=>x.n===+n);const st=STAGES.find(x=>x.id===s);return p?`${st.name} process ${n} — ${p.action} (${p.actor})`:id}
  if(id.startsWith("mt:")){const k=id.slice(3);const t=k.startsWith("tpl:")?MT.templates.find(x=>x.id===k.slice(4)):k.startsWith("fam:")?MT.families.find(x=>x.id===k.slice(4)):MT[k];return `Model type — ${t?t.name:k}`}
  if(id.startsWith("gap:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — not designed yet: ${(SPEC[s]?.gaps||[])[+i]}`}
  if(id.startsWith("art:")){const a=ARTS.find(x=>"art:"+x.id===id);return a?`Hand-off — ${a.name} (${nodeName(a.from)} → ${a.to.map(nodeName).join(", ")})`:id}
  if(id.startsWith("gate:")){const s=STAGES.find(x=>"gate:"+x.id===id);return `${s.name} — before it moves on: ${GATES[s.id]}`}
  if(id==="socio:kept")return "Sociomapa — what's kept from today's engine";
  if(id==="profile:pipeline")return "Sociomapa — the proposed indicator profile map";
  return id}
function summaryText(){
  const L=[];L.push("# AIA MVP brainstorm — "+new Date().toISOString().slice(0,10));
  for(const [k,l] of STANCES){const ids=Object.keys(marks).filter(i=>marks[i].stance===k);if(!ids.length)continue;L.push("","## "+l);for(const i of ids)L.push("- "+label(i)+(marks[i].note?"\n  Note: "+marks[i].note:""))}
  const aqs=Object.keys(marks).filter(i=>i.startsWith("aq:")&&marks[i].answer);if(aqs.length){L.push("","## Methodology answers");for(const i of aqs)L.push("- "+label(i)+": "+marks[i].answer+(marks[i].note?" — "+marks[i].note:""))}
  const notes=Object.keys(marks).filter(i=>marks[i].note&&!marks[i].stance&&!(i.startsWith("aq:")&&marks[i].answer));if(notes.length){L.push("","## Notes");for(const i of notes)L.push("- "+label(i)+"\n  "+marks[i].note)}
  const ids=Object.entries(ideas);if(ids.length){L.push("","## Added in the session");for(const [iid,v] of ids){const m=marks["idea:"+iid]||{};L.push(`- [${STAGES.find(s=>s.id===v.stage).name}] ${v.kind}: ${v.text}`+(m.stance?` (${m.stance})`:"")+(m.note?"\n  Note: "+m.note:""))}}
  return L.join("\n");
}

const SPEC = {"zadani": {"purpose": "Turn the client's loosely worded problem into a decision that can be tested (owner, options, a rule with threshold and risk limit, objectives) before any data or computation, and hand each later step exactly what it needs.", "actors": ["Researcher", "Ada", "Code"], "process": [{"n": 1, "phase": "Popis", "actor": "Researcher", "action": "Describe the decision in own words", "detail": "One free-text field: what the client is choosing between, why now, what the firm wants, who decides and by when. Starter texts can prefill it (Investice, nebo služba; Cena; Nový produkt; Kampaň).", "fields": ["Co klient potřebuje rozhodnout?", "Začít od"], "rule": "The only required field of the stage; nothing else is mandatory.", "output": "Popis saved on the study's working copy (revision-checked).", "onFail": null, "screen": "Z1 · 01 Co klient potřebuje rozhodnout?", "source": "decision-brief#DB1 · decision-brief#DB0", "status": "planned"}, {"n": 2, "phase": "Popis", "actor": "Researcher", "action": "Attach the client's files", "detail": "Files added through Přidat podklady are kept as the client's sources, with this study's occurrence, and filed in the study's Vstupy folder; each row shows its reading (e.g. 'list Měsíce · 36 měsíců · přečteno celé', 'PDF · 9 stran · přečteno') and the label Důvěrné.", "fields": ["file name", "reading summary", "Důvěrné / Veřejné", "Přidat podklady"], "rule": "A brief's files are Class A by rule; no data class on screen, a file reads Důvěrný or Veřejný.", "output": "client_sources rows + a knowledge item filed in the study's Vstupy folder.", "onFail": null, "screen": "Z1 · 02 Podklady", "source": "decision-brief#DB1 · study-files#SF6 · Z0 'Co zůstává'", "status": "planned"}, {"n": 3, "phase": "Popis", "actor": "Ada", "action": "Show what the text already states, suggest missing materials", "detail": "Ada lists the brief elements she read from the text as chips (rozhodnutí, 3 možnosti, cíl, kdo a do kdy, mez rizika missing) and proposes further materials in 'Co ještě pomůže', each with what it contains, why it helps and which step uses it.", "fields": ["Ada z textu vyčetla", "Podklad", "Proč", "Použije", "Přidat", "Nemáme"], "rule": "Nothing suggested is required.", "output": "Přidat: 'Přidáno · přečte se při triáži'; Nemáme: an open item.", "onFail": "Nemáme: 'Zapsáno jako otevřená položka'; a missing file later becomes a wide-range assumption.", "screen": "Z1 · Ada z textu vyčetla; 03 Co ještě pomůže", "source": "decision-brief#DB1 · Z1", "status": "planned"}, {"n": 4, "phase": "Triáž", "actor": "Ada", "action": "Propose the eight parts with sources", "detail": "On 'Pokračovat · Ada rozepíše Zadání' an ordinary Lead turn reads the Popis and files and proposes eight parts (decision and goal; who and by when; options; constraints; rule and risk; customers; data and uncertainties; execution and output on the canvas), each citing where it came from (file and page or the Popis) and naming the step it goes to; extra options Ada adds are marked as hers.", "fields": ["part title", "proposed text", "Zdroj", "kind: společné | Obchodní model", "→ target step"], "rule": "Models propose, a person accepts (ADR 0026); triage is an ordinary Lead turn; a paid job only through a card with an amount.", "output": "A proposal of n parts on the working copy, nothing applied.", "onFail": null, "screen": "Z2 · Návrh Zadání: 8 částí", "source": "decision-brief#DB2 · decision-brief#DB0 · Z0 'Co zůstává'", "status": "planned"}, {"n": 5, "phase": "Triáž", "actor": "Researcher", "action": "Accept, edit or drop each part", "detail": "Each part has a checkbox; 'Přijmout vybrané (n)' applies the ticked parts to the working copy; the rest stay proposed until dismissed; 'Vrátit' undoes; 'Odložit' defers.", "fields": ["checkbox per part", "Přijmout vybrané (n)", "Odložit", "Vrátit"], "rule": "Accepted per change; nothing is accepted on its own.", "output": "Accepted parts written into the Zadání; 'Přijato n částí. Ostatní zůstávají v návrhu, dokud je nezahodíte.'", "onFail": null, "screen": "Z2 · Přijmout vybrané", "source": "decision-brief#DB2 · ADR 0026", "status": "planned"}, {"n": 6, "phase": "Triáž", "actor": "Ada", "action": "Ask every question that matters, by importance", "detail": "Questions ordered by how much they can change the recommendation; the first three open, the rest under 'Další otázky (n)'. Each carries its reason in words and a tag (mění doporučení, největší neznámá, plán provedení) and offers answer buttons or a chat answer.", "fields": ["question", "why (in words)", "tag", "answer options", "Další otázky (n)"], "rule": "No crown amount in triage; a value of information in Kč appears only on Výsledky, computed by the model.", "output": "Open questions on the stage.", "onFail": null, "screen": "Z2 · 01 Ada se ptá vše, na čem záleží", "source": "decision-brief#DB2 · W2 · W3", "status": "decided"}, {"n": 7, "phase": "Triáž", "actor": "Researcher", "action": "Answer; the answer lands where it belongs", "detail": "A picked or typed answer is written into its target as the researcher's edit: the loss limit into the rule ('10 mil. Kč, nejvýš v 1 budoucnosti z 10 · zapsáno do pravidla'), a promised file into Data ('zpozdeni_2024.xlsx přijde do Dat'), a pilot into execution.", "fields": ["answer", "target field", "edit time"], "rule": null, "output": "The answered question closes with its stored answer; the target field changes as a logged edit.", "onFail": "Nemáme on a data question: the quantity stays an open item.", "screen": "Z2 · question cards; Z3 · Ada chat 9:14", "source": "Z2 · Z3 · decision-brief#DB2", "status": "proposed"}, {"n": 8, "phase": "Rozhodnutí", "actor": "Researcher", "action": "Fix decision, owner, deadline and goal", "detail": "The decision core's first block, each field with its source line (e.g. 'vysledovka_2025.xlsx ř. 14').", "fields": ["Co se rozhoduje", "Proč teď", "Co chce firma získat", "Kdo rozhoduje", "Do kdy"], "rule": "R1: the decision has an owner, a date and a business goal (code, holds the hand-off).", "output": "Decision core block 01 on the working copy.", "onFail": "R1 chip not done; hand-off held.", "screen": "Z3 · 01 Rozhodnutí a cíl firmy", "source": "decision-brief#DB3 · decision-brief#DB4 · Z7 R1", "status": "planned"}, {"n": 9, "phase": "Rozhodnutí", "actor": "Ada", "action": "Propose whether a computation is needed", "detail": "Ada proposes 'Potřebuje výpočet?' from the decision type; the researcher confirms. Yes shows Data, Předpoklady, Model, Výsledky and the Model sub-step, and adds the badge 'Obchodní model' beside 'Výzkum'; no goes from Rešerše to Osnova reportu.", "fields": ["Potřebuje výpočet? Ano/Ne", "proposed by", "confirmed by", "badge"], "rule": "Ada proposes, the researcher confirms; the model steps exist only on yes.", "output": "Model switch on the study; the stage track and the model content kind change (CP3).", "onFail": null, "screen": "Z3 · 01 Potřebuje výpočet?", "source": "W4 · W5 · decision-brief#DB3 · research-findings-stage#FND1 · cost-model-study#CP3", "status": "decided"}, {"n": 10, "phase": "Rozhodnutí", "actor": "Researcher", "action": "List options and constraints", "detail": "Options as keyed rows (A, A2, B, B2, C, C2, H) with a description, a cited page and who added them ('klient' or 'Ada · přijato'); 'Přidat možnost'. Constraints every option must meet, each with its source (e.g. 'smlouva_3PL_CZ.pdf s. 8').", "fields": ["option key", "option text", "detail + source page", "who", "constraint", "constraint source", "Přidat možnost"], "rule": "R2: at least two options, or one against 'nic neměnit'; constraints written down (code, holds the hand-off).", "output": "Options become the model's variants; constraints its timing and capacity rules.", "onFail": "R2 not done; hand-off held.", "screen": "Z3 · 02 Možnosti a omezení", "source": "decision-brief#DB3 · Z7 R2", "status": "planned"}, {"n": 11, "phase": "Rozhodnutí", "actor": "Researcher", "action": "State the rule and risk limit first", "detail": "Measure (e.g. příspěvek po logistice, NPV 2026–2032 at 8 % against B), threshold (better than today with P ≥ 0,80 of 20 000 futures), risk limit (chips 5 / 10 / 20 mil. Kč or 'Napsat vlastní': a loss worse than X in at most 1 future in 10) and what follows when no option passes. The rule sentence is stamped with its time, 'před prvním výpočtem', and its guarantor.", "fields": ["Ukazatel", "Práh", "Mez rizika", "Napsat vlastní", "Když žádná varianta pravidlo nesplní", "zapsáno (time)", "ručí"], "rule": "Recorded before the first computation; any change logged and marked in the report; no confidence named → default 0.90/0.10, said on the page; no rule → no recommendation. 'Mez určuje finanční ředitel, ne Ada.'", "output": "DecisionRule on the working copy (an element of the Model Revision), its first statement and changes in the operation log.", "onFail": "State 'chybí mez rizika'; R3 fails and holds the hand-off.", "screen": "Z3 · 03 Pravidlo a riziko", "source": "decision-brief#DB3 · cost-model-study#CR7 · M-4", "status": "planned"}, {"n": 12, "phase": "Rozhodnutí", "actor": "Researcher", "action": "Choose how certain the answer must be", "detail": "One of three: Stačí směr (one central scenario), Číslo s rozsahem (every result with an interval, 20 000 futures), Úzký rozsah (within ±5 %, more scenarios, narrower input ranges).", "fields": ["Jak jisté to musí být", "Stačí směr", "Číslo s rozsahem", "Úzký rozsah"], "rule": null, "output": "Certainty level on the decision core.", "onFail": null, "screen": "Z3 · Jak jisté to musí být", "source": "decision-brief#DB3 · Z3", "status": "planned"}, {"n": 13, "phase": "Rozhodnutí", "actor": "Researcher", "action": "Set objectives, execution and output", "detail": "Objectives C1…Cn, each tagged with what it serves (pravidlu, provedení, gives the model assumptions). Execution: who reads, in what form, pilot (region, length, start, owner), what will be watched, scope, deadline and study budget.", "fields": ["C1..Cn", "slouží", "Kdo čte", "V jaké podobě", "Pilot", "Co se bude hlídat", "Rozsah a rozpočet"], "rule": "R4: every objective serves the decision or its execution (code); R7: execution, scope, budget and deadline fit (Lead's advice, holds nothing).", "output": "Objectives (read downstream from Zadání) and the execution block.", "onFail": "R4 fails: hand-off held; R7: advice only.", "screen": "Z3 · 04 Cíle; 05 Provedení a výstup", "source": "decision-brief#DB3 · decision-brief#DB4 · Z7", "status": "planned"}, {"n": 14, "phase": "Analýzy", "actor": "Ada", "action": "Propose analysis frameworks for the decision", "detail": "Ada proposes a set from the catalogue (seven groups) for the decision type, one reason per framework; each row shows what it needs (data klienta, rešerše, experti), how it is produced (výpočet, rešerše citováno, syntéza se zdroji, experti jmenovaní, odhad) and its report chapter. Post-MVP frameworks shown disabled ('po MVP').", "fields": ["framework", "question it answers", "needs: D / R / E", "grade", "→ chapter", "Ada mark", "toggle"], "rule": "Default sets per decision type are data the owner approves; a framework needing register fields naming persons is never proposed before its balancing test.", "output": "Framework proposal on the working copy.", "onFail": "A framework needing persons' register data: left out, Ada says why.", "screen": "Z4 · groups 02–08", "source": "analysis-frameworks#AF1 · analysis-frameworks#AF0 · W2", "status": "planned"}, {"n": 15, "phase": "Analýzy", "actor": "Researcher", "action": "Toggle frameworks; see what the selection costs", "detail": "The researcher accepts or changes each framework; a live summary shows selected n of m (Ada proposed k), the Deep Research cost ceiling of the selection out of the study budget, the report-outline chapters and the number of expert scoring forms.", "fields": ["Vybráno n z m", "Deep Research … USD nejvýš", "Kapitoly osnovy", "Hodnocení expertů n formulářů"], "rule": "Accepted per change (ADR 0026).", "output": "Framework selection saved on the working copy; later drives DR subjects (AF3), model views (AF4), expert forms (AF5), outline chapters (AF6).", "onFail": null, "screen": "Z4 · 01 Co výběr znamená", "source": "analysis-frameworks#AF2", "status": "planned"}, {"n": 16, "phase": "Model", "actor": "Ada", "action": "Propose the model's parts (only with a model)", "detail": "Target quantity and what it is compared against, horizon and step (měsíce / roky), the views to compute, model boundaries (inside / outside and why), a file → number inventory with status, key assumptions P1…Pn with value or range, source and guarantor, and what could flip the result.", "fields": ["Cílová veličina", "Horizont", "Co model spočítá", "Hranice modelu", "Data: soubor → číslo", "Klíčové předpoklady", "Kdo ručí", "Co by mohlo výsledek otočit"], "rule": "R5: quantity, horizon, boundaries, data and assumptions with a guarantor present (code, holds the hand-off); nothing missing may be missing silently.", "output": "The model's parts on the working copy; 'Na kroku Data se každé číslo přiváže…' – only an inventory here.", "onFail": "A missing number: 'Požádat o plán přechodu' / 'Vyžádat data o zpožděních' or 'Vzít jako předpoklad s rozsahem'; R5 fails until resolved.", "screen": "Z5 · 01–07", "source": "decision-brief#DB0 · decision-brief#DB4 · Z5", "status": "planned"}, {"n": 17, "phase": "Připravenost", "actor": "Code", "action": "Check readiness R1–R7", "detail": "R1–R5 checked by code and holding the hand-off; R6 (no unmeasurable words) and R7 (scope, budget, deadline) are the Lead's advice. Chips under the stage header, each opening its detail; R6 offers a rewrite ('výrazně' → 'aspoň 45 %').", "fields": ["R1–R7 chip", "Připravenost k předání", "Přijmout přepis", "Nechat"], "rule": "R1–R5 hold; R6–R7 hold nothing.", "output": "Readiness state: Blokováno / Připraveno.", "onFail": "'Chybí: R3 Pravidlo a riziko' with the reason in words and 'Doplnit mez'.", "screen": "Z7 · chips, Připravenost k předání drawer, 02 Co předání nedrží", "source": "decision-brief#DB4", "status": "planned"}, {"n": 18, "phase": "Předání", "actor": "Researcher", "action": "Hand over to the next steps", "detail": "'Předat do Dat' offers each downstream step its part as a proposal (Data: files and numbers to bind; Předpoklady: P1–P7; Model: options, constraints; Výsledky and Report: rule, risk, execution). Zadání stays editable; a later edit is offered downstream as a proposal.", "fields": ["Ze Zadání", "Kam", "Stav", "Předat do Dat", "Otevřít Data"], "rule": "Nothing downstream is overwritten.", "output": "State Předáno (time); downstream steps 'čeká na vás tam'.", "onFail": "Blocked while any of R1–R5 fails.", "screen": "Z7 · 01 Co Data a Předpoklady převezme", "source": "decision-brief#DB5", "status": "planned"}], "objects": [{"name": "Brief part (triage proposal)", "fields": ["part: 1..8 (e.g. '5 · Pravidlo a riziko')", "text: string", "source: 'smlouva_3PL_CZ.pdf s. 8' | 'z popisu'", "kind: společné | Obchodní model", "to: step ids", "proposed_by: Ada", "by_ada_option: bool"], "states": ["proposed", "accepted", "edited", "dismissed"]}, {"name": "Decision core", "fields": ["decision: string", "why_now: string", "goal: string + source", "owner: 'Finanční ředitel Velis'", "deadline: 2026-12-15 (result by 2026-12-08)", "needs_model: bool (proposed_by Ada, confirmed_by researcher)", "options: [{key 'A2', text, detail, source, who}]", "constraints: [{text, source}]", "certainty: direction | range | narrow", "objectives: [{id 'C1', text, serves}]"], "states": ["draft", "accepted"]}, {"name": "Decision rule", "fields": ["measure: 'NPV 2026–2032 při 8 %, proti B'", "comparison/threshold: 'P(lepší než B) ≥ 0,80'", "risk_limit: 'ztráta > 10 mil. Kč v ≤ 10 %'", "confidence: 0.80 (default 0.90/0.10)", "no_pass_consequence: text", "stated_at: timestamp, before first computation", "guarantor: person", "changes: operation log"], "states": ["missing", "stated", "changed after results (marked)"]}, {"name": "Framework selection", "fields": ["framework_id: 'pestel'", "group: 'Strategie a trh'", "needs: D|R|E", "grade: výpočet | rešerše citováno | syntéza | experti | odhad", "chapter: 'Prostředí a konkurence'", "proposed_by_ada: bool + reason", "selected: bool", "dr_ceiling_usd: 0.6", "mvp: bool"], "states": ["proposed", "selected", "deselected", "disabled (po MVP)"]}, {"name": "Readiness R1–R7", "fields": ["id: R1..R7", "text", "how: kód · drží předání | rada Vedoucího", "state: done | you | advice", "detail/reason"], "states": ["Blokováno", "Připraveno", "Předáno"]}], "handoffs_out": [{"name": "Files and numbers to bind", "to": ["data"], "contents": ["file list with the part that asked for it (Vyžádalo: Z1, Z2 otázka 2, Z3 možnost B2, Z5)", "11 numbers to bind to a column or page", "missing numbers as open items"]}, {"name": "Key assumptions", "to": ["predpoklady"], "contents": ["P1–P7: label, value or range, source, guarantor, state"]}, {"name": "Variants and constraints", "to": ["model"], "contents": ["options A…H as variants", "constraints as timing and capacity", "target quantity, horizon, boundaries, views"]}, {"name": "Framework selection", "to": ["reserse", "model", "osnova"], "contents": ["selected frameworks → Deep Research subjects and ceiling", "computed frameworks → result views", "chapters and point slots → report outline", "expert forms"]}, {"name": "Rule, risk and execution", "to": ["vysledky", "zprava"], "contents": ["decision rule with risk limit and stated time", "what could flip the result → sensitivity and value of information", "execution, pilot, what to watch, readers and form"]}], "gaps": ["What exactly are the eight parts' fields (DB0's schema), which are required, and how does triage part 1–5 map onto the decision core's fields so that accepting a part fills Z3 rather than duplicating it?", "Where is the decision-type taxonomy that drives both Ada's model-switch proposal and the default framework sets (AF1: 'as data the owner approves'), and who writes the first version?", "When Zadání is edited after hand-off, how is the downstream proposal computed (a diff per target field?), and which already-accepted Data bindings, assumptions or Deep Research runs go stale?", "If the model switch is turned from Ano to Ne after Data/Předpoklady hold content, what happens to that content and to the stage track?", "How do the three certainty levels (Stačí směr / Číslo s rozsahem / Úzký rozsah) map onto the rule's confidence, CR7's 0.90/0.10 default and the model's scenario count, and does Ada or code check that they agree with the threshold?", "How does code check R4 ('each objective serves the decision') and R5 when the model is off: is 'serves' a required link field to the rule, an option or execution?", "Is triage free (an ordinary Lead turn) or the paid 'Analýza zadání, nejvýše 0,40 USD' card shown on Z0, and what happens when the study budget is still 0?", "Who is the rule's guarantor as a data type (a member, or a client contact recorded by a member as CR2 says for inputs), and is the risk limit's source quote (the CFO's sentence) stored?"]}, "data": {"purpose": "Make the client's own files usable as evidence: each tabular file under an accepted data contract and quality report, each document number checked on its page, every model number bound to a column or page and checked before use.", "actors": ["Researcher", "Ada", "Code"], "process": [{"n": 1, "phase": "Intake", "actor": "Code", "action": "List every file with who asked for it", "detail": "The study's files sit among the client's sources in the study's Vstupy folder; each row says what is inside, its contract summary, which Zadání part requested it and its status; Deep Research's market inputs appear as a row too.", "fields": ["Soubor", "Co je uvnitř", "Smlouva dat", "Vyžádalo", "Stav", "Přidat podklady", "Stáhnout originály"], "rule": null, "output": "Data step's file table.", "onFail": "A file Zadání asked for and nobody delivered stays an open item.", "screen": "M1 · 01 Soubory a k čemu jsou", "source": "KM1Data · study-files#SF6 · client-data-in-analysis#10", "status": "proposed"}, {"n": 2, "phase": "Reading", "actor": "Code", "action": "Read the whole grid from the original", "detail": "A full-grid reader over the kept original bytes, not the stored preview reading, under stated analysis bounds.", "fields": ["rows read / rows total", "sheet", "bound"], "rule": "Above the bounds the reader refuses by name; never a partial copy; a reading carrying rows_bound or sheets_bound cannot be accepted.", "output": "A complete grid for the contract and the quality report ('celý list, 12 400 z 12 400 řádků').", "onFail": "'zkrácené čtení nelze přijmout': refused by name.", "screen": "MV1 · 02 Čtení souboru", "source": "client-data-in-analysis#3a · #2a", "status": "planned"}, {"n": 3, "phase": "Contract", "actor": "Ada", "action": "Propose a data contract for a tabular file", "detail": "Per column: kind, role in the contract (identifikátor, segment, období, zásah, výsledek), personal or not, whether it goes into the analysis copy (ano, vyřazen, jen odvozené), a masked sample; derived columns proposed in place of personal ones (PSČ → kraj, město nad 100 tis.).", "fields": ["Sloupec", "Druh", "Role ve smlouvě", "Osobní?", "Do analytické kopie", "Ukázka"], "rule": "A dataset is not usable on upload alone; the contract is a frozen type.", "output": "Contract v1 in state 'návrh' ('návrh Ady, upravil výzkumník').", "onFail": null, "screen": "MV1 · 01 Datová smlouva", "source": "client-data-in-analysis#2 · MV1Contract", "status": "planned"}, {"n": 4, "phase": "Contract", "actor": "Researcher", "action": "Classify every used column", "detail": "The researcher names each column used and classifies it personal or not; samples of personal columns are masked; a column the personal-data hints flag is refused unless the researcher overrides it explicitly.", cost-model-study#CP4, #CP1", "status": "planned"}, {"n": 3, "phase": "Propose", "actor": "Ada", "action": "Propose a better-grounded value with its source", "detail": "When new client data arrives under an accepted contract, Ada proposes replacing a person's range with the data's (here 0-12 % by marketing replaced by 2,2-5,8 %, base 3,9 %); the row keeps the previous value as \"dříve\".", "fields": ["proposed min/base/max", "source link (Ukázat: datová smlouva)", "previous value (dříve)", "reason"], "rule": "Ada states no number that is not in its context and computes none; each change is a per-change operation", "output": "A proposal in the Lead pane; on accept, the input changes and the last run's results are marked to be rerun", "onFail": "Dismissed: nothing changes; on a route not approved for Class A the Lead's turn parks (LO12a)", "screen": "M2 · Ada pane (\"Přijmout oba.\" → \"Přijato jako vaše rozhodnutí. Výpočet je potřeba spustit znovu\")", "source": "cost-model-study#CP9 · KM2Assumptions board", "status": "planned"}, {"n": 4, "phase": "Bind", "actor": "Researcher", "action": "Take an input from a public source", "detail": "An input taken from Rešerše names the accepted knowledge item, its revision and the quote it rests on (e.g. wage growth from ČSÚ DataStat).", "fields": ["knowledge_item_id", "revision", "quote", "Zdroj"], "rule": "A public_source input names a typed SOURCE revision; a Deep Research finding enters only after a person added its source", "output": "PublicSource provenance; label veřejný zdroj", "onFail": "no_provenance refused; a research_result input refused provenance_not_available", "screen": "M2 · 01, row \"Růst mezd ve skladování ročně\"", "source": "cost-model-study#CP1 · client-knowledge-lifecycle K3 · quantitative-families#MKT4", "status": "planned"}, {"n": 5, "phase": "Bind", "actor": "Code", "action": "Derive a volume input from a backtested forecast", "detail": "The kept forecast method's backtest errors (5th-95th percentile) gi ding whose source no person added cannot be an input", "screen": "M4e · 01-03; header \"Přidat do osnovy zprávy\", \"Exportovat CSV / XLSX\", \"Porovnat běhy\"", "source": "quantitative-families#MKT2, #MKT4, #MKT5 · ADR 0046 W22, A10", "status": "planned"}], "objects": [{"name": "Result ref", "fields": ["ref id", "option", "quantity", "grade: výpočet | odhad", "method id / version", "register status", "median, p5, p95", "v základu", "inputs read"], "states": ["internal (odhad (interní))", "registered", "stale"]}, {"name": "Verdict", "fields": ["DecisionRule (option, quantity, comparison, threshold, confidence, risk bound, constraint)", "stated at", "changed after results: bool", "per option: splněno / nesplněno", "doporučeno | nerozhodnuto", "default confidence used: bool", "dominance"], "states": ["no rule", "judged", "marked changed after results"]}, {"name": "Value-of-information row", "fields": ["input", "EVPPI before", "EVPPI after", "Jak ověřit", "material: bool", "offer"], "states": ["offered", "started"]}, {"name": "Result view (tab)", "fields": ["tab: Rozhodnutí | Finance | Účetnictví | Provoz | Logistika | Trh", "framework", "sections", "data waited for"], "states": ["computed", "čeká na data", "analýza není vybraná"]}], "handoffs_out": [{"name": "Chosen results as report-outline points", "to": ["osnova"], "contents": ["result refs with grade and method", "charts as specs over stored refs", "verdict with its rule", "researcher judgements with author"]}, {"name": "Properties for the map", "to": ["sociomapa"], "contents": ["options as objects", "chosen results (NPV, interval width, P(cheapest)) as properties", "scale extremes and direction"]}, {"name": "Results for the report", "to": ["zprava"], "contents": ["CALCULATED numbers", "ESTIMATED numbers labelled with method status", "method appendix (id, version, register status)"]}, {"name": "Requests for missing data", "to": ["data"], "contents": ["file or columns a view waits for (e.g. promised and actual delivery dates)"]}], "gaps": ["The canvas's rule is multi-option with a risk bound (P(loss > 10 mil.) ≤ 10 %) and a hard constraint (the city promise); CR7 defines a pairwise rule (one option, one threshold, a confidence). How is a rule over seven options with a risk bound and constraints represented and judged, and who checks a constraint like \"Slib ve městech\"?", "Client surface for unregistered estimates: W27 says they reach the client report labelled with an approval warning, but CP10 still refuses them on the client surface and M4's banner says the client report carries only výpočet and ranges. Which is built?", "Where do the Finance, Účetnictví and Provoz figures per option come from? quantitative-families computes statements from a ledger and ratios from statements, but the canvas projects 2028 statements and ratios per option and a monthly LP: what links the cash-flow model to those projections?", "The verification offer: CR6 offers \"Ověřit výzkumem\" (a survey study), which the freeze removed; the canvas's \"Jak ověřit\" lists data requests and contract terms. What does a material EVPPI now offer, and what does it create?", "Where is the verdict at other discount rates drawn, and which rates (W16)? M4 has no section for it.", "What does \"Přidat do osnovy zprávy\" hand over: a single number, a whole section, a chart spec? And what happens to an added point when the run is rerun or a result goes stale?", "The exact range table and dominance (CR2, CR8) are planned for Výsledky but not drawn on M4; where do they sit beside the Monte Carlo table?"]}, "sociomapa": {"purpose": "Show which objects the rows rate alike, and how firm that picture is, by one engine and two map types; it supports the recommendation and never makes it.", "actors": ["Researcher", "Ada", "Code", "Metodika", "Client's people"], "process": [{"n": 1, "phase": "Configuration", "actor": "Ada", "action": "Propose the configuration", "detail": "From where the rows come from and what is asked, Ada ail": null, "screen": null, "source": "sociomapa-systemu#SYS2 · MOD-11.1", "status": "planned"}, {"n": 5, "phase": "Map", "actor": "Code", "action": "Compute the map", "detail": "aia-sociomap-5: pair relations (baseline-corrected r̃, or correlation of standardised columns), layout on the ruler, heights and terrain where defined, split-half agreement.", "fields": ["r̃ per pair", "layout method", "iterations", "converged", "heights", "split-half"], "rule": "One engine for every configuration; a configuration is data, not code.", "output": "The map.", "onFail": null, "screen": null, "source": "engine_v2.compute_object_map · AIA_SOCIOMAP_V5", "status": "decided"}, {"n": 6, "phase": "Test", "actor": "Code", "action": "Run the scenario test", "detail": "Futures: the map under driver correlation 0, 0,4 and 0,8 and on a new sample; Spearman of distances ≥ 0,8 for every two. Weights: shares of first place in three fan widths.", "fields": ["assumptions", "samples", "ρ per pair of maps", "shares first / tied"], "rule": "No p-values: the model makes as many rows as we ask for.", "output": "The stability verdict and the shares.", "onFail": "Printed as is; distances are then not read.", "screen": null, "source": "lifecycle page: Budoucnosti, Nastavení vah", "status": "planned"}, {"n": 7, "phase": "Test", "actor": "Code", "action": "Run the observed-data test", "detail": "Experts: whole experts resampled, one radius 1,2 × median spread. Units: 400 bootstraps, a pair drawn when its 95 % interval excludes zero. Months: 1 000 IAAFT surrogates, Benjamini–Yekutieli, effective months.", "fields": ["resamples", "radius", "intervals", "q", "n_eff"], "rule": "Resample the way the rows depend on each other.", "output": "The test result per pair or per map.", "onFail": "A pair that fails is not drawn.", "screen": null, "source": "lifecycle page: Experti, Jednotky, Měsíce", "status": "planned"}, {"n": 8, "phase": "Tables", "actor": "Code", "action": "Build the tables beside the map", "detail" function drawConnectors(){
  document.querySelectorAll(".lanes").forEach(box=>{
    const svg=box.querySelector("svg.conn"); if(!svg)return;
    const b=box.getBoundingClientRect(); svg.setAttribute("width",b.width); svg.setAttribute("height",b.height); svg.setAttribute("viewBox",`0 0 ${b.width} ${b.height}`);
    const cards=[...box.querySelectorAll(".pcard")].map(c=>c.getBoundingClientRect());
    let d="";
    for(let i=0;i<cards.length-1;i++){const a=cards[i],c=cards[i+1];const x1=a.left+a.width/2-b.left,y1=a.bottom-b.top,x2=c.left+c.width/2-b.left,y2=c.top-b.top;const my=y1+(y2-y1)/2;
      d+=Math.abs(x1-x2)<2?`M${x1},${y1}V${y2-2}`:`M${x1},${y1}V${my}H${x2}V${y2-2}`}
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--strong)" stroke-width="1.6"/>`;
  });
}

/* ================= language: Czech by default, English one click away ================= */
/* The page is written in English. In Czech mode every piece of text that is drawn is looked up in CS and
   replaced, numbers carried across. The lookup key is the English text with each number replaced by §.
   Text inside [data-notr] is left alone: plan chunks and the build detail of each step are quoted from the
   plan files, which are in English. */
const LANG_KEY="aia-mvp-map-lang";
let LANG="cs"; try{const l=localStorage.getItem(LANG_KEY);if(l==="en"||l==="cs")LANG=l}catch(e){}
const CS=JSON.parse(document.getElementById("i18n-cs").textContent);
const NUM=/\d+(?:[.,]\d+)*/g;
/* Numbers are carried into the Czech text. The page writes decimals both ways (0,871 and 0.82) and thousands the
   English way (20,000), so: a comma group counts as thousands only when the number does not start with 0;
   a point becomes a comma; and a number that is part of an id (MOD-13.1, v1.2) is left exactly as it is. */
function csNum(x,idLike){if(idLike)return x;return /^[1-9]\d{0,2}(,\d{3})+$/.test(x)?x.replace(/,/g," "):/^\d+\.\d+$/.test(x)?x.replace(".",","):x}
/* Czech "z/ze" and "v/ve" depend on how the number after them is read ("ze 6", "ve 42 %", "z 9").
   Ordinals and dates ("z 9. listopadu") are left as the translator wrote them. */
function csVoc(n){while(n>=1000){n=Math.floor(n/1000);if(n===1)return [false,false]}
  if(n>=100){n=Math.floor(n/100);if(n===1)return [true,true]}
  else if(n>=20)n=Math.floor(n/10);
  else if(n>=10)return [[12,13,14,16,17].includes(n),[12,13,14].includes(n)];
  return [[2,3,4,6,7].includes(n),[2,3,4].includes(n)]}
function csPrep(out){return out.replace(/(^|[^\p{L}\p{N}])([zZvV])e?([  ])(\d+(?: \d{3})*)(?!\d| \d{3}|\p{L}|\.[  ]\p{Ll})/gu,(m,pre,p,sp,num)=>{
  const v=csVoc(parseInt(num.replace(/ /g,""),10));return pre+p+((/z/i.test(p)?v[0]:v[1])?"e":"")+sp+num})}
/* the English original of a translated quote or plan text, as a tooltip in Czech mode */
const origT=x=>LANG==="cs"&&x?` data-orig title="${esc("Původní znění: "+x)}"`:"";
function tr(text){const t=text.trim();if(!t)return text;const s=t.replace(/\s+/g," "),nums=[];const key=s.replace(NUM,(m,off)=>{nums.push([m,/[A-Za-z]-?$/.test(s.slice(Math.max(0,off-2),off))]);return "§"});
  const cs=CS[key];if(cs===undefined)return text;let i=0;const out=csPrep(cs.replace(/§/g,()=>{const n=nums[i++];return n?csNum(n[0],n[1]):""}));
  /* a piece that became only punctuation ("tab." → ".") must sit against the link before it, without the space */
  return /^[.,;:!?)]/.test(out)?text.replace(t,out).replace(/^\s+/,""):text.replace(t,out)}
const TR_ATTRS=["placeholder","aria-label","title"];
function trTree(root){if(LANG!=="cs")return;

let abbrQ="";
function abbrPlanRows(){
  // one row per plan file: the id prefixes of its chunks, read from the plan data on this page
  const cs=LANG==="cs";
  return Object.keys(PLANS).map(k=>{const ids=PLANS[k].map(c=>String(c.id));
    const pre=[...new Set(ids.map(i=>(i.match(/^[A-Za-z]+/)||[""])[0]))].filter(Boolean);
    const name=cs?tr(PLAN_NAME[k]||k):(PLAN_NAME[k]||k);
    const ab=pre.length?pre.map(p=>p+"…").join(", "):k+"#"+ids[0]+" …";
    return [ab,"","",`Chunks of the plan “${name}” (${k}), ${ids.length} in all.`,`Díly plánu „${name}“ (${k}), celkem ${ids.length}.`]});
}
function renderAbbr(){
  const cs=LANG==="cs", T=(e,c)=>esc(cs?c:e);
  const groups=ABBR.map(g=>g[0]==="Codes on this page"?[g[0],g[1],g[2],g[3],g[4].concat(abbrPlanRows())]:g);
  const total=groups.reduce((n,g)=>n+g[4].length,0);
  const body=groups.map(([ge,gc,ne,nc,rows])=>`<div class="section abg"><div class="mgh"><h3>${T(ge,gc)}</h3>${ne?`<p>${T(ne,nc)}</p>`:""}</div>
    <div class="abtab">${rows.map(([a,fe,fc,me,mc])=>{const full=cs?(fc||fe):fe;
      return `<div class="abrow" data-s="${esc((a+" "+fe+" "+fc+" "+me+" "+mc).toLowerCase())}"><b>${esc(a)}</b><span class="abfull">${esc(full)}</span><span class="abmean">${T(me,mc)}</span></div>`}).join("")}</div></div>`).join("");
  $("#v-abbr").innerHTML=`<div data-notr><h2>${T("Abbreviations and codes","Zkratky a kódy")}</h2>
  <p class="lede">${T(`Every abbreviation and code this page uses, ${total} rows in ${groups.length} groups: what the letters stand for and what it means in plain words. The words the page uses, such as Zadání or guarantor, are explained in the glossary on the Overview tab.`,
    `Všechny zkratky a kódy, které tato stránka používá, ${total} řádků v ${groups.length} skupinách: co písmena znamenají a co to je prostými slovy. Slova, která stránka používá, například Zadání nebo garant, vysvětluje slovník na záložce Přehled.`)}</p>
  <p><label class="abq"><span>${T("Find","Hledat")}</span><input id="abq" type="search" autocomplete="off" value="${esc(abbrQ)}" placeholder="${T("for example NPV, W25, register","například NPV, W25, registr")}"></label>
  <span class="cap" id="abn" aria-live="polite"></span></p>
  ${body}</div>`;
  abbrFilter();
}
function abbrFilter(){const q=abbrQ.trim().toLowerCase();let n=0;
  document.querySelectorAll("#v-abbr .abg").forEach(g=>{let any=false;g.querySelectorAll(".abrow").forEach(r=>{const on=!q||r.dataset.s.includes(q);r.hidden=!on;if(on){any=true;n++}});g.hidden=!any});
  const el=document.getElementById("abn");if(el)el.textContent=q?(LANG==="cs"?`Nalezeno řádků: ${n}`:`Rows found: ${n}`):""}
document.addEventListener("input",e=>{if(e.target.id==="abq"){abbrQ=e.target.value;abbrFilter()}});

lsLoad(); renderLang(); renderNav(); route(); setSave("This browser only","warn");
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  if(!db){setSave("This browser only","warn");return}
  setSave("Saved","ok");
  for(const id of [...pending])putMark(id);
  for(const iid of [...pendingIdeas])putIdea(iid);
  db.collection("marks").onSnapshot(s=>{const fresh={};s.docs.forEach(d=>{const v=d.data();if(v&&v.id)fresh[v.id]={stance:v.stance||"",note:v.note||"",answer:v.answer||"",star:v.star||false}});
    for(const k of pending){const v=marks[k];if(v&&(v.stance||v.note||v.answer||v.star))fresh[k]=v;else delete fresh[k]}
    marks=fresh;lsSave();rerenderSoft()},e=>setSave("Sync stopped","warn"));
  db.collection("ideas").onSnapshot(s=>{const fresh={};s.docs.forEach(d=>{fresh[d.id]=d.data()});for(const k of pendingIdeas){if(ideas[k])fresh[k]=ideas[k];else delete fresh[k]}ideas=fresh;lsSave();rerenderSoft()},e=>{});
})();
let softT,softDue=false;function rerenderSoft(){clearTimeout(softT);softT=setTimeout(()=>{const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"||a.tagName==="SELECT")){softDue=true;return}softDue=false;const y=scrollY;rerender();scrollTo(0,y)},120)}
document.addEventListener("focusout",()=>{if(softDue)rerenderSoft()});
</script>
