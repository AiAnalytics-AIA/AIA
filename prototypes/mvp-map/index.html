 scope record of § Nov parks. Until you say which record stands, treat them as undecided. The small code after each line is the decision, question or plan it comes from.":"Pět seznamů. Ve druhém je to, co tato stránka plánuje do MVP, ale záznam rozsahu z §. listopadu odkládá. Dokud neřeknete, který záznam platí, berte to jako nerozhodnuté. Malý kód za každým řádkem označuje rozhodnutí, otázku nebo plán, ze kterého položka vychází.","Data-class gates are enforced wherever a real client's data is held; on develop they only advise":"Brány tříd dat platí závazně všude, kde jsou uložena data skutečného klienta; v prostředí develop jen jako doporučení","A run shows accuracy and unsupported claims; recall is measured on the test set":"Běh ukazuje přesnost a nepodložená tvrzení; úplnost se měří na testovací sadě","The freeze on Deep Research's engine is lifted only for v§'s capabilities":"Zmrazení jádra Deep Research je zrušeno jen pro schopnosti v§","each step has its own source; the chain shows its weakest source":"každý krok má vlastní zdroj; řetěz ukáže ten nejslabší zdroj","bottom-up sizing from a survey (MKT§): parked together with the survey work":"zdola nahoru z průzkumu (MKT§): odloženo spolu s větví průzkumů","The example failed at § and § experts, § depots and § months; Velis placed objects without relation lines below § rows. Proposed: set each minimum from its planted-answer test and print it on the map.":"Příklad selhal při § a § expertech, § depech a § měsících; Velis při méně než § řádcích umístil objekty bez čar vztahů. Návrh: každé minimum určit z jeho zkoušky s vloženou odpovědí a uvést ho na mapě.","The map can't answer this. It subtracts each row's mean, and that removes the level the options share, which is what a joint loss is made of. Proposed: answer it from the joint-loss table beside the futures map.":"Na to mapa odpovědět neumí: odečtením řádkového průměru zmizí společná úroveň, ze které se společná ztráta skládá. Návrh: odpovídat z tabulky společných ztrát vedle mapy budoucností.","Two options can be close because they score alike, or because their strengths and weaknesses follow the same pattern even at different levels. The mindmap leaves this open; every other map here takes close to mean the same pattern. Proposed: build both on the test dataset and keep the one that exposes the traps planted in it.":"Dvě varianty mohou být blízko, protože mají podobné hodnoty, nebo protože jejich silné a slabé stránky mají stejný průběh, i když na jiné úrovni. Myšlenková mapa to nechává otevřené; všechny ostatní mapy zde berou blízkost jako stejný průběh. Návrh: postavit obě verze na testovací datové sadě a ponechat tu, která odhalí pasti vložené do sady.","Indicators come in Kč, km and %. A rank ignores how large the gaps are. A §–§ range lets one extreme option stretch the scale. A z-score depends on which options are in the set. This page proposes the median and MAD per indicator. To be decided using the test dataset: does the leader or the grouping change between methods?":"Ukazatele jsou v Kč, km a %. Pořadí nebere v úvahu, jak velké jsou rozdíly. Rozsah §–§ dovolí jedné krajní variantě roztáhnout stupnici. Z-skóre závisí na tom, které varianty jsou v sadě. Tato stránka navrhuje medián a MAD pro každý ukazatel. Rozhodnout na testovací datové sadě: mění se mezi metodami vedoucí varianta nebo seskupení?","How to read the maps; the state of the world from Deep Research, which rows it could move and in which direction; what happens if one weight doubles; and the limits.":"Jak mapy číst, stav světa z Deep Research, které řádky by mohl posunout a kterým směrem, co se stane, když se jedna váha zdvojnásobí, a omezení.","A row where lower is better but it is read as if higher were better.":"Řádek, kde je lepší nižší hodnota, ale čte se, jako by byla lepší vyšší.","Inputs are the judgement of named people; their names are personal data of people at the client.":"Vstupy jsou úsudky jmenovitě uvedených lidí; jména jsou osobní údaje lidí u klienta.","Objects with a strong negative relation are placed far apart; height is not decided yet.":"Objekty se silným záporným vztahem leží daleko od sebe; o výšce není rozhodnuto.","All three, each at a rate declared in advance. In the example the units map drew § false pairs of § (§ %), where about one per run was expected. So the rate must be stated before the register entry.":"Všechny tři, s předem stanovenou mírou. V příkladu mapa jednotek vykreslila § falešných dvojic ze § (§ %); čekala se asi jedna na běh. Míru je třeba stanovit před zápisem do registru metod.","Soft-rank Spearman with Coulomb repulsion for §–§ objects, Interval MDS for more; the result is converted to the ruler.":"Soft-rank Spearman s Coulombovým odpuzováním (§–§ objektů), nad tento počet Interval MDS; převedeno na pravítko.","Scenario maps: does the same picture come out under assumptions written first? Observed-data maps: does it hold when we resample the rows in a way that keeps how they depend on each other?":"Mapy scénářů: vyjde stejný obraz i při předpokladech zapsaných předem? Mapy naměřených dat: vydrží obraz, když řádky převzorkujeme tak, jak na sobě závisejí?","Where a statistical method helps the nine steps: what goes in, what happens, what comes out, and what it adds to the report. Six methods are in the MVP. Each is fixed before the results are seen and none of them learns from outcomes. Methods that do learn come after the MVP (decided on § Nov); an example is weights adjusted after a decision proved wrong. They are listed at the end of this tab. All numbers are the fictional Velis case.":"Kde statistická metoda pomáhá devíti krokům: co do ní vstupuje, co se stane, co z ní vychází a co přidá do reportu. V MVP je šest metod. Každá je pevně dána dřív, než jsou vidět výsledky, a žádná se neučí z toho, jak rozhodnutí dopadla. Metody, které se učí, přijdou až po MVP (rozhodnuto §. listopadu); příkladem jsou váhy upravené poté, co se rozhodnutí ukázalo jako chybné. Tyto metody najdete na konci této záložky. Všechna čísla jsou ze smyšleného případu Velis.","Every configuration finds the structure planted in its fixture. In a world with no relation, it draws no more false relations than its declared error rate allows. Scenario maps are tested by their stability under assumptions written down first; observed-data maps by resampling in a way that respects how their rows depend on each other.":"Každá konfigurace najde strukturu vloženou do svých testovacích dat. Ve světě, kde žádný vztah není, nakreslí nejvýš tolik falešných vztahů, kolik připouští její předem uvedená míra chyb. Mapy scénářů se zkoušejí stabilitou při předpokladech zapsaných předem, mapy naměřených dat převzorkováním podle toho, jak na sobě jejich řádky závisejí.","For every pair of options it counts, over the futures, how often both lose against today. The map can't answer this: it removes each row's mean, and with it the shared level that a joint loss is made of. The table can.":"Pro každou dvojici variant spočítá, v kolika budoucnostech obě prohrávají proti dnešnímu stavu. Mapa na to odpovědět neumí: odečtením řádkového průměru zmizí společná úroveň, ze které se společná ztráta skládá. Tabulka to umí.","Two records in the repo disagree. The master plan and ADR § keep your decision A§ of § Nov: everything stays in the MVP and no single study is its spine. This page is built on that. The scope record of § Nov (prototypes/obchodni-model/MVP-SCOPE.md, version §) says your words of § Nov replaced A§. In that record one study is the spine: the site decision behind report §. The record parks the analysis frameworks, accounting and market size, operations research, the data connectors, Sobol sensitivity, the diagram stacks, the shared client review and the personal-data register. It plans five two-week waves. It also adds an acceptance step before the case: an independent calculation with known answers. If the § Nov record stands, the steps, the build order and the Done-when tab on this page have to be cut down to match it.":"Dva záznamy v repozitáři si odporují. Hlavní plán a ADR § se drží vašeho rozhodnutí A§ z §. listopadu: vše zůstává v MVP a žádná jednotlivá studie není jeho páteří. Na tom stojí tato stránka. Záznam rozsahu z §. listopadu (prototypes/obchodni-model/MVP-SCOPE.md, verze §) uvádí, že vaše slova z §. listopadu nahradila A§: páteří je studie, ze které vznikl report §, tedy rozhodnutí o lokalitě. Záznam odkládá analytické rámce, účetnictví a velikost trhu, operační výzkum, datové konektory, citlivost metodou Sobol, sady diagramů, sdílenou revizi s klientem a registr osobních údajů. Plánuje pět dvoutýdenních vln. Před samotný případ navíc přidává jeden krok přijetí: nezávislý výpočet se známými odpověďmi. Pokud platí záznam z §. listopadu, musíme podle něj seškrtat kroky, pořadí stavby i záložku „Kdy je hotovo“ na této stránce.","A public value equals the source's response byte for byte. VIES is never stored. A field that names a person stays hidden unless a balancing test has been done.":"Veřejná hodnota se shoduje s odpovědí zdroje bajt po bajtu. VIES se nikdy neukládá. Pole, které uvádí člověka jménem, zůstane skryté, dokud neproběhne balanční test.","An estimate whose method is not approved reaches a client only with a label, and the approval record keeps the warning.":"Odhad, jehož metoda není schválená, se ke klientovi dostane jen s označením a upozornění se zaznamená ve schválení.","sociomapa-systemu (SYS§–SYS§) and M-§ in the master plan speak of four “modes”, grade MODELLED, § scenarios and edges on the scenario map. The methodology of § Nov has two types and five configurations, grade odhad, § § futures and no lines on a scenario map. Proposed: bring the plan files to the methodology before SYS§ starts. The plan files and the design screens also still say Zpráva and Osnova zprávy; this page says Report and Osnova reportu since § Nov.":"Plán sociomapa-systemu (SYS§–SYS§) a M-§ v hlavním plánu mluví o čtyřech „režimech“, stupni MODELLED, § scénářích a hranách na mapě scénářů. Metodika z §. listopadu má dva typy a pět konfigurací, stupeň odhad, § § budoucností a na mapě scénářů žádné čáry. Návrh: sladit soubory plánů s metodikou, než začne SYS§. Soubory plánů a návrhové obrazovky také stále říkají Zpráva a Osnova zprávy; tato stránka od §. listopadu říká Report a Osnova reportu.","Turn the client's loosely worded problem into a decision that can be tested (owner, options, a rule with threshold and risk limit, objectives) before any data or computation, and hand each later step exactly what it needs.":"Převést volně formulovaný problém klienta na rozhodnutí, které lze ověřit (vlastník, varianty, pravidlo s prahem a limitem rizika, cíle), dříve než přijdou data nebo výpočty, a předat každému dalšímu kroku přesně to, co potřebuje.","Describe the decision in own words":"Popsat rozhodnutí vlastními slovy","One free-text field: what the client is choosing between, why now, what the firm wants, who decides and by when. Starter texts can prefill it (Investice, nebo služba; Cena; Nový produkt; Kampaň).":"Jedno volné textové pole: mezi čím klient volí, proč právě teď, čeho chce firma dosáhnout, kdo rozhoduje a do kdy. Lze ho předvyplnit úvodními texty (Investice, nebo služba; Cena; Nový produkt; Kampaň).","The only required field of the stage; nothing else is mandatory.":"Jediné povinné pole kroku; nic jiného povinné není.","Popis saved on the study's working copy (revision-checked).":"Popis uložený v pracovní verzi studie (s kontrolou revize).","Attach the client's files":"Přiložit soubory klienta","Files added through Přidat podklady are kept as the client's sources, with this study's occurrence, and filed in the study's Vstupy folder; each row shows its reading (e.g. 'list Měsíce · § měsíců · přečteno celé', 'PDF · § stran · přečteno') and the label Důvěrné.":"Soubory přidané přes Přidat podklady se uchovají jako zdroje klienta s výskytem v této studii a založí se do složky Vstupy studie. Každý řádek ukazuje, jak byl soubor přečten (např. 'list Měsíce · § měsíců · přečteno celé', 'PDF · § stran · přečteno'), a štítek Důvěrné.","file name":"název souboru","reading summary":"souhrn čtení","A brief's files are Class A by rule; no data class on screen, a file reads Důvěrný or Veřejný.":"Soubory zadání jsou podle pravidla ve třídě A; třída dat se na obrazovce neukazuje, soubor je označen Důvěrný nebo Veřejný.","client_sources rows + a knowledge item filed in the study's Vstupy folder.":"řádky client_sources + znalostní položka založená ve složce Vstupy studie.","Show what the text already states, suggest missing materials":"Ukázat, co text už uvádí, a navrhnout chybějící podklady","Ada lists the brief elements she read from the text as chips (rozhodnutí, § možnosti, cíl, kdo a do kdy, mez rizika missing) and proposes further materials in 'Co ještě pomůže', each with what it contains, why it helps and which step uses it.":"Ada vypíše prvky zadání, které vyčetla z textu, jako štítky (rozhodnutí, § možnosti, cíl, kdo a do kdy, mez rizika chybí). V 'Co ještě pomůže' navrhne další podklady a u každého uvede, co obsahuje, proč pomůže a který krok ho použije.","Nothing suggested is required.":"Nic z navrženého není povinné.","Přidat: 'Přidáno · přečte se při triáži'; Nemáme: an open item.":"Přidat: 'Přidáno · přečte se při triáži'; Nemáme: otevřená položka.","Nemáme: 'Zapsáno jako otevřená položka'; a missing file later becomes a wide-range assumption.":"Nemáme: 'Zapsáno jako otevřená položka'; chybějící soubor se později stane předpokladem se širokým rozsahem.","Propose the eight parts with sources":"Navrhnout osm částí se zdroji","On 'Pokračovat · Ada rozepíše Zadání' an ordinary Lead turn reads the Popis and files and proposes eight parts (decision and goal; who and by when; options; constraints; rule and risk; customers; data and uncertainties; execution and output on the canvas), each citing where it came from (file and page or the Popis) and naming the step it goes to; extra options Ada adds are marked as hers.":"Po 'Pokračovat · Ada rozepíše Zadání' přečte Ada v běžném tahu Popis a soubory a navrhne osm částí: rozhodnutí a cíl; kdo a do kdy; varianty; omezení; pravidlo a riziko; zákazníci; data a nejistoty; provedení a výstup na plátně. Každá část cituje, odkud pochází (soubor a strana, nebo Popis), a uvádí krok, do kterého jde. Varianty, které Ada přidá, jsou označené jako její.","part title":"název části","proposed text":"navržený text","→ target step":"→ cílový krok","Models propose, a person accepts (ADR §); triage is an ordinary Lead turn; a paid job only through a card with an amount.":"Modely navrhují, člověk přijímá (ADR §); triáž je běžný tah Ady; placená úloha jen přes kartu s částkou.","A proposal of n parts on the working copy, nothing applied.":"Návrh n částí v pracovní verzi; nic není použito.","Accept, edit or drop each part":"Přijmout, upravit nebo zahodit každou část","Each part has a checkbox; 'Přijmout vybrané (n)' applies the ticked parts to the working copy; the rest stay proposed until dismissed; 'Vrátit' undoes; 'Odložit' defers.":"Každá část má zaškrtávací políčko; 'Přijmout vybrané (n)' zapíše zaškrtnuté části do pracovní verze; ostatní zůstávají v návrhu, dokud je nezahodíte; 'Vrátit' krok vrátí; 'Odložit' ho odloží.","checkbox per part":"zaškrtávací políčko u každé části","Accepted per change; nothing is accepted on its own.":"Přijímá se po jednotlivých změnách; nic se nepřijme samo.","Accepted parts written into the Zadání; 'Přijato n částí. Ostatní zůstávají v návrhu, dokud je nezahodíte.'":"Přijaté části zapsané do Zadání; 'Přijato n částí. Ostatní zůstávají v návrhu, dokud je nezahodíte.'","Ask every question that matters, by importance":"Položit všechny důležité otázky, seřazené podle významu","Questions ordered by how much they can change the recommendation; the first three open, the rest under 'Další otázky (n)'. Each carries its reason in words and a tag (mění doporučení, největší neznámá, plán provedení) and offers answer buttons or a chat answer.":"Otázky jsou seřazené podle toho, jak moc mohou změnit doporučení; první tři jsou rozbalené, ostatní pod 'Další otázky (n)'. Každá nese důvod vyjádřený slovy a štítek (mění doporučení, největší neznámá, plán provedení) a nabízí tlačítka s odpověďmi nebo odpověď v chatu.","why (in words)":"proč (slovy)","answer options":"možnosti odpovědi","No crown amount in triage; a value of information in Kč appears only on Výsledky, computed by the model.":"V triáži žádná částka v korunách; hodnota informace v Kč se objeví až v kroku Výsledky a spočítá ji model.","Open questions on the stage.":"Otevřené otázky v kroku.","Answer; the answer lands where it belongs":"Odpovědět; odpověď se zapíše tam, kam patří","A picked or typed answer is written into its target as the researcher's edit: the loss limit into the rule ('§ mil. Kč, nejvýš v § budoucnosti z § · zapsáno do pravidla'), a promised file into Data ('zpozdeni_§.xlsx přijde do Dat'), a pilot into execution.":"Vybraná nebo napsaná odpověď se zapíše do svého cíle jako úprava výzkumníka: limit ztráty do pravidla ('§ mil. Kč, nejvýš v § budoucnosti z § · zapsáno do pravidla'), slíbený soubor do Dat ('zpozdeni_§.xlsx přijde do Dat'), pilot do provedení.","answer":"odpověď","target field":"cílové pole","edit time":"čas úpravy","The answered question closes with its stored answer; the target field changes as a logged edit.":"Zodpovězená otázka se uzavře s uloženou odpovědí; cílové pole se změní jako zaznamenaná úprava.","Nemáme on a data question: the quantity stays an open item.":"Nemáme u datové otázky: veličina zůstane otevřenou položkou.","Fix decision, owner, deadline and goal":"Stanovit rozhodnutí, vlastníka, termín a cíl","The decision core's first block, each field with its source line (e.g. 'vysledovka_§.xlsx ř. §').":"První blok jádra rozhodnutí; každé pole s řádkem svého zdroje (např. 'vysledovka_§.xlsx ř. §').","R§: the decision has an owner, a date and a business goal (code, holds the hand-off).":"R§: rozhodnutí má vlastníka, datum a obchodní cíl (kontroluje kód, zastaví předávku).","Decision core block § on the working copy.":"Blok § jádra rozhodnutí v pracovní verzi.","R§ chip not done; hand-off held.":"Štítek R§ nesplněn; předávka zastavena.","Propose whether a computation is needed":"Navrhnout, zda je potřeba výpočet","Ada proposes 'Potřebuje výpočet?' from the decision type; the researcher confirms. Yes shows Data, Předpoklady, Model, Výsledky and the Model sub-step, and adds the badge 'Obchodní model' beside 'Výzkum'; no goes from Rešerše to Osnova reportu.":"Ada navrhne 'Potřebuje výpočet?' podle typu rozhodnutí; výzkumník potvrdí. Ano zobrazí kroky Data, Předpoklady, Model, Výsledky a dílčí krok Model a vedle 'Výzkum' přidá odznak 'Obchodní model'; Ne vede z Rešerše rovnou do Osnovy reportu.","proposed by":"navrhl","confirmed by":"potvrdil","badge":"odznak","Ada proposes, the researcher confirms; the model steps exist only on yes.":"Ada navrhne, výzkumník potvrdí; kroky modelu existují jen při Ano.","Model switch on the study; the stage track and the model content kind change (CP§).":"Přepínač modelu ve studii; změní se dráha kroků a druh obsahu modelu (CP§).","List options and constraints":"Vypsat varianty a omezení","Options as keyed rows (A, A§, B, B§, C, C§, H) with a description, a cited page and who added them ('klient' or 'Ada · přijato'); 'Přidat možnost'. Constraints every option must meet, each with its source (e.g. 'smlouva_§PL_CZ.pdf s. §').":"Varianty jako řádky s klíčem (A, A§, B, B§, C, C§, H) s popisem, citovanou stranou a tím, kdo je přidal ('klient' nebo 'Ada · přijato'); 'Přidat možnost'. Omezení, která musí splnit každá varianta, každé se svým zdrojem (např. 'smlouva_§PL_CZ.pdf s. §').","option key":"klíč varianty","option text":"text varianty","detail + source page":"podrobnost + strana zdroje","constraint":"omezení","constraint source":"zdroj omezení","R§: at least two options, or one against 'nic neměnit'; constraints written down (code, holds the hand-off).":"R§: aspoň dvě varianty, nebo jedna proti 'nic neměnit'; omezení jsou zapsaná (kontroluje kód, zastaví předávku).","Options become the model's variants; constraints its timing and capacity rules.":"Z variant se stanou varianty modelu, z omezení jeho pravidla pro načasování a kapacitu.","R§ not done; hand-off held.":"R§ nesplněno; předávka zastavena.","State the rule and risk limit first":"Nejdřív stanovit pravidlo a limit rizika","Measure (e.g. příspěvek po logistice, NPV §–§ at § % against B), threshold (better than today with P ≥ § of § § futures), risk limit (chips § / § / § mil. Kč or 'Napsat vlastní': a loss worse than X in at most § future in §) and what follows when no option passes. The rule sentence is stamped with its time, 'před prvním výpočtem', and its guarantor.":"Ukazatel (např. příspěvek po logistice, NPV §–§ při § % proti B), práh (lepší než dnes s P ≥ § z § § budoucností), limit rizika (štítky § / § / § mil. Kč nebo 'Napsat vlastní': ztráta horší než X nejvýš v § budoucnosti z §) a co následuje, když žádná varianta neprojde. Věta pravidla nese čas zápisu, 'před prvním výpočtem', a svého garanta.","Recorded before the first computation; any change logged and marked in the report; no confidence named → default §/§, said on the page; no rule → no recommendation. 'Mez určuje finanční ředitel, ne Ada.'":"Zapisuje se před prvním výpočtem; každá změna se zaznamená a v reportu označí; když není uvedena hladina jistoty → výchozí §/§, uvedená na stránce; bez pravidla → žádné doporučení. 'Mez určuje finanční ředitel, ne Ada.'","DecisionRule on the working copy (an element of the Model Revision), its first statement and changes in the operation log.":"DecisionRule v pracovní verzi (prvek revize modelu); jeho první znění a změny v protokolu operací.","State 'chybí mez rizika'; R§ fails and holds the hand-off.":"Stav 'chybí mez rizika'; R§ neprojde a zastaví předávku.","Choose how certain the answer must be":"Zvolit, jak jistá musí být odpověď","One of three: Stačí směr (one central scenario), Číslo s rozsahem (every result with an interval, § § futures), Úzký rozsah (within ±§ %, more scenarios, narrower input ranges).":"Jedna ze tří: Stačí směr (jeden centrální scénář), Číslo s rozsahem (každý výsledek s intervalem, § § budoucností), Úzký rozsah (v rozmezí ±§ %, více scénářů, užší rozsahy vstupů).","Certainty level on the decision core.":"Úroveň jistoty v jádru rozhodnutí.","Set objectives, execution and output":"Stanovit cíle, provedení a výstup","Objectives C§…Cn, each tagged with what it serves (pravidlu, provedení, gives the model assumptions). Execution: who reads, in what form, pilot (region, length, start, owner), what will be watched, scope, deadline and study budget.":"Cíle C§…Cn, každý označený tím, čemu slouží (pravidlu, provedení, dává modelu předpoklady). Provedení: kdo čte a v jaké podobě, pilot (region, délka, začátek, vlastník), co se bude sledovat, rozsah, termín a rozpočet studie.","R§: every objective serves the decision or its execution (code); R§: execution, scope, budget and deadline fit (Lead's advice, holds nothing).":"R§: každý cíl slouží rozhodnutí nebo jeho provedení (kontroluje kód); R§: provedení, rozsah, rozpočet a termín k sobě sedí (rada Ady, nic nezastaví).","Objectives (read downstream from Zadání) and the execution block.":"Cíle (další kroky je čtou ze Zadání) a blok provedení.","R§ fails: hand-off held; R§: advice only.":"R§ neprojde: předávka zastavena; R§: jen rada.","Propose analysis frameworks for the decision":"Navrhnout analytické rámce pro rozhodnutí","Ada proposes a set from the catalogue (seven groups) for the decision type, one reason per framework; each row shows what it needs (data klienta, rešerše, experti), how it is produced (výpočet, rešerše citováno, syntéza se zdroji, experti jmenovaní, odhad) and its report chapter. Post-MVP frameworks shown disabled ('po MVP').":"Ada navrhne z katalogu (sedm skupin) sadu rámců pro daný typ rozhodnutí, u každého rámce jeden důvod. Každý řádek ukazuje, co rámec potřebuje (data klienta, rešerše, experti), jak vzniká (výpočet, rešerše citováno, syntéza se zdroji, experti jmenovaní, odhad), a jeho kapitolu reportu. Rámce po MVP jsou zobrazené jako nedostupné ('po MVP').","framework":"rámec","question it answers":"otázka, na kterou odpovídá","needs: D / R / E":"potřebuje: D / R / E","grade":"stupeň","→ chapter":"→ kapitola","Ada mark":"označení Ady","toggle":"přepínač","Default sets per decision type are data the owner approves; a framework needing register fields naming persons is never proposed before its balancing test.":"Výchozí sady pro každý typ rozhodnutí jsou data, která schvaluje vlastník. Rámec, který potřebuje pole z rejstříků uvádějící osoby, se nikdy nenavrhne před balančním testem.","Framework proposal on the working copy.":"Návrh rámců v pracovní verzi.","A framework needing persons' register data: left out, Ada says why.":"Rámec, který potřebuje údaje o osobách z rejstříků: vynechán, Ada řekne proč.","Toggle frameworks; see what the selection costs":"Zapnout nebo vypnout rámce; vidět, kolik výběr stojí","The researcher accepts or changes each framework; a live summary shows selected n of m (Ada proposed k), the Deep Research cost ceiling of the selection out of the study budget, the report-outline chapters and the number of expert scoring forms.":"Výzkumník každý rámec přijme nebo změní. Živý souhrn ukazuje: vybráno n z m (Ada navrhla k), strop nákladů Deep Research pro výběr z rozpočtu studie, kapitoly osnovy reportu a počet hodnoticích formulářů pro experty.","Accepted per change (ADR §).":"Přijímá se po jednotlivých změnách (ADR §).","Framework selection saved on the working copy; later drives DR subjects (AF§), model views (AF§), expert forms (AF§), outline chapters (AF§).":"Výběr rámců uložený v pracovní verzi; později řídí témata DR (AF§), pohledy modelu (AF§), formuláře pro experty (AF§) a kapitoly osnovy (AF§).","Propose the model's parts (only with a model)":"Navrhnout části modelu (jen s modelem)","Target quantity and what it is compared against, horizon and step (měsíce / roky), the views to compute, model boundaries (inside / outside and why), a file → number inventory with status, key assumptions P§…Pn with value or range, source and guarantor, and what could flip the result.":"Cílová veličina a s čím se porovnává, horizont a krok (měsíce / roky), pohledy k výpočtu, hranice modelu (co je uvnitř a vně a proč), soupis soubor → číslo se stavem, klíčové předpoklady P§…Pn s hodnotou nebo rozsahem, zdrojem a garantem a co by mohlo výsledek otočit.","R§: quantity, horizon, boundaries, data and assumptions with a guarantor present (code, holds the hand-off); nothing missing may be missing silently.":"R§: jsou uvedeny veličina, horizont, hranice, data a předpoklady s garantem (kontroluje kód, zastaví předávku); nic nesmí chybět bez upozornění.","The model's parts on the working copy; 'Na kroku Data se každé číslo přiváže…' – only an inventory here.":"Části modelu v pracovní verzi; 'Na kroku Data se každé číslo přiváže…' – zde jen soupis.","A missing number: 'Požádat o plán přechodu' / 'Vyžádat data o zpožděních' or 'Vzít jako předpoklad s rozsahem'; R§ fails until resolved.":"Chybějící číslo: 'Požádat o plán přechodu' / 'Vyžádat data o zpožděních' nebo 'Vzít jako předpoklad s rozsahem'; R§ neprojde, dokud se to nevyřeší.","Check readiness R§–R§":"Zkontrolovat připravenost R§–R§","R§–R§ checked by code and holding the hand-off; R§ (no unmeasurable words) and R§ (scope, budget, deadline) are the Lead's advice. Chips under the stage header, each opening its detail; R§ offers a rewrite ('výrazně' → 'aspoň § %').":"R§–R§ kontroluje kód a zastavují předávku; R§ (žádná neměřitelná slova) a R§ (rozsah, rozpočet, termín) jsou rady Ady. Štítky jsou pod záhlavím kroku a každý otevře své podrobnosti; R§ nabídne přepis ('výrazně' → 'aspoň § %').","R§–R§ chip":"štítek R§–R§","R§–R§ hold; R§–R§ hold nothing.":"R§–R§ zastavují předávku; R§–R§ nezastaví nic.","'Chybí: R§ Pravidlo a riziko' with the reason in words and 'Doplnit mez'.":"'Chybí: R§ Pravidlo a riziko' s důvodem vyjádřeným slovy a 'Doplnit mez'.","Hand over to the next steps":"Předat dalším krokům","'Předat do Dat' offers each downstream step its part as a proposal (Data: files and numbers to bind; Předpoklady: P§–P§; Model: options, constraints; Výsledky and Report: rule, risk, execution). Zadání stays editable; a later edit is offered downstream as a proposal.":"'Předat do Dat' nabídne každému dalšímu kroku jeho část jako návrh (Data: soubory a čísla k přivázání; Předpoklady: P§–P§; Model: varianty, omezení; Výsledky a Report: pravidlo, riziko, provedení). Zadání zůstává upravitelné; pozdější úprava se dalším krokům nabídne jako návrh.","Nothing downstream is overwritten.":"V dalších krocích se nic nepřepíše.","Blocked while any of R§–R§ fails.":"Zablokováno, dokud kterékoli z R§–R§ neprojde.","Brief part (triage proposal)":"Část zadání (návrh z triáže)","part: §..§ (e.g. '§ · Pravidlo a riziko')":"part: §..§ (např. '§ · Pravidlo a riziko')","to: step ids":"to: id kroků","accepted":"přijato","edited":"upraveno","dismissed":"zahozeno","Decision core":"Jádro rozhodnutí","goal: string + source":"goal: string + zdroj","deadline: §-§-§ (result by §-§-§)":"deadline: §-§-§ (výsledek do §-§-§)","needs_model: bool (proposed_by Ada, confirmed_by researcher)":"needs_model: bool (proposed_by Ada, confirmed_by výzkumník)","draft":"koncept","confidence: § (default §/§)":"confidence: § (výchozí §/§)","stated_at: timestamp, before first computation":"stated_at: timestamp, před prvním výpočtem","guarantor: person":"guarantor: osoba","changes: operation log":"changes: protokol operací","missing":"chybí","stated":"stanoveno","changed after results (marked)":"změněno po výsledcích (označeno)","Framework selection":"Výběr rámců","proposed_by_ada: bool + reason":"proposed_by_ada: bool + důvod","selected":"vybráno","deselected":"nevybráno","disabled (po MVP)":"vypnuto (po MVP)","Readiness R§–R§":"Připravenost R§–R§","detail/reason":"podrobnost / důvod","Files and numbers to bind":"Soubory a čísla k přivázání","file list with the part that asked for it (Vyžádalo: Z§, Z§ otázka §, Z§ možnost B§, Z§)":"seznam souborů s částí, která o ně požádala (Vyžádalo: Z§, Z§ otázka §, Z§ možnost B§, Z§)","§ numbers to bind to a column or page":"§ čísel k přivázání ke sloupci nebo straně","missing numbers as open items":"chybějící čísla jako otevřené položky","Key assumptions":"Klíčové předpoklady","P§–P§: label, value or range, source, guarantor, state":"P§–P§: popisek, hodnota nebo rozsah, zdroj, garant, stav","Variants and constraints":"Varianty a omezení","options A…H as variants":"varianty A…H jako varianty modelu","constraints as timing and capacity":"omezení jako načasování a kapacita","target quantity, horizon, boundaries, views":"cílová veličina, horizont, hranice, pohledy","selected frameworks → Deep Research subjects and ceiling":"vybrané rámce → témata a strop Deep Research","computed frameworks → result views":"počítané rámce → pohledy výsledků","chapters and point slots → report outline":"kapitoly a místa pro body → osnova reportu","expert forms":"formuláře pro experty","Rule, risk and execution":"Pravidlo, riziko a provedení","decision rule with risk limit and stated time":"rozhodovací pravidlo s limitem rizika a časem zápisu","what could flip the result → sensitivity and value of information":"co by mohlo výsledek otočit → citlivost a hodnota informace","execution, pilot, what to watch, readers and form":"provedení, pilot, co sledovat, čtenáři a forma","What exactly are the eight parts' fields (DB§'s schema), which are required, and how does triage part §–§ map onto the decision core's fields so that accepting a part fills Z§ rather than duplicating it?":"Jaká přesně jsou pole osmi částí (schéma DB§), která z nich jsou povinná a jak se části triáže §–§ mapují na pole jádra rozhodnutí, aby přijetí části vyplnilo Z§, a ne ho zdvojilo?","Where is the decision-type taxonomy that drives both Ada's model-switch proposal and the default framework sets (AF§: 'as data the owner approves'), and who writes the first version?":"Kde je taxonomie typů rozhodnutí, ze které vychází návrh přepínače modelu od Ady i výchozí sady rámců (AF§: „jako data, která schvaluje vlastník“), a kdo napíše první verzi?","When Zadání is edited after hand-off, how is the downstream proposal computed (a diff per target field?), and which already-accepted Data bindings, assumptions or Deep Research runs go stale?":"Když se Zadání upraví po předávce, jak se spočítá návrh pro další kroky (rozdíl po cílových polích?) a které už přijaté vazby v Datech, předpoklady nebo běhy Deep Research tím zastarají?","If the model switch is turned from Ano to Ne after Data/Předpoklady hold content, what happens to that content and to the stage track?":"Když se přepínač modelu přepne z Ano na Ne a Data nebo Předpoklady už mají obsah, co se stane s tímto obsahem a s dráhou kroků?","How do the three certainty levels (Stačí směr / Číslo s rozsahem / Úzký rozsah) map onto the rule's confidence, CR§'s §/§ default and the model's scenario count, and does Ada or code check that they agree with the threshold?":"Jak se tři úrovně jistoty (Stačí směr / Číslo s rozsahem / Úzký rozsah) mapují na hladinu jistoty pravidla, výchozí hodnotu CR§ §/§ a počet scénářů modelu? A kontroluje Ada nebo kód, že odpovídají prahu?","How does code check R§ ('each objective serves the decision') and R§ when the model is off: is 'serves' a required link field to the rule, an option or execution?":"Jak kód zkontroluje R§ („každý cíl slouží rozhodnutí“) a R§, když je model vypnutý: je „slouží“ povinné pole s odkazem na pravidlo, variantu nebo provedení?","Is triage free (an ordinary Lead turn) or the paid 'Analýza zadání, nejvýše § USD' card shown on Z§, and what happens when the study budget is still §?":"Je triáž zdarma (běžný tah Ady), nebo jde o placenou kartu 'Analýza zadání, nejvýše § USD' zobrazenou na Z§? A co se stane, když je rozpočet studie stále §?","Who is the rule's guarantor as a data type (a member, or a client contact recorded by a member as CR§ says for inputs), and is the risk limit's source quote (the CFO's sentence) stored?":"Kdo je garant pravidla jako datový typ (člen týmu, nebo kontakt u klienta, kterého zapíše člen týmu, jak to CR§ říká pro vstupy)? A ukládá se citace zdroje limitu rizika (věta finančního ředitele)?","The spike, before any dependency is added: every MVP visual type in the coverage table below rendered server-side through its proposed engine, on fictional data, with IBM Plex, the design tokens' palette and Czech number formats (§ %, § §); bytes equal on a second render; each engine's licence and the map boundaries' data licence read and recorded; all six stacks are in the MVP (ADR § A§, \"All six in MVP\"), so the spike proves each for its types and reports a type it cannot render, never dropping a stack (no product code, zero paid calls)":"Ověřovací prototyp (spike) dřív, než se přidá jakákoli závislost: každý vizuální typ MVP z tabulky pokrytí níže vykreslený na serveru navrženým vykreslovacím nástrojem, na smyšlených datech, s písmem IBM Plex, paletou z design tokenů a českými formáty čísel (§ %, § §); při druhém vykreslení shodné bajty; licence každého nástroje a datová licence hranic map přečtené a zapsané; všech šest sad nástrojů je v MVP (ADR § A§, „všech šest v MVP“), takže prototyp ověří každou pro její typy a nahlásí typ, který vykreslit neumí, ale žádnou sadu nevypustí (žádný produktový kód, nula placených volání)","The visual as a type: kind (chart, diagram, table, framework template), engine, spec, a source reference on every element that states a fact or a number, alt text and long description, spec version; validated per engine (the Vega-Lite and Vega schemas, the Mermaid parser, bpmn-moddle against BPMN §, the template's own schema) before anything is shown; one fixture read by Python and TypeScript":"Vizuál jako typ: druh (graf, diagram, tabulka, šablona rámce), nástroj, specifikace, odkaz na zdroj u každého prvku, který uvádí fakt nebo číslo, alternativní text a dlouhý popis, verze specifikace; ověření podle nástroje (schémata Vega-Lite a Vega, parser Mermaid, bpmn-moddle proti BPMN §, vlastní schéma šablony) dřív, než se cokoli zobrazí; jedna sada testovacích dat, kterou čte Python i TypeScript","The renderer in the worker: deterministic SVG and PNG from a stored spec (vl-convert for Vega-Lite and Vega; Graphviz; a pinned headless renderer for Mermaid, bpmn-js and ECharts, refused by name when absent); fonts and palette from the tokens; stored as artifacts keyed by the spec's hash; the same spec renders the same bytes":"Vykreslování ve workeru: deterministické SVG a PNG z uložené specifikace (vl-convert pro Vega-Lite a Vega; Graphviz; pro Mermaid, bpmn-js a ECharts headless vykreslovač s pevnou verzí, a když chybí, odmítnuto s uvedením důvodu); písma a paleta z tokenů; uloženo jako artefakty pod klíčem hashe specifikace; stejná specifikace dá stejné bajty","Charts on Vega-Lite and Vega: every chart type of the coverage table as a tested preset (forest plot, tornado, waterfall, fan chart, Gantt, heat map, strategy canvas, quadrant bubble matrix, treemap, radar, choropleth and flow map), each number a reference; Sankey and chord on ECharts only if DG§ finds Mermaid's Sankey insufficient":"Grafy na Vega-Lite a Vega: každý typ grafu z tabulky pokrytí jako otestovaná předvolba (forest plot, tornádový graf, vodopádový graf, vějířový graf, Ganttův diagram, teplotní mapa, strategické plátno, kvadrantová bublinová matice, treemap, paprskový graf, kartogram a mapa toků), každé číslo jako odkaz; Sankey a chord na ECharts, jen pokud DG§ zjistí, že Sankey v Mermaid nestačí","Process and system diagrams: BPMN § (pools, lanes, gateways, events) on bpmn-js; flowchart, state, sequence, entity-relationship, mind map, timeline, Gantt, C§ and Sankey on Mermaid; data-flow diagrams, causal loops with polarity and decision trees on Graphviz; free node diagrams on React Flow with elkjs layout":"Procesní a systémové diagramy: BPMN § (bazény, dráhy, brány, události) na bpmn-js; vývojový diagram, stavový, sekvenční a entitně-relační diagram, myšlenková mapa, časová osa, Gantt, C§ a Sankey na Mermaid; diagramy datových toků, příčinné smyčky s polaritou a rozhodovací stromy na Graphviz; volné uzlové diagramy na React Flow s rozložením elkjs","Framework templates: typed data drawn by AIA's own deterministic SVG layout, one template per shape (SWOT §×§, PESTEL six factors, Porter's five forces, Ansoff §×§, value chain, McKinsey §S, business model canvas, ERRC grid, Ishikawa, DuPont tree, SIPOC, capability map, current and target state); BCG and GE-McKinsey drawn as DG§ quadrant charts":"Šablony rámců: typovaná data, která kreslí vlastní deterministické SVG rozložení AIA, jedna šablona na tvar (SWOT §×§, PESTEL se šesti faktory, Porterových pět sil, Ansoff §×§, hodnotový řetězec, McKinsey §S, business model plátno, mřížka ERRC, Ishikawa, strom DuPont, SIPOC, mapa schopností, současný a cílový stav); BCG a GE-McKinsey se kreslí jako kvadrantové grafy DG§","Tables as one typed spec: plain, cross-tab, matrix (RACI), heat table, comparison with conditional marks, financial statement with indented subtotals; every cell a reference; the same table on screen (TanStack Table) and in the DOCX (report_docx tables)":"Tabulky jako jedna typovaná specifikace: prostá, kontingenční, matice (RACI), teplotní tabulka, srovnání s podmíněným zvýrazněním, finanční výkaz s odsazenými mezisoučty; každá buňka je odkaz; stejná tabulka na obrazovce (TanStack Table) i v DOCX (tabulky report_docx)","The Lead's visual tools: it proposes a visual as a typed spec, per change, through the edit vocabulary (ADR §); the spec is validated before the researcher sees it; a number enters only as a reference it was given, never typed by the model; read tools for the visuals that exist":"Vizuální nástroje Ady: navrhuje vizuál jako typovanou specifikaci, po jednotlivých změnách, přes slovník úprav (ADR §); specifikace se ověří dřív, než ji výzkumník uvidí; číslo vstupuje jen jako odkaz, který Ada dostala, nikdy ho nenapíše model; nástroje pro čtení existujících vizuálů","Editors on screen: the bpmn-js modeller, Mermaid text with a live preview, a chart form over the Vega-Lite spec, a form per framework template, React Flow for free node diagrams; every edit a working-copy operation, revision-checked":"Editory na obrazovce: modelář bpmn-js, text Mermaid s živým náhledem, formulář grafu nad specifikací Vega-Lite, formulář pro každou šablonu rámce, React Flow pro volné uzlové diagramy; každá úprava je operace v pracovní verzi s kontrolou revize","Into the report: each figure from its stored render, never browser bytes (the map snapshot's rule, report-delivery RD§); caption with its sources, alt text, numbered with the outline; the report outline links each element to its source (research-findings-stage FND§)":"Do reportu: každý obrázek z uloženého vykreslení, nikdy bajty z prohlížeče (pravidlo snímku mapy, report-delivery RD§); popisek se zdroji, alternativní text, číslování podle osnovy; osnova reportu propojí každý prvek s jeho zdrojem (research-findings-stage FND§)","Accessibility and the design system: alt text and a long description on every visual, the palette's contrast and colour-vision checks (scripts/check-design.mjs) extended to diagram and template colours, print sizes for the DOCX":"Přístupnost a design systém: alternativní text a dlouhý popis u každého vizuálu; kontroly kontrastu palety a čitelnosti pro poruchy barvocitu (scripts/check-design.mjs) rozšířené na barvy diagramů a šablon; tiskové velikosti pro DOCX","After the MVP: ArchiMate notation (no open-source web renderer found; a symbol set on React Flow, or Archi's exchange format), value stream maps, customer journey maps, Sociomap-style overlays on diagrams":"Po MVP: notace ArchiMate (nenašel se open-source webový vykreslovač; sada symbolů na React Flow, nebo výměnný formát Archi), mapy toku hodnot, mapy zákaznické cesty, překryvy ve stylu Sociomapy na diagramech","The chart-of-accounts mapping in a dataset's data contract: each account to a statement line and sign, period and currency per column":"Mapování účtové osnovy v datové smlouvě datové sady: každý účet na řádek výkazu a znaménko, období a měna u každého sloupce","Statements: profit and loss and balance sheet from a trial balance or ledger export through the mapping; balance checks refused by name":"Výkazy: výkaz zisku a ztráty a rozvaha z obratové předvahy nebo exportu hlavní knihy přes mapování; nesouhlasící kontroly bilance odmítnuty s uvedením důvodu","Ratios: a closed, defined list (liquidity, leverage, margins, turnover), each with its formula and a division by zero named":"Poměrové ukazatele: uzavřený, definovaný seznam (likvidita, zadluženost, marže, obrátkovost), každý se vzorcem a s pojmenovaným případem dělení nulou","Budget against actual: variance per line, with price, volume and mix decomposition where the contract declares quantities":"Rozpočet proti skutečnosti: odchylka po řádcích, s rozkladem na cenu, objem a mix tam, kde smlouva uvádí množství","Accounting stages, charts and report blocks":"Účetní kroky, grafy a bloky reportu","The cash-flow schedule: flows by year with a stated discount rate and horizon":"Plán peněžních toků: toky po letech s uvedenou diskontní sazbou a horizontem","IRR (a stated root rule; several or no roots refused by name) over the MVP's NPV and payback, extended to any cash-flow schedule":"IRR (uvedené pravidlo pro volbu kořene; více kořenů nebo žádný odmítnuto s uvedením důvodu) nad NPV a dobou návratnosti z MVP, rozšířené na libovolný plán peněžních toků","Scenarios and one-way sensitivity on NPV and IRR, reusing cost scenarios' machinery":"Scénáře a jednorozměrná citlivost NPV a IRR, s využitím mechanismu nákladových scénářů","Pricing break-even: contribution margin, units and revenue to break even":"Cenový bod zvratu: příspěvková marže, počet kusů a tržby pro bod zvratu","Price elasticity fitted from the client's price and volume data (ESTIMATED; its method owner's register entry)":"Cenová elasticita odhadnutá z cenových a objemových dat klienta (ESTIMATED; zápis vlastníka metody v registru metod)","Finance stages, charts and report blocks":"Finanční kroky, grafy a bloky reportu","EOQ and reorder point (CALCULATED); safety stock from a stated demand deviation (CALCULATED) or one fitted from data (ESTIMATED)":"EOQ a bod znovuobjednání (CALCULATED); pojistná zásoba z uvedené odchylky poptávky (CALCULATED) nebo z odchylky odhadnuté z dat (ESTIMATED)","Linear optimisation: variables, constraints and an objective as typed elements; HiGHS pinned through scipy; the optimum, binding constraints and shadow prices in words; infeasible and unbounded as named results":"Lineární optimalizace: proměnné, omezení a účelová funkce jako typované prvky; HiGHS s pevnou verzí přes scipy; optimum, vazná omezení a stínové ceny slovy; nepřípustná a neomezená úloha jako pojmenované výsledky","Demand forecasting as a model type of its own, on the MVP's backtested methods (cost-model-study CR§), for any demand series":"Prognóza poptávky jako samostatný typ modelu, na metodách MVP ověřených zpětným testem (cost-model-study CR§), pro libovolnou řadu poptávky","Monte Carlo, global sensitivity and value of information on any CALCULATED type, generalising the MVP's (cost-model-study CR§, CR§, CR§)":"Monte Carlo, globální citlivost a hodnota informace pro libovolný typ CALCULATED, jako zobecnění těch z MVP (cost-model-study CR§, CR§, CR§)","Operations research stages, charts and report blocks":"Kroky, grafy a bloky reportu pro operační výzkum","The research_result provenance: one admitted claim of an approved research run of the same client, carrying its own grade (modelled under ADR §), its run, ref and artifact SHA-§":"Původ research_result: jedno přijaté tvrzení ze schváleného výzkumného běhu téhož klienta, s vlastním stupněm (modelováno podle ADR §), svým během, odkazem a SHA-§ artefaktu","TAM, SAM and SOM top-down as a chain of inputs, each step its own label, the chain printing the weakest":"TAM, SAM a SOM shora dolů jako řetěz vstupů, každý krok s vlastním označením; řetěz vypíše ten nejslabší","Bottom-up from a survey's admitted share × a population count (research_result), its interval carried, labelled modelováno":"Zdola nahoru z přijatého podílu z průzkumu × počet obyvatel (research_result), s přeneseným intervalem, označeno modelováno","A market-sizing Deep Research purpose (an ADR § amendment): queries from a person's Class B focus, never from the model; findings enter only as public_source":"Účel Deep Research pro odhad velikosti trhu (dodatek k ADR §): dotazy vycházejí ze zaměření, které zadá člověk (třída B), nikdy od modelu; zjištění vstupují jen jako public_source","Market-sizing stages, charts and report blocks":"Kroky, grafy a bloky reportu pro velikost trhu","The survey beside a model: a model revision cites one approved research run of the same client, and its report gains the run's approved map snapshot and admitted key numbers as a chapter, never combined into a model number":"Průzkum vedle modelu: revize modelu cituje jeden schválený výzkumný běh téhož klienta a její report získá jako kapitolu schválený snímek mapy z tohoto běhu a jeho přijatá klíčová čísla; nikdy se nesloučí do čísla modelu","Scope and the disclaimer, written with the legal counsel the owner names: what AIA flags (tax, contract and employment law; Czech and EU), the report's \"not legal advice\" text, the researcher's acceptance of each legal point; recorded before any legal point reaches a study":"Rozsah a výhrada, sepsané s právním poradcem, kterého určí vlastník: na co AIA upozorňuje (daňové, smluvní a pracovní právo; české a EU), text reportu „nejde o právní radu“, přijetí každého právního bodu výzkumníkem; zapsáno dřív, než se jakýkoli právní bod dostane do studie","e-Sbírka and EUR-Lex as gate routes (public-data-routes): a provision fetched by its identifier in the version in force on a stated date, captured content-addressed, its licence and rate limits in the source register":"e-Sbírka a EUR-Lex jako trasy brány (public-data-routes): ustanovení načtené podle identifikátoru ve znění účinném k uvedenému datu, uložené s adresováním podle obsahu, jeho licence a limity dotazů v registru zdrojů","The legal point as a type: the law, the provision, the version date, the verbatim quote and its snapshot hash; a quote must be literally in the captured provision (Deep Research's grounding rule)":"Právní bod jako typ: předpis, ustanovení, datum znění, doslovná citace a hash jejího snímku; citace musí být doslova v uloženém ustanovení (pravidlo ukotvení ve zdroji z Deep Research)","Legal parameters and constraints: a point becomes a Předpoklady parameter (corporate tax rate, depreciation groups and methods, VAT, minimum wage, overtime premium, notice periods) or a Model constraint, each accepted by the researcher; the after-tax view (cost-model-study#CM§) reads them":"Právní parametry a omezení: bod se stane parametrem v kroku Předpoklady (sazba daně z příjmů právnických osob, odpisové skupiny a metody, DPH, minimální mzda, příplatek za přesčas, výpovědní lhůty) nebo omezením v kroku Model, každý přijme výzkumník; čte je pohled po zdanění (cost-model-study#CM§)","Version watch: a study's legal points re-checked against the version in force at the report's date; a changed provision marks the results that depend on it stale (deep-research-v§ DRV§, DRV§)":"Hlídání znění: právní body studie se znovu ověří proti znění účinnému k datu reportu; změněné ustanovení označí výsledky, které na něm závisejí, jako zastaralé (deep-research-v§ DRV§, DRV§)","The legal point in the report outline and the report: a kind and a grade of its own, the disclaimer printed wherever one is used":"Právní bod v osnově reportu a v reportu: vlastní druh a stupeň, výhrada vytištěná všude, kde se bod použije","The journey: the fictional Velis study's after-tax view from the cited corporate tax rate and depreciation provisions, and a notice period as a timing constraint, on recorded doubles; zero paid calls":"Ověřovací průchod: pohled po zdanění ve smyšlené studii Velis z citované sazby daně z příjmů právnických osob a odpisových ustanovení a výpovědní lhůta jako časové omezení, na nahraných testovacích dvojnících; nula placených volání","Turn every number the model will read into an accepted range with its source, guarantor and distribution, plus the declared correlations and fixed study parameters, so uncertainty enters the model on record.":"Každé číslo, které model čte, se převede na přijatý rozsah se zdrojem, garantem a rozdělením. K tomu přibudou deklarované korelace a pevné parametry studie. Nejistota tak vstupuje do modelu doložitelně.","List every input the model reads":"Vypsat každý vstup, který model čte","The rows come from Zadání's model parts (Z§ § Data, Z§ § Klíčové předpoklady) and the model type's declared inputs; each is approved again here with the value Model will actually use.":"Řádky pocházejí z modelových částí Zadání (Z§ § Data, Z§ § Klíčové předpoklady) a z deklarovaných vstupů typu modelu. Každý se zde znovu schválí s hodnotou, kterou Model skutečně použije.","Every input the pinned type reads has a row; the type's schema decides the columns (generic over the type).":"Každý vstup, který připnutý typ čte, má řádek. Sloupce určuje schéma typu (obecně pro každý typ).","One row per input, state proposed until accepted":"Jeden řádek na vstup, ve stavu navrženo, dokud není přijat","An input with no row cannot feed Model; unknown is said as neznámé, never §":"Vstup bez řádku nemůže vstoupit do Modelu; neznámá hodnota se uvádí jako neznámé, nikdy §","Bind an input to a client dataset":"Navázat vstup na datovou sadu klienta","The input is the sum, count or mean of a contract-named column over a stated filter on contract-named columns and a stated period, computed over the dataset's analysis copy and admitted CLIENT_REPORTED (not a sample).":"Vstup je součet, počet nebo průměr sloupce pojmenovaného ve smlouvě, přes uvedený filtr na sloupcích pojmenovaných ve smlouvě a za uvedené období. Počítá se nad analytickou kopií datové sady a přijímá se jako CLIENT_REPORTED (ne jako vzorek).","aggregation":"agregace","filter":"filtr","period":"období","Column and filter columns named by an accepted contract; the contract version is the one the input names":"Sloupec i sloupce filtru pojmenovává přijatá smlouva; verze smlouvy je ta, kterou vstup uvádí","ClientDataset provenance with the contract version and copy SHA-§ pinned; Zdroj shows the file (e.g. zpozdeni_§.xlsx) and the label z dat klienta":"Původ ClientDataset s připnutou verzí smlouvy a SHA-§ kopie; Zdroj ukazuje soubor (např. zpozdeni_§.xlsx) a označení z dat klienta","Refused by name: an unnamed column, an unaccepted contract, another contract version; a new contract version makes the pinned input stale and the revision unsubmittable until a person picks again":"Odmítnuto s uvedením důvodu: nepojmenovaný sloupec, nepřijatá smlouva, jiná verze smlouvy. Nová verze smlouvy udělá z připnutého vstupu zastaralý a revizi nelze odeslat, dokud člověk znovu nevybere","Propose":"Návrh","Propose a better-grounded value with its source":"Navrhnout lépe podloženou hodnotu i se zdrojem","When new client data arrives under an accepted contract, Ada proposes replacing a person's range with the data's (here §-§ % by marketing replaced by §-§ %, base § %); the row keeps the previous value as \"dříve\".":"Když pod přijatou smlouvou přijdou nová data klienta, Ada navrhne nahradit rozsah od člověka rozsahem z dat (zde §–§ % od marketingu nahrazeno §–§ %, základ § %). Řádek si předchozí hodnotu ponechá jako „dříve“.","proposed min/base/max":"navržené min/základ/max","Ada states no number that is not in its context and computes none; each change is a per-change operation":"Ada neuvádí žádné číslo, které nemá v kontextu, a žádné nepočítá; každá změna je samostatná operace","A proposal in the Lead pane; on accept, the input changes and the last run's results are marked to be rerun":"Návrh v panelu Ady; po přijetí se vstup změní a výsledky posledního běhu se označí k novému spuštění","Dismissed: nothing changes; on a route not approved for Class A the Lead's turn parks (LO§a)":"Zamítnuto: nic se nemění; na trase neschválené pro třídu A se tah Ady odloží (LO§a)","Take an input from a public source":"Převzít vstup z veřejného zdroje","An input taken from Rešerše names the accepted knowledge item, its revision and the quote it rests on (e.g. wage growth from ČSÚ DataStat).":"Vstup převzatý z Rešerše uvádí přijatou znalostní položku, její revizi a citaci, o kterou se opírá (např. růst mezd z ČSÚ DataStat).","revision":"revize","A public_source input names a typed SOURCE revision; a Deep Research finding enters only after a person added its source":"Vstup public_source uvádí typovanou revizi SOURCE; nález z Deep Research vstoupí až poté, co člověk přidal jeho zdroj","no_provenance refused; a research_result input refused provenance_not_available":"no_provenance odmítnuto; vstup research_result odmítnut s provenance_not_available","Derive a volume input from a backtested forecast":"Odvodit objemový vstup z prognózy ověřené backtestem","The kept forecast method's backtest errors (§th-§th percentile) give the volume input's range and its Monte Carlo distribution (here order growth §-§ %, base § %).":"Chyby backtestu ponechané metody prognózy (§.–§. percentil) dávají rozsah objemového vstupu a jeho rozdělení pro Monte Carlo (zde růst objednávek §–§ %, základ § %).","method (naive, seasonal naive, drift, Holt-Winters)":"metoda (naivní, sezonní naivní, drift, Holt-Winters)","backtest window":"okno backtestu","held-out MAE":"MAE na odložených datech","The candidate is used only if its held-out MAE is strictly below the baseline's on the same origins (ADR § decision § (§) proposes MASE instead, pending A. Bahbouh's answer §)":"Kandidát se použije, jen pokud je jeho MAE na odložených datech ostře nižší než u základní prognózy na týchž počátcích (ADR § rozhodnutí § (§) místo toho navrhuje MASE, čeká se na odpověď A. Bahbouha §)","An input whose range and distribution come from the forecast; Zdroj \"objednavky_§-§.xlsx · předpověď\"":"Vstup, jehož rozsah a rozdělení pocházejí z prognózy; Zdroj „objednavky_§-§.xlsx · předpověď“","Baseline (seasonal naive; naive below two cycles) used instead, said in words":"Místo toho se použije základní prognóza (sezonní naivní; pod dvěma cykly naivní), řečeno slovy","State low, base and high with unit":"Uvést nízkou, základní a vysokou hodnotu s jednotkou","Every input is a range, not one number: Min, Základ, Max in the input's unit and the model's one currency (CZK), edited in place with the input standard's controls.":"Každý vstup je rozsah, ne jedno číslo: Min, Základ, Max v jednotce vstupu a v jediné měně modelu (CZK). Upravuje se přímo na místě ovládacími prvky standardu vstupů.","currency":"měna","low ≤ base ≤ high; units and currency must match the type's declared input":"nízká ≤ základní ≤ vysoká; jednotky a měna musí odpovídat deklarovanému vstupu typu","The input's range, logged as the writer's operation":"Rozsah vstupu, zapsaný jako operace jeho autora","Refused by name: an inverted range, unit_mismatch, currency_mismatch":"Odmítnuto s uvedením důvodu: obrácený rozsah, unit_mismatch, currency_mismatch","Name the guarantor":"Určit garanta","Ručí always names a person at the client (finance director, head of logistics, sales director) who stands behind the range.":"Ručí vždy uvádí člověka u klienta (finanční ředitel, vedoucí logistiky, obchodní ředitel), který za rozsahem stojí.","A guarantor is a person at the client (W§); the plan's form is a member, or a client contact recorded by a member":"Garant je člověk u klienta (W§); v plánu má podobu člena týmu nebo kontaktu u klienta, kterého zapsal člen týmu","The guarantor stored on the input":"Garant uložený u vstupu","An input with no guarantor cannot be accepted (CR§ requires one on every input)":"Vstup bez garanta nelze přijmout (CR§ ho vyžaduje u každého vstupu)","Fix a contractual value":"Zafixovat smluvní hodnotu","A value fixed by a contract has no range: Min and Max show \"—\" and the source cites the contract page; if the contract allows a change, the range is allowed and the clause is its stated reason (e.g. price escalation as a separate input).":"Hodnota daná smlouvou nemá rozsah: Min a Max ukazují „—“ a zdroj cituje stranu smlouvy. Pokud smlouva změnu připouští, rozsah je povolen a důvodem je příslušná klauzule (např. eskalace ceny jako samostatný vstup).","Zdroj (contract file and page)":"Zdroj (soubor a strana smlouvy)","Fixed unless the contract allows a change (W§)":"Pevná, pokud smlouva nepřipouští změnu (W§)","A fixed input that takes no distribution":"Pevný vstup bez rozdělení","Distributions":"Rozdělení","Assign each input's distribution by source":"Přiřadit každému vstupu rozdělení podle zdroje","Client data: the estimate's own distribution and interval; a person's range: PERT with λ = §; people who disagree: a mixture of their ranges. Triangular, uniform or truncated normal only when a person states it, on record.":"Data klienta: vlastní rozdělení a interval odhadu; rozsah od člověka: PERT s λ = §; lidé, kteří se neshodnou: směs jejich rozsahů. Trojúhelníkové, rovnoměrné nebo useknuté normální rozdělení jen tehdy, když ho člověk výslovně uvede a zapíše.","distribution":"rozdělení","source kind":"druh zdroje","stated by":"kdo uvedl","W§: by source; Metodika defaults (S§) final as written":"W§: podle zdroje; výchozí hodnoty Metodiky (S§) platí, jak jsou zapsány","A distribution per input, shown per row and summarised in \"Jak se rozsahy použijí · Rozdělení\"":"Rozdělení u každého vstupu, zobrazené v každém řádku a shrnuté v „Jak se rozsahy použijí · Rozdělení“","Correlations":"Korelace","Propose inputs that move together":"Navrhnout vstupy, které se pohybují spolu","Ada proposes pairs with a rank correlation and a reason (e.g. the two §PLs' price escalation ρ = §, both driven by wages and fuel; wage growth and own cost per order ρ = §).":"Ada navrhne dvojice s pořadovou korelací a důvodem (např. eskalace cen obou §PL ρ = §, obě táhnou mzdy a palivo; růst mezd a vlastní náklady na objednávku ρ = §).","input A":"vstup A","input B":"vstup B","Pairwise rank correlations declared by a person; Ada only proposes":"Párové pořadové korelace deklaruje člověk; Ada je jen navrhuje","Proposed pairs in the Souvislosti table":"Navržené dvojice v tabulce Souvislosti","Accept each pair and state independence":"Přijmout každou dvojici a uvést nezávislost","The researcher accepts or dismisses each pair; every other pair is recorded as independent (\"zapsáno, ne předpokládáno\").":"Výzkumník každou dvojici přijme, nebo zamítne; každá další dvojice se zapíše jako nezávislá („zapsáno, ne předpokládáno“).","accepted pairs":"přijaté dvojice","independence statement":"prohlášení o nezávislosti","Independence is stated, never assumed":"Nezávislost se uvádí, nikdy nepředpokládá","The accepted correlation matrix for the run":"Přijatá korelační matice pro běh","Check the correlation matrix":"Zkontrolovat korelační matici","The accepted pairs form a rank-correlation matrix that Iman-Conover will impose; it is checked for positive semi-definiteness.":"Z přijatých dvojic vznikne matice pořadových korelací, kterou uplatní Iman-Conover. Ověří se, že je kladně semidefinitní.","matrix":"matice","PSD required (S§)":"Vyžaduje se PSD (S§)","A valid matrix pinned for Monte Carlo":"Platná matice připnutá pro Monte Carlo","Refused correlation_not_psd; the nearest valid matrix offered as a proposal":"Odmítnuto s correlation_not_psd; nejbližší platná matice se nabídne jako návrh","Fixed parameters":"Pevné parametry","Set the study's discount rate":"Stanovit diskontní sazbu studie","One discount rate for the study (§ %, guaranteed by the finance director), applied to every option; Výsledky shows how the verdict moves at other rates (canvas: § % and § %).":"Jedna diskontní sazba pro studii (§ %, garantuje finanční ředitel), použitá pro každou variantu. Výsledky ukazují, jak se verdikt posune při jiných sazbách (plátno: § % a § %).","A fixed study parameter, never lowered because a model is simulated (decision § (§))":"Pevný parametr studie, nikdy se nesnižuje kvůli tomu, že se model simuluje (rozhodnutí § (§))","A fixed parameter on the Model Revision":"Pevný parametr v revizi modelu","Accept legal parameters from cited provisions":"Přijmout právní parametry z citovaných ustanovení","A legal point (law, provision, version in force on a date, verbatim quote, snapshot hash) becomes a parameter: corporate income tax rate § %, depreciation group § and method; the researcher accepts it.":"Právní bod (předpis, ustanovení, znění účinné k danému datu, doslovná citace, hash snímku) se stane parametrem: sazba daně z příjmů právnických osob § %, odpisová skupina § a způsob odpisování. Výzkumník ho přijme.","snapshot sha§":"sha§ snímku","parameter value":"hodnota parametru","The quote must be literally in the captured provision; never legal advice":"Citace musí doslovně stát v zachyceném ustanovení; nikdy nejde o právní radu","A legal parameter read by the after-tax NPV":"Právní parametr, který čte NPV po zdanění","LGL§: a changed provision at the report's date marks the dependent results stale":"LGL§: změněné ustanovení k datu reportu označí závislé výsledky jako zastaralé","Show the pinned method settings":"Ukázat připnuté nastavení metody","The panel states the draws and seed (§ § · seed § · five-stream convergence) and the Metodika module version the run will pin, with its register status.":"Panel uvádí počet tahů a seed (§ § · seed § · konvergence pěti proudů) a verzi modulu Metodiky, kterou běh připne, i s jejím stavem v registru metod.","Metodika module and version":"modul a verze Metodiky","register status":"stav v registru metod","Defaults final as written (Q§); a change is a new module version, which a run pins":"Výchozí hodnoty platí, jak jsou zapsány (Q§); změna je nová verze modulu, kterou si běh připne","The method pins shown before the run":"Připnutá nastavení metody, zobrazená před během","Save revision-checked and log each write":"Ukládat s kontrolou revize a každý zápis zaznamenat","Each edit saves the model's working content naming its base revision and is logged as its writer's operation; the page offers version history, comparison with the last run and an XLSX export.":"Každá úprava uloží pracovní obsah modelu s uvedením výchozí revize a zaznamená se jako operace jejího autora. Stránka nabízí historii verzí, porovnání s posledním během a export do XLSX.","working revision":"pracovní revize","writer":"autor zápisu","A stale save is refused (§); one writer, every write logged":"Zastaralé uložení se odmítne (§); jeden autor zápisu, každý zápis zaznamenán","A new working revision":"Nová pracovní revize","§ stale save: the person's copy is kept and reloaded":"§ zastaralé uložení: verze člověka se zachová a znovu načte","Confirm every input accepted and current":"Potvrdit, že každý vstup je přijatý a aktuální","The step is done when every input and fixed parameter is accepted (\"§ předpokladů a § pevné parametry · všechny přijaté\") and none reads a stale contract version.":"Krok je hotový, když je přijatý každý vstup i pevný parametr („§ předpokladů a § pevné parametry · všechny přijaté“) a žádný nečte zastaralou verzi smlouvy.","count of inputs":"počet vstupů","count of fixed parameters":"počet pevných parametrů","states":"stavy","No provenance, unaccepted or stale input blocks submission of th her configuration; the choice is recorded.":"Výzkumník návrh přijme, nebo zvolí jinou konfiguraci; volba se zapíše.","when":"kdy","A valve: nothing is computed before it is confirmed.":"Ventil: dokud není potvrzeno, nic se nepočítá.","The confirmed configuration.":"Potvrzená konfigurace.","Build the table":"Sestavit tabulku","Futures and weight settings from the model run under its seed; experts' ratings from the rating form; units and months from the client's data contract.":"Budoucnosti a nastavení vah z běhu modelu pod jeho seedem; hodnocení expertů z hodnoticího formuláře; jednotky a měsíce z datové smlouvy klienta.","objects":"objekty","Each table named and saved, so every map traces to its exact table.":"Každá tabulka je pojmenovaná a uložená, takže každou mapu lze dohledat k její přesné tabulce.","The row matrix.":"Matice řádků.","Fewer rows than the configuration's minimum: refused by name.":"Méně řádků, než je minimum konfigurace: odmítnuto s uvedením důvodu.","Preparation":"Příprava","Declare the preparation":"Deklarovat přípravu","Row mean removed (futures, experts); a §–§ value scale then row mean (weights); z across units; trend removed then z (months); direction aligned for every indicator.":"Odečtený průměr řádku (budoucnosti, experti); stupnice hodnot §–§ a potom průměr řádku (váhy); z-skóre napříč jednotkami; po odečtení trendu z-skóre (měsíce); u každého ukazatele sjednocený směr.","transformation":"transformace","direction":"směr","declared at":"čas deklarace","Frozen before any result; a change after is a new revision the report names.":"Zmrazená před jakýmkoli výsledkem; pozdější změna je nová revize, kterou report uvede.","The declared preparation, pinned with the run.":"Deklarovaná příprava, připnutá k běhu.","Compute the map":"Spočítat mapu","aia-sociomap-§: pair relations (baseline-corrected r̃, or correlation of standardised columns), layout on the ruler, heights and terrain where defined, split-half agreement.":"aia-sociomap-§: vztahy dvoj at tak, jak na sobě řádky závisejí.","The test result per pair or per map.":"Výsledek zkoušky pro každou dvojici nebo každou mapu.","A pair that fails is not drawn.":"Dvojice, která neprojde, se nenakreslí.","Tables":"Tabulky","Build the tables beside the map":"Sestavit tabulky vedle mapy","Heights; joint losses (futures); shares of first place (weights); intervals (units); effective months (months).":"Výšky; společné ztráty (budoucnosti); podíly prvních míst (váhy); intervaly (jednotky); efektivní měsíce (měsíce).","table":"tabulka","counts":"počty","Every share printed with both counts.":"Každý podíl se tiskne s oběma počty.","The companion tables.":"Doprovodné tabulky.","Claims":"Tvrzení","State what the map may claim":"Uvést, co mapa smí tvrdit","The configuration's claim and never-claim list, on screen and in the report; three results printed: converged, fidelity, verdict.":"Tvrzení konfigurace a seznam toho, co nikdy netvrdí, na obrazovce i v reportu; vytisknou se tři výsledky: konvergence, věrnost, verdikt.","claim":"tvrzení","never-claims":"co nikdy netvrdí","three results":"tři výsledky","Never one word for credibility.":"Nikdy jedno slovo pro důvěryhodnost.","The claim text.":"Text tvrzení.","Label it by its register status":"Označit podle stavu v registru metod","Internal until the methodologist registers the configuration, after its planted-answer test passes; printed as “odhad (metoda čeká na schválení metodikem)”.":"Interní, dokud metodolog konfiguraci nezapíše do registru metod, a to až po úspěšné zkoušce s vloženou odpovědí; tiskne se jako „odhad (metoda čeká na schválení metodikem)“.","The § Oct approval covers people's ratings only.":"Schválení z §. října pokrývá jen hodnocení od lidí.","The label on the map.":"Označení na mapě.","Add the map's points to the outline":"Přidat body mapy do osnovy","The map snapshot, its test and tables, and its claim become points in Osnova reportu.":"Snímek mapy, její zkouška a tabulky a její tvrzení se stanou body
