to končí.","A sociomap is a picture of how the options relate. Two options sit close when the rows of a table rate them alike, and the height under each shows how well it does. There are two map types and five configurations, all computed by one engine. Where the rows come from decides how the map is tested. The map supports the recommendation; the decision rule makes it.":"Sociomapa je obraz toho, jaké vztahy mezi sebou varianty mají. Dvě varianty leží blízko, když je řádky tabulky hodnotí podobně, a výška pod každou ukazuje, jak dobře si vede. Existují dva typy map a pět konfigurací; všechny počítá jedno výpočetní jádro. Podle toho, odkud řádky pocházejí, se určuje, jak se mapa zkouší. Mapa doporučení podporuje; vytváří ho rozhodovací pravidlo.","How to read a map":"Jak mapu číst","far = unrelated":"daleko = bez vztahu","Close = the same pattern":"Blízko = stejný průběh","Two options do well in the same futures: better than the others in the same future, not better than today.":"Dvěma variantám se daří ve stejných budoucnostech: jsou lepší než ostatní v téže budoucnosti, ne lepší než dnešek.","Far = one gains what the other loses":"Daleko = jedna získává, co druhá ztrácí","What helps one hurts the other. Whether one backs up the other is read from the joint-loss table.":"Co jedné pomáhá, druhé škodí. Zda jedna zálohuje druhou, se čte z tabulky společných ztrát.","Height = the mean result":"Výška = průměrný výsledek","Mean saving, weighted score or rating. The terrain stretches small differences: read the table beside the map.":"Průměrná úspora, vážené skóre nebo hodnocení. Terén malé rozdíly zvětšuje: čtěte tabulku vedle mapy.","stable":"stabilní","unstable":"nestabilní","Dashed circle = uncertainty":"Čárkovaný kruh = nejistota","On the expert map: how far a point moves when other experts rate. Two options inside one circle can't be told apart.":"Na mapě expertů: jak daleko se bod posune, když hodnotí jiní experti. Dvě varianty uvnitř jednoho kruhu nelze od sebe rozlišit.","Try it: the fleet example, futures map":"Vyzkoušejte si: příklad s vozovým parkem, mapa budoucností","§ options × § futures under the team's assumption (drivers correlated §), from the lifecycle page. Laid out by the real aia-sociomap-§ engine; the numbers are invented.":"§ variant × § budoucností při předpokladu týmu (korelace vlivů §), ze stránky životního cyklu. Rozložení spočítalo skutečné výpočetní jádro aia-sociomap-§; čísla jsou vymyšlená.","Invented data · aia-sociomap-§ · near = do well in the same futures · height = mean saving":"Vymyšlená data · aia-sociomap-§ · blízko = daří se jim ve stejných budoucnostech · výška = průměrná úspora","As published: no lines":"Jak je zveřejněno: bez čar","Show the § relations":"Zobrazit § vztahů","Height (mean saving)":"Výška (průměrná úspora)","The other two assumptions":"Zbylé dva předpoklady","Does one back up the other?":"Zálohuje jedna druhou?","Click an option or a line to read it. The test passed: on this sample the weakest agreement between the three assumptions is § against § (§ on the second sample).":"Klikněte na variantu nebo na čáru a přečtěte si podrobnosti. Zkouška prošla: na tomto vzorku je nejslabší shoda mezi třemi předpoklady § proti hranici § (na druhém vzorku §).","positive relation r̃":"kladný vztah r̃","negative: what helps one hurts the other":"záporný: co jedné pomáhá, druhé škodí","Thicker line = stronger relation":"Silnější čára = silnější vztah","Grey dots = the same option under the other assumptions":"Šedé tečky = tatáž varianta při ostatních předpokladech","Two map types, five configurations":"Dva typy map, pět konfigurací","Start from the table: who made its rows? Two configurations belong to the scenario map and three to the observed-data map. “Futures × weights” is an option of the scenario map, not a sixth configuration. The sentence in quotes is what each map is allowed to say.":"Začněte u tabulky: kdo vytvořil její řádky? Dvě konfigurace patří k mapě scénářů a tři k mapě naměřených dat. „Budoucnosti × váhy“ je volba mapy scénářů, ne šestá konfigurace. Věta v uvozovkách říká, co která mapa smí tvrdit.","A model computes the rows. The claim is about the model and its assumptions, not about the market.":"Řádky počítá model. Tvrzení se týká modelu a jeho předpokladů, ne trhu.","Scenario map · futures":"Mapa scénářů · budoucnosti","“In this model and under these assumptions, these options do well in the same futures.”":"„V tomto modelu a za těchto předpokladů se těmto variantám daří ve stejných budoucnostech.“","One row":"Jeden řádek","One future the model computed: the savings of each option against today":"Jedna budoucnost spočítaná modelem: úspory každé varianty oproti dnešku","odhad; internal until registered":"odhad; interní, dokud není zapsaná v registru","Example":"Příklad","Stable: the weakest agreement is § on the first sample and § on the second, against §. The diesel pair and the electric pair sit together.":"Stabilní: nejslabší shoda je § na prvním vzorku a § na druhém, proti hranici §. Naftová dvojice leží u sebe a elektrická dvojice také.","Scenario map · weight settings":"Mapa scénářů · nastavení vah","“Under weights near the client's, this option is first in this share of settings.”":"„Při vahách blízkých vahám klienta je tato varianta první v tomto podílu nastavení.“","One weight setting from a fan around the client's weights: each option's §–§ score":"Jedno nastavení vah z vějíře kolem vah klienta: skóre §–§ každé varianty","Under the “provoz” weights, Elektro – leasing is first in § % of the medium fan.":"Při vahách „provoz“ je Elektro – leasing první v § % středního vějíře.","MVP · an option":"MVP · volba","Scenario map · option":"Mapa scénářů · volba","“The picture holds, or does not, when the future and the weights change together.”":"„Obraz platí, nebo neplatí, když se budoucnost a váhy mění současně.“","One future under one weight setting":"Jedna budoucnost při jednom nastavení vah","Released together with the scenario map.":"Uvolní se společně s mapou scénářů.","Someone recorded the rows. The claim is about the data that was written down.":"Řádky někdo zaznamenal. Tvrzení se týká dat, která byla zapsána.","Observed-data map · experts":"Mapa naměřených dat · experti","“This is how these named experts see the options.”":"„Takto vidí varianty tito jmenovitě uvedení experti.“","One named expert on one criterion, options rated §–§":"Jeden jmenovitě uvedený expert u jednoho kritéria, varianty hodnocené §–§","inputs úsudek (named people), result odhad":"vstupy úsudek (lidé uvedení jménem), výsledek odhad","Uncertainty radius §–§ on the map's ruler, over six runs.":"Poloměr nejistoty §–§ na pravítku mapy, v šesti bězích.","Observed-data map · units":"Mapa naměřených dat · jednotky","“Across these units, these indicators move together, with a § % interval.”":"„Napříč těmito jednotkami se tyto ukazatele pohybují společně, s §% intervalem.“","One depot, branch, product or customer; the objects are its indicators":"Jedno depo, pobočka, produkt nebo zákazník; objekty jsou jeho ukazatele","All § planted pairs drawn; false pairs must stay within the declared rate.":"Všech § vložených dvojic je nakresleno; falešné dvojice musí zůstat v předem ohlášené míře.","Observed-data map · months":"Mapa naměřených dat · měsíce","“Over these months, these figures move together beyond what unrelated series show.”":"„Za tyto měsíce se tyto údaje pohybují společně víc, než kolik ukazují řady bez vztahu.“","One month of the firm's series, trend removed":"Jeden měsíc z řad firmy, po odečtení trendu","odhad; a pair that fails its test is not drawn":"odhad; dvojice, která neprojde svou zkouškou, se nekreslí","Needs § months or more.":"Vyžaduje nejméně § měsíců.","Proposed: the indicator profile map":"Návrh: mapa profilu ukazatelů","From the § Nov mindmap. The options are compared on facts that do not depend on the company's own view: economics, location, current state and financials. Each map comes from one weighted table, so changing the rows or the weights gives a different map. It is not in the MVP until you decide (Q-PROFILE).":"Z myšlenkové mapy z §. listopadu Varianty se porovnávají podle faktů, které nezávisí na vlastním pohledu firmy: ekonomika, poloha, současný stav a finanční údaje. Každá mapa vychází z jedné vážené tabulky, takže změna řádků nebo vah dá jinou mapu. V MVP není, dokud nerozhodnete (Q-PROFILE).","One decision question, § to § options, one snapshot date for every value, and the client's weights written before any map.":"Jedna rozhodovací otázka, § až § variant, jedno rozhodné datum pro všechny hodnoty a váhy klienta zapsané dřív, než vznikne jakákoli mapa.","Indicator table":"Tabulka ukazatelů","One named, saved table per map. Each row has its name, unit, source and date, direction (higher or lower is better), weight and group. A missing value stays missing and the company is asked for it.":"Pro každou mapu jedna pojmenovaná a uložená tabulka. Každý řádek má název, jednotku, zdroj a datum, směr (lepší je vyšší, nebo nižší hodnota), váhu a skupinu. Chybějící hodnota zůstává chybějící a firma je o ni požádána.","Processing":"Zpracování","Raw values are never overwritten. Check units, currencies and dates; turn every row so that higher is better; put the rows on one scale; apply the weights. One processed-data file per table.":"Surové hodnoty se nikdy nepřepisují. Zkontrolovat jednotky, měny a data; otočit každý řádek tak, aby vyšší hodnota byla lepší; převést řádky na jednu stupnici; použít váhy. Pro každou tabulku jeden soubor zpracovaných dat.","Map":"Mapa","Relations between the options from the prepared table, then layout, height and terrain from aia-sociomap-§. Maps from different tables are turned and mirrored onto each other, nothing more, so they can be compared side by side.":"Vztahy mezi variantami z připravené tabulky, potom rozložení, výška a terén z aia-sociomap-§. Mapy z různých tabulek se na sebe jen otočí a zrcadlí, nic víc, aby je bylo možné porovnat vedle sebe.","How to read the maps, the state of the world from Deep Research, which rows it could move and in which direction, what happens if one weight doubles, and the limits.":"Jak mapy číst, stav světa z Deep Research, které řádky by mohl posunout a kterým směrem, co se stane, když se jedna váha zdvojnásobí, a omezení.","Observed-data map · proposed":"Mapa naměřených dat · navrženo","“These options have the same shape of profile across these indicators.”":"„Tyto varianty mají napříč těmito ukazateli stejný tvar profilu.“","One indicator or ratio; the objects are the options or competitors":"Jeden ukazatel nebo poměr; objekty jsou varianty nebo konkurenti","odhad, once it has a test":"odhad, jakmile bude mít zkoušku","Not computed yet. Waits on its test dataset and your decision.":"Zatím nespočítáno. Čeká na svou testovací datovou sadu a na vaše rozhodnutí.","Open before it can be built":"Co je otevřeno, než ji lze postavit","Each is explained on the":"Každá otázka je vysvětlena na záložce","Its test dataset, with the answer sealed first":"Její testovací datová sada s odpovědí předem zapečetěnou","Built from real places and public figures where they exist. Which option is right, under which weights and why, is written down and sealed before any map is made (TD-§). Each trap has an expected effect on the map.":"Sestavena ze skutečných míst a veřejných údajů, kde existují. Která varianta je správná, při jakých vahách a proč, se zapíše a zapečetí dřív, než vznikne jakákoli mapa (TD-§). Každá nástraha má očekávaný vliv na mapu.","Double counting":"Dvojí započtení","Two rows that measure the same thing, such as fuel price and transport cost.":"Dva řádky, které měří totéž, například cena paliva a náklady na dopravu.","A misleading leader":"Zavádějící vedoucí varianta","Best on paper, fails on one hidden indicator.":"Na papíře nejlepší, selže na jednom skrytém ukazateli.","An outlier":"Odlehlá hodnota","One extreme value that stretches the scale.":"Jedna krajní hodnota, která roztáhne stupnici.","A wrong direction":"Špatný směr","A row where lower is better but it is read as higher.":"Řádek, kde je lepší nižší hodnota, ale čte se, jako by byla lepší vyšší.","Real-world mess":"Nepořádek skutečného světa","Missing and stale values, two official numbers that disagree, mixed currencies, weights that contradict the stated goal, a world event the research should find.":"Chybějící a zastaralé hodnoty, dvě úřední čísla, která si odporují, smíchané měny, váhy v rozporu s uvedeným cílem, světová událost, kterou má rešerše najít.","What we calculate, in ten steps":"Co počítáme, v deseti krocích","The same ten steps for every configuration. Steps marked “kept” already run in the engine, aia-sociomap-§, which was built for people's ratings. The rest is new for business maps. Click a step: plain words first, the method underneath.":"Stejných deset kroků pro každou konfiguraci. Kroky označené „ponecháno“ už běží ve výpočetním jádru aia-sociomap-§, které vzniklo pro hodnocení od lidí. Zbytek je pro podnikové mapy nový. Klikněte na krok: nejprve prostými slovy, pod tím metoda.","Where do the rows come from?":"Odkud pocházejí řádky?","this picks the map type":"tím se určí typ mapy","new":"nové","a future, a setting, an expert":"budoucnost, nastavení, expert","Prepare the table":"Připravit tabulku","declared before any result":"stanoveno před jakýmkoli výsledkem","Aram's Q§":"Aramova Q§","Measure each pair":"Změřit každou dvojici","the same pattern across rows":"stejný průběh napříč řádky","kept":"ponecháno","Place them on the map":"Umístit je na mapu","together = close":"společně = blízko","Height and terrain":"Výška a terén","height = the mean result":"výška = průměrný výsledek","Test the map":"Zkouška mapy","each configuration its own":"každá konfigurace má svou","Three results, never one word":"Tři výsledky, nikdy jedno slovo","converged · faithful · firm":"konvergence · věrnost · pevnost","Tables beside the map":"Tabulky vedle mapy","what the map can't show":"co mapa neukáže","Say only what's allowed":"Říkat jen to, co se smí","claims, never-claims, register":"co tvrdí, co netvrdí, registr metod","Configuration · MOD-§ · SYS§ · SYS§":"Konfigurace · MOD-§ · SYS§ · SYS§","Start from the table. If a model computed the rows (futures, weight settings), it is a scenario map. If someone recorded them (experts, units, months), it is an observed-data map. Then pick the configuration from what you ask.":"Začněte u tabulky. Pokud řádky spočítal model (budoucnosti, nastavení vah), jde o mapu scénářů. Pokud je někdo zaznamenal (experti, jednotky, měsíce), jde o mapu naměřených dat. Konfiguraci pak zvolte podle toho, na co se ptáte.","Why it matters:":"Proč na tom záleží:","The source of the rows decides what a map may claim and how it is tested.":"Původ řádků rozhoduje o tom, co mapa smí tvrdit a jak se zkouší.","aia-sociomap-§ today (people's ratings)":"aia-sociomap-§ dnes (hodnocení od lidí)","One kind of row: people's ratings of objects.":"Jeden druh řádku: hodnocení objektů od lidí.","Business maps":"Podnikové mapy","Two types, five configurations: futures, weight settings (and their cross), experts, units, months; the indicator profile proposed as a sixth.":"Dva typy, pět konfigurací: budoucnosti, nastavení vah (a jejich kombinace), experti, jednotky, měsíce; profil ukazatelů je navržen jako šestá.","No question for Aram here":"Tady není žádná otázka pro Arama","Covered by the validation suite on fake data with known answers.":"Pokrývá to sada ověřovacích testů na vymyšlených datech se známými odpověďmi.","What each map shows, and where it fails":"Co která mapa ukazuje a kde selhává","Results of the fleet example, taken from the stored engine runs of the Sociomap Lifecycles page. The example has a planted answer: the two diesel options share the diesel price and the two electric ones the electricity price, so a correct map must place each pair together.":"Výsledky příkladu s vozovým parkem, převzaté z uložených běhů výpočetního jádra na stránce Sociomap Lifecycles. Příklad má vloženou odpověď: obě naftové varianty sdílejí cenu nafty a obě elektrické cenu elektřiny, takže správná mapa musí každou dvojici umístit k sobě.","Futures":"Budoucnosti","Which options do well in the same futures, and which balance each other. Close: relative performance in the same future. Height: mean saving.":"Kterým variantám se daří ve stejných budoucnostech a které se navzájem vyvažují. Blízko: relativní výkon ve stejné budoucnosti. Výška: průměrná úspora.","Stable on both samples (weakest agreement § against §); both planted pairs found in § of § runs.":"Stabilní na obou vzorcích (nejslabší shoda § proti §); obě vložené dvojice nalezeny v § z § běhů.","Fails":"Selhává","The map returns what the model holds: finding the planted pairs proves the method, not the model.":"Mapa vrací to, co je v modelu: nalezení vložených dvojic dokazuje metodu, ne model.","Stability under driver correlation § · § · § and a new sample: Spearman of the § distances ≥ §.":"Stabilita při korelaci vlivů § · § · § a na novém vzorku: Spearman pro § vzdáleností ≥ §.","Weight settings":"Nastavení vah","Would the order change under other weights? Rows are weight settings from a fan around the client's weights; height is the mean weighted score.":"Změnilo by se pořadí při jiných vahách? Řádky jsou nastavení vah z vějíře kolem vah klienta; výška je průměrné vážené skóre.","Under the “provoz” weights, Elektro – leasing is first in § % of the narrow fan and § % of the wide one. Under the “finance” weights another option leads.":"Při vahách „provoz“ je Elektro – leasing první v § % úzkého vějíře a v § % širokého. Při vahách „finance“ vede jiná varianta.","The share depends on the fan width: print all three.":"Podíl závisí na šířce vějíře: uvádějte všechny tři.","Shares of first place in narrow, medium and wide fans; map agreement across widths.":"Podíly prvních míst v úzkém, středním a širokém vějíři; shoda map napříč šířkami.","Futures × weights":"Budoucnosti × váhy","Does the picture hold when the future and the weights change together? An option of the scenario map, not a sixth configuration.":"Drží obraz, i když se budoucnost a váhy mění současně? Je to volba mapy scénářů, ne šestá konfigurace.","Elektro – leasing first in § of § cells under the “provoz” weights.":"Elektro – leasing je při vahách „provoz“ první v § z § buněk.","The planted answer was lost in § of § runs; rows of one future belong together.":"Vložená odpověď se ztratila v § z § běhů; řádky jedné budoucnosti patří k sobě.","Who is first in every cell of the grid, then both scenario tests.":"Kdo je první v každé buňce mřížky, potom obě zkoušky mapy scénářů.","Experts":"Experti","Which options do our named experts see alike? Each expert rates each option on each criterion.":"Které varianty vidí naši jmenovaní experti podobně? Každý expert hodnotí každou variantu podle každého kritéria.","Planted answer found § of § times at § experts, missed § of § at § and §.":"Vložená odpověď byla nalezena §krát ze § při § expertech a nenalezena §krát ze § při § a § expertech.","Inputs are named people's judgement; names are personal data inside the client.":"Vstupy jsou úsudky jmenovaných lidí; jména jsou osobní údaje uvnitř klienta.","Whole experts resampled § times; one radius = § × the median spread.":"Celí experti převzorkováni §krát; jeden poloměr = § × mediánové rozptýlení.","Units":"Jednotky","Which indicators move together across depots, branches, products or customers? The objects are the indicators.":"Které ukazatele se napříč depy, pobočkami, produkty nebo zákazníky pohybují společně? Objekty jsou tady ukazatele.","All § planted pairs drawn every time, but up to § false pairs of § in one run.":"Všech § vložených dvojic se vykreslilo pokaždé, ale v jednom běhu až § falešných dvojic z §.","A strong negative relation is placed far away; height is not decided.":"Silný záporný vztah je umístěn daleko; o výšce není rozhodnuto.","§ bootstraps of the units; a pair is drawn only when its § % interval excludes zero.":"§ bootstrapových výběrů jednotek; dvojice se vykreslí, jen když její §% interval neobsahuje nulu.","Months":"Měsíce","Which monthly figures move together in time, after their trend is removed?":"Které měsíční údaje se v čase pohybují společně po odečtení trendu?","At § months: § of § planted pairs found. At § months, low inertia: § of §.":"Při § měsících: nalezena § z § vložených dvojic. Při § měsících a nízké setrvačnosti: § ze §.","The naive test draws false pairs under strong inertia.":"Naivní test při silné setrvačnosti kreslí falešné dvojice.","§ § IAAFT surrogates per series, Benjamini–Yekutieli, effective months per pair; block bootstrap described.":"§ § náhradních řad IAAFT na každou řadu, Benjamini–Yekutieli, efektivní počet měsíců pro každou dvojici; blokový bootstrap popsán.","Indicator profile (proposed)":"Profil ukazatelů (navrženo)","Options or competitors placed by the shape of their profile over indicators: economics, location, current state, financials.":"Varianty nebo konkurenti umístění podle tvaru svého profilu přes ukazatele: ekonomika, poloha, současný stav, finance.","Not computed yet: needs its planted-answer fixture (R§-Q§).":"Zatím nespočítáno: potřebuje vlastní testovací data s vloženou odpovědí (R§-Q§).","Double counting: two rows measuring the same thing pull options together.":"Dvojí započtení: dva řádky, které měří totéž, přitahují varianty k sobě.","Direction aligned, median and MAD per indicator, resampled by indicator family.":"Směr sjednocen, medián a MAD pro každý ukazatel, převzorkování po rodinách ukazatelů.","Aram's questions":"Otázky pro Arama","Thirteen method choices only the methodologist can make. The methodology proposes an answer to most; he confirms each through the register. Click an answer to record it; where the recommendation combines two, click both. ★ marks our recommendation.":"Třináct voleb metody, které může udělat jen metodolog. U většiny z nich metodika navrhuje odpověď; on každou potvrdí přes registr metod. Kliknutím odpověď zaznamenáte; kde doporučení spojuje dvě odpovědi, klikněte na obě. ★ označuje naše doporučení.","Removing false alarms (months)":"Odstranění falešných poplachů (měsíce)","With many pairs of monthly series, some links appear by luck. Which correction removes them?":"Při mnoha dvojicích měsíčních řad se některé vztahy objeví jen náhodou. Která korekce je odstraní?","c · FDR calibrated by block resampling":"c · FDR kalibrovaná blokovým převzorkováním","d · Cai & Liu bootstrap test":"d · bootstrapový test Cai & Liu","something else":"něco jiného","We recommend:":"Doporučujeme:","(b): the lifecycle page's months chapter uses it beside § § surrogates. (a) has no guarantee for these tests.":"(b): používá ji kapitola o měsících na stránce Sociomap Lifecycles spolu s § § náhradními řadami. (a) nemá pro tyto testy záruku.","Growing numbers":"Rostoucí čísla","KPIs that grow over time look linked just because both grow. What do we map?":"Ukazatele KPI, které v čase rostou, vypadají jako související jen proto, že oba rostou. Co mapujeme?","a · remove a trend declared first":"a · odečíst předem stanovený trend","b · differences":"b · diference","c · show both":"c · ukázat obojí","(a), written down before results; in the example every growing series otherwise correlated with every other.":"(a), zapsáno před výsledky; v příkladu jinak každá rostoucí řada korelovala s každou další.","Counting independent months":"Počítání nezávislých měsíců","How do we count truly independent months when they follow each other?":"Jak spočítat skutečně nezávislé měsíce, když na sebe navazují?","b · Pyper & Peterman (modified)":"b · Pyper & Peterman (upraveno)","(b), printed beside every pair (e.g. § of § months).":"(b), uvedeno u každé dvojice (např. § ze § měsíců).","How many months at least?":"Kolik měsíců nejméně?","At § months the example's test found § of § planted pairs; at § and § it found them under low inertia.":"Při § měsících našla zkouška v příkladu § z § vložených dvojic; při § a § měsících je našla při nízké setrvačnosti.","a · § months minimum":"a · nejméně § měsíců","b · § months minimum":"b · nejméně § měsíců","c · below the minimum, describe only, no map":"c · pod minimem jen popis, žádná mapa","(a) with (c): print the minimum on the map and refuse a shorter series by name.":"(a) spolu s (c): minimum uvést na mapě a kratší řadu jmenovitě odmítnout.","Fake “no link” series":"Umělé řady „bez vztahu“","How do we make series that behave like the real ones but have no real link?":"Jak vytvořit řady, které se chovají jako skutečné, ale žádný skutečný vztah mezi nimi není?","a · phase randomisation":"a · randomizace fází","c · block permutation":"c · bloková permutace","(b), § § per series after removing the trend; their autocorrelation checked against the original.":"(b), § § na každou řadu po odečtení trendu; jejich autokorelace se ověří proti původní řadě.","Measuring “move together”":"Jak měřit „pohybují se společně“","Which number measures how two objects move together?":"Které číslo měří, jak se dva objekty pohybují společně?","a · baseline-corrected r̃ after the row mean (futures, weights, experts)":"a · r̃ korigované o základní úroveň, po odečtení řádkového průměru (budoucnosti, váhy, experti)","b · correlation of standardised columns (units, months)":"b · korelace standardizovaných sloupců (jednotky, měsíce)","(a) and (b), each fixed for its configuration before results are seen.":"(a) i (b), každé pevně dané pro svou konfiguraci dřív, než jsou vidět výsledky.","When do we trust a configuration?":"Kdy konfiguraci věříme?","What must it score on data with a planted answer before we trust it?":"Čeho musí dosáhnout na datech s vloženou odpovědí, než jí začneme věřit?","planted groups found":"nalezené vložené skupiny","false pairs in a no-relation world":"falešné dvojice ve světě bez vztahů","stability of the layout":"stabilita rozložení","All three, at a declared rate. In the example the units map drew § false pairs of § (§ %), about one per run expected: the rate must be stated before the register entry.":"Všechny tři, s předem stanovenou mírou. V příkladu mapa jednotek vykreslila § falešných dvojic ze § (§ %), čekala se asi jedna na běh: míra musí být stanovena před zápisem do registru metod.","Today's value of future money":"Dnešní hodnota budoucích peněz","Which interest rate turns future money into today's money when the futures are simulated?":"Která úroková sazba převádí budoucí peníze na dnešní, když jsou budoucnosti simulované?","a · risk-free on simulated flows":"a · bezriziková sazba na simulované toky","b · risk-adjusted rate":"b · sazba upravená o riziko","c · the client's WACC":"c · WACC klienta","One rate per study for all options; show how the verdict changes at other rates; never lowered because the model is simulated.":"Jedna sazba na studii pro všechny varianty; ukázat, jak se verdikt mění při jiných sazbách; sazba se nikdy nesnižuje proto, že je model simulovaný.","From low/likely/high to a curve":"Od nízká/pravděpodobná/vysoká ke křivce","How do we turn a person's low, likely and high into a distribution?":"Jak z nízké, pravděpodobné a vysoké hodnoty od člověka uděláme rozdělení?","a · PERT throughout":"a · všude PERT","b · fit beta or lognormal where data exist":"b · proložit beta nebo lognormální rozdělení tam, kde jsou data","c · mixture when experts disagree":"c · směs rozdělení, když se experti neshodnou","(b) where data exist and (c) whenever people disagree.":"(b) tam, kde jsou data, a (c) vždy, když se lidé neshodnou.","Was the forecast any good?":"Byla prognóza k něčemu?","How do we score a forecast against what really happened?":"Jak ohodnotíme prognózu proti tomu, co se opravdu stalo?","a · held-out MAE":"a · MAE na odložených datech","(b), scaled by the seasonal naive forecast; never MAPE where zeros occur.":"(b), škálováno sezónní naivní prognózou; nikdy MAPE tam, kde se vyskytují nuly.","What height means for units and months":"Co znamená výška u jednotek a měsíců","On these maps the objects are indicators, not options, so a mean result has no meaning.":"Na těchto mapách jsou objekty ukazatele, ne varianty, takže průměrný výsledek nedává smysl.","a · the mean of the standardised indicator":"a · průměr standardizovaného ukazatele","b · no height, layout only":"b · žádná výška, jen rozložení","c · a business measure declared per study":"c · obchodní míra stanovená pro každou studii","(b) until the methodologist decides; the example draws both without terrain.":"(b), dokud metodolog nerozhodne; příklad kreslí obě mapy bez terénu.","How firm must a scenario map be?":"Jak pevná musí být mapa scénářů?","The futures map passes when every two of its three maps agree at Spearman ≥ §. The example's weakest agreement was §.":"Mapa budoucností projde, když se každé dvě z jejích tří map shodují na úrovni Spearman ≥ §. Nejslabší shoda v příkladu byla §.","a · § across three assumptions and a new sample":"a · § napříč třemi předpoklady a novým vzorkem","c · set per study":"c · stanovit pro každou studii","(a), the methodology's default; print the weakest agreement, not just the verdict.":"(a), výchozí hodnota metodiky; uvádět nejslabší shodu, ne jen verdikt.","How many experts at least?":"Kolik expertů nejméně?","The expert map missed the planted answer in § of § runs with § or § experts and found it § of § times with §.":"Mapa expertů nenašla vloženou odpověď ve § ze § běhů při § nebo § expertech a našla ji §krát ze § při §.","a · at least §":"a · nejméně §","b · at least §":"b · nejméně §","c · below the minimum, a table instead of a map":"c · pod minimem tabulka místo mapy","(b) with (c), to be confirmed on the planted-answer fixture.":"(b) spolu s (c), potvrdit na testovacích datech s vloženou odpovědí.","The map never claims…":"Mapa nikdy netvrdí…","The recommendation: the decision rule makes it; the map supports it.":"Doporučení: dává ho rozhodovací pravidlo; mapa ho podporuje.","How the market or the company really behaves: a scenario map's relations belong to the model.":"Jak se trh nebo firma skutečně chová: vztahy na mapě scénářů patří modelu.","That two close options win together, or that one can stand in for the other in operations.":"Že dvě blízké varianty vítězí společně nebo že jedna může v provozu zastoupit druhou.","Distances when the configuration's test failed: then only the heights are read.":"Vzdálenosti, když zkouška konfigurace neprošla: pak se čtou jen výšky.","A cause; a distance as the size of an effect; the ground between points as an estimate.":"Příčinu; vzdálenost jako velikost účinku; terén mezi body jako odhad.","Distinct phases, from only §–§ months, without a declared break.":"Oddělené fáze jen z §–§ měsíců, bez předem stanoveného zlomu.","A share of first place as the probability of winning: it is a share of the settings we tried.":"Podíl prvních míst jako pravděpodobnost výhry: je to podíl nastavení, která jsme vyzkoušeli.","That a pair without a line is unrelated: the test may only have lacked rows.":"Že dvojice bez čáry spolu nesouvisí: testu mohly jen chybět řádky.","The method works because Sociomapping works for team communication.":"Že metoda funguje, protože Sociomapping funguje pro týmovou komunikaci.","Kept from today's engine":"Zachováno z dnešního výpočetního jádra","Row centring, pair relations, layout and ruler, heights and terrain, split-half, determinism. New: the preparation per configuration, the tests, the tables beside the map and one register entry per configuration.":"Centrování řádků, vztahy dvojic, rozložení a pravítko, výšky a terén, split-half, determinismus. Nově: příprava podle konfigurace, zkoušky, tabulky vedle mapy a jeden zápis v registru metod na každou konfiguraci.","Where this tab comes from.":"Z čeho tato záložka vychází.","The method is the one on the Sociomap Lifecycles page (§ Nov, computed on develop §bb§c§e); the figures were checked against its stored runs on § Nov. The plan chunks quoted in small type (SYS§–SYS§) and M-§ in the master plan were written on § Nov and still say four “modes”, grade MODELLED, § scenarios and edges on the scenario map. The methodology replaces that wording; the plan files have not been updated yet (Q-PLANWORDS).":"Metoda je ta ze stránky Sociomap Lifecycles (§. listopadu, spočítáno na develop §bb§c§e); čísla byla §. listopadu ověřena proti jejím uloženým běhům. Díly plánu citované malým písmem (SYS§–SYS§) a M-§ v hlavním plánu byly napsány §. listopadu a stále uvádějí čtyři „režimy“, stupeň MODELLED, § scénářů a hrany na mapě scénářů. Metodika toto znění nahrazuje; soubory plánů zatím nebyly aktualizovány (Q-PLANWORDS).","Futures map of the six fleet options":"Mapa budoucností šesti variant vozového parku","Calculation steps":"Kroky výpočtu","Rows in · SYS§ · SYS§ · SYS§":"Vstupní řádky · SYS§ · SYS§ · SYS§","Each configuration has its own row: one future the model computed, one weight setting from a fan around the client's weights, one expert on one criterion, one depot, or one month.":"Každá konfigurace má svůj řádek: jednu budoucnost spočítanou modelem, jedno nastavení vah z vějíře kolem vah klienta, jednoho experta u jednoho kritéria, jedno depo nebo jeden měsíc.","A scenario map can have as many rows as we ask for, so it can't be judged by p-values.":"Mapa scénářů může mít tolik řádků, kolik si řekneme, takže ji nelze posuzovat podle p-hodnot.","One respondent's ratings.":"Hodnocení jednoho respondenta.","Futures: § in the example, § § in the method. Weight settings: § per fan. Experts: § rows each. Units: one per depot. Months: one per month.":"Budoucnosti: § v příkladu, § § v metodě. Nastavení vah: § na vějíř. Experti: § řádky na každého. Jednotky: jeden na depo. Měsíce: jeden na měsíc.","Declared preparation · SYS§ · MOD-§":"Předem stanovená příprava · SYS§ · MOD-§","Decide how the table is prepared before seeing any map: remove each row's mean, put costs on a common §–§ scale, standardise each indicator across units, or remove a trend from monthly series.":"O přípravě tabulky rozhodněte dřív, než uvidíte jakoukoli mapu: odečíst průměr každého řádku, převést náklady na společnou stupnici §–§, standardizovat každý ukazatel přes jednotky, nebo odečíst trend z měsíčních řad.","Two series that both grow look related even when they aren't; a criterion in millions drowns the weights.":"Dvě řady, které obě rostou, vypadají jako související, i když nejsou; kritérium v milionech přehluší váhy.","Per-person centring of ratings.":"Centrování hodnocení u každého člověka zvlášť.","Kept for futures and experts. New: a §–§ value scale per criterion for weights; z across units; detrend, then z, for months; direction aligned for every indicator.":"Zachováno pro budoucnosti a experty. Nově: hodnotová stupnice §–§ pro každé kritérium u vah; z-skóre přes jednotky; u měsíců odečtení trendu a pak z-skóre; u každého ukazatele sjednocený směr.","Relation statistic · engine":"Statistika vztahu · výpočetní jádro","For every pair: across the rows, do their values rise and fall together? This is what “close” means on every map.":"Pro každou dvojici: stoupají a klesají jejich hodnoty napříč řádky společně? To znamená „blízko“ na každé mapě.","Close means the same pattern, not the same level.":"Blízko znamená stejný průběh, ne stejnou úroveň.","Baseline-corrected correlation of centred ratings.":"Korelace centrovaných hodnocení korigovaná o základní úroveň.","Kept: r̃ = (r − r§)/(§ − r§) for futures, weights and experts; plain correlation of the standardised columns for units and months.":"Zachováno: r̃ = (r − r§)/(§ − r§) pro budoucnosti, váhy a experty; prostá korelace standardizovaných sloupců pro jednotky a měsíce.","Layout · engine · SYS§":"Rozložení · výpočetní jádro · SYS§","Objects whose rows move together are placed close; the rest apart. Kept from today's engine, for every configuration.":"Objekty, jejichž řádky se pohybují společně, leží blízko; ostatní dál od sebe. Zachováno z dnešního výpočetního jádra, pro každou konfiguraci.","The layout was never the problem; how well it fits must be visible.":"Rozložení nikdy nebylo problém; musí být vidět, jak dobře sedí.","Soft-rank Spearman with Coulomb repulsion (§–§ objects), Interval MDS above; converted to the ruler.":"Soft-rank Spearman s Coulombovým odpuzováním (§–§ objektů), nad tím Interval MDS; převedeno na pravítko.","Kept. The layout's own stop rule and its fidelity to the matrix are printed beside the map.":"Zachováno. Vlastní pravidlo zastavení rozložení a jeho věrnost matici se uvádějí vedle mapy.","Terrain · engine · CS§":"Terén · výpočetní jádro · CS§","The height under each option is its mean result: mean saving, mean weighted score or mean rating. The ground between the points is a smooth transition, not data.":"Výška pod každou variantou je její průměrný výsledek: průměrná úspora, průměrné vážené skóre nebo průměrné hodnocení. Terén mezi body je plynulý přechod, ne data.","The terrain stretches §–§ to the full range, so a hill can be a small difference.":"Terén roztahuje hodnoty §–§ na celý rozsah, takže kopec může znamenat malý rozdíl.","Height from ratings; framed_relative_idw terrain, §/d³.":"Výška z hodnocení; terén framed_relative_idw, §/d³.","Kept for scenario maps and experts. Units and months: the meaning of height is open, so no terrain. Read heights from the table beside the map.":"Zachováno pro mapy scénářů a experty. Jednotky a měsíce: význam výšky je otevřený, proto bez terénu. Výšky čtěte z tabulky vedle mapy.","Robustness · SYS§ · SYS§ · SYS§ · SYS§":"Robustnost · SYS§ · SYS§ · SYS§ · SYS§","Scenario maps: does the same picture come out under assumptions written first? Observed-data maps: does it hold when we resample the rows the way they depend on each other?":"Mapy scénářů: vyjde stejný obraz i při předpokladech zapsaných předem? Mapy naměřených dat: drží, když řádky převzorkujeme tak, jak na sobě závisejí?","Each kind of row can fool you in its own way.":"Každý druh řádku vás může oklamat po svém.","Split-half agreement and pair floors with Benjamini–Hochberg.":"Shoda split-half a minimální prahy pro dvojice s Benjamini–Hochberg.","Futures: Spearman of distances ≥ § across three assumptions and a new sample. Weights: shares of first place in three fan widths. Experts: whole experts resampled, one radius. Units: § bootstraps, § % intervals. Months: § § IAAFT surrogates, Benjamini–Yekutieli, effective months.":"Budoucnosti: Spearman vzdáleností ≥ § napříč třemi předpoklady a novým vzorkem. Váhy: podíly prvních míst ve třech šířkách vějíře. Experti: převzorkování celých expertů, jeden poloměr. Jednotky: § bootstrapových výběrů, §% intervaly. Měsíce: § § náhradních řad IAAFT, Benjamini–Yekutieli, efektivní počet měsíců.","Credibility · SYS§ · SYS§":"Důvěryhodnost · SYS§ · SYS§","Every map prints three things: did the layout stop by its own rule, how faithfully the map keeps the order of the relations, and the verdict of its test. A failure is printed as it is.":"Každá mapa uvádí tři věci: zda se rozložení zastavilo podle vlastního pravidla, jak věrně mapa zachovává pořadí vztahů, a verdikt své zkoušky. Neúspěch se uvede tak, jak je.","One word like “credible” hides which part failed.":"Jedno slovo jako „důvěryhodná“ skrývá, která část selhala.","One credibility figure (split-half).":"Jedno číslo důvěryhodnosti (split-half).","Split-half kept as a check that the layout is not an artefact. After a failed test only the heights are read, never the distances.":"Split-half zůstává jako kontrola, že rozložení není artefakt. Po neúspěšné zkoušce se čtou jen výšky, nikdy vzdálenosti.","Companion tables · CS§ · EX§":"Doprovodné tabulky · CS§ · EX§","Some questions the map cannot answer. “Does one option back up another?” is answered by the joint-loss table: when A loses against today, in how many of those futures B loses too.":"Na některé otázky mapa odpovědět neumí. Na otázku „Zálohuje jedna varianta druhou?“ odpovídá tabulka společných ztrát: když A prohrává proti dnešnímu stavu, v kolika z těchto budoucností prohrává i B.","Removing the row mean removes the shared level that a joint loss is made of.":"Odečtením řádkového průměru zmizí společná úroveň, ze které se společná ztráta skládá.","Heights table; joint losses (futures); shares of first place (weights); a § % interval per pair (units); effective months per pair (months).":"Tabulka výšek; společné ztráty (budoucnosti); podíly prvních míst (váhy); §% interval pro každou dvojici (jednotky); efektivní počet měsíců pro každou dvojici (měsíce).","Claims · SYS§ · register":"Tvrzení · SYS§ · registr metod","Each configuration states what it may claim and what it never claims, on screen and in the report. Until the methodologist registers it, the map prints as an estimate, marked internal.":"Každá konfigurace uvádí, co smí tvrdit a co nikdy netvrdí, na obrazovce i ve zprávě. Dokud ji metodolog nezapíše do registru metod, uvádí se mapa jako odhad, označená jako interní.","A map that claims too much is worse than no map.":"Mapa, která tvrdí příliš mnoho, je horší než žádná mapa.","One register entry for respondent ratings (§ Oct).":"Jeden zápis v registru metod pro hodnocení respondentů (§. října).","One entry per configuration, after its planted-answer test passes; until then “odhad (metoda čeká na schválení metodikem)”, internal.":"Jeden zápis na konfiguraci, až projde její zkouška s vloženou odpovědí; do té doby „odhad (metoda čeká na schválení metodikem)“, interní.","The map can't say. Elektro – koupě loses against today in § of § futures; Elektro – leasing, beside it, loses in all §: no backup. Nafta – koupě, far away, loses in only § of them (§ %). The joint-loss table answers this, not the distance.":"Mapa to říct neumí. Elektro – koupě prohrává proti dnešnímu stavu ve § z § budoucností; Elektro – leasing, hned vedle, prohrává ve všech §: žádná záloha. Nafta – koupě, daleko od nich, prohrává jen ve § z nich (§ %). Odpověď dává tabulka společných ztrát, ne vzdálenost.","An option":"Varianta","Mean saving":"Průměrná úspora","against today · loses against today in":"proti dnešnímu stavu · počet budoucností, kde proti dnešnímu stavu prohrává:","futures.":".","The grey dots show where it lies under no and strong driver correlation.":"Šedé body ukazují, kde leží při žádné a při silné korelaci vlivů.","A pair":"Dvojice","NK and NL":"NK a NL","Their rows move together: the same futures favour both.":"Jejich řádky se pohybují společně: stejné budoucnosti přejí oběma.","r̃ = § · the engine calls it reliable; this configuration tests the whole map, not pairs":"r̃ = § · výpočetní jádro označuje vztah za spolehlivý; tato konfigurace zkouší celou mapu, ne dvojice","NK and EK":"NK a EK","Opposite: what helps one hurts the other.":"Opačně: co jedné pomáhá, druhé škodí.","r̃ = -§ · the engine calls it reliable; this configuration tests the whole map, not pairs":"r̃ = -§ · výpočetní jádro označuje vztah za spolehlivý; tato konfigurace zkouší celou mapu, ne dvojice","NK and EXT":"NK a EXT","Hardly related.":"Téměř spolu nesouvisejí.","r̃ = -§ · the engine calls it weak; this configuration tests the whole map, not pairs":"r̃ = -§ · výpočetní jádro označuje vztah za slabý; tato konfigurace zkouší celou mapu, ne dvojice","Statistical methods and machine learning in the study":"Statistické metody a strojové učení ve studii","Where a statistical method helps the nine steps: what goes in, what happens, what comes out, and what it adds to the report. Six methods are in the MVP. Each is fixed before the results are seen and none of them learns from outcomes. Methods that do learn, such as weights adjusted after a decision proved wrong, follow the MVP (decided on § Nov) and are listed at the end of this tab. All numbers are the fictional Velis case.":"Kde statistická metoda pomáhá devíti krokům: co do ní vstupuje, co se stane, co z ní vychází a co přidá do zprávy. V MVP je šest metod. Každá je pevně dána dřív, než jsou vidět výsledky, a žádná se neučí z toho, jak rozhodnutí dopadla. Metody, které se učí, například váhy upravené poté, co se rozhodnutí ukázalo jako chybné, přijdou po MVP (rozhodnuto §. listopadu) a jsou uvedeny na konci této záložky. Všechna čísla jsou ze smyšleného případu Velis.","Code computes":"Počítá kód","Built in AIA on numpy and scipy. No language model computes a number; Ada may only suggest.":"Postaveno v AIA na knihovnách numpy a scipy. Žádné číslo nepočítá jazykový model; Ada smí jen navrhovat.","Fixed before results":"Pevně dáno před výsledky","Every setting is chosen before the data is seen, and registered in Metodika by A. Bahbouh.":"Každé nastavení se volí dřív, než jsou vidět data, a A. Bahbouh ho zapisuje do Metodiky.","Graded “odhad”":"Stupeň „odhad“","Labelled until registered. Same inputs and seed give the same bytes.":"Takto označeno až do zápisu v registru metod. Stejné vstupy a stejný seed dají stejné bajty.","Nothing leaves AIA":"Nic neopouští AIA","No client data to BigML or any ML service. Its rows are Class A, its summaries Class B.":"Žádná data klienta neodcházejí do BigML ani do jiné služby strojového učení. Jejich řádky jsou třída A, jejich souhrny třída B.","Where each method sits":"Kam která metoda patří","none":"žádná","§. Is the forecast better than “same as last year”?":"§. Je prognóza lepší než „stejně jako loni“?","§. Is anything in the data odd?":"§. Je v datech něco neobvyklého?","Lost orders after a late delivery":"Ztracené objednávky po pozdním dodání","Price elasticity":"Cenová elasticita","Delivery-time percentiles":"Percentily doby dodání","Odd invoice rows":"Neobvyklé řádky faktur","What a change caused":"Co změna způsobila","§. Which input moves the answer most?":"§. Který vstup hýbe výsledkem nejvíc?","§. How wide should the range be?":"§. Jak široký má být rozsah?","§. When does each option win?":"§. Kdy která varianta vítězí?","§. Do two options lose together?":"§. Prohrávají dvě varianty společně?","What is picked together":"Co se vychystává společně","Weights learned from outcomes":"Váhy naučené z toho, jak rozhodnutí dopadla","Weights raised after a shock":"Váhy zvýšené po šoku","Customer or SKU groups":"Skupiny zákazníků nebo SKU","wins in § %":"vítězí v § %","Czech wage growth, % a year (§ → §)":"Růst mezd v ČR, % ročně (§ → §)","surcharge Kč":"příplatek Kč","Each dot is one future. Filled: the Polish §PL with express wins. The dashed box is what PRIM finds.":"Každý bod je jedna budoucnost. Plný bod: vítězí polský §PL s expresem. Čárkovaně je vyznačen rámeček, který najde PRIM.","When does each option win?":"Kdy která varianta vítězí?","Scenario discovery · PRIM, with a CART tree as a check":"Scenario discovery · PRIM, kontrola stromem CART","It reads the model's § futures and finds the two or three conditions under which an option wins. A cloud of simulations becomes one sentence a board can check.":"Přečte § budoucností z modelu a najde dvě nebo tři podmínky, za kterých varianta vítězí. Z mraku simulací se stane jedna věta, kterou může vedení ověřit.","The Polish §PL with express wins in § % of futures. When Czech wage growth is at least § % and the Polish freight surcharge at most § Kč per order, it wins in § % of them. Those two numbers are what Velis watches after deciding.":"Polský §PL s expresem vítězí ve § % budoucností. Když mzdy v ČR rostou aspoň o § % a polský příplatek za dopravu je nejvýš § Kč na objednávku, vítězí v § % z nich. Tato dvě čísla Velis po rozhodnutí sleduje.","In":"Vstup","The § futures from Model, every input as drawn":"Všech § budoucností z kroku Model, každý vstup tak, jak byl vylosován","Which option won in each future, by the Zadání rule":"Která varianta v každé budoucnosti zvítězila podle rozhodovacího pravidla ze Zadání","What it does":"Co dělá","Mark the futures where the option wins":"Označí budoucnosti, ve kterých varianta vítězí","Trim the edge that removes the most losing futures, a little at a time":"Po malých krocích ořezává ten okraj, který odstraní nejvíc prohraných budoucností","Stop at a fixed minimum box size, at most § conditions":"Zastaví se při předem dané nejmenší velikosti rámečku, nejvýš § podmínky","Check the box on the other half of the futures":"Ověří rámeček na druhé polovině budoucností","A box: §–§ conditions in plain numbers":"Rámeček: §–§ podmínky v běžných číslech","Density: how often the option wins inside it":"Hustota: jak často varianta uvnitř oblasti vítězí","Coverage: how many of its wins the box holds":"Pokrytí: jakou část výher varianty rámeček obsahuje","Into the report":"Do zprávy","Osnova zprávy: the point “When the recommendation holds”, with its table, linked to the run and the method":"Osnova zprávy: bod „Kdy doporučení platí“ s tabulkou, propojený s během a metodou","Zpráva: the conditions become “what to watch after deciding”":"Zpráva: z podmínek se stane „co sledovat po rozhodnutí“","Sociomapa: explains why two options sit together":"Sociomapa: vysvětluje, proč dvě varianty leží u sebe","odhad (it reads Monte Carlo futures)":"odhad (čte budoucnosti z Monte Carlo)","Built":"Stavba","In AIA, numpy. A new chunk beside cost-model-study#CR§. Not in BigML.":"V AIA, numpy. Nový díl plánu vedle cost-model-study#CR§. Ne v BigML.","For Aram":"Pro Arama","Trim step, minimum box size, maximum conditions and the held-out check: all fixed before results?":"Krok ořezu, nejmenší velikost rámečku, nejvyšší počet podmínek a kontrola na druhé polovině budoucností: je vše pevně nastaveno před výsledky?","Risk:":"Riziko:","It describes the model, not the market. Printed as “in this model”.":"Popisuje model, ne trh. Tiskne se se slovy „v tomto modelu“.","Diesel price":"Cena nafty","Parcel volume":"Objem zásilek","Polish rent":"Nájem v Polsku","Wage growth":"Růst mezd","Other § inputs":"Ostatních § vstupů","Share of the spread in “Polish §PL minus Czech §PL, §-year cost”.":"Podíl na rozptylu ukazatele „polský §PL minus český §PL, náklady za § let“.","Which input moves the answer most?":"Který vstup hýbe výsledkem nejvíc?","Variance-based sensitivity · Sobol (Jansen), PRCC when inputs move together":"Citlivost založená na rozptylu · Sobol (Jansen), PRCC, když se vstupy pohybují společně","It splits the spread of a result between the inputs that cause it, so everyone can see which guess matters and which hardly does.":"Rozdělí rozptyl výsledku mezi vstupy, které ho způsobují. Každý tak vidí, na kterém odhadu záleží a na kterém skoro ne.","Diesel price explains § % of the spread in the cost difference between the Polish and the Czech §PL; parcel volume § %. Velis's COO is asked to firm up those two ranges first, not the other ten.":"Cena nafty vysvětluje § % rozptylu rozdílu nákladů mezi polským a českým §PL, objem zásilek § %. Provozní ředitel společnosti Velis má proto nejdřív zpřesnit tyto dva rozsahy, ne zbylých deset.","The model and every input's range from Předpoklady":"Model a rozsah každého vstupu z kroku Předpoklady","Which inputs move together (the Souvislosti table)":"Které vstupy se pohybují společně (tabulka Souvislosti)","Re-run the model with one input changed at a time, many thousands of times":"Přepočítá model mnohotisíckrát, pokaždé se změnou jediného vstupu","Measure how much of the result's spread each input causes, alone and with others":"Změří, jakou část rozptylu výsledku způsobuje každý vstup sám a jakou spolu s ostatními","If inputs move together, use rank correlation instead":"Když se vstupy pohybují společně, použije místo toho pořadovou korelaci","A bar per input: its share of the spread, with an interval":"Sloupec pro každý vstup: jeho podíl na rozptylu, s intervalem","The §–§ inputs worth measuring better":"§–§ vstupy, které stojí za přesnější měření","Osnova zprávy: the chart “What matters most”, beside the tornado":"Osnova zprávy: graf „Na čem záleží nejvíc“, vedle tornádového grafu","Feeds the value of information in Kč (CR§)":"Je vstupem pro hodnotu informace v Kč (CR§)","Zpráva: the method appendix names the method and its version":"Zpráva: metodická příloha uvádí metodu a její verzi","odhad, with bootstrap intervals":"odhad, s intervaly z bootstrapu","In AIA, numpy. Already planned: cost-model-study#CR§.":"V AIA, numpy. Už v plánu: cost-model-study#CR§.","With inputs that move together (W§): rank correlation (PRCC) or Shapley effects?":"U vstupů, které se pohybují společně (W§): pořadová korelace (PRCC), nebo Shapleyho efekty?","A share of spread in the model is not importance in the world. A small share can still matter in the tails.":"Podíl na rozptylu v modelu není totéž co důležitost ve skutečném světě. I malý podíl může být důležitý na okrajích rozdělení.","today":"dnes","forecast":"prognóza","MASE § vs § → used":"MASE § proti § → použita","Monthly orders: § months of history, § months forecast with its § % range.":"Měsíční objednávky: § měsíců historie a prognóza na § měsíců s rozsahem § %.","Is the forecast better than “same as last year”?":"Je prognóza lepší než „stejně jako loni“?","Forecast baselines and ETS (Holt-Winters), scored by MASE":"Základní prognózy a ETS (Holt-Winters), hodnocené podle MASE","It forecasts a series such as monthly orders, then tests itself on the past: if it cannot beat the simple rule “same month last year”, it is not used, and the page says so.":"Předpoví řadu, například měsíční objednávky, a pak se sama vyzkouší na minulosti. Když nepřekoná jednoduché pravidlo „stejný měsíc loni“, nepoužije se a stránka to uvede.","§ months of orders. The seasonal forecast scores § against “same month last year” (§) over § test points in the past, so it is used for next year's volume.":"§ měsíců objednávek. Sezónní prognóza má skóre § proti pravidlu „stejný měsíc loni“ (§) na § testovacích bodech v minulosti, proto se použije pro objem příštího roku.","§–§ months of one series from the client's data, under its contract":"§–§ měsíců jedné řady z dat klienta, podle její datové smlouvy","Fit the simple rules: last value, same month last year, trend":"Spočítá jednoduchá pravidla: poslední hodnota, stejný měsíc loni, trend","Fit a seasonal forecast (ETS)":"Sestaví sezónní prognózu (ETS)","Pretend it is an earlier month, forecast, compare with what happened; repeat":"Vrátí se do dřívějšího měsíce, udělá prognózu a porovná ji s tím, co se stalo; pak to opakuje","Keep the forecast only if it beats the seasonal rule":"Prognózu ponechá, jen když překoná sezónní pravidlo","Next § months with their range":"Příštích § měsíců s jejich rozsahem","The score (MASE) and how many test points it rests on":"Skóre (MASE) a počet testovacích bodů, o které se opírá","Its past errors, for the next card":"Minulé chyby prognózy, pro další kartu","Osnova zprávy: the volume chart with its test, linked to the data file":"Osnova zprávy: graf objemu s jeho testem, s odkazem na datový soubor","Zpráva: the method appendix states the score and the test points":"Zpráva: metodická příloha uvádí skóre a testovací body","A forecast that failed is reported as not used":"Prognóza, která neobstála, se uvede jako nepoužitá","In AIA, numpy and scipy. Already planned: cost-model-study#CR§, with MAE replaced by MASE (ADR § decision §).":"V AIA, numpy a scipy. Už v plánu: cost-model-study#CR§, kde MASE nahradilo MAE (ADR §, rozhodnutí §).","Your question §: is “MASE below §” enough? The minimum number of test points?":"Vaše otázka §: stačí „MASE pod §“? Jaký je nejmenší počet testovacích bodů?","Six test points is a thin test. Breaks (a new carrier, a Black Friday) are not in the past.":"Šest testovacích bodů je slabý test. Zlomy (nový dopravce, Black Friday) v minulosti nejsou.","past forecast error":"minulá chyba prognózy","orders: §–§ thousand (§ %)":"objednávky: §–§ tisíc (§ %)","Past forecast errors; the shaded middle § % becomes the input's range.":"Minulé chyby prognózy; z vystínovaných prostředních § % se stane rozsah vstupu.","How wide should the range be?":"Jak široký má být rozsah?","Empirical (conformal-style) intervals from backtest errors":"Empirické intervaly (na způsob konformní predikce) z chyb zpětného testu","It sets an input's low and high from how wrong the forecast actually was in the past, instead of from a guess or a textbook bell curve.":"Nízkou a vysokou hodnotu vstupu nastaví podle toho, jak moc se prognóza v minulosti skutečně mýlila, ne podle odhadu od oka nebo učebnicové Gaussovy křivky.","Next year's orders: § to § thousand (§ %), because the forecast was off by up to −§ % and +§ % in its past tests. That range goes straight into Předpoklady.":"Objednávky v příštím roce: § až § tisíc (§ %), protože se prognóza v minulých testech mýlila až o −§ % a +§ %. Tento rozsah jde rovnou do kroku Předpoklady.","The forecast's past errors from the card before":"Minulé chyby prognózy z předchozí karty","Sort the errors":"Seřadí chyby","Read the §th and §th percentiles":"Odečte §. a §. percentil","Apply them to the new forecast":"Použije je na novou prognózu","Too few errors: fall back to the guarantor's range":"Když je chyb příliš málo, vrátí se k rozsahu od garanta","The input's range on Předpoklady, with its source “forecast errors”":"Rozsah vstupu v kroku Předpoklady, se zdrojem „chyby prognózy“","The number of errors it rests on":"Počet chyb, o které se opírá","Osnova zprávy: the assumptions table shows the range and why it is that wide":"Osnova zprávy: tabulka předpokladů ukazuje rozsah a důvod, proč je tak široký","Every headline downstream (median and § % interval) inherits it":"Přebírá ho každé hlavní číslo v dalších krocích (medián a interval § %)","In AIA, part of CR§, feeding the Monte Carlo (CR§).":"V AIA, součást CR§; je vstupem pro Monte Carlo (CR§).","From how many past errors do we trust the range, and how does it widen with the horizon?":"Od kolika minulých chyb rozsahu věříme a jak se rozšiřuje s délkou výhledu?","Months are not interchangeable, so the § % is a calibration, not a guarantee. Call it that.":"Měsíce nejsou zaměnitelné, takže § % je kalibrace, ne záruka. Tak to také nazývejme.","threshold":"práh","Nov §: §× median":"listopad §: §× medián","Researcher: “Black Friday, keep”":"Výzkumník: „Black Friday, ponechat“","Monthly returns; the dashed line is the threshold.":"Měsíční vratky; čárkovaná čára je práh.","Is anything in the data odd?":"Je v datech něco neobvyklého?","Robust outlier flags · MAD, Hampel, seasonal residuals":"Robustní označení odlehlých hodnot · MAD, Hampel, sezónní rezidua","It flags values far from the usual, using the median so one extreme month cannot hide another. It only flags; a person decides.":"Označí hodnoty daleko od obvyklých. Vychází z mediánu, aby jeden krajní měsíc nezakryl jiný. Jen označuje; rozhoduje člověk.","Returns in November § were § times the median month. Flagged. The researcher marks it “Black Friday, keep” and the note stays with the number.":"Vratky v listopadu § dosáhly §násobku mediánového měsíce. Označeno. Výzkumník k tomu zapíše „Black Friday, ponechat“ a poznámka zůstane u čísla.","The client's monthly KPIs and rows, under the data contract":"Měsíční KPI a řádky klienta, podle datové smlouvy","Take out the seasonal pattern":"Odečte sezónní průběh","Measure each value's distance from the median, in robust units":"Změří vzdálenost každé hodnoty od mediánu v robustních jednotkách","Flag anything beyond a fixed threshold":"Označí vše, co překročí pevný práh","A person keeps or excludes it, with a reason":"Člověk hodnotu ponechá, nebo vyloučí, a uvede důvod","A list of flagged values with the reason each was kept or excluded":"Seznam označených hodnot s důvodem, proč byla každá ponechána nebo vyloučena","Nothing removed silently":"Nic se neodstraní potichu","Zpráva: the data quality appendix lists every flag and decision":"Zpráva: příloha o kvalitě dat uvádí každé označení a rozhodnutí","Numbers that used an excluded value say so in their source link":"Čísla, která použila vyloučenou hodnotu, to uvádějí v odkazu na zdroj","a flag on z dat klienta numbers, not a number of its own":"označení u čísel „z dat klienta“, ne samostatné číslo","In AIA, a few dozen lines. Part of the quality report (client-data-in-analysis#§a, cost-model-study#CR§).":"V AIA, několik desítek řádků kódu. Součást přehledu kvality dat (client-data-in-analysis#§a, cost-model-study#CR§).","The threshold, who may exclude, and is an exclusion recorded in the approval ledger?":"Jaký práh, kdo smí vylučovat a zapisuje se vyloučení do knihy schválení?","Excluding inconvenient points. Hence: a person decides, with a reason on record.":"Vylučování nepohodlných bodů. Proto rozhoduje člověk a důvod se zaznamená.","Own wh.":"Vlastní sklad","Own + auto":"Vlastní + automat.","Polish §PL":"Polský §PL","PL + express":"PL + expres","Czech §PL":"Český §PL","CZ fixed":"CZ pevná cena","hedge":"pojistka","Options joined low in the tree win in the same futures.":"Varianty spojené nízko ve stromu vyhrávají ve stejných budoucnostech.","Do two options lose together?":"Prohrávají dvě varianty společně?","The joint-loss table beside the futures map · optional clustering of shared losses":"Tabulka společných ztrát vedle mapy budoucností · volitelné shlukování společných ztrát","For every pair of options it counts, over the futures, how often both lose against today. The map can't answer this, because removing the row mean removes the shared level a joint loss is made of; the table does.":"Pro každou dvojici variant spočítá, v kolika budoucnostech obě prohrávají proti dnešnímu stavu. Mapa na to odpovědět neumí: odečtením řádkového průměru zmizí společná úroveň, ze které se společná ztráta skládá. Tabulka to umí.","The two own-warehouse options win in the same futures, and so do the two Polish options. The fixed-price Czech §PL stands apart: when the Polish §PL with express loses, it tends to win, so it is the insurance if the pilot fails.":"Obě varianty s vlastním skladem vyhrávají ve stejných budoucnostech, stejně tak obě polské varianty. Český §PL s pevnou cenou stojí stranou: když polský §PL s expresem prohrává, obvykle vyhrává. Je tedy pojistkou pro případ, že pilot selže.","The § futures, and which option won or lost in each":"§ budoucností a která varianta v každé z nich vyhrála nebo prohrála","For each pair: how often they win together, and how often one wins when the other loses":"Pro každou dvojici: jak často vyhrávají společně a jak často jedna vyhrává, když druhá prohrává","Join the most alike options first, step by step":"Krok za krokem spojuje nejdřív ty nejpodobnější varianty","Groups of options and the hedging pairs":"Skupiny variant a dvojice, které se navzájem jistí","A tree, or the map's distances":"Strom, nebo vzdálenosti na mapě","Sociomapa systémů: the content of the scenario map, or a check beside it":"Sociomapa systémů: obsah mapy scénářů, nebo kontrola vedle ní","Osnova zprávy: the point “The insurance option”":"Osnova zprávy: bod „Varianta jako pojistka“","odhad (it reads the model's futures)":"odhad (čte budoucnosti z modelu)","In AIA, numpy; proposed in the methodology, not built yet.":"V AIA, numpy; navrženo v metodice, zatím nepostaveno.","Which similarity measure and threshold, and is this what the scenario map should draw?":"Jaká míra podobnosti a jaký práh? A je tohle to, co má mapa scénářů kreslit?","A distance read as an effect size. The group exists only in the model.":"Vzdálenost čtená jako velikost účinku. Skupina existuje jen v modelu.","After the MVP: machine learning":"Po MVP: strojové učení","Decided on § Nov: after the MVP we also want to use machine learning. These are the candidates, the two from the § Nov mindmap first. Some learn from data (weights, groups, delivery times, odd rows); the others are statistical methods that need rows a client rarely has yet. Which one comes first is open (Q-MLFIRST).":"Rozhodnuto §. listopadu: po MVP chceme používat i strojové učení. Zde jsou kandidáti; první dva jsou z myšlenkové mapy z §. listopadu. Některé metody se učí z dat (váhy, skupiny, doby doručení, neobvyklé řádky). Ostatní jsou statistické metody, které potřebují řádky, jaké klient zatím málokdy má. Která přijde první, je otevřeno (Q-MLFIRST).","What has to be true before one starts":"Co musí platit, než některá z nich začne","Something to learn from":"Je z čeho se učit","What happened after past decisions, or tens of thousands of client rows. Monthly figures give § to § rows: a model fitted to those looks precise and is not.":"To, co se stalo po minulých rozhodnutích, nebo desítky tisíc řádků klienta. Měsíční údaje dají § až § řádků: model postavený na nich vypadá přesně, ale přesný není.","Fixed first, then registered":"Nejdřív pevné nastavení, pak zápis do registru","The settings are chosen before the data is seen, and the methodologist registers the method. A method that picks itself cannot be registered.":"Nastavení se zvolí dřív, než jsou vidět data, a metodolog metodu zapíše do registru metod. Metodu, která se vybírá sama, do registru zapsat nelze.","The data stays inside AIA":"Data zůstávají v AIA","No client rows go to an outside machine-learning service. A new library in the domain needs a change to ARCHITECTURE.md first.":"Žádné řádky klienta neodcházejí do vnější služby strojového učení. Nová knihovna v doménové vrstvě nejdřív vyžaduje změnu souboru ARCHITECTURE.md.","It says what it is":"Říká, čím je","The report prints the result as an estimate about the data or the model. It is never called a cause unless a design supports that.":"Zpráva uvádí výsledek jako odhad o datech nebo o modelu. Příčinou se nenazve nikdy, pokud to nepodporuje výzkumné uspořádání.","What it answers":"Na co odpovídá","Method":"Metoda","Out (Velis)":"Výstup (Velis)","Why later":"Proč později","Supervised learning over past decisions":"Učení s učitelem na minulých rozhodnutích","Past studies and what happened after each decision":"Minulé studie a to, co se stalo po každém rozhodnutí","A weight adjusted because last year's choice proved wrong":"Váha upravená proto, že se loňská volba ukázala jako chybná","A note on how the weights were set":"Poznámka o tom, jak byly váhy nastaveny","Needs the outcomes of real studies; the MVP has none (mindmap)":"Potřebuje vědět, jak dopadly skutečné studie; MVP žádné nemá (myšlenková mapa)","Rules or a model learned from past shocks":"Pravidla nebo model naučený z minulých šoků","Past shocks and what they did to the indicators, e.g. a war and the fuel price":"Minulé šoky a to, co udělaly s ukazateli, např. válka a cena paliva","A higher fuel weight when Deep Research reports a similar scenario":"Vyšší váha paliva, když Deep Research ohlásí podobný scénář","The report's state-of-the-world chapter":"Kapitola zprávy o stavu světa","Needs the indicator profile and a history of shocks (mindmap)":"Potřebuje profil ukazatelů a historii šoků (myšlenková mapa)","Logistic regression or matched groups (W§)":"Logistická regrese nebo párované skupiny (W§)","Order rows with delay and repeat purchase":"Řádky objednávek se zpožděním a opakovaným nákupem","Repeat purchase § % vs § % for matched orders: −§ points (§–§)":"Opakovaný nákup § % proti § % u spárovaných objednávek: −§ bodů (§–§)","An assumption's range, with “association, not effect” printed":"Rozsah předpokladu, s vytištěnou poznámkou „souvislost, ne účinek“","Needs Aram's method; high risk of a causal reading":"Potřebuje Aramovu metodu; vysoké riziko, že se výsledek bude číst jako příčina","Log-log regression (FIN§)":"Log-log regrese (FIN§)","Prices and volumes over time":"Ceny a objemy v čase","Elasticity −§ (−§ to −§)":"Elasticita −§ (−§ až −§)","A model input for pricing decisions":"Vstup modelu pro rozhodnutí o cenách","Most e-shops rarely change prices: wide interval":"Většina e-shopů mění ceny zřídka: široký interval","Gradient boosting, quantile loss":"Gradient boosting, kvantilová ztráta","Tens of thousands of delivery rows":"Desítky tisíc řádků o doručení","§th percentile delivery time by region and carrier":"§. percentil doby doručení podle regionu a dopravce","The operations view's service-level input":"Vstup úrovně služeb pro provozní pohled","Needs a new library in the domain (ARCHITECTURE.md change)":"Potřebuje novou knihovnu v doménové vrstvě (změna ARCHITECTURE.md)","Customer or SKU rows":"Řádky zákazníků nebo SKU","Groups by recency, frequency, value":"Skupiny podle doby od posledního nákupu, četnosti a hodnoty","The unit map (SYS§)":"Mapa jednotek (SYS§)","The unit map waits on the validation suite":"Mapa jednotek čeká na sadu validačních zkoušek","Invoice rows":"Řádky faktur","A short list of rows to check":"Krátký seznam řádků ke kontrole","The data quality appendix":"Příloha o kvalitě dat","Only if the robust flags miss things":"Jen pokud robustnímu označování něco uniká","Association rules":"Asociační pravidla","Order rows with SKUs":"Řádky objednávek s SKU","Cases and screen protectors together, lift §":"Pouzdra a ochranná skla společně, lift §","Warehouse slotting in the logistics view":"Rozmístění zboží ve skladu v logistickém pohledu","Only if the own-warehouse option needs layout":"Jen pokud varianta s vlastním skladem potřebuje řešit rozložení skladu","Difference-in-differences, synthetic control, uplift":"Rozdíl v rozdílech, syntetická kontrola, uplift","An experiment, or a clean break and a comparable series":"Experiment, nebo čistý zlom a srovnatelná řada","The effect of a change, with its assumptions":"Účinek změny, s jeho předpoklady","A finding only with a design behind it":"Zjištění jen tehdy, když za ním stojí výzkumné uspořádání","Clients rarely have the design":"Klienti takové uspořádání mají zřídka","Avoid":"Čemu se vyhnout","Random forests, boosted trees, deepnets on monthly KPIs":"Náhodné lesy, boostované stromy a hluboké sítě na měsíčních KPI","§–§ rows: they over-fit and look precise.":"§–§ řádků: modely se přeučí a vypadají přesně.","A method that picks itself can't be fixed before results or registered.":"Metodu, která se vybírá sama, nelze pevně nastavit před výsledky ani zapsat do registru.","Topic models":"Tematické modely","A finding is a quote in a source, not a topic.":"Zjištění je citace ve zdroji, ne téma.","WhizzML, batch predictions":"WhizzML, dávkové predikce","AIA already has its workflow engine.":"AIA už vlastní nástroj pro řízení pracovních postupů má.","Client data to BigML":"Data klienta do BigML","Class A/B data leaves only over an EU route approved for its class. BigML is none.":"Data třídy A/B odcházejí jen cestou v EU schválenou pro jejich třídu. BigML takovou cestou není.","Full analysis, with the BigML check and anchors:":"Úplná analýza, s prověrkou BigML a odkazy na doklady:","Machine Learning in AIA":"Strojové učení v AIA","Scatter of futures with the box where the Polish §PL with express wins":"Bodový graf budoucností s rámečkem, kde vyhrává polský §PL s expresem","Bars of each input's share of the spread":"Sloupce s podílem každého vstupu na rozptylu","Order history and forecast with its range":"Historie objednávek a prognóza s jejím rozsahem","Histogram of past forecast errors":"Histogram minulých chyb prognózy","Monthly returns with one flagged month":"Měsíční vratky s jedním označeným měsícem","Tree of options grouped by shared wins":"Strom variant seskupených podle společných výher","Decisions and open questions":"Rozhodnutí a otevřené otázky","decided ·":"rozhodnuto ·","open. A decision is shown with the words it was made in: the product owner's, or his answer in the step-by-step walkthrough of § Nov. An open question says who has to answer it and what we propose. Click a step to filter.":"otevřeno. Rozhodnutí uvádíme slovy, kterými bylo učiněno: slovy vlastníka produktu, nebo jeho odpovědí při procházení krok za krokem §. listopadu. U otevřené otázky je uvedeno, kdo na ni má odpovědět a co navrhujeme. Kliknutím na krok seznam vyfiltrujete.","Open questions":"Otevřené otázky","For the product owner":"Pro vlastníka produktu","From the coordinator":"Od koordinátora","Whole MVP":"Celé MVP","§ decided · § open":"§ rozhodnuto · § otevřeno","§ decided":"§ rozhodnuto","Two records in the repo disagree. The master plan and ADR § keep your decision A§ of § Nov: everything stays in the MVP and no single study is its spine. This page is built on that. The scope record of § Nov (prototypes/obchodni-model/MVP-SCOPE.md, version §) says your words of § Nov replaced A§: the study behind report §, a site decision, is the spine. It parks the analysis frameworks, accounting and market size, operations research, the data connectors, Sobol sensitivity, the diagram stacks, the shared client review and the personal-data register. It plans five two-week waves, and accepts the MVP on an independent calculation with known answers before the case. If the § Nov record stands, the steps, the build order and the Done-when tab here have to be cut down to it.":"Dva záznamy v repozitáři si odporují. Hlavní plán a ADR § drží vaše rozhodnutí A§ z §. listopadu: vše zůstává v MVP a žádná jednotlivá studie není jeho páteří. Na tom stojí tato stránka. Záznam rozsahu z §. listopadu (prototypes/obchodni-model/MVP-SCOPE.md, verze §) uvádí, že vaše slova z §. listopadu nahradila A§: páteří je studie, ze které vznikla zpráva §, tedy rozhodnutí o lokalitě. Záznam odkládá analytické rámce, účetnictví a velikost trhu, operační výzkum, datové konektory, citlivost Sobol, sady diagramů, sdílenou revizi s klientem a registr osobních údajů. Plánuje pět dvoutýdenních vln a MVP přijímá na základě nezávislého výpočtu se známými odpověďmi, ještě před případem. Pokud platí záznam z §. listopadu, je třeba kroky, pořadí stavby i záložku „Kdy je hotovo“ na této stránce podle něj zkrátit.","Proposed for MP§, which redefines MVP-ACCEPT-§ with its tests. Needs your approval.":"Navrženo pro MP§, který nově vymezuje MVP-ACCEPT-§ včetně jeho testů. Potřebuje vaše schválení.","It would prove the modules are reusable, and it is where the indicator profile would be tested first (R§-Q§). Recommended: in the MVP, once its chunks are estimated.":"Dokázalo by to, že moduly lze použít opakovaně, a poprvé by se tu vyzkoušel profil ukazatelů (R§-Q§). Doporučení: do MVP, jakmile budou odhadnuty jeho díly plánu.","The mindmap asks for a new dataset as close to reality as possible: real places, real public statistics and prices, with planted traps (double counting, a misleading leader, an outlier, a wrong direction) and real-world mess. TD-§ seals its answer before any map. No plan chunk builds it yet. Velis and the fleet are invented.":"Myšlenková mapa žádá novou datovou sadu co nejbližší skutečnosti: skutečná místa, skutečné veřejné statistiky a ceny, s vloženými pastmi (dvojí započtení, klamný favorit, odlehlá hodnota, obrácený směr) a s nepořádkem, jaký mají skutečná data. TD-§ zapečetí její odpověď dřív, než vznikne jakákoli mapa. Zatím ji nestaví žádný díl plánu. Velis i vozový park jsou vymyšlené.","You decided on § Nov that machine learning follows the MVP. The candidates are at the end of the Methods & ML tab: weights learned from outcomes or from past shocks, customer and product groups, delivery-time models, odd-row detection. Each needs data the MVP does not produce: the outcomes of real studies, or tens of thousands of client rows. Proposed: choose the first one when the first real client study is known (Q-FIRST), and record what happened after each decision from the first study on, so there is something to learn from.":"§. listopadu jste rozhodl, že strojové učení přijde po MVP. Kandidáti jsou na konci záložky „Metody a ML“: váhy naučené z toho, jak rozhodnutí dopadla, nebo z minulých šoků, skupiny zákazníků a produktů, modely doby doručení, hledání neobvyklých řádků. Každý potřebuje data, která MVP nevytváří: výsledky skutečných studií, nebo desítky tisíc řádků klienta. Návrh: prvního kandidáta vybrat, až bude známa první skutečná studie pro klienta (Q-FIRST), a už od první studie zaznamenávat, co se stalo po každém rozhodnutí, aby bylo z čeho se učit.","You have one in mind; the decision type is deliberately not recorded yet. It decides which template and data routes matter first.":"Jednu máte na mysli; typ rozhodnutí zatím záměrně není zapsán. Určí, na kterých šablonách a datových cestách záleží nejdřív.","Decided":"Rozhodnuto","AIA researches business decisions":"AIA zkoumá obchodní rozhodnutí","The AI-respondent survey lane is frozen, then archived after MVP acceptance":"Větev průzkumů s AI respondenty je zmrazena a po přijetí MVP se archivuje","Data contracts first, then the model platform":"Nejdřív datové smlouvy, pak modelová platforma","Everything stays in the MVP; no single journey is its spine (§ Nov; the scope record of § Nov says this was replaced on § Nov, see Q-SPINE)":"Vše zůstává v MVP; žádná jednotlivá cesta není jeho páteří (§. listopadu; podle záznamu rozsahu z §. listopadu to bylo §. listopadu nahrazeno, viz Q-SPINE)","One study for a business decision, nine steps":"Jedna studie pro obchodní rozhodnutí, devět kroků","Machine learning follows the MVP. The MVP's six methods are fixed statistics; methods that learn from data come after it":"Strojové učení přijde po MVP. Šest metod v MVP je pevně nastavená statistika; metody, které se učí z dat, přijdou až po něm","The panel and population are retired with the survey lane":"Panel a populace končí spolu s větví průzkumů","Who has to answer":"Kdo má odpovědět","Show all steps":"Zobrazit všechny kroky","Nothing open here.":"Zde není nic otevřeného.","The work is written as plan files in the repo, and each plan is cut into chunks: one chunk is one piece that can be built and tested on its own. Chunks are grouped into four waves, built in order. The numbers below count chunks per wave; click a chunk id in the table to read it. The scope record of § Nov plans five two-week waves instead; which plan stands is Q-SPINE.":"Práce je zapsána v souborech plánů v repozitáři a každý plán je rozdělen na díly: jeden díl plánu je kus práce, který lze postavit a otestovat samostatně. Díly jsou seskupeny do čtyř vln, které se staví po sobě. Čísla níže udávají počet dílů ve vlně; kliknutím na id dílu v tabulce si ho přečtete. Záznam rozsahu z §. listopadu místo toho plánuje pět dvoutýdenních vln; který plán platí, řeší otázka Q-SPINE.","Client data in analysis":"Data klienta v analýze","Personal data from registers":"Osobní údaje z rejstříků","Diagrams, charts, tables":"Diagramy, grafy, tabulky","+ § more plans":"+ § dalších plánů","Model platform":"Modelová platforma","Public data routes":"Cesty k veřejným datům","Finance · accounting · operations · market":"Finance · účetnictví · provoz · trh","Analysis frameworks":"Analytické rámce","Situation reports & expert map":"Situační zprávy a mapa expertů","Legal context":"Právní kontext","Parked, or planned for after acceptance.":"Odloženo, nebo plánováno až po přijetí.","All chunks":"Všechny díly plánu","Plan":"Plán","W§ · Foundations":"W§ · Základy","W§ · The platform":"W§ · Platforma","W§ · Estimates and maps":"W§ · Odhady a mapy","W§ · Acceptance":"W§ · Přijetí","Business Zadání":"Obchodní Zadání","When is the MVP done?":"Kdy je MVP hotové?","The MVP is done when these § statements are true, and each one is checked by an automatic test. They are proposed, not yet approved (Q-ACC). Once approved they replace the older list, AC-§ to AC-§, which was written for the survey product. The scope record of § Nov adds a step before them: an independent calculation with known answers that the model must reproduce (Q-SPINE).":"MVP je hotové, když platí těchto § tvrzení a každé z nich ověřuje automatický test. Jsou navržena, zatím ne schválena (Q-ACC). Po schválení nahradí starší seznam AC-§ až AC-§, napsaný pro produkt průzkumů. Záznam rozsahu z §. listopadu před ně přidává ještě jeden krok: nezávislý výpočet se známými odpověďmi, který musí model zopakovat (Q-SPINE).","Client data only under a contract":"Data klienta jen podle datové smlouvy","A client file enters a computation only under an accepted dat
