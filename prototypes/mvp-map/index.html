ted, or reopened?":"Co se stane s mapou, když se model spustí znovu nebo se změní Předpoklady: zastará, přepočítá se, nebo se znovu otevře?","The catalogue as data: every framework with its id, group, the question it answers, how it is produced (computed by code, cited Deep Research points, synthesis, named experts), its inputs (client data, Deep Research, experts), its grade, its report outline chapter kind and its MVP flag; versioned, one fixture read by Python and TypeScript; a framework point is a typed reference (an accepted finding, an admitted client-data claim, a model result, an expert's score) or the researcher's own judgement, labelled with its grade and author (ADR § A§), never unlabelled free text (W§)":"Katalog jako data: každý rámec se svým id, skupinou, otázkou, na kterou odpovídá, způsobem vzniku (výpočet kódem, citované body z Deep Research, syntéza, jmenovitě uvedení experti), vstupy (data klienta, Deep Research, experti), stupněm jistoty, druhem kapitoly v osnově reportu a příznakem MVP. Verzovaný, jedna sada testovacích dat čtená z Pythonu i TypeScriptu. Bod rámce je typovaný odkaz (přijatý nález, přijaté tvrzení z dat klienta, výsledek modelu, skóre experta) nebo vlastní úsudek výzkumníka, označený stupněm a autorem (ADR § A§), nikdy neoznačený volný text (W§)","The default sets: decision type to the frameworks Ada proposes, as data the owner approves; the Lead proposes a set with one reason per framework, the researcher accepts per change (ADR §); a framework that needs register fields naming persons is never proposed before its balancing test (W§)":"Výchozí sady: typ rozhodnutí → rámce, které Ada navrhne, jako data, která schvaluje vlastník. Ada navrhne sadu s jedním důvodem u každého rámce, výzkumník přijímá po jednotlivých změnách (ADR §). Rámec, který potřebuje pole veřejného rejstříku jmenující osoby, se nikdy nenavrhne před svým balančním testem (W§)","The Zadání picker (prototype board Z§): the groups, a toggle per framework, what each needs, the Deep Research cost ceiling of the selection, the report outline chapters and the expert forms it creates; saved on the study's working copy; post-MVP frameworks shown and disabled (W§)":"Výběr rámců v Zadání (plocha prototypu Z§): skupiny, přepínač u každého rámce, co který potřebuje, strop nákladů na Deep Research pro daný výběr, kapitoly osnovy reportu a formuláře pro experty, které výběr vytvoří; uloženo v pracovní verzi studie; rámce po MVP zobrazené a vypnuté (W§)","The selection drives Deep Research: each framework that needs research becomes subjects of the Design Research plan, its ceiling pinned at enqueue; a deselected framework takes its subjects out of the next run (W§, after deep-research-v§ DRV§)":"Výběr řídí Deep Research: každý rámec, který potřebuje rešerši, se stane tématy plánu Design Research a jeho strop se připne při zařazení do fronty; odebraný rámec vyřadí svá témata z dalšího běhu (W§, po deep-research-v§ DRV§)","The selection drives the model: each computed framework switches on its view on Výsledky (Finance, Účetnictví, Provoz, Logistika, Trh) through cost-model-study and quantitative-families; a framework whose data contract is missing says which file it waits for (W§)":"Výběr řídí model: každý počítaný rámec zapne svůj pohled ve Výsledcích (Finance, Účetnictví, Provoz, Logistika, Trh) přes cost-model-study a quantitative-families; rámec, kterému chybí datová smlouva, řekne, na který soubor čeká (W§)","The selection drives the experts: each expert-scored framework (the Blue Ocean strategy canvas, the risk register, RACI, the architecture frameworks) creates a scoring form for named raters, through situation-reports EX§'s expert panel (W§)":"Výběr řídí experty: každý rámec hodnocený experty (strategické plátno Blue Ocean, registr rizik, RACI, architektonické rámce) vytvoří hodnoticí formulář pro jmenovitě uvedené hodnotitele, přes expertní panel EX§ z plánu situation-reports (W§)","The selection drives the report outline: each framework a chapter or a part of one, with its point slots (SWOT's four quadrants, PESTEL's six factors, Porter's five forces); a point without a resolving source link is refused (research-findings-stage FND§) (W§)":"Výběr řídí osnovu reportu: každý rámec je kapitolou nebo její částí se sloty pro body (čtyři kvadranty SWOT, šest faktorů PESTEL, pět sil podle Portera); bod bez funkčního odkazu na zdroj se odmítne (research-findings-stage FND§) (W§)","Logistics frameworks: cost-to-serve, make-or-buy and §PL total cost of ownership, network and warehouse location (centre of gravity), service level and OTIF, transport cost by zone, warehouse sizing, each computed by code from client data under its contract and public inputs (W§)":"Logistické rámce: náklady na obsluhu zákazníka (cost-to-serve), make-or-buy a celkové náklady vlastnictví u §PL, umístění sítě a skladů (těžiště), úroveň služeb a OTIF, náklady na dopravu podle zón, dimenzování skladu; každý počítá kód z dat klienta pod jejich smlouvou a z veřejných vstupů (W§)","Corporate governance and enterprise architecture frameworks: ownership and group structure (after register-personal-data RPD§), RACI, risk management (COSO ERM, ISO §), compliance obligations, internal control; the capability map, current and target state with the gap, systems and data flows, the operating model; expert-scored or cited, never written by a model (W§)":"Rámce správy a řízení společnosti a podnikové architektury: vlastnická a skupinová struktura (po register-personal-data RPD§), RACI, řízení rizik (COSO ERM, ISO §), povinnosti souladu (compliance), vnitřní kontrola; mapa schopností, současný a cílový stav s rozdílem, systémy a datové toky, provozní model; hodnocené experty nebo citované, nikdy nenapsané modelem (W§)","The journey: a fictional study picks its frameworks in Zadání and gets a report outline with SWOT, PESTEL, Porter, TAM/SAM/SOM and cost-to-serve chapters, every point linked to its source; recorded doubles, zero paid calls (W§)":"Cesta uživatele: smyšlená studie si v Zadání vybere rámce a dostane osnovu reportu s kapitolami SWOT, PESTEL, Porter, TAM/SAM/SOM a cost-to-serve, každý bod propojený se zdrojem; nahrané testovací náhrady, nula placených volání (W§)","After the MVP: the portfolio frameworks (Ansoff, BCG, GE-McKinsey, VRIO, value chain, McKinsey §S) enabled in the picker":"Po MVP: portfoliové rámce (Ansoff, BCG, GE-McKinsey, VRIO, hodnotový řetězec, McKinsey §S) zapnuté ve výběru","The gate's three additions before a structured or archive route goes live: per-source rate limits (ARES § a minute), a robots.txt and text-and-data-mining reservation check before any fetch for mining, a retention limit on mined copies; each refusal named":"Tři doplňky brány, než začne fungovat strukturovaná nebo archivní trasa: limity četnosti pro každý zdroj (ARES § za minutu), kontrola robots.txt a výhrady vůči vytěžování textů a dat před každým stažením pro vytěžování, limit doby uchování vytěžených kopií; každé odmítnutí s uvedením důvodu","The typed input as a contract: value, unit, period, range, source, licence and as-of date, with the labelled Czech set (§+ sentences from annual reports, ČSÚ releases and price lists, two annotators) pinned as a fixture":"Typovaný vstup jako smlouva: hodnota, jednotka, období, rozsah, zdroj, licence a datum platnosti, s označkovanou českou sadou (§+ vět z výročních zpráv, publikací ČSÚ a ceníků, dva anotátoři) připnutou jako testovací data","The rule-based extractor in code: the model proposes the concept and the period only; value and unit F§ >= § on the labelled set before it is used":"Extraktor založený na pravidlech v kódu: model navrhuje jen pojem a období; hodnota a jednotka musí na označkované sadě dosáhnout F§ ≥ §, než se extraktor použije","The extraction step between verify and synthesize: typed inputs extracted from accepted findings' quotes and from structured routes (public-data-routes), each accepted by a person before it reaches a model input (public_source) or a findings table":"Krok extrakce mezi ověřením a syntézou: typované vstupy vytažené z citací přijatých nálezů a ze strukturovaných tras (public-data-routes); každý přijme člověk, než se dostane do vstupu modelu (public_source) nebo do tabulky nálezů","Citation precision and recall in verify (a run shows accuracy and unsupported claims; recall is the method's tested level from the evaluation set, never a per-run number, ADR § W§): DeepTRACE's citation accuracy and thoroughness, the judge calibrated on § human-labelled statement-source pairs (kappa reported), and a link-health check; targets accuracy >= § %, unsupported < § %, thoroughness >= § %":"Přesnost (precision) a úplnost (recall) citací při ověření (běh ukazuje správnost a nepodložená tvrzení; úplnost je otestovaná úroveň metody z hodnoticí sady, nikdy číslo za jeden běh, ADR § W§): správnost a důkladnost citací podle DeepTRACE, hodnotitel kalibrovaný na § dvojicích výrok–zdroj označených lidmi (uvádí se kappa) a kontrola funkčnosti odkazů; cíle: správnost ≥ § %, nepodložená tvrzení < § %, důkladnost ≥ § %","Source credibility v§ (tiers named Úřední / Oborový / Ostatní, never A/B/C, ADR § W§): declared (source, claim type) tables, a Code-of-Practice checklist for statistics, a review date and a four-year stale flag; a score proposed by a model refused":"Důvěryhodnost zdrojů v§ (úrovně pojmenované Úřední / Oborový / Ostatní, nikdy A/B/C, ADR § W§): deklarované tabulky (zdroj, typ tvrzení), kontrolní seznam podle Code of Practice pro statistiky, datum revize a příznak zastarání po čtyřech letech; skóre navržené modelem se odmítne","Triangulation: each numeric claim decomposed into sub-questions, agreement or contradiction recorded per typed input, a person resolves a contradiction (macro-F§ measured on a labelled Czech set)":"Triangulace: každé číselné tvrzení se rozloží na dílčí otázky, shoda nebo rozpor se zapíše u každého typovaného vstupu, rozpor řeší člověk (macro-F§ měřené na označkované české sadě)","As-of-date research: Memento TimeGate and Wayback CDX beside the Common Crawl index, a new 'as of' purpose; every archive finding carries its capture's own datetime within a declared tolerance":"Rešerše k datu: Memento TimeGate a Wayback CDX vedle indexu Common Crawl, nový účel „k datu“; každý archivní nález nese vlastní datum a čas svého zachycení v deklarované toleranci","Scheduled monitoring: structured series polled by their own update annotations (Eurostat UPDATE_DATA), pages at an estimated change rate, an alert only when an extracted value changes":"Plánované sledování: strukturované řady dotazované podle jejich vlastních poznámek o aktualizaci (Eurostat UPDATE_DATA), stránky podle odhadované rychlosti změn, upozornění jen tehdy, když se změní vytažená hodnota","Precedents and case outcomes as a purpose: candidates only, each confirmed by a person; no outcome predicted":"Precedenty a výsledky případů jako účel: jen kandidáti, každého potvrdí člověk; žádný výsledek se nepředpovídá","Show the stored results per view, judge the person's own decision rule on them, and say what would change the decision and what is worth verifying, each number with its grade and method.":"Ukázat uložené výsledky pro každý pohled, posoudit podle nich vlastní rozhodovací pravidlo dotyčného a říct, co by rozhodnutí změnilo a co stojí za ověření; každé číslo se stupněm jistoty a metodou.","Frame":"Vymezení","Open the views the selection switched on":"Otevřít pohledy, které zapnul výběr","The tabs Rozhodnutí, Finance, Účetnictví, Provoz, Logistika and Trh appear as Zadání's framework selection switched them on; a framework whose data contract is missing says which file it waits for.":"Záložky Rozhodnutí, Finance, Účetnictví, Provoz, Logistika a Trh se objeví podle toho, které analytické rámce zapnul výběr v Zadání. Rámec bez datové smlouvy řekne, na jaký soubor čeká.","tabs":"záložky","framework selection":"výběr analytických rámců","missing file":"chybějící soubor","Each computed framework switches on its view (AF§)":"Každý spočtený analytický rámec zapne svůj pohled (AF§)","The result views for this run":"Pohledy na výsledky tohoto běhu","\"analýza není vybraná\" for an unselected framework, with a link to Zadání · Analýzy do zprávy":"„analýza není vybraná“ u nevybraného analytického rámce, s odkazem na „Zadání · Analýzy do zprávy“","Grades":"Stupně jistoty","Mark every number's grade by method":"Označit stupeň jistoty každého čísla podle metody","A deterministic formula prints výpočet even over an estimated input; Monte Carlo and statistics print odhad; an estimate whose method is not registered is marked odhad (interní) on screen and, in a client report, \"metoda čeká na schválení metodikem\" with an approval warning.":"Deterministický vzorec ukáže výpočet i nad odhadnutým vstupem; Monte Carlo a statistika ukážou odhad. Odhad z metody, která není zapsaná v registru, je na obrazovce označen jako odhad (interní) a v klientském reportu „metoda čeká na schválení metodikem“ s upozorněním ke schválení.","method version":"verze metody","Grade follows the method (W§); register entry decides client label (CP§, W§)":"Stupeň jistoty určuje metoda (W§); popisek pro klienta určuje záznam v registru metod (CP§, W§)","Each value carries its grade chip":"Každá hodnota nese štítek se stupněm jistoty","Never refused for an unregistered method (W§); the warning is recorded on the approval's ledger row":"Nezapsaná metoda nikdy není důvodem k odmítnutí (W§); upozornění se zapíše do řádku schválení v knize schválení","Headline":"Hlavní čísla","Lead with the median and its interval":"Začít mediánem a jeho intervalem","Each option's headline is the median with its § % interval from the draws; the base-case value appears only as \"v základu\" in a smaller line.":"Hlavní číslo každé varianty je medián s § % intervalem z losování. Hodnota základního případu se objeví jen jako „v základu“ na menším řádku.","W§: median + § % interval leads":"W§: na prvním místě medián + § % interval","Headline figures on every tab":"Hlavní čísla na každé záložce","Judge the stated decision rule":"Posoudit zapsané rozhodovací pravidlo","The rule written in Zadání before the data (here: highest median if better than B with P ≥ § and a loss over § mil. Kč in at most § % of futures, the city delivery promise not worsened) is judged per option.":"Pravidlo zapsané v Zadání ještě před daty se posoudí pro každou variantu. Zde: nejvyšší medián, pokud je lepší než B s P ≥ § a ztráta nad § mil. Kč nastane nejvýše v § % budoucností, a slib doručení ve městech se nezhorší.","Judged as written; default confidence § / § only when the rule names none, said on the page; dominance printed beside":"Posuzuje se tak, jak je zapsané; výchozí jistota § / § jen tehdy, když ji pravidlo neuvádí, a stránka to řekne; vedle se uvede dominance","Verdict: doporučeno, nerozhodnuto (naming the top inputs), splněno/nesplněno per option":"Verdikt: doporučeno, nerozhodnuto (s uvedením hlavních vstupů), splněno/nesplněno pro každou variantu","No rule: no recommendation, \"rozhodovací pravidlo chybí\"; a rule changed after results is marked":"Bez pravidla není doporučení, „rozhodovací pravidlo chybí“; pravidlo změněné po výsledcích se označí","Draw the difference's distribution":"Vykreslit rozdělení rozdílu","A histogram of the recommended option minus B across § § futures with the § % and § % marks and the share right of zero (§ %).":"Histogram rozdílu doporučené varianty a B přes § § budoucností, se značkami § % a § % a podílem vpravo od nuly (§ %).","share > §":"podíl > §","Charts drawn from stored refs only":"Grafy se kreslí jen z uložených odkazů","The distribution chart":"Graf rozdělení","Show what turns the result":"Ukázat, co výsledek obrací","A tornado: each input at its low (blue) and high (orange) bound, the rest at base, ordered by swing; Sobol or partial-rank-correlation bars beside it, with the flip inputs and their flip values.":"Tornádový graf: každý vstup a","Used only if it beats the baseline on held-out error (MAE in the plan; MASE pending decision § (§))":"Použije se, jen když na odložených datech poráží základní prognózu (v plánu MAE; MASE čeká na rozhodnutí § (§))","Forecast view":"Pohled prognózy","The baseline is used and said":"Použije se základní prognóza a stránka to řekne","Show the value of information":"Ukázat hodnotu informace","EVPPI per input in Kč, before and after the latest data, with how each could be verified; the total value of perfect information (§ → § mil. Kč). This is the only place a crown value of information appears.":"EVPPI pro každý vstup v Kč, před nejnovějšími daty a po nich, a jak lze každý vstup ověřit; celková hodnota dokonalé informace (§ → § mil. Kč). Jen zde se hodnota informace uvádí v korunách.","Material at ≥ § % of the absolute expected difference; an offer creates nothing until a person starts it":"Podstatné od § % absolutního očekávaného rozdílu; nabídka nic nevytvoří, dokud ji člověk nespustí","Value-of-information table and verification offers":"Tabulka hodnoty informace a nabídky ověření","Show the verdict at other discount rates":"Ukázat verdikt při jiných diskontních sazbách","The verdict recomputed at the alternative rates beside the study's fixed rate (the canvas names § % and § % around § %).":"Verdikt přepočtený při alternativních sazbách vedle pevné sazby studie (plátno uvádí § % a § % kolem § %).","rate":"sazba","verdict per rate":"verdikt pro každou sazbu","One rate decides; the others are shown, never used to pick":"Rozhoduje jedna sazba; ostatní se ukazují, nikdy se podle nich nevybírá","Rate sensitivity of the verdict":"Citlivost verdiktu na sazbu","Build the business case per option":"Sestavit ekonomické vyhodnocení pro každou variantu","Per option against B: investment, NPV at § % as median and interval (odhad) with \"v základu\", NPV after tax at § % with legal depreciation, IRR and discounted payback at base (výpočet).":"Pro každou variantu proti B: investice, NPV při § % jako medián a interval (odhad) s „v základu“, NPV po dani § % se zákonnými odpisy, IRR a diskontovaná doba návratnosti v základu (výpočet).","IRR by a stated root rule; the rule reads the NPV Zadání named, the other beside it":"IRR podle uvedeného pravidla pro výběr kořene; pravidlo čte NPV, které určilo Zadání, druhé je vedle","Business-case table":"Tabulka ekonomického vyhodnocení","multiple_irr (each root listed), no_irr, none_within_horizon":"multiple_irr (každý kořen vypsán), no_irr, none_within_horizon","Show cash flow by year and price break-evens":"Ukázat peněžní tok po letech a cenové body zvratu","The recommended option's yearly benefit and outlay against B with the discounted cumulative line and the payback marked; each price's break-even alone, others at base, for supplier negotiation.":"Roční přínos a výdaje doporučené varianty proti B, s diskontovanou kumulativní čárou a vyznačenou dobou návratnosti. Bod zvratu každé ceny zvlášť, ostatní v základu, pro vyjednávání s dodavateli.","year":"rok","Each price varied alone (one-way)":"Každá cena se mění sama (jednorozměrně)","Cash-flow chart and price break-even table":"Graf peněžního toku a tabulka cenových bodů zvratu","Estimate price elasticity from client data":"Odhadnout cenovou elasticitu z dat klienta","A log-log fit of orders on delivery price from the client's own price change (−§, § % interval −§ až −§), and the discount that would win back lost orders.":"Log-log regrese objednávek na ceně doručení z vlastní změny ceny klienta (−§, § % interval −§ až −§) a sleva, která by ztracené objednávky získala zpět.","elasticity":"elasticita","source event":"zdrojová událost","discount":"sleva","net effect":"čistý dopad","A registered Metodika method; internal until registered":"Metoda Metodiky zapsaná v registru; do zápisu interní","An ESTIMATED elasticity marked odhad (interní)":"Elasticita ESTIMATED označená jako odhad (interní)","Show baseline statements and plan against actual":"Ukázat výchozí výkazy a plán proti skutečnosti","The § P&L and balance sheet from the client's ledger export through the chart-of-accounts mapping, reconciled with the §PL invoices; plan against actual per line as absolute and share.":"Výkaz zisku a ztráty a rozvaha za § z exportu účetní knihy klienta přes přiřazení k účtovému rozvrhu, odsouhlasené s fakturami §PL. Plán proti skutečnosti po řádcích, v absolutní hodnotě i jako podíl.","Every account mapped; price/volume/mix only where the contract declares quantities":"Každý účet je přiřazený; rozklad na cenu, objem a mix jen tam, kde smlouva uvádí množství","Statements and variance (z dat klienta)":"Výkazy a odchylky (z dat klienta)","Unmapped account refused by name; does_not_balance named with the difference":"Nepřiřazený účet se odmítne s uvedením důvodu; does_not_balance se uvede i s rozdílem","Project health ratios per option":"Promítnout finanční ukazatele pro každou variantu","EBITDA, margin, net debt / EBITDA, ROCE and current ratio in § for each option at base, with the financing assumption stated (hall from a loan, switch from cash).":"EBITDA, marže, čistý dluh / EBITDA, ROCE a běžná likvidita v roce § pro každou variantu v základu, s uvedeným předpokladem financování (hala z úvěru, přechod z hotovosti).","per option · §":"pro každou variantu · §","Closed list of ratios, each with its formula":"Uzavřený seznam ukazatelů, každý se svým vzorcem","A zero denominator is undefined, never infinity or §":"Nulový jmenovatel znamená nedefinovanou hodnotu, nikdy nekonečno ani §","Plan capacity, routing and stock":"Naplánovat kapacitu, trasy a zásoby","Monthly order forecast against supplier capacity; a monthly linear program (HiGHS) minimising logistics cost and lost contribution under Zadání's constraints, with the routing plan and savings; safety stock per warehouse layout.":"Měsíční prognóza objednávek proti kapacitě dodavatele. Měsíční lineární program (HiGHS), který minimalizuje náklady na logistiku a ztracený příspěvek při omezeních ze Zadání, s plánem tras a úsporami. Pojistná zásoba pro každé rozložení skladů.","binding constraints":"vázající omezení","Solver and version pinned; binding constraints and shadow prices in words; safety stock z × σ × √L (canvas also the square-root pooling rule)":"Řešič a jeho verze jsou pevně dané; vázající omezení a stínové ceny slovy; pojistná zásoba z × σ × √L (plátno uvádí i pravidlo odmocniny pro sdružení zásob)","Capacity risk, optimal plan and stock":"Riziko kapacity, optimální plán a zásoby","infeasible, unbounded named with the solver's reason":"infeasible, unbounded se uvedou s důvodem od řešiče","Compute the selected logistics frameworks":"Spočítat vybrané logistické analytické rámce","Cost-to-serve by zone, make-or-buy and §PL total cost, warehouse sizing against growth, service level and OTIF, each from client data under its contract and public inputs.":"Náklady na obsluhu podle zón, vlastní provoz, nebo nákup služby a celkové náklady §PL, dimenzování skladu vůči růstu, úroveň služeb a OTIF. Vše z dat klienta podle jejich smlouvy a z veřejných vstupů.","Computed by code; only selected frameworks run":"Počítá kód; spustí se jen vybrané analytické rámce","Logistics views":"Logistické pohledy","OTIF \"čeká na data\": missing promised and actual delivery dates named, \"Vyžádat data o doručení\"":"OTIF „čeká na data“: uvede se, že chybí slíbená a skutečná data doručení, a „Vyžádat data o doručení“","Size the market and judge the growth plan":"Určit velikost trhu a posoudit plán růstu","TAM, SAM and SOM top-down from cited public findings and the client's revenue; the growth plan's implied share per range end, each rated by the researcher as a labelled judgement (realistické, ověřit).":"TAM, SAM a SOM shora dolů z citovaných veřejných zjištění a z tržeb klienta. Podíl na trhu, který plán růstu předpokládá, pro každý konec rozsahu; každý ohodnotí výzkumník jako označený úsudek (realistické, ověřit).","Each chain step its own label, the chain printing the weakest; findings enter only as public_source; a verdict word is the researcher's judgement":"Každý krok řetězu má vlastní stupeň jistoty a řetěz ukáže ten nejslabší; zjištění vstupují jen jako public_source; slovní verdikt je úsudek výzkumníka","Market view; then \"Přidat do osnovy zprávy\" hands chosen results on":"Pohled trhu; pak „Přidat do osnovy zprávy“ předá vybrané výsledky dál","A finding whose source no person added cannot be an input":"Zjištění, jehož zdroj žádný člověk nepřidal, nemůže být vstupem","Result ref":"Odkaz na výsledek","quantity":"veličina","method id / version":"id / verze metody","median, p§, p§":"medián, p§, p§","registered":"zapsaná v registru","Verdict":"Verdikt","DecisionRule (option, quantity, comparison, threshold, confidence, risk bound, constraint)":"DecisionRule (varianta, veličina, srovnání, práh, jistota, limit rizika, omezení)","stated at":"kdy zapsáno","changed after results: bool":"změněno po výsledcích: bool","per option: splněno / nesplněno":"pro každou variantu: splněno / nesplněno","default confidence used: bool":"použita výchozí jistota: bool","no rule":"bez pravidla","judged":"posouzeno","marked changed after results":"označeno jako změněné po výsledcích","Value-of-information row":"Řádek hodnoty informace","EVPPI before":"EVPPI před","EVPPI after":"EVPPI po","material: bool":"podstatné: bool","offer":"nabídka","offered":"nabídnuto","started":"zahájeno","Result view (tab)":"Pohled na výsledky (záložka)","sections":"oddíly","data waited for":"data, na která se čeká","Chosen results as report-outline points":"Vybrané výsledky jako body osnovy reportu","result refs with grade and method":"odkazy na výsledky se stupněm jistoty a metodou","charts as specs over stored refs":"grafy jako specifikace nad uloženými odkazy","verdict with its rule":"verdikt s jeho pravidlem","researcher judgements with author":"úsudky výzkumníka s autorem","Properties for the map":"Vlastnosti pro mapu","options as objects":"varianty jako objekty","chosen results (NPV, interval width, P(cheapest)) as properties":"vybrané výsledky (NPV, šířka intervalu, P(nejlevnější)) jako vlastnosti","scale extremes and direction":"krajní body škály a směr","Results for the report":"Výsledky pro report","CALCULATED numbers":"čísla CALCULATED","ESTIMATED numbers labelled with method status":"čísla ESTIMATED označená stavem metody","method appendix (id, version, register status)":"příloha o metodách (id, verze, stav v registru)","Requests for missing data":"Žádosti o chybějící data","file or columns a view waits for (e.g. promised and actual delivery dates)":"soubor nebo sloupce, na které pohled čeká (např. slíbená a skutečná data doručení)","The canvas's rule is multi-option with a risk bound (P(loss > § mil.) ≤ § %) and a hard constraint (the city promise); CR§ defines a pairwise rule (one option, one threshold, a confidence). How is a rule over seven options with a risk bound and constraints represented and judged, and who checks a constraint like \"Slib ve městech\"?":"Pravidlo na plátně pracuje s více variantami, s limitem rizika (P(ztráta > § mil.) ≤ § %) a s pevným omezením (slib ve městech). CR§ definuje párové pravidlo (jedna varianta, jeden práh, jedna jistota). Jak se zapíše a posoudí pravidlo nad sedmi variantami s limitem rizika a omezeními? A kdo kontroluje omezení jako „Slib ve městech“?","Client surface for unregistered estimates: W§ says they reach the client report labelled with an approval warning, but CP§ still refuses them on the client surface and M§'s banner says the client report carries only výpočet and ranges. Which is built?":"Odhady z nezapsaných metod u klienta: podle W§ se dostanou do klientského reportu s upozorněním ke schválení. CP§ je ale na straně klienta stále odmítá a banner M§ říká, že klientský report obsahuje jen výpočet a rozsahy. Co se postaví?","Where do the Finance, Účetnictví and Provoz figures per option come from? quantitative-families computes statements from a ledger and ratios from statements, but the canvas projects § statements and ratios per option and a monthly LP: what links the cash-flow model to those projections?":"Odkud se berou čísla pro Finance, Účetnictví a Provoz u každé varianty? quantitative-families počítá výkazy z účetní knihy a ukazatele z výkazů. Canvas ale promítá výkazy a ukazatele za rok § pro každou variantu a měsíční LP. Co propojuje model peněžních toků s těmito projekcemi?","The verification offer: CR§ offers \"Ověřit výzkumem\" (a survey study), which the freeze removed; the canvas's \"Jak ověřit\" lists data requests and contract terms. What does a material EVPPI now offer, and what does it create?":"Nabídka ověření: CR§ nabízí „Ověřit výzkumem“ (dotazníkovou studii), kterou zmrazení odstranilo; „Jak ověřit“ na plátně vypisuje žádosti o data a smluvní podmínky. Co teď nabídne podstatné EVPPI a co vytvoří?","Where is the verdict at other discount rates drawn, and which rates (W§)? M§ has no section for it.":"Kde se kreslí verdikt při jiných diskontních sazbách a při kterých sazbách (W§)? M§ pro to nemá oddíl.","What does \"Přidat do osnovy zprávy\" hand over: a single number, a whole section, a chart spec? And what happens to an added point when the run is rerun or a result goes stale?":"Co předává „Přidat do osnovy zprávy“: jedno číslo, celý oddíl, nebo specifikaci grafu? A co se stane s přidaným bodem, když se běh zopakuje nebo výsledek zastará?","The exact range table and dominance (CR§, CR§) are planned for Výsledky but not drawn on M§; where do they sit beside the Monte Carlo table?":"Tabulka přesných rozsahů a dominance (CR§, CR§) jsou plánované pro Výsledky, ale na M§ nejsou nakreslené. Kde budou vedle tabulky Monte Carlo?","The report outline (Osnova zprávy) as data, and the ADR it needs: the report's structure (chapters and sections in the report's own order) where each section holds points, not prose; a point is a claim or a number with its kind (finding, data point, method point, conclusion, recommendation), its visual (table, graph, process diagram, map or none) and its provenance link; the stage after Sociomapa and before Zpráva on the study's working project (revision-checked saves); a stop as a named checkpoint the researcher closes; the ADR § decision-§ record for this new kind of report material (W§, a contract before any code)":"Osnova reportu jako data a ADR, které potřebuje. Struktura reportu (kapitoly a oddíly v pořadí reportu), kde každý oddíl obsahuje body, ne souvislý text. Bod je tvrzení nebo číslo s druhem (zjištění, datový bod, metodický bod, závěr, doporučení), vizuálem (tabulka, graf, procesní diagram, mapa nebo žádný) a odkazem na původ. Krok po Sociomapě a před Reportem v pracovním projektu studie (ukládání s kontrolou revize). Zastávka jako pojmenovaný kontrolní bod, který uzavírá výzkumník. Záznam podle ADR § rozhodnutí § pro tento nový druh podkladů reportu (W§, smlouva před jakýmkoli kódem)","The one study's stage track (ADR § decision §, A§ \"One merged study\"): the canvas's nine steps in five groups (Zadání; Data, Rešerše, Předpoklady; Model; Výsledky, Sociomapa; Osnova zprávy, Zpráva), the model steps shown only when Zadání says a model is needed; the survey stages (Dotazník to Analýza) left out of new studies and read-only on a study that holds survey content or runs, the routes refusing a write by name (survey_lane_frozen), nothing deleted before the lane is archived (mvp-master-plan#MP§)":"Řada kroků jedné studie (ADR § rozhodnutí §, A§ „One merged study“): devět kroků z plátna v pěti skupinách (Zadání; Data, Rešerše, Předpoklady; Model; Výsledky, Sociomapa; Osnova reportu, Report). Kroky modelu se ukážou, jen když Zadání řekne, že je model potřeba. Kroky průzkumu (Dotazník až Analýza) v nových studiích nejsou; ve studii s obsahem nebo běhy průzkumu jsou jen ke čtení a routy zápis odmítnou s uvedením důvodu (survey_lane_frozen). Nic se nesmaže, dokud se větev průzkumu nearchivuje (mvp-master-plan#MP§)","The provenance link: every number and claim in the report outline is a hyperlink to what stands behind it, resolved by code from stored ids: a Deep Research finding's quote in its captured snapshot, a typed value and its route response, a client dataset's column under its accepted contract version, a model run's result and its method entry in Metodika, a map and its method; a point whose link does not resolve shows as unverified and cannot reach Zpráva":"Odkaz na původ: každé číslo a tvrzení v osnově reportu je hypertextový odkaz na to, co za ním stojí. Kód ho dohledá z uložených id: citace zjištění Deep Research v zachyceném snímku, typovaná hodnota a odpověď její routy, sloupec datové sady klienta podle přijaté verze smlouvy, výsledek běhu modelu a záznam jeho metody v Metodice, mapa a její metoda. Bod, jehož odkaz nelze dohledat, se ukáže jako neověřený a do Reportu se nedostane","Findings in: every accepted Design Research and Interpretation Research finding and every typed value (deep-research-v§ DRV§) offered as a point; the researcher's check per finding (kept, set aside, needs checking) recorded in the approval ledger, never changing the sealed bundle; a point whose source is set aside goes stale, named":"Zjištění na vstupu: každé přijaté zjištění Design Research a Interpretation Research a každá typovaná hodnota (deep-research-v§ DRV§) se nabídne jako bod. Kontrola výzkumníka u každého zjištění (ponecháno, odloženo, potřebuje ověřit) se zapíše do knihy schválení a nikdy nemění zapečetěný balík. Bod, jehož zdroj byl odložen, zastará a uvede se proč","Tables: built from accepted points, every cell a ref with its link, units and periods carried; never a number written by a model or typed without a source":"Tabulky: sestavené z přijatých bodů, každá buňka je odkaz se svým odkazem na původ, jednotky a období se přenášejí. Nikdy číslo napsané modelem nebo zadané bez zdroje","Graphs from those tables (bar, line, stacked, scatter), drawn with the viz tokens, every mark linked to its point; the same drawing on screen and in the DOCX (report_docx charts)":"Grafy z těchto tabulek (sloupcový, spojnicový, skládaný, bodový), kreslené vizualizačními tokeny, každá značka propojená se svým bodem; stejná kresba na obrazovce i v DOCX (report_docx charts)","Process diagrams and other visuals: a registry of visual kinds; a process diagram as typed data (steps, actors, decisions, flows) edited in place (input standard I§-I§), each element that states a fact linked to its point; rendered as SVG in the stage and the report":"Procesní diagramy a další vizuály: registr druhů vizuálů. Procesní diagram jako typovaná data (kroky, aktéři, rozhodnutí, toky) upravovaná na místě (vstupní standard I§-I§), každý prvek, který uvádí fakt, propojený se svým bodem. Vykresluje se jako SVG v kroku i v reportu","The Lead in the stage: it reads the report outline, the findings and the data through its read tools, proposes the outline, a point, a visual or a move per change, and a person accepts (ADR §); a paid lookup only through the card (lead-orchestration)":"AI vedoucí výzkumu v kroku: čte osnovu reportu, zjištění a data svými čtecími nástroji a navrhuje osnovu, bod, vizuál nebo přesun, vždy po jedné změně; přijímá člověk (ADR §). Placený dotaz jen přes kartu (lead-orchestration)","Stops: the researcher opens, names and closes each; the closed stops are what Zpráva receives; reopening one marks the report draft stale and names the points that moved; an unverified point holds the hand-off until its source is found or it is removed (ADR § W§)":"Zastávky: výzkumník každou otevře, pojmenuje a uzavře. Report dostane uzavřené zastávky. Znovuotevření zastávky označí koncept reportu jako zastaralý a uvede body, které se změnily. Neověřený bod zdrží předávku, dokud se nenajde jeho zdroj nebo dokud se neodstraní (ADR § W§)","Zpráva written from the report outline: the report's prose around the closed points in the same outline, every printed number and claim keeping its provenance link (with artifact-report RPT§a's tagged content controls); the report states no point the report outline does not hold, checked before approval; an external finding labelled as external context; Czech in the MVP, English after (ADR § W§)":"Report psaný z osnovy reportu: text reportu kolem uzavřených bodů ve stejné osnově, každé vytištěné číslo a tvrzení si drží odkaz na původ (s označenými ovládacími prvky obsahu z artifact-report RPT§a). Report neuvádí žádný bod, který osnova reportu nemá; kontroluje se to před schválením. Externí zjištění se označí jako vnější kontext. V MVP česky, později anglicky (ADR § W§)","The Sociomapa stage, before the report outline: the scenario map (cost-model-study CS§-CS§) when the study has a model, an expert map (situation-reports EX§-EX§), or a unit or period map once sociomapa-systemu SYS§ passes; its option clusters and hedges (ADR § A§) offered to the report outline as points with their method link":"Krok Sociomapa před osnovou reportu: mapa scénářů (cost-model-study CS§-CS§), když má studie model, expertní mapa (situation-reports EX§-EX§), nebo mapa jednotek či období, jakmile projde sociomapa-systemu SYS§. Její shluky variant a pojistky (ADR § A§) se nabídnou osnově reportu jako body s odkazem na metodu","The journey: a fictional research study from the brief to an approved report through a report outline holding one table, one graph, one process diagram and an expert map, every link resolving, over recorded Deep Research; zero paid calls":"Průchod: smyšlená výzkumná studie od zadání po schválený report přes osnovu reportu s jednou tabulkou, jedním grafem, jedním procesním diagramem a expertní mapou, všechny odkazy se dohledají, nad nahraným Deep Research; nula placených volání","The shared review (ADR § W§): a closed stop shared with the client's decision-makers as a read-only page (points, visuals, sources), their comments and agreement recorded on the approval ledger (a subject admitted by migration before its writer); optional, the report then written from it":"Sdílená kontrola (ADR § W§): uzavřená zastávka sdílená s rozhodujícími osobami klienta jako stránka jen ke čtení (body, vizuály, zdroje). Jejich komentáře a souhlas se zapíší do knihy schválení (subjekt přidaný migrací dříve než kód, který do něj zapisuje). Je volitelná; report se pak píše z ní","The methodology owner's ten questions (the pivot research's § Questions for the methodology lead) sent to A. Bahbouh as one message with each recommendation, with the SOMECS name and the published method's licence for him to check (ADR § Q§); each answer recorded here as it comes; no replaced statistic built before its answer":"Deset otázek vlastníka metodiky (výzkum pivotu, § Questions for the methodology lead) poslaných A. Bahbouhovi najednou, každá s doporučením, spolu s názvem SOMECS a licencí publikované metody, aby je zkontroloval (ADR § Q§). Každá odpověď se sem zapíše, jakmile přijde. Žádná nahrazovaná statistika se nestaví před svou odpovědí","The synthetic validation suite, generators only: null worlds (independent random walks, AR(§) at §, § and §, seasonal series with no cross-relation), known factors (§ KPIs from § factors), a sparse VAR(§), contamination (§ % outliers, one level shift), compositional shares, § units × § drivers, § scenarios × § options from a cost model with a known Iman-Conover correlation; § seeded replicates at T or n §, §, §, §; fixtures pinned by SHA-§ like F§-F§":"Syntetická sada validačních zkoušek, jen generátory: nulové světy (nezávislé náhodné procházky, AR(§) s §, § a §, sezónní řady bez vzájemného vztahu), známé faktory (§ KPI ze § faktorů), řídký VAR(§), kontaminace (§ % odlehlých hodnot, jeden skok úrovně), kompoziční podíly, § jednotek × § faktorů, § scénářů × § variant z nákladového modelu se známou korelací Iman-Conover; § replikací se seedem při T nebo n §, §, §, §; testovací data připnutá otiskem SHA-§ jako F§-F§","The suite run over today's -§ statistics, as the baseline the replacements are judged against; the spike's three sets (§ × §, § × §, § × §) re-run with planted ground truth and its script committed":"Běh sady nad dnešními statistikami -§ jako základ, proti kterému se posuzují náhrady; tři sady z průzkumného prototypu (spike) (§ × §, § × §, § × §) znovu spuštěné s vloženou známou odpovědí a s commitnutým skriptem","Declared preprocessing per variable before results are seen: unit, transformation (log, log-ratio for shares), detrend or difference, deseasonalise only with two cycles, robust standardisation; reported beside every relation (answers §, §)":"Předzpracování každé proměnné deklarované dřív, než se uvidí výsledky: jednotka, transformace (log, log-podíl pro podíly), odečtení trendu nebo diference, sezónní očištění jen při dvou cyklech, robustní standardizace; uvádí se u každého vztahu (odpovědi §, §)","The relation statistic: Pearson on the transformed series, or a skipped correlation where outliers are flagged, fixed before results are seen (answer §)":"Statistika vztahu: Pearson na transformovaných řadách, nebo skipped korelace tam, kde jsou označené odlehlé hodnoty; pevně dáno dřív, než se uvidí výsledky (odpověď §)","The baseline: per-variable surrogates (IAAFT by default) after detrending, checked to reproduce each series' autocorrelation; for scenarios, the imposed input correlation (answer §)":"Základ: náhradní řady pro každou proměnnou (výchozí IAAFT) po odečtení trendu, s kontrolou, že zachovávají autokorelaci každé řady; u scénářů zadaná korelace vstupů (odpověď §)","Pair floors replaced by an autocorrelation-adjusted effective-sample-size floor, the formula and the floor from the synthetic power curves (answer §)":"Minimální počty párů nahradí minimum efektivní velikosti vzorku upravené o autokorelaci; vzorec a minimum vycházejí ze syntetických křivek síly testu (odpověď §)","Multiple testing: Benjamini-Yekutieli by default, q and the method reported; a resampling-calibrated FDR only on the methodology owner's approval after the suite (answer §)":"Vícenásobné testování: výchozí Benjamini-Yekutieli, uvádí se q a metoda; FDR kalibrované převzorkováním jen se schválením vlastníka metodiky po projití sady (odpověď §)","Credibility: a block bootstrap of rows (block length declared) with Procrustes-aligned displacement per object in place of split-half; stability only, no intervals, below the minimum length (answer §); for the scenario map no block bootstrap: stability across seeds and assumptions, with and without each future's mean (ADR § decision §)":"Věrohodnost: blokový bootstrap řádků (délka bloku deklarovaná) s posunem každého objektu po Prokrustově zarovnání místo split-half. Pod minimální délkou jen stabilita, bez intervalů (odpověď §). U mapy scénářů žádný blokový bootstrap: stabilita napříč seedy a předpoklady, s průměrem každé budoucnosti i bez něj (ADR § rozhodnutí §)","Fit beside the layout: stress-§ and stress per point against a random-data benchmark and a permutation test; the layout, terrain and determinism unchanged":"Shoda vedle rozložení: stress-§ a stress pro každý bod proti srovnání s náhodnými daty a permutační test; rozložení, terén a determinismus se nemění","The scenario mode: rows a model's Monte Carlo scenarios (>= §, cost-model-study CR§), the imposed correlation as the baseline, grade MODELLED, the claim 'in this model, A and B move together'; consumed by cost-model-study CS§-CS§":"Scénářový režim: řádky jsou scénáře Monte Carlo z modelu (>= §, cost-model-study CR§), zadaná korelace jako základ, stupeň MODELLED, tvrzení „v tomto modelu se A a B pohybují spolu“; využívá ho cost-model-study CS§-CS§","The expert mode: options or competitors scored by named people on criteria, grade MODELLED with the inputs stated; consumed by situation-reports EX§-EX§":"Expertní režim: varianty nebo konkurenty hodnotí lidé uvedení jménem podle kritérií, stupeň MODELLED s uvedenými vstupy; využívá ho situation-reports EX§-EX§","The unit and period modes, only after the suite passes at the methodology owner's thresholds (answer §): units placed with density above a stated n, periods as a trajectory, failing edges not drawn, regimes only from a declared break; ESTIMATED, INTERNAL_ONLY until registered":"Režimy jednotek a období, až když sada projde při prazích vlastníka metodiky (odpověď §): jednotky umístěné s hustotou nad stanoveným n, období jako trajektorie, hrany, které neprojdou, se nekreslí, režimy jen z deklarovaného zlomu; ESTIMATED, INTERNAL_ONLY do zápisu v registru","Each mode a Metodika register entry of its own (ADR §), INTERNAL_ONLY until approved; the never-claim list as copy on screen and in the report; the name Sociomapa systémů, never SOMECS, and A. Bahbouh's check of the name and the published method's licence recorded before any client reads it (ADR § Q§, A§)":"Každý režim má vlastní záznam v registru metod Metodiky (ADR §), INTERNAL_ONLY do schválení. Seznam toho, co mapa nikdy netvrdí, jako text na obrazovce i v reportu. Název Sociomapa systémů, nikdy SOMECS; kontrola názvu a licence publikované metody A. Bahbouhem se zapíše dřív, než to čte jakýkoli klient (ADR § Q§, A§)","ADR § accepted; the legal counsel who approves the terms library (Q§) named":"ADR § přijato; je jmenován právník, který schvaluje knihovnu smluvních podmínek (Q§)","Chapter kinds and the outline: a registry of versioned chapter kinds, ReportOutline, the four recipes as preset outlines composed byte for byte as today; generalises cost-model-study CP§'s frame":"Druhy kapitol a osnova: registr verzovaných druhů kapitol, ReportOutline, čtyři recepty jako přednastavené osnovy sestavené bajt po bajtu jako dnes; zobecňuje rámec z cost-model-study CP§","Expert scoring: an expert panel (named experts, role, internal or the client's), a scoring form over objects × criteria with scale extremes and direction, the expert_rating provenance, aggregation by the registered weights and discrepancy threshold; a missing score stays missing":"Expertní hodnocení: panel expertů (jmenovitě uvedení experti, role, interní nebo od klienta), hodnoticí formulář nad objekty × kritérii s krajními body škály a směrem, původ expert_rating, agregace podle vah zapsaných v registru a prahu neshody; chybějící hodnocení zůstává chybějící","The somecs_expert model type on ADR §'s platform, reusing cost-model-study CS§-CS§ (fuzzy matrix, layout and fit, WIND, view) with criteria as properties":"Typ modelu somecs_expert na platformě z ADR §, který znovu použije cost-model-study CS§-CS§ (fuzzy matice, rozložení a shoda, WIND, pohled) s kritérii jako vlastnostmi","The outline proposed by the Lead and approved by a person (ledger subject report_outline), per change":"Osnovu navrhne AI vedoucí výzkumu a schválí člověk (subjekt v knize schválení report_outline), vždy po jedné změně","Chapters across studies of one client: artifacts pinned by id and SHA-§, another client's refused, every source in the manifest":"Kapitoly napříč studiemi jednoho klienta: artefakty připnuté podle id a SHA-§, artefakty jiného klienta se odmítnou, každý zdroj v manifestu","Fixed method texts as versioned data, signed by the methodology owner; a report pins the versions it printed":"Pevné texty metod jako verzovaná data podepsaná vlastníkem metodiky; report si připne verze, které vytiskl","Contract parties and terms: the client profile's registration fields (Class A), the organization's own, a terms text library approved as Q§ decides":"Smluvní strany a podmínky: registrační údaje z profilu klienta (třída A), vlastní údaje organizace, knihovna textů podmínek schválená podle rozhodnutí Q§","New chapter kinds: segment profiling and prioritisation, competitor profiles (Deep Research, cited), phased strategy, risks with mitigation, KPI framework; every number a ref, prose through the writer and the sentence check":"Nové druhy kapitol: profilování a prioritizace segmentů, profily konkurentů (Deep Research, s citacemi), strategie po fázích, rizika s opatřeními, soustava KPI. Každé číslo je odkaz, text jde přes writer a kontrolu vět","SOMECS's native output table (Incons, Cons, Asymm, Card, Card*, S(i), S(i)_Sd, d(i), Hm(i)) once each has a register entry with its formula; export E§ as the check":"Nativní výstupní tabulka SOMECS (Incons, Cons, Asymm, Card, Card*, S(i), S(i)_Sd, d(i), Hm(i)), až bude mít každá veličina záznam v registru metod se svým vzorcem; kontrolou je export E§","Bulk maps: one stored snapshot per height variable of a model, coded labels with their key, an appendix without comment":"Hromadné mapy: jeden uložený snímek pro každou proměnnou výšky modelu, kódované popisky s legendou, příloha bez komentáře","Cut-out maps (výřezové): zooms on regions or coherence groups chosen by the registered selection rule, each commented where cited":"Výřezové mapy: přiblížení oblastí nebo skupin koherence vybraných podle pravidla výběru zapsaného v registru; každá s komentářem tam, kde je citovaná","Imported fieldwork: the origin Q§ decides, a questionnaire's answers imported under a data contract and mapped to the study's design items, MQ-§'s survey rule, its own Sociomap, never merged with the AI panel":"Importovaný terénní sběr: původ určí Q§; odpovědi dotazníku importované podle datové smlouvy a přiřazené k položkám designu studie, pravidlo průzkumu z MQ-§, vlastní sociomapa, nikdy nesloučené s AI panelem","Bring in public evidence for the chosen frameworks and the model: findings that are quotes in captured sources, typed numbers extracted by code, public register and statistics values and cited legal provisions, each accepted by a person before it is used.":"Přinést veřejné doklady pro zvolené analytické rámce a pro model: zjištění, která jsou citacemi v zachycených zdrojích, čísla s určeným typem, která vytáhne kód, hodnoty z veřejných rejstříků a statistik a citovaná ustanovení právních předpisů. Každou položku přijme člověk dřív, než se použije.","Turn selected frameworks into research subjects":"Převést zvolené analytické rámce na předměty rešerše","Each framework selected in Zadání that needs research becomes subjects of the Design Research plan; a deselected framework takes its subjects out of the next run.":"Každý analytický rámec zvolený v kroku Zadání, který potřebuje rešerši, se stane předměty plánu Design Research. Když se výběr rámce zruší, jeho předměty z příštího běhu vypadnou.","subjects":"předměty","ceiling USD":"strop v USD","The ceiling is pinned at enqueue.":"Strop se zafixuje při zařazení do fronty.","Design Research plan subjects.":"Předměty plánu Design Research.","Ask Ada for a priced run":"Požádat Adu o běh s uvedenou cenou","'Požádat Adu o Deep Research…' opens Ada's priced card in the Lead pane; the researcher approves it there.":"'Požádat Adu o Deep Research…' otevře v panelu Ady kartu s cenou; výzkumník ji tam schválí.","ceiling":"strop","study budget":"rozpočet studie","No paid start from a stage; a priced route runs only once its organization approved every live setting (ADR §); a priced call is held against the study budget before it leaves.":"Žádný placený start přímo z kroku. Placená cesta běží, až když její organizace schválí všechna ostrá nastavení (ADR §). Placené volání se před odesláním zarezervuje v rozpočtu studie.","A Deep Research run with its ceiling pinned.":"Běh Deep Research se zafixovaným stropem.","Over budget or unapproved settings: the card is refused by name (live_settings_unapproved, outside_wallet).":"Překročený rozpočet nebo neschválená nastavení: karta je odmítnuta s uvedením důvodu (live_settings_unapproved, outside_wallet).","Admit every fetch through RetrievalGate":"Pustit každé stažení přes RetrievalGate","Every query and URL leaves through the gate, which reads the data source register (legal status, cost, rate limit, licence, retention, whether a field names a natural person) and adds per-source rate limits, a robots.txt / text-and-data-mining reservation check and a retention limit on mined copies.":"Každý dotaz a každá URL odchází přes bránu. Brána čte rejstřík zdrojů dat (právní stav, cena, limit četnosti, licence, doba uchování, zda pole uvádí člověka jménem). Přidává limity četnosti pro jednotlivé zdroje, kontrolu robots.txt a výhrady k vytěžování textů a dat a limit uchování vytěžených kopií.","source":"zdroj","legal status":"právní stav","rate limit":"limit četnosti","retention":"doba uchování","names a person":"uvádí člověka jménem","ARES at most § a minute; TDM opt-out honoured; NEN data behind its login never collected; VIES validated once, never stored; the register is read by the gate, never by a model.":"ARES nejvýš § dotazů za minutu; výhrada TDM se respektuje; data NEN za přihlášením se nikdy nesbírají; VIES se ověří jednou a nikdy se neukládá; rejstřík čte brána, nikdy model.","Fetch allowed or refused.":"Stažení povoleno, nebo odmítnuto.","Each refusal named.":"Každé odmítnutí s uvedením důvodu.","Structured routes":"Strukturované cesty","Propose a query key for a register or series":"Navrhnout klíč dotazu pro rejstřík nebo řadu","For SDMX (Eurostat, ECB), ČNB, ARES, the commercial register, TED, ISVZ and Sbírka listin the model proposes a query key; code fetches.":"Pro SDMX (Eurostat, ECB), ČNB, ARES, obchodní rejstřík, TED, ISVZ a Sbírku listin navrhne klíč dotazu model; stahuje kód.","route":"cesta","query key":"klíč dotazu","response hash":"hash odpovědi","Every admitted value byte-equal to the API's response; recorded doubles and golden responses pinned by hash.":"Každá přijatá hodnota se bajt po bajtu shoduje s odpovědí API; nahrané testovací náhrady a referenční odpovědi jsou zafixované hashem.","Route responses as typed input candidates.":"Odpovědi cest jako kandidáti na vstupy s určeným typem.","Findings":"Zjištění","Ground each finding in a captured quote":"Opřít každé zjištění o zachycenou citaci","Code picks subjects and tracks, sends every query and fetch, captures content-addressed snapshots and keeps a finding only when its quote is in a source the same track retrieved.":"Kód vybírá předměty a větve rešerše, posílá každý dotaz a stažení a pořizuje snímky zdrojů adresované podle obsahu. Zjištění ponechá jen tehdy, když je jeho citace ve zdroji, který stáhla tatáž větev.","finding":"zjištění","quote":"citace","snapshot hash":"hash snímku","A finding is a quote in a captured source, or nothing (frozen engine).":"Zjištění je citace v zachyceném zdroji, nebo nic (zmrazené jádro).","Findings in the sealed bundle.":"Zjištění v zapečetěném balíku.","Ungrounded quote: no finding.":"Citace bez opory ve zdroji: žádné zjištění.","Extraction":"Vytěžení","Extract typed inputs from quotes":"Vytáhnout z citací vstupy s určeným typem","Between verify and synthesize, a rule-based extractor takes value and unit from accepted findings' quotes and structured responses; the model proposes only the concept and the period.":"Mezi ověřením a syntézou vezme extraktor založený na pravidlech hodnotu a jednotku z citací přijatých zjištění a ze strukturovaných odpovědí. Model navrhuje jen pojem a období.","Extractor used only after value and unit F§ ≥ § on the labelled Czech set (§+ sentences, two annotators).":"Extraktor se použije, až když hodnota a jednotka dosáhnou F§ ≥ § na označené české sadě (§+ vět, dva anotátoři).","Typed input candidates.":"Kandidáti na vstupy s určeným typem.","Credibility":"Důvěryhodnost","Tier each source from declared tables":"Zařadit každý zdroj do úrovně podle deklarovaných tabulek","Each source gets Úřední (authorities, statistics), Oborový (associations, studies) or Ostatní from declared (source, claim type) tables, a Code-of-Practice checklist for statistics, a review date and a four-year stale flag.":"Každý zdroj dostane úroveň Úřední (úřady, statistiky), Oborový (svazy, studie) nebo Ostatní podle deklarovaných tabulek (zdroj, typ tvrzení). U statistik se přidá kontrolní seznam podle Code of Practice, dále datum revize a příznak zastaralosti po čtyřech letech.","review date":"datum revize","stale flag":"příznak zastaralosti","Never A/B/C on screen; a score proposed by a model is refused.":"Na obrazovce nikdy A/B/C; skóre navržené modelem se odmítá.","Tier and stale mark on every finding and input.":"Úroveň a značka zastaralosti u každého zjištění a vstupu.","Older than § years: marked zastaralé ('odloženo · zdroj starší § let').":"Starší než § roky: označeno jako zastaralé ('odloženo · zdroj starší § let').","Triangulation":"Triangulace","Detect agreement or contradiction":"Zjistit shodu nebo rozpor","Each numeric claim decomposed into sub-questions; agreement or contradiction recorded per typed input with both citations (e.g. warehouse rent § vs § Kč/m², § %).":"Každé číselné tvrzení se rozloží na dílčí otázky. Shoda nebo rozpor se zaznamená u každého vstupu s určeným typem, s oběma citacemi (např. nájem skladu § vs. § Kč/m², § %).","input":"vstup","source A value":"hodnota ze zdroje A","source B value":"hodnota ze zdroje B","difference":"rozdíl","A contradiction is resolved by a person, never by the model.":"Rozpor řeší člověk, nikdy model.","Input in state 'rozpor'.":"Vstup ve stavu 'rozpor'.","Resolve a contradiction":"Vyřešit rozpor","Pick the source that holds, or take a range with a base ('Vezmi rozsah §–§, základ §'); recorded as the researcher's decision with both citations.":"Zvolit zdroj, který platí, nebo vzít rozsah se základem ('Vezmi rozsah §–§, základ §'). Zaznamená se jako rozhodnutí výzkumníka s oběma citacemi.","chosen source | range low–high":"zvolený zdroj | rozsah od–do","base":"základ","Unresolved: the input cannot be accepted.":"Nevyřešeno: vstup nelze přijmout.","Measure citation quality per run":"Měřit kvalitu citací v každém běhu","Per run: citation accuracy (target ≥ § %) and unsupported claims (< § %); completeness shown as the method's tested level from the evaluation set (≥ § %), labelled so; link health with dead links replaced by an archive copy.":"V každém běhu: přesnost citací (cíl ≥ § %) a nepodložená tvrzení (< § %). Úplnost se uvádí jako otestovaná úroveň metody z hodnoticí sady (≥ § %) a je tak označena. Kontroluje se stav odkazů; nefunkční odkazy se nahradí archivní kopií.","Judge calibrated on § human-labelled pairs (kappa reported); recall never a per-run number.":"Hodnoticí model je kalibrovaný na § párech označených lidmi (uvádí se kappa); záchyt (recall) se nikdy neuvádí jako číslo za jeden běh.","Below target: shown as not met.":"Pod cílem: uvedeno jako nesplněno.","Review":"Kontrola","Accept each typed input":"Přijmout každý vstup s určeným typem","Each typed input is accepted before it reaches a model input (public_source) or a findings table; a value from a Sbírka listin PDF/XHTML statement is checked by a person first.":"Každý vstup s určeným typem se přijme dřív, než se dostane do vstupu modelu (public_source) nebo do tabulky zjištění. Hodnotu z výkazu PDF/XHTML ve Sbírce listin nejprve zkontroluje člověk.","Accepted by a person before any use.":"Přijme ho člověk před jakýmkoli použitím.","Accepted typed input.":"Přijatý vstup s určeným typem.","Not accepted: never a model input.":"Nepřijatý vstup se nikdy nestane vstupem modelu.","Review findings by framework":"Projít zjištění podle analytických rámců","Findings grouped by the frameworks chosen in Zadání (PESTEL by factor, Porter by force, benchmark by competitor, trends) with filters and a 'Čeká na vás' count; each kept, set aside or left for checking.":"Zjištění jsou seskupená podle analytických rámců zvolených v kroku Zadání (PESTEL podle faktorů, Porter podle sil, benchmark podle konkurentů, trendy), s filtry a počtem 'Čeká na vás'. Každé zjištění se ponechá, odloží, nebo nechá ke kontrole.","The check is recorded in the approval ledger and never changes the sealed bundle.":"Kontrola se zapíše do knihy schválení a nikdy nemění zapečetěný balík.","Per-finding review state.":"Stav kontroly u každého zjištění.","A set-aside source makes its points stale, named.":"Odložený zdroj označí své body jako zastaralé a vyjmenuje je.","Rate a cited finding, labelled":"Ohodnotit citované zjištění, s označením","A rating beside a quote (Porter's force strength: nízká / střední / vysoká) is the researcher's own judgement, printed with its grade and author's name; Ada may propose it with a reason.":"Hodnocení vedle citace (síla konkurenční síly podle Portera: nízká / střední / vysoká) je vlastní úsudek výzkumníka. Tiskne se se svým stupněm a jménem autora. Ada ho může navrhnout s důvodem.","author":"autor","reason (Ada's proposal)":"důvod (návrh Ady)","Never mixed with sourced points; the Lead never writes a judgement point.":"Nikdy se nemíchá s body ze zdrojů; Ada nikdy nepíše bod úsudku.","Judgement point.":"Bod úsudku.","Personal data":"Osobní údaje","Withhold register fields naming persons":"Zadržet pole rejstříků, která uvádějí člověka jménem","Fields naming a natural person (ARES statutory bodies, commercial-register officers and owners, sole traders) are hidden on screen and never sent to a model until the balancing test passes; Class A by rule, masked.":"Pole, která uvádějí člověka jménem (statutární orgány v ARES, členové orgánů a vlastníci v obchodním rejstříku, živnostníci), jsou na obrazovce skrytá. Modelu se nikdy nepošlou, dokud neprojde balanční test. Podle pravidla patří do třídy A a jsou maskovaná.","field":"pole","reason":"důvod","Withheld until RPD§'s balancing test; a person field reaches a model only where RPD§'s record allows.":"Zadrženo do balančního testu RPD§; pole s osobou se k modelu dostane jen tam, kde to dovoluje záznam RPD§.","Masked field.":"Maskované pole.","Record a balancing test":"Zaznamenat balanční test","'Založit test vyváženosti' records per client and source the purpose, legitimate interest, retention and either an Art. § notice or the exemption reason, on the approval ledger.":"'Založit test vyváženosti' zaznamená pro každého klienta a zdroj účel, oprávněný zájem, dobu uchování a buď oznámení podle čl. §, nebo důvod výjimky. Vše se zapíše do knihy schválení.","Processing record (RPD§) written with the owner's legal counsel first; an ApprovalSubject admitted by migration before its writer.":"Záznam o zpracování (RPD§) se nejdřív sepíše s právním poradcem vlastníka. Subjekt v ApprovalSubject přidá migrace dřív, než vznikne kód, který ho zapisuje.","Ledger record; withheld field released to this study.":"Záznam v knize; zadržené pole se uvolní pro tuto studii.","No test: field stays hidden.":"Bez testu zůstává pole skryté.","Capture a legal provision as cited":"Zachytit ustanovení právního předpisu jako citované","A provision fetched from e-Sbírka or EUR-Lex by identifier in the version in force on a stated date, captured content-addressed; a legal point is law, provision, version date, verbatim quote and snapshot hash.":"Ustanovení se stáhne z e-Sbírky nebo EUR-Lex podle identifikátoru, ve znění účinném k uvedenému datu, a zachytí se s adresou podle obsahu. Právní bod tvoří předpis, ustanovení, datum znění, doslovná citace a hash snímku.","provision":"ustanovení","version date":"datum znění","The quote must be literally in the captured provision; scope and 'not legal advice' text agreed with legal counsel before any legal point reaches a study.":"Citace musí být doslova v zachyceném ustanovení. Rozsah a text 'nejde o právní radu' se dohodnou s právním poradcem dřív, než se jakýkoli právní bod dostane do studie.","Legal point candidate.":"Kandidát na právní bod.","Quote not in provision: refused.":"Citace není v ustanovení: odmítnuto.","Accept a legal point as parameter or constraint":"Přijmout právní bod jako parametr nebo omezení","The researcher accepts each legal point; it becomes a Předpoklady parameter (corporate tax rate, depreciation, VAT, minimum wage, overtime premium, notice period) or a Model constraint; every report using one carries the disclaimer.":"Výzkumník přijme každý právní bod. Ten se stane parametrem v kroku Předpoklady (sazba daně z příjmů právnických osob, odpisy, DPH, minimální mzda, příplatek za přesčas, výpovědní doba) nebo omezením v kroku Model. Každý report, který ho použije, nese upozornění.","legal point":"právní bod","→ parameter | constraint":"→ parametr | omezení","AIA flags what applies and never gives legal advice; re-checked against the version in force at the report's date, a changed provision marks dependent results stale.":"AIA označí, co platí, a nikdy nedává právní radu. Bod se znovu ověří proti znění účinnému k datu reportu; změněné ustanovení označí závislé výsledky jako zastaralé.","Accepted legal parameter or constraint.":"Přijatý právní parametr nebo omezení.","Changed provision: dependent results marked stale.":"Změněné ustanovení: závislé výsledky se označí jako zastaralé.","Offer accepted inputs and findings on":"Nabídnout přijaté vstupy a zjištění dál","Accepted typed inputs go to Předpoklady and the market view; accepted findings, judgements and legal points are offered to the report outline as points with their links; sources export as CSV.":"Přijaté vstupy s určeným typem jdou do kroku Předpoklady a do pohledu na trh. Přijatá zjištění, úsudky a právní body se nabídnou osnově reportu jako body se svými odkazy. Zdroje se exportují jako CSV.","Only accepted items move on.":"Dál jdou jen přijaté položky.","Proposals on Předpoklady; points for Osnova reportu.":"Návrhy v kroku Předpoklady; body pro Osnovu reportu.","Typed input":"Vstup s určeným typem","period: §":"období: §","range: §–§":"rozsah: §–§","source + page/series":"zdroj + strana/řada","as_of: date":"as_of: datum","triangulation: agree | rozpor + resolution":"triangulace: shoda | rozpor + řešení","extracted":"vytěženo","Finding":"Zjištění (záznam)","tier":"úroveň","stale: bool":"zastaralé: bool","needs checking":"ke kontrole","Source register entry":"Záznam v rejstříku zdrojů","source: ARES":"zdroj: ARES","cost":"cena","rate limit: §/min":"limit četnosti: §/min","names natural person: field list":"uvádí člověka jménem: seznam polí","Legal point":"Právní bod","verbatim quote":"doslovná citace","becomes: parameter | constraint":"stane se: parametr | omezení","captured":"zachyceno","stale (version changed)":"zastaralé (znění se změnilo)","Balancing test record":"Záznam o balančním testu","client":"klient","purpose":"účel","Art. § notice | exemption reason":"oznámení podle čl. § | důvod výjimky","recorded":"zaznamenáno","Accepted typed inputs":"Přijaté vstupy s určeným typem","value, unit, period, range, source, licence, as-of, tier":"hodnota, jednotka, období, rozsah, zdroj, licence, k datu, úroveň","researcher's resolution of a contradiction":"řešení rozporu výzkumníkem","market size inputs for the Trh view":"vstupy velikosti trhu pro pohled Trh","Legal parameters and constraints":"Právní parametry a omezení","tax rate, depreciation, VAT, minimum wage, notice period with provision and version date":"sazba daně, odpisy, DPH, minimální mzda, výpovědní doba s ustanovením a datem znění","constraints with their quote":"omezení s jejich citací","Findings by framework":"Zjištění podle analytických rámců","accepted findings with quote, source, snapshot, tier":"přijatá zjištění s citací, zdrojem, snímkem a úrovní","labelled judgements with author":"označené úsudky s autorem","legal points with disclaimer flag":"právní body s příznakem upozornění","run quality: accuracy, unsupported, tested recall":"kvalita běhu: přesnost, nepodložená tvrzení, otestovaný záchyt","The legal counsel the owner has not yet named blocks RPD§ (the processing record) and LGL§ (scope and disclaimer): until then no person field and no legal point may reach a study; is there an MVP path without them?":"Právní poradce, kterého vlastník zatím nejmenoval, blokuje RPD§ (záznam o zpracování) a LGL§ (rozsah a upozornění). Do té doby se do studie nesmí dostat žádné pole s osobou ani žádný právní bod. Existuje cesta k MVP bez nich?","How is a finding assigned to a framework's slot (PESTEL factor, Porter force): by the plan's subject at enqueue, by Ada after the run, or by the researcher, and can it be moved?":"Jak se zjištění přiřadí k místu v analytickém rámci (faktor PESTEL, síla podle Portera)? Podle předmětu plánu při zařazení do fronty, Adou po běhu, nebo výzkumníkem? A dá se přesunout?","What grade and provenance does a researcher's contradiction resolution (range §–§, base §) carry downstream: a typed input, a judgement, or both?":"Jaký stupeň a původ nese dál řešení rozporu výzkumníkem (rozsah §–§, základ §): vstup s určeným typem, úsudek, nebo obojí?","The labelled Czech extraction set and the §-pair judge calibration must exist before DRV§ and DRV§ are used: who produces them, and what does Rešerše show before they exist?":"Označená česká sada pro vytěžování a kalibrace hodnoticího modelu na § párech musí existovat dřív, než se použijí DRV§ a DRV§. Kdo je připraví a co ukáže Rešerše, dokud neexistují?","No canvas board shows legal points: on which screen are provisions listed, accepted and turned into parameters?":"Žádná tabule na plátně návrhu neukazuje právní body. Na které obrazovce se ustanovení vypisují, přijímají a převádějí na parametry?","When monitoring (DRV§) or the version watch (LGL§) finds a changed value after it was accepted on Předpoklady, what is offered to the researcher and which results go stale?":"Když monitorování (DRV§) nebo hlídání znění (LGL§) najde změněnou hodnotu poté, co byla přijata v kroku Předpoklady, co se výzkumníkovi nabídne a které výsledky zastarají?","How is the per-framework Deep Research ceiling (Z§'s §–§ USD) computed when structured routes are fee-free and Brave is priced, and is it re-quoted on the card?":"Jak se počítá strop Deep Research pro jeden analytický rámec (Z§: §–§ USD), když strukturované cesty jsou bez poplatku a Brave je placený? A uvede se na kartě znovu přepočtená cena?","Does Rešerše run once after Zadání's hand-off or repeatedly, and which run's findings does the report outline take when several exist?":"Běží Rešerše jednou po předávce ze Zadání, nebo opakovaně? A zjištění kterého běhu převezme osnova reportu, když jich je víc?","Write the report's prose around exactly the closed outline points, keeping every number traceable and labelled, then have a person approve one exact version and export it to the client.":"Napsat text reportu přesně kolem uzavřených bodů osnovy tak, aby každé číslo bylo dohledatelné a označené. Potom nechat člověka schválit jednu přesnou verzi a exportovat ji pro klienta.","Compose":"Psaní","Write prose around closed points":"Napsat text kolem uzavřených bodů","The writer drafts each section's prose around the closed points in the outline's order, leading with the recommendation and the execution plan; every printed number is a locked, tagged content control holding its ref. Czech in the MVP.":"Pisatel napíše koncept textu každého oddílu kolem uzavřených bodů, v pořadí osnovy. Začne doporučením a plánem realizace. Každé vytištěné číslo je uzamčený, označený prvek obsahu (content control), který nese svůj odkaz. V MVP česky.","closed points":"uzavřené body","prose":"text","locked ref controls":"uzamčené prvky s odkazy","language: cs":"jazyk: cs","Every printed number and claim keeps its provenance link; English comes after the MVP.":"Každé vytištěné číslo a tvrzení si drží svůj odkaz na původ; angličtina přijde až po MVP.","A draft report version ('Koncept · čeká na schválení').":"Koncept verze reportu ('Koncept · čeká na schválení').","Check":"Kontrola","Check the prose against the outline":"Zkontrolovat text proti osnově","Before approval, code checks that the report states no point the outline does not hold, and the sentence check marks a comparison made in words with no ledger number in the sentence.":"Před schválením kód ověří, že report neuvádí žádný bod, který osnova neobsahuje. Kontrola vět označí srovnání vyjádřené slovy, u kterého ve větě chybí evidované číslo.","sentence":"věta","cited refs":"citované odkazy","outline point ids":"id bodů osnovy","unsupported_comparison mark":"značka unsupported_comparison","Report ⊆ closed outline; the sentence check marks, never refuses.":"Report ⊆ uzavřená osnova; kontrola vět označuje, nikdy neodmítá.","Check results attached to the draft.":"Výsledky kontroly připojené ke konceptu.","A sentence with no outline point is flagged before approval.":"Věta bez bodu osnovy se označí před schválením.","Print each number's grade":"Vytisknout u každého čísla jeho stupeň","Each number prints its grade label beside it: výpočet, odhad (interní), z dat klienta, veřejný zdroj, úsudek, právní předpis; a grade follows its method, not its inputs; the legend is printed.":"U každého čísla se vytiskne štítek jeho stupně: výpočet, odhad (interní), z dat klienta, veřejný zdroj, úsudek, právní předpis. Stupeň se řídí metodou, ne vstupy. Vytiskne se i legenda.","One table maps every grade to its Czech label and admission rule; deterministic formulas are výpočet, Monte Carlo and statistics are odhad.":"Jedna tabulka přiřazuje každému stupni český štítek a pravidlo přijetí. Deterministické vzorce jsou výpočet, Monte Carlo a statistika jsou odhad.","Labelled numbers and the grade legend.":"Označená čísla a legenda stupňů.","An unknown total prints 'neznámé' with its missing input (CP§).":"Neznámý součet se vytiskne jako 'neznámé' s chybějícím vstupem (CP§).","Lead with the median and interval":"Začít mediánem a intervalem","Each option's headline is the median with its § % interval; the base case appears only as 'v základu'; NPV is printed before and after tax.":"Hlavním číslem každé varianty je medián s § % intervalem. Základní případ se objeví jen jako 'v základu'. NPV se tiskne před zdaněním i po něm.","median":"medián","Median plus interval leads; the decision rule reads one tax view, the other sits beside it.":"Na prvním místě je medián s intervalem. Rozhodovací pravidlo čte jeden daňový pohled, druhý stojí vedle něj.","Labels":"Štítky","Label judgements and external context":"Označit úsudky a vnější kontext","A researcher's judgement prints as one, with its author ('podle úsudku výzkumníka realistický'); an external Deep Research finding is labelled as external context, never as client data or respondent evidence.":"Úsudek výzkumníka se tiskne jako úsudek, s autorem ('podle úsudku výzkumníka realistický'). Vnější zjištění z Deep Research se označí jako vnější kontext, nikdy jako data klienta nebo doklad od respondentů.","judgement author":"autor úsudku","external context label":"štítek vnějšího kontextu","Never mixed with sourced points.":"Nikdy se nemíchá s body ze zdrojů.","Labelled sentences.":"Označené věty.","Label unregistered methods":"Označit metody nezapsané v registru","An estimate whose method A. Bahbouh has not registered still reaches the client version, labelled 'metoda čeká na schválení metodikem'.":"Odhad, jehož metodu A. Bahbouh nezapsal do registru metod, se do verze pro klienta přesto dostane, s označením 'metoda čeká na schválení metodikem'.","Include, labelled, warn; never refused.":"Zahrnout, označit, upozornit; nikdy neodmítnout.","Labelled estimates in the client version.":"Označené odhady ve verzi pro klienta.","Print the legal disclaimer":"Vytisknout právní upozornění","Wherever a legal point is used, the report prints that it is not legal advice.":"Všude, kde se použije právní bod, report uvede, že nejde o právní radu.","legal points used":"použité právní body","disclaimer text":"text upozornění","The disclaimer is printed in every report that uses a legal point.":"Upozornění se tiskne v každém reportu, který používá právní bod.","The disclaimer block.":"Blok s upozorněním.","Appendix":"Příloha","Append methods and sources":"Připojit metody a zdroje","A method appendix names each method's id, version, pinned defaults and register status; a sources appendix lists each file (with pages), data contract version, method version and seed.":"Příloha metod uvádí u každé metody id, verzi, zafixované výchozí hodnoty a stav v registru. Příloha zdrojů uvádí každý soubor (se stranami), verzi datové smlouvy, verzi metody a seed.","files and pages":"soubory a strany","Every method used is listed with its register status.":"Každá použitá metoda je uvedena se stavem v registru metod.","'Metody a registr' and 'Příloha · Odkud čísla jsou'.":"'Metody a registr' a 'Příloha · Odkud čísla jsou'.","Variant":"Varianta","Switch internal and client versions":"Přepnout interní verzi a verzi pro klienta","'Interní' / 'Pro klienta' switches between the internal draft and the client version of the same report.":"'Interní' / 'Pro klienta' přepíná mezi interním konceptem a verzí pro klienta téhož reportu.","CR§: the client version carries CALCULATED and registered ESTIMATED numbers only; W§ later admits unregistered estimates, labelled.":"CR§: verze pro klienta nese jen čísla CALCULATED a ESTIMATED zapsaná v registru; W§ později připustí i odhady nezapsané v registru, s označením.","The variant shown.":"Zobrazená varianta.","Figures":"Obrázky","Insert figures from stored renders":"Vložit obrázky z uložených vykreslení","Each figure comes from its stored server render, never browser bytes, numbered with the outline, with a caption naming its sources and alt text.":"Každý obrázek pochází z uloženého vykreslení na serveru, nikdy z bajtů prohlížeče. Je číslovaný podle osnovy a má popisek se zdroji a alternativní text.","figure no.":"č. obrázku","render artifact":"artefakt vykreslení","caption sources":"zdroje v popisku","The same spec renders the same bytes.":"Stejná specifikace vykreslí stejné bajty.","Figures in the DOCX.":"Obrázky v DOCX.","No stored render: the figure is not printed.":"Bez uloženého vykreslení se obrázek netiskne.","Edit the draft in the editor":"Upravit koncept v editoru","Report opens in the report editor (ONLYOFFICE) instead of a preview; the numbers stay in locked controls, and a saved version records what it changed in code-written text.":"Report se místo náhledu otevře v editoru reportu (ONLYOFFICE). Čísla zůstávají v uzamčených prvcích a uložená verze zaznamená, co změnila v textu napsaném kódem.","editor version":"verze editoru","saved by":"uložil","changed controls":"změněné prvky","loose numbers":"volná čísla","Locked controls; a save's changes recorded.":"Uzamčené prvky; změny při uložení se zaznamenají.","A saved koncept version.":"Uložená verze ve stavu koncept.","Unsaved edits hold the approval.":"Neuložené úpravy zadrží schválení.","Revise":"Revize","Go back to the outline":"Vrátit se do osnovy","'Zpět do osnovy' reopens the outline; reopening a stop marks the draft stale and names the points that moved.":"'Zpět do osnovy' znovu otevře osnovu. Znovuotevření zastávky označí koncept jako zastaralý a uvede body, které se posunuly.","stale draft":"zastaralý koncept","moved points":"posunuté body","A draft from a reopened stop is stale.":"Koncept ze znovu otevřené zastávky je zastaralý.","A stale draft, with the moved points named.":"Zastaralý koncept s uvedením posunutých bodů.","Approve":"Schválení","Approve one exact version":"Schválit jednu přesnou verzi","'Schválit' approves exactly the stored version shown, once; the client report's checks and the unregistered-method warnings appear in the dialog and are recorded on the approval's ledger row; the report kind is business_model.":"'Schválit' schválí právě zobrazenou uloženou verzi, a to jednou. Kontroly reportu pro klienta a upozornění na metody nezapsané v registru se ukážou v dialogu a zapíšou se do řádku schválení v knize. Druh reportu je business_model.","version (stored_at)":"verze (stored_at)","report kind: business_model":"druh reportu: business_model","warnings":"upozornění","approver":"schvalovatel","self-approval rule":"pravidlo pro schválení vlastní práce","Warnings, never a refusal; no author approving their own line where self-approval is off.":"Upozornění, nikdy odmítnutí. Kde je schválení vlastní práce vypnuté, autor nesmí schválit vlastní řadu verzí.","An approved version with its ledger row.":"Schválená verze s řádkem v knize.","report_version_sta
