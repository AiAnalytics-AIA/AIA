ýpočet (W21)", "output": "A preview, not the headline", "onFail": "An unknown input makes the total neznámé, naming it", "screen": "M3 · 04 Výsledek v základním scénáři", "source": "KM3Model board · cost-model-study#CM2", "status": "proposed"}, {"n": 10, "phase": "Submit", "actor": "Researcher", "action": "Submit the Model Revision", "detail": "The working content becomes an immutable Model Revision: type id and version, elements, inputs, scenarios and decision rule, its canonical JSON and SHA-256, naming its working revision; a ledger row with the hash of its input list in the same transaction.", "fields": ["type_id", "type_version", "elements", "inputs", "scenarios", "DecisionRule", "sha256", "working_revision"], "rule": "Under APPROVE_GATE; ledger subject business_model", "output": "A submitted Model Revision", "onFail": "A stale save 409; a stale pinned input blocks submission until a person picks again", "screen": null, "source": "cost-model-study#CP1, #CP3, #CP5, #CP6", "status": "planned"}, {"n": 11, "phase": "Run", "actor": "Researcher", "action": "Start the computation", "detail": "\"Spustit výpočet · 0,00 USD\" (or the typed request to Ada, \"Spusť výpočet\") starts a business_model run: prepare, compute, report.", "fields": ["Spustit výpočet", "ceiling 0,00 USD"], "rule": "Known 0.00 USD ceiling; no hold, no charge, no confirmation", "output": "A run queued", "onFail": null, "screen": "M3 · header \"Spustit výpočet · 0,00 USD\"; Ada pane", "source": "cost-model-study#CP5", "status": "planned"}, {"n": 12, "phase": "Run", "actor": "Code", "action": "Freeze the run's inputs and pins", "detail": "Prepare freezes the revision and each dataset input by artifact id and SHA-256, and pins the type id and version, the Metodika module version and the seed drawn once at start.", "fields": ["revision sha256", "dataset artifact ids + sha256", "type pin", "module version", "seed"], "rule": "The run never reads the working copy", "output": "A frozen run identity", "onFail": null, "screen": null, "source": "cost-model-study#CP5, #CP2, #CP10", "status": "planned"}, {"n": 13, "phase": "Run", "actor": "Code", "action": "Compute the deterministic results", "detail": "Per line and per year totals; break-even on a driver in a stated range; one-way sensitivity ±10 %; cumulative cost with capital in year 0 and the payback year; NPV before and after tax and discounted payback, in Decimal.", "fields": ["totals", "break_even", "curve", "sensitivity", "cumulative", "payback", "NPV before tax", "NPV after tax"], "rule": "Break-even exact only where the driver enters through one monotone form; unknown propagated by name, never zero", "output": "CALCULATED results (výpočet)", "onFail": "break_even_not_exact (naming the driver), none_in_range, identical, none_within_horizon", "screen": null, "source": "cost-model-study#CM2, #CM7 · ADR 0046 W18", "status": "planned"}, {"n": 14, "phase": "Run", "actor": "Code", "action": "Compute exact ranges and dominance", "detail": "Every total's and difference's exact range by vertex enumeration over the low/high grid cut into closed STEP cells; dominance where A is below B at every vertex; otherwise the inputs that flip the ranking with their flip values.", "fields": ["range per total", "dominance", "flip inputs", "flip values"], "rule": "Exactness check first (each input through one monotone form); vertex cap 2^14", "output": "Ranges, dominance and flip values", "onFail": "range_not_exact (naming the input, Monte Carlo becomes the range view), range_too_large", "screen": null, "source": "cost-model-study#CR2", "status": "planned"}, {"n": 15, "phase": "Run", "actor": "Code", "action": "Run the Monte Carlo", "detail": "20 000 draws per stream under PCG64 and the run's seed, distributions from Předpoklady, correlations imposed by Iman-Conover; P(option better than B) with its standard error, the difference's 90 % interval, each scenario's percentiles.", "fields": ["N", "seed", "streams", "P", "standard error", "p5", "p50", "p95"], "rule": "Converged when five streams agree on P within ±0.01 and on the 5th/95th percentiles within tolerance; else N doubles to 160 000", "output": "ESTIMATED results (odhad), stored with the seed", "onFail": "not_converged", "screen": "M3 Ada pane (\"Hotovo za 6 s: základní výpočet a 20 000 losů\")", "source": "cost-model-study#CR3 · sign-off S4", "status": "planned"}, {"n": 16, "phase": "Run", "actor": "Code", "action": "Compute sensitivity and value of information", "detail": "Sobol first-order and total indices (Jansen, bootstrap intervals) for independent inputs, partial rank correlation when inputs are correlated; EVPPI per input from the draws in 20 equal-frequency bins.", "fields": ["Sobol S1", "Sobol ST", "PRCC", "EVPPI per input"], "rule": "PRCC replaces Sobol when any accepted correlation exists; EVPPI material at ≥ 5 % of the absolute expected difference", "output": "ESTIMATED sensitivity and value-of-information results", "onFail": "Sobol not shown for correlated inputs, the page says why", "screen": null, "source": "cost-model-study#CR4, #CR6 · sign-off S5, S7", "status": "planned"}, {"n": 17, "phase": "Store", "actor": "Code", "action": "Store results and keep reruns identical", "detail": "Results are stored as artifacts and never recomputed on read; a rerun under the same pins gives the same bytes; a retry with unchanged inputs reuses the results; the page keeps the run history, comparison and a JSON export.", "fields": ["results artifact", "Historie běhů", "Porovnat běhy", "Exportovat model (JSON)"], "rule": "Determinism harness: no clock, no randomness outside the seed; the usage ledger holds no row", "output": "Results ready; Výsledky unlocked", "onFail": null, "screen": "M3 · header (Historie běhů, Porovnat běhy, Exportovat model (JSON))", "source": "cost-model-study#CP2, #CP5, #CP10", "status": "planned"}], "objects": [{"name": "Model Revision", "fields": ["type_id / type_version (cost_scenarios v1 as first template)", "elements: drivers, line items, timing", "inputs (frozen from Předpoklady)", "scenarios: baseline + ≤ 11", "DecisionRule", "fixed parameters", "canonical JSON", "sha256", "working_revision"], "states": ["working", "submitted"]}, {"name": "Line item (Položka)", "fields": ["name", "kind: PŘÍJEM | KAPITÁL | FIXNÍ | VARIABILNÍ | JEDNORÁZOVĚ", "formula (closed vocabulary)", "variants it applies to", "year / timing", "capacity rule"], "states": ["proposed", "accepted", "dismissed"]}, {"name": "Scenario (Varianta)", "fields": ["id: A, A2, B, B2, C, C2, H", "name", "description", "baseline: bool", "overrides", "constraint flag"], "states": []}, {"name": "Run (business_model)", "fields": ["steps: prepare, compute, report", "revision sha256", "dataset artifact ids + sha256", "type pin", "Metodika module version", "seed", "N", "ceiling: 0,00 USD"], "states": ["queued", "running", "completed", "not_converged", "failed"]}, {"name": "Results artifact", "fields": ["CALCULATED outputs: totals, break-even, curve, sensitivity, cumulative, payback, NPV before/after tax", "ESTIMATED outputs: P, SE, percentiles, Sobol/PRCC, EVPPI", "ranges, dominance, flip values", "each output: grade, method id, version"], "states": []}], "handoffs_out": [{"name": "Stored results of the run", "to": ["vysledky"], "contents": ["CALCULATED and ESTIMATED refs with grade, method id and version", "median, 90 % interval and base value per option", "ranges, dominance, flip values", "Sobol/PRCC, EVPPI", "seed, pins"]}, {"name": "Monte Carlo scenarios for the scenario map", "to": ["sociomapa"], "contents": ["the run's scenarios as objects", "draws (≥ 800) per option", "chosen result refs as properties"]}, {"name": "Method and model description for the report", "to": ["osnova", "zprava"], "contents": ["line items and kinds", "timing and capacity rules", "method ids, versions, register status", "what is not modelled"]}], "gaps": ["What is the closed formula vocabulary of the composable model (W17)? CM1 defines four cost forms; the canvas uses revenue, residual value, growth exponents and conditional overrides. Which operators exist, and how do PŘÍJEM and JEDNORÁZOVĚ items enter CM2's exactness and break-even rules?", "How are capacity and timing rules expressed (overflow to another supplier, a 12-month build, a 6-month notice, half-year 2027), and do they create STEP cells for the exact-range enumeration?", "Is \"Submit\" a separate act? The canvas has one \"Spustit výpočet\" button, while CP5/CP6 require a submitted revision under APPROVE_GATE with a ledger row before a run.", "Model step size: Zadání Z5 02 offers months or years, and Provoz's LP is monthly, but CM2/CM7 compute per year. Does one model run produce monthly figures for Provoz, or is the monthly LP a separate computation over the same inputs?", "How does Ada's proposal of a whole item set (11 items) become per-change operations a researcher can accept in one pass without approving numbers it did not ground?", "Which model type template is pinned when the decision is not a cost comparison (contribution, revenue): is cost_scenarios v1 renamed or replaced by a cash-flow type, and what is its id?"]}, "vysledky": {"purpose": "Show the stored results per view, judge the person's own decision rule on them, and say what would change the decision and what is worth verifying, each number with its grade and method.", "actors": ["Code", "Researcher", "Ada", "Metodika"], "process": [{"n": 1, "phase": "Frame", "actor": "Code", "action": "Open the views the selection switched on", "detail": "The tabs Rozhodnutí, Finance, Účetnictví, Provoz, Logistika and Trh appear as Zadání's framework selection switched them on; a framework whose data contract is missing says which file it waits for.", "fields": ["tabs", "framework selection", "missing file"], "rule": "Each computed framework switches on its view (AF4)", "output": "The result views for this run", "onFail": "\"analýza není vybraná\" for an unselected framework, with a link to Zadání · Analýzy do zprávy", "screen": "M4 · tab bar; M4f · 05", "source": "analysis-frameworks#AF4 · ADR 0046 decision 4", "status": "planned"}, {"n": 2, "phase": "Grades", "actor": "Code", "action": "Mark every number's grade by method", "detail": "A deterministic formula prints výpočet even over an estimated input; Monte Carlo and statistics print odhad; an estimate whose method is not registered is marked odhad (interní) on screen and, in a client report, \"metoda čeká na schválení metodikem\" with an approval warning.", "fields": ["grade", "method id", "method version", "register status"], "rule": "Grade follows the method (W21); register entry decides client label (CP10, W27)", "output": "Each value carries its grade chip", "onFail": "Never refused for an unregistered method (W27); the warning is recorded on the approval's ledger row", "screen": "M4 · banner and section chips (výpočet / odhad (interní))", "source": "ADR 0046 W21, W27 · cost-model-study#CP8, #CP10, #CR8", "status": "decided"}, {"n": 3, "phase": "Headline", "actor": "Code", "action": "Lead with the median and its interval", "detail": "Each option's headline is the median with its 90 % interval from the draws; the base-case value appears only as \"v základu\" in a smaller line.", "fields": ["Medián proti B", "90% interval", "v základu"], "rule": "W20: median + 90 % interval leads", "output": "Headline figures on every tab", "onFail": null, "screen": "M4 · 01; M4b · 01 (\"(−3,5 až +18,6) · v základu +8,8\")", "source": "ADR 0046 W20 · cost-model-study#CP8", "status": "decided"}, {"n": 4, "phase": "Rozhodnutí", "actor": "Code", "action": "Judge the stated decision rule", "detail": "The rule written in Zadání before the data (here: highest median if better than B with P ≥ 0,80 and a loss over 10 mil. Kč in at most 10 % of futures, the city delivery promise not worsened) is judged per option.", "fields": ["Varianta", "Medián proti B", "90% interval", "P(lepší než B)", "P(ztráta > 10 mil.)", "Slib ve městech", "Pravidlo"], "rule": "Judged as written; default confidence 0,90 / 0,10 only when the rule names none, said on the page; dominance printed beside", "output": "Verdict: doporučeno, nerozhodnuto (naming the top inputs), splněno/nesplněno per option", "onFail": "No rule: no recommendation, \"rozhodovací pravidlo chybí\"; a rule changed after results is marked", "screen": "M4 · 01 Doporučení podle pravidla", "source": "cost-model-study#CR7 · Z3 · R2", "status": "planned"}, {"n": 5, "phase": "Rozhodnutí", "actor": "Code", "action": "Draw the difference's distribution", "detail": "A histogram of the recommended option minus B across 20 000 futures with the 5 % and 95 % marks and the share right of zero (86 %).", "fields": ["C2 − B", "5 %", "95 %", "share > 0"], "rule": "Charts drawn from stored refs only", "output": "The distribution chart", "onFail": null, "screen": "M4 · 02 Rozdíl C2 − B ve 20 000 budoucnostech", "source": "cost-model-study#CR8", "status": "planned"}, {"n": 6, "phase": "Rozhodnutí", "actor": "Code", "action": "Show what turns the result", "detail": "A tornado: each input at its low (blue) and high (orange) bound, the rest at base, ordered by swing; Sobol or partial-rank-correlation bars beside it, with the flip inputs and their flip values.", "fields": ["input", "low swing", "high swing", "Sobol / PRCC", "flip value"], "rule": "Ordered by swing; Sobol only for independent inputs", "output": "Sensitivity view", "onFail": "Correlated inputs: PRCC shown and the page says why Sobol is not", "screen": "M4 · 03 Co výsledek otáčí", "source": "cost-model-study#CM4, #CR2, #CR4, #CR8", "status": "planned"}, {"n": 7, "phase": "Rozhodnutí", "actor": "Code", "action": "Draw the break-even", "detail": "The options' totals across a driver's range drawn through the exact curve points, every crossing marked (C = B at 4,7 %, C2 = B at 7,2 % order loss), the data's range shaded, and the price flip (3PL PL fee 37,4 Kč).", "fields": ["driver", "range", "crossings", "data range"], "rule": "Points are exact evaluations: a fixed 64-point grid, both sides of every STEP jump, every crossing", "output": "Break-even chart", "onFail": "break_even_not_exact, none_in_range said in words", "screen": "M4 · 04 Bod zvratu", "source": "cost-model-study#CM2, #CM4", "status": "planned"}, {"n": 8, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the forecast and its backtest", "detail": "The kept forecast over history, its backtest against the baseline on the same 6 held-out months (Holt-Winters MASE 0,67 against seasonal naive 1,29), and that its errors set the order-growth range.", "fields": ["method", "baseline", "MASE", "held-out MAE", "backtest window"], "rule": "Used only if it beats the baseline on held-out error (MAE in the plan; MASE pending decision 10 (3))", "output": "Forecast view", "onFail": "The baseline is used and said", "screen": "M4 · 05 Předpověď objednávek, ověřená zpětně", "source": "cost-model-study#CR5, #CR8 · ADR 0046 decision 10 (3)", "status": "planned"}, {"n": 9, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the value of information", "detail": "EVPPI per input in Kč, before and after the latest data, with how each could be verified; the total value of perfect information (3,8 → 2,4 mil. Kč). This is the only place a crown value of information appears.", "fields": ["Předpoklad", "Před daty", "Po nich", "Jak ověřit", "EVPI"], "rule": "Material at ≥ 5 % of the absolute expected difference; an offer creates nothing until a person starts it", "output": "Value-of-information table and verification offers", "onFail": null, "screen": "M4 · 06 Hodnota informace: co ještě ověřit", "source": "cost-model-study#CR6 · ADR 0046 W3", "status": "planned"}, {"n": 10, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the verdict at other discount rates", "detail": "The verdict recomputed at the alternative rates beside the study's fixed rate (the canvas names 6 % and 10 % around 8 %).", "fields": ["rate", "verdict per rate"], "rule": "One rate decides; the others are shown, never used to pick", "output": "Rate sensitivity of the verdict", "onFail": null, "screen": "not drawn on M4; stated on M2 · 02 Pevné parametry", "source": "ADR 0046 W16, decision 10 (4)", "status": "decided"}, {"n": 11, "phase": "Finance", "actor": "Code", "action": "Build the business case per option", "detail": "Per option against B: investment, NPV at 8 % as median and interval (odhad) with \"v základu\", NPV after tax at 21 % with legal depreciation, IRR and discounted payback at base (výpočet).", "fields": ["Investice", "NPV (8 %) · medián a 90% interval", "po dani", "IRR", "Návratnost (diskontovaná)"], "rule": "IRR by a stated root rule; the rule reads the NPV Zadání named, the other beside it", "output": "Business-case table", "onFail": "multiple_irr (each root listed), no_irr, none_within_horizon", "screen": "M4b · 01 Business case", "source": "cost-model-study#CM7 · quantitative-families#FIN2 · ADR 0046 W18", "status": "planned"}, {"n": 12, "phase": "Finance", "actor": "Code", "action": "Show cash flow by year and price break-evens", "detail": "The recommended option's yearly benefit and outlay against B with the discounted cumulative line and the payback marked; each price's break-even alone, others at base, for supplier negotiation.", "fields": ["year", "roční přínos", "roční výdaj", "kumulovaně", "Cena", "Dnes", "Bod zvratu"], "rule": "Each price varied alone (one-way)", "output": "Cash-flow chart and price break-even table", "onFail": null, "screen": "M4b · 02 Peněžní tok; 03 Ceny pro bod zvratu", "source": "quantitative-families#FIN4, #FIN6 · cost-model-study#CR2", "status": "planned"}, {"n": 13, "phase": "Finance", "actor": "Code", "action": "Estimate price elasticity from client data", "detail": "A log-log fit of orders on delivery price from the client's own price change (−0,38, 90 % interval −0,45 až −0,22), and the discount that would win back lost orders.", "fields": ["elasticity", "90% interval", "source event", "discount", "net effect"], "rule": "A registered Metodika method; internal until registered", "output": "An ESTIMATED elasticity marked odhad (interní)", "onFail": null, "screen": "M4b · 04 Cenová elasticita a cena dopravy", "source": "quantitative-families#FIN5 · ADR 0046 W8", "status": "planned"}, {"n": 14, "phase": "Účetnictví", "actor": "Code", "action": "Show baseline statements and plan against actual", "detail": "The 2025 P&L and balance sheet from the client's ledger export through the chart-of-accounts mapping, reconciled with the 3PL invoices; plan against actual per line as absolute and share.", "fields": ["Výsledovka 2025", "Rozvaha k 31. 12. 2025", "Plán", "Skutečnost", "Rozdíl"], "rule": "Every account mapped; price/volume/mix only where the contract declares quantities", "output": "Statements and variance (z dat klienta)", "onFail": "Unmapped account refused by name; does_not_balance named with the difference", "screen": "M4c · 01 Výchozí stav 2025; 02 Plán proti skutečnosti", "source": "quantitative-families#ACC1, #ACC2, #ACC4", "status": "planned"}, {"n": 15, "phase": "Účetnictví", "actor": "Code", "action": "Project health ratios per option", "detail": "EBITDA, margin, net debt / EBITDA, ROCE and current ratio in 2028 for each option at base, with the financing assumption stated (hall from a loan, switch from cash).", "fields": ["Ukazatel", "2025", "per option · 2028"], "rule": "Closed list of ratios, each with its formula", "output": "Ratio table (výpočet)", "onFail": "A zero denominator is undefined, never infinity or 0", "screen": "M4c · 03 Ukazatele zdraví firmy v roce 2028", "source": "quantitative-families#ACC3 · KM8Accounting board (per-option projection)", "status": "proposed"}, {"n": 16, "phase": "Provoz", "actor": "Code", "action": "Plan capacity, routing and stock", "detail": "Monthly order forecast against supplier capacity; a monthly linear program (HiGHS) minimising logistics cost and lost contribution un  dates)"]}], "gaps": ["The canvas's rule is multi-option with a risk bound (P(loss > 10 mil.) ≤ 10 %) and a hard constraint (the city promise); CR7 defines a pairwise rule (one option, one threshold, a confidence). How is a rule over seven options with a risk bound and constraints represented and judged, and who checks a constraint like \"Slib ve městech\"?", "Client surface for unregistered estimates: W27 says they reach the client report labelled with an approval warning, but CP10 still refuses them on the client surface and M4's banner says the client report carries only výpočet and ranges. Which is built?", "Where do the Finance, Účetnictví and Provoz figures per option come from? quantitative-families computes statements from a ledger and ratios from statements, but the canvas projects 2028 statements and ratios per option and a monthly LP: what links the cash-flow model to those projections?", "The verification offer: CR6 offers \"Ověřit výzkumem\" (a survey study), which the freeze removed; the canvas's \"Jak ověřit\" lists data requests and contract terms. What does a material EVPPI now offer, and what does it create?", "Where is the verdict at other discount rates drawn, and which rates (W16)? M4 has no section for it.", "What does \"Přidat do osnovy zprávy\" hand over: a single number, a whole section, a chart spec? And what happens to an added point when the run is rerun or a result goes stale?", "The exact range table and dominance (CR2, CR8) are planned for Výsledky but not drawn on M4; where do they sit beside the Monte Carlo table?"]}, "sociomapa": {"purpose": "Show which objects the rows rate alike, and how firm that picture is, by one engine and two map types; it supports the recommendation and never makes it.", "actors": ["Researcher", "Ada", "Code", "Metodika", "Client's people"], "process": [{"n": 1, "phase": "Configuration", "actor": "Ada", "action": "Propose the configuration", "detail": "From where the rows come from and what is asked, Ada proposes one of the five configurations, with its two declarations: do the objects share a scale, and how do the rows depend.", "fields": ["map type", "configuration", "shared scale", "row dependence"], "rule": "Proposed before any map is computed, never after (MOD-3.3).", "output": "The configuration pinned on the study's Sociomapa run.", "onFail": "A configuration not in the register can still run, labelled internal.", "screen": null, "source": "lifecycle page · MOD-13.1 · R2-Q15", "status": "decided"}, {"n": 2, "phase": "Configuration", "actor": "Researcher", "action": "Confirm or change it", "detail": "The researcher accepts the proposal or picks another configuration; the choice is recorded.", "fields": ["configuration", "who", "when"], "rule": "A valve: nothing is computed before it is confirmed.", "output": "The confirmed configuration.", "onFail": null, "screen": null, "source": "MODULES.md module 13", "status": "planned"}, {"n": 3, "phase": "Rows", "actor": "Code", "action": "Build the table", "detail": "Futures and weight settings from the model run under its seed; experts' ratings from the rating form; units and months from the client's data contract.", "fields": ["source", "row count", "objects", "seed"], "rule": "Each table named and saved, so every map traces to its exact table.", "output": "The row matrix.", "onFail": "Fewer rows than the configuration's minimum: refused by name.", "screen": null, "source": "sociomapa-systemu#SYS9 #SYS10 #SYS11 · mindmap", "status": "planned"}, {"n": 4, "phase": "Preparation", "actor": "Metodika", "action": "Declare the preparation", "detail": "Row mean removed (futures, experts); a 0–10 value scale then row mean (weights); z across units; trend removed then z (months); direction aligned for every indicator.", "fields": ["transformation", "direction", "declared at"], "rule": "Frozen before any result; a change after is a new revision the report names.", "output": "The declared preparation, pinned with the run.", "onFail": null, "screen": null, "source": "sociomapa-systemu#SYS2 · MOD-11.1", "status": "planned"}, {"n": 5, "phase": "Map", "actor": "Code", "action": "Compute the map", "detail": "aia-sociomap-5: pair relations (baseline-corrected r̃, or correlation of standardised columns), layout on the ruler, heights and terrain where defined, split-half agreement.", "fields": ["r̃ per pair", "layout method", "iterations", "converged", "heights", "split-half"], "rule": "One engine for every configuration; a configuration is data, not code.", "output": "The map.", "onFail": null, "screen": null, "source": "engine_v2.compute_object_map · AIA_SOCIOMAP_V5", "status": "decided"}, {"n": 6, "phase": "Test", "actor": "Code", "action": "Run the scenario test", "detail": "Futures: the map under driver correlation 0, 0,4 and 0,8 and on a new sample; Spearman of distances ≥ 0,8 for every two. Weights: shares of first place in three fan widths.", "fields": ["assumptions", "samples", "ρ per pair of maps", "shares first / tied"], "rule": "No p-values: the model makes as many rows as we ask for.", "output": "The stability verdict and the shares.", "onFail": "Printed as is; distances are then not read.", "screen": null, "source": "lifecycle page: Budoucnosti, Nastavení vah", "status": "planned"}, {"n": 7, "phase": "Test", "actor": "Code", "action": "Run the observed-data test", "detail": "Experts: whole experts resampled, one radius 1,2 × median spread. Units: 400 bootstraps, a pair drawn when its 95 % interval excludes zero. Months: 1 000 IAAFT surrogates, Benjamini–Yekutieli, effective months.", "fields": ["resamples", "radius", "intervals", "q", "n_eff"], "rule": "Resample the way the rows depend on each other.", "output": "The test result per pair or per map.", "onFail": "A pair that fails is not drawn.", "screen": null, "source": "lifecycle page: Experti, Jednotky, Měsíce", "status": "planned"}, {"n": 8, "phase": "Tables", "actor": "Code", "action": "Build the tables beside the map", "detail": "H icator table", "fields": ["indicator", "unit", "source + date", "direction", "weight", "group", "value per object"], "states": ["draft", "frozen"]}, {"name": "Expert rating", "fields": ["expert name", "criterion", "option", "score 0–10", "when"], "states": ["missing", "scored"]}, {"name": "Map snapshot", "fields": ["map artifact id", "view", "render artifact (by hash)", "approval"], "states": ["stored", "approved"]}], "handoffs_out": [{"name": "Map points", "to": ["osnova"], "contents": ["claim text", "configuration", "test result", "tables beside the map", "register status", "never-claim list"]}, {"name": "Map figure", "to": ["osnova", "zprava"], "contents": ["stored snapshot render", "three results", "label 'metoda čeká na schválení metodikem'"]}], "gaps": ["What height means on the units and months maps (open, methodologist).", "Whether the indicator profile is a sixth configuration (R2-Q22).", "The minimum rows for each configuration, from its planted-answer test.", "The fan widths and the number of weight settings for the crossed grid.", "The declared error rate a no-relation world may show before a register entry.", "What happens to the map when the model is rerun or the Předpoklady change: stale, recomputed, or reopened?"]}, "osnova": {"purpose": "Lay out the report as its bare points (each claim or number with its visual and a resolving link to its source or method) so a person can verify everything before any prose is written.", "actors": ["Researcher", "Ada", "Code", "Client's people"], "process": [{"n": 1, "phase": "Structure", "actor": "Ada", "action": "Propose the outline's chapters", "detail": "Ada proposes the report outline (chapters and sections in report order) from the brief, the selected frameworks and the study's results; the canvas shows 5 chapters and 17 points.", "fields": ["chapter", "section", "order", "framework", "chapter kind"], "rule": "A person accepts each change; an outline the person has not approved does not compose (ledger subject     for(let i=0;i<cards.length-1;i++){const a=cards[i],c=cards[i+1];const x1=a.left+a.width/2-b.left,y1=a.bottom-b.top,x2=c.left+c.width/2-b.left,y2=c.top-b.top;const my=y1+(y2-y1)/2;
      d+=Math.abs(x1-x2)<2?`M${x1},${y1}V${y2-2}`:`M${x1},${y1}V${my}H${x2}V${y2-2}`}
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--strong)" stroke-width="1.6"/>`;
  });

/* ================= language: Czech by default, English one click away ================= */
/* The page is written in English. In Czech mode every piece of text that is drawn is looked up in CS and
   replaced, numbers carried across. The lookup key is the English text with each number replaced by §.
   Text inside [data-notr] is left alone: plan chunks and the build detail of each step are quoted from the
   plan files, which are in English. */
const LANG_KEY="aia-mvp-map-lang";
let LANG="cs"; try{const l=localStorage.getItem(LANG_KEY);if(l==="en"||l==="cs")LANG=l}catch(e){}
const CS=JSON.parse(document.getElementById("i18n-cs").textContent);
const NUM=/\d+(?:[.,]\d+)*/g;
/* Numbers are carried into the Czech text. The page writes decimals both ways (0,871 and 0.82) and thousands the
   English way (20,000), so: a comma group counts as thousands only when the number does not start with 0;
   a point becomes a comma; and a number that is part of an id (MOD-13.1, v1.2) is left exactly as it is. */
function csNum(x,idLike){if(idLike)return x;return /^[1-9]\d{0,2}(,\d{3})+$/.test(x)?x.replace(/,/g," "):/^\d+\.\d+$/.test(x)?x.replace(".",","):x}
function tr(text){const t=text.trim();if(!t)return text;const s=t.replace(/\s+/g," "),nums=[];const key=s.replace(NUM,(m,off)=>{nums.push([m,/[A-Za-z]-?$/.test(s.slice(Math.max(0,off-2),off))]);return "§"});
  const cs=CS[key];if(cs===undefined)return text;let i=0;return text.replace(t,cs.replace(/§/g,()=>{const n=nums[i++];return n?csNum(n[0],n[1]):""}))}
const TR_ATTRS=["placeholder","aria-label","title"];
function trTree(root){if(LANG!=="cs")return;
  if(root.nodeType===3){if(root.parentElement&&!root.parentElement.closest("[data-notr],script,style,textarea")){const o=tr(root.nodeValue);if(o!==root.nodeValue)root.nodeValue=o}return}
  if(root.nodeType!==1||root.closest("[data-notr],script,style,textarea"))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){if(n.parentElement.closest("[data-notr],script,style,textarea"))continue;const o=tr(n.nodeValue);if(o!==n.nodeValue)n.nodeValue=o}
  for(const el of [root,...root.querySelectorAll("[placeholder],[aria-label],[title]")]){if(el.closest("[data-notr]"))continue;for(const a of TR_ATTRS){const val=el.getAttribute&&el.getAttribute(a);if(val){const o=tr(val);if(o!==val)el.setAttribute(a,o)}}}
}
new MutationObserver(ms=>{if(LANG!=="cs")return;for(const m of ms)for(const n of m.addedNodes)trTree(n)}).observe(document.body,{childList:true,subtree:true});
function renderLang(){document.documentElement.lang=LANG;$("#lang").innerHTML=[["cs","Česky"],["en","English"]].map(([k,l])=>`<button data-lang="${k}" aria-pressed="${LANG===k}">${l}</button>`).join("")}
function renderNav(){document.getElementById("nav").innerHTML=NAV.map(([h,l,i])=>`<a href="#${h}">${ico(i)}${l}</a>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;LANG=b.dataset.lang;try{localStorage.setItem(LANG_KEY,LANG)}catch(x){}

    for(const k of pending){const v=marks[k];if(v&&(v.stance||v.note||v.answer||v.star))fresh[k]=v;else delete fresh[k]}
    marks=fresh;lsSave();rerenderSoft()},e=>setSave("Sync stopped","warn"));

})();
