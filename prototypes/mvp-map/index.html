<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AIA MVP Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Built for a shared screen: 17px body, one idea per tile, icons and colour by step group.
   Plain words first; the technical detail (plan ids, method names) sits underneath in a smaller line. */
:root{
  --bg:#f6f7f8; --raised:#ffffff; --sunken:#eef0f2; --border:#dfe3e7; --strong:#7d858d;
  --ink:#13171b; --muted:#454e57; --faint:#5c656e;
  --signal:#0f6577; --signal-wash:#e1eff2; --signal-tint:#f1f7f8; --on-signal:#ffffff;
  --you:#a33a05; --you-wash:#fdeee2; --ok:#1d7a4e; --ok-wash:#e2f3ea; --bad:#c22b2f; --bad-wash:#fcebeb;
  --world:#5d6872; --world-wash:#eceff2; --ai-wash:#f2f6f7; --ai-edge:#cbd7da;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#4a3aa7; --v6:#d4558a;
  --stage:#14171c; --t1:#2c3e9e; --t3:#2aa3d8; --t5:#2bb53f; --t7:#e7ee31; --t10:#c8302a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1113; --raised:#15191c; --sunken:#0a0c0e; --border:#262c31; --strong:#626d76;
  --ink:#e8ecee; --muted:#b3bcc3; --faint:#929ca4;
  --signal:#4fb2c3; --signal-wash:#12272c; --signal-tint:#0f1c20; --on-signal:#0e1113;
  --you:#ffb07a; --you-wash:#3a2416; --ok:#4cc38a; --ok-wash:#12301f; --bad:#ff6f6c; --bad-wash:#3a1a1c;
  --world:#9aa7b2; --world-wash:#1d2328; --ai-wash:#182024; --ai-edge:#34434a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#9085e9; --v6:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1113; --raised:#15191c; --sunken:#0a0c0e; --border:#262c31; --strong:#626d76;
  --ink:#e8ecee; --muted:#b3bcc3; --faint:#929ca4;
  --signal:#4fb2c3; --signal-wash:#12272c; --signal-tint:#0f1c20; --on-signal:#0e1113;
  --you:#ffb07a; --you-wash:#3a2416; --ok:#4cc38a; --ok-wash:#12301f; --bad:#ff6f6c; --bad-wash:#3a1a1c;
  --world:#9aa7b2; --world-wash:#1d2328; --ai-wash:#182024; --ai-edge:#34434a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#9085e9; --v6:#d55181; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--raised)}
a{color:var(--signal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--raised);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:12px}
.brand h1{font:600 24px/1.2 var(--serif);margin:0}
nav.views{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav.views a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500;font-size:16px;display:inline-flex;gap:8px;align-items:center}
nav.views a svg{width:20px;height:20px}
nav.views a[aria-current="page"]{background:var(--signal-wash);color:var(--ink)}
nav.views a:hover{color:var(--ink)}
.save{font:14px var(--sans);color:var(--faint);white-space:nowrap}
.save.ok{color:var(--ok)} .save.warn{color:var(--you)}
main{padding-block:28px 80px}
h2{font:600 36px/1.15 var(--serif);margin:0 0 8px;text-wrap:balance}
h3{font-size:20px;font-weight:600;margin:0;line-height:1.3}
h4{font-size:17px;font-weight:600;margin:0}
.lede{color:var(--muted);max-width:72ch;margin:0 0 20px;font-size:19px}
.cap{font-size:15px;color:var(--faint)}
.tech{font:14px/1.45 var(--mono);color:var(--faint)}
.mono{font-family:var(--mono)}
.eyebrow{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:2px 10px;border-radius:999px;font:500 14px/20px var(--sans);border:1px solid var(--border);background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.w1{background:var(--signal-wash);color:var(--ink);border-color:transparent}
.chip.w2{background:var(--ok-wash);color:var(--ink);border-color:transparent}
.chip.w3{background:var(--you-wash);color:var(--ink);border-color:transparent}
.chip.w4{background:var(--world-wash);color:var(--ink);border-color:transparent}
.chip.parked,.chip.post,.chip.uns{background:transparent;color:var(--faint);border-style:dashed}
.chip.done{background:var(--ok);color:var(--on-signal);border-color:transparent}
.chip.open{background:var(--you-wash);color:var(--you);border-color:transparent;font-weight:600}
.chip.dec{background:var(--signal-wash);color:var(--ink);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 18px;border-radius:8px;border:1px solid var(--strong);background:var(--raised);cursor:pointer;font-weight:500;font-size:16px}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
input[type=search],input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--strong);border-radius:8px;padding:8px 12px;min-width:0;min-height:44px}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--signal)}

/* group colours */
.g0{--g:var(--world)} .g1{--g:var(--v1)} .g2{--g:var(--v3)} .g3{--g:var(--v4)} .g4{--g:var(--v2)} .g5{--g:var(--v6)}
.badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--g) 16%,var(--raised));color:var(--g);flex:none}
.badge .ico{width:28px;height:28px}
.badge.big{width:72px;height:72px;border-radius:20px}.badge.big .ico{width:40px;height:40px}

/* ---- process map ---- */
.map{background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:18px;overflow-x:auto}
.mapgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0 14px;min-width:1180px}
.grp{grid-row:1;border-top:5px solid var(--g);padding-top:8px;margin-bottom:14px}
.grp b{font-size:17px;display:block}
.grp span{font-size:15px;color:var(--faint)}
.node{grid-row:2;position:relative;text-align:left;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:11px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:236px;min-width:0}
.node:hover{border-color:var(--g)}
.node[aria-pressed="true"]{border-color:var(--g);background:color-mix(in srgb,var(--g) 7%,var(--raised));box-shadow:0 6px 18px color-mix(in srgb,var(--g) 22%,transparent)}
.node .num{font:600 15px var(--sans);color:var(--g)}
.node .nm{font-weight:600;font-size:clamp(16px,1.2vw,21px);line-height:1.15}
.node .what{font-size:15px;color:var(--muted);line-height:1.35}
.node .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.node .model-only{font:600 13px var(--sans);color:var(--you)}
.node .ct{font-size:14px;color:var(--faint)}
.node .ct b{color:var(--ink)}
.node:not(:last-child)::after{content:"";position:absolute;right:-13px;top:34px;border:6px solid transparent;border-left:8px solid var(--strong)}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--faint);line-height:1.1}
.stats span{display:flex;flex-direction:column}
.stats b{font-size:19px;color:var(--ink);font-weight:600}
.stats .o b{color:var(--you)} .stats .k b{color:var(--ok)}
.wbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.wbar i{display:block;height:100%}
.story{grid-row:3;margin-top:10px;font:15px/1.35 var(--serif);color:var(--ink);background:var(--sunken);border-radius:10px;padding:10px 12px;border-left:4px solid var(--g)}
.lane{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0 14px;min-width:1180px;margin-top:10px}
.lanebar{border-radius:10px;padding:10px 14px;font-size:16px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid transparent;text-align:left;background:var(--sunken)}
.lanebar b{font-weight:600;white-space:nowrap}
.lanebar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanebar[aria-pressed="true"]{border-color:var(--signal)}
.lane.ada .lanebar{background:var(--ai-wash);border-color:var(--ai-edge)}
.lane.met .lanebar{background:var(--you-wash)}
.lane.law .lanebar{background:var(--world-wash)}
.lane.ev .lanebar{background:var(--signal-wash)}
.lane .lanebar[aria-pressed="true"]{border-color:var(--ink)}
.legendrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:12px 0 0;font-size:15px;color:var(--muted)}
.legendrow i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* ---- stage detail ---- */
.panel{background:var(--raised);border:1px solid var(--border);border-radius:14px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel>.pb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.sthead{padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 24px;align-items:start;border-bottom:1px solid var(--border)}
@media (max-width:800px){.sthead{grid-template-columns:auto minmax(0,1fr)}.sthead .nav{grid-column:1/-1}}
.sthead h2{font-size:40px;margin:0}
.sthead .en{font:500 20px var(--sans);color:var(--faint);margin-left:10px}
.explain{font-size:20px;line-height:1.5;margin:10px 0 0;max-width:70ch}
.velis{display:flex;gap:14px;align-items:flex-start;margin:16px 0 0;padding:14px 18px;border-radius:12px;background:var(--sunken);border-left:5px solid var(--g);max-width:90ch}
.velis b{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--g);display:block;margin-bottom:2px}
.velis p{margin:0;font:18px/1.45 var(--serif)}
.flowrow{display:grid;grid-template-columns:minmax(240px,1fr) 40px minmax(0,2.3fr) 40px minmax(240px,1fr);gap:0;align-items:stretch;padding:24px}
@media (max-width:1100px){.flowrow{grid-template-columns:1fr}.flowrow .arr{transform:rotate(90deg);height:40px}}
.iobox{border-radius:12px;padding:16px;background:var(--sunken);display:flex;flex-direction:column;gap:6px}
.iobox .eyebrow{color:var(--g)}
.iobox p{margin:0;font-size:17px}
.arr{display:grid;place-items:center;color:var(--strong)}
.arr .ico{width:32px;height:32px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:2px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--raised);position:relative}
.tile .tn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font:600 15px var(--sans)}
.tile h4{font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.tile .marks{margin-top:auto;padding-top:6px}
@media (hover:hover){.tile .marks,.item .marks,.card .marks,.acard .marks{opacity:0;transition:opacity .12s}
 .tile:hover .marks,.tile:focus-within .marks,.item:hover .marks,.item:focus-within .marks,.card:hover .marks,.card:focus-within .marks,.acard:hover .marks,.acard:focus-within .marks,.marks.has{opacity:1}}
.tile.marked-keep,.item.marked-keep{border-color:var(--ok)} .tile.marked-change,.item.marked-change{border-color:var(--you)} .tile.marked-cut,.item.marked-cut{border-color:var(--bad)} .tile.marked-later,.item.marked-later{border-color:var(--world)} .tile.marked-discuss,.item.marked-discuss{border-color:var(--signal)}
.tile.marked-cut h4,.tile.marked-cut p{text-decoration:line-through;opacity:.7}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.item{border:2px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;background:var(--raised)}
.item .idc{font:500 14px var(--mono);color:var(--faint);white-space:nowrap;padding-top:3px}
.item .tx{font-size:17px;min-width:0}
.item .tx.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.q{background:color-mix(in srgb,var(--you) 5%,var(--raised))}
.item.q .idc{color:var(--you)}
.marks{display:inline-flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.mk{border:1px solid var(--border);background:var(--raised);border-radius:8px;font:500 14px var(--sans);padding:4px 10px;cursor:pointer;min-height:34px;color:var(--muted)}
.mk:hover{border-color:var(--strong);color:var(--ink)}
.mk[aria-pressed="true"].keep{background:var(--ok);color:var(--on-signal);border-color:var(--ok)}
.mk[aria-pressed="true"].change{background:var(--you);color:var(--bg);border-color:var(--you)}
.mk[aria-pressed="true"].cut{background:var(--bad);color:var(--on-signal);border-color:var(--bad)}
.mk[aria-pressed="true"].later{background:var(--world);color:var(--bg);border-color:var(--world)}
.mk[aria-pressed="true"].discuss{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
.mk.note[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
.notebox{grid-column:1/-1}
.quote{font-family:var(--serif);font-size:16px;color:var(--muted);border-left:3px solid var(--strong);padding-left:10px;margin-top:4px}
.more{background:none;border:0;color:var(--signal);cursor:pointer;font-size:15px;padding:0;min-height:32px}
.empty{color:var(--faint);font-size:16px;padding:6px 0;margin:0}
.ideaform{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:560px){.ideaform{grid-template-columns:1fr}}
details.builders{margin-top:20px}
details.builders>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;font-size:20px;font-weight:600}
details.builders>summary::-webkit-details-marker{display:none}
details.builders>summary .chev{transition:transform .15s}
details.builders[open]>summary .chev{transform:rotate(90deg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--raised);padding:6px 14px;cursor:pointer;font-size:15px;font-weight:500;min-height:40px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.planhead{font-size:16px;font-weight:600;margin-top:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* grades */
.grades{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grades{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.grades{grid-template-columns:1fr 1fr}}
.grade{border-radius:12px;padding:14px;background:var(--sunken);border-top:5px solid var(--gc);display:flex;flex-direction:column;gap:4px}
.grade b{font-size:18px}
.grade p{margin:0;font-size:15px;color:var(--muted);line-height:1.4}
.grade .ex{font:15px/1.4 var(--serif);color:var(--ink)}

/* ---- sociomapa ---- */
.cols{display:grid;gap:16px}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))} .c3{grid-template-columns:repeat(3,minmax(0,1fr))} .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1200px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.c4,.c3,.c2{grid-template-columns:1fr}}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.mvp{border-top:5px solid var(--signal)} .card.later{border-top:5px dashed var(--strong)}
.card p{margin:0}
.claim{font:600 19px/1.35 var(--serif)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:16px;margin:0}
.kv dt{color:var(--faint)} .kv dd{margin:0}
.section{margin-top:36px}
.section>h2{font-size:30px}
.readmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.readmap{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.readmap{grid-template-columns:1fr}}
.rm{background:var(--raised);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.rm svg{display:block;width:100%;height:auto;background:var(--stage)}
.rm div{padding:12px 16px}
.rm b{font-size:18px;display:block}
.rm p{margin:4px 0 0;color:var(--muted);font-size:16px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1200px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pstep{border:2px solid var(--border);border-radius:12px;background:var(--raised);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.pstep:hover{border-color:var(--strong)}
.pstep[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-tint);box-shadow:0 6px 18px color-mix(in srgb,var(--signal) 20%,transparent)}
.pstep .top{display:flex;align-items:center;gap:10px}
.pstep .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 16px var(--sans);flex:none}
.pstep.kept .n{background:var(--strong)}
.pstep .t{font-weight:600;font-size:18px;line-height:1.25}
.pstep .s{font-size:15px;color:var(--muted);line-height:1.35}
.pstep .tag{margin-top:auto}
.stepdetail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:1000px){.stepdetail{grid-template-columns:1fr}}
.bigplain{font-size:21px;line-height:1.5;margin:6px 0 14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
.cmp>div{padding:14px;font-size:16px}
.cmp>div:first-child{background:var(--sunken);border-right:1px solid var(--border)}
.cmp b{display:block;font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px}
.why{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:17px;padding:12px 14px;border-radius:10px;background:var(--you-wash)}
.demo{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}
@media (max-width:1000px){.demo{grid-template-columns:1fr}}
.mapbox{background:var(--stage);border-radius:14px;overflow:hidden;position:relative}

/* ---- waves ---- */

.pill.m-keep{box-shadow:inset 0 -3px 0 var(--ok)} .pill.m-change{box-shadow:inset 0 -3px 0 var(--you)} .pill.m-cut{box-shadow:inset 0 -3px 0 var(--bad);text-decoration:line-through} .pill.m-later{box-shadow:inset 0 -3px 0 var(--world)} .pill.m-discuss{box-shadow:inset 0 -3px 0 var(--signal)}

ys yes.":"Nestaví se, dokud někdo neřekne ano.","The indicator profile map: options compared on company-independent indicators":"Mapa profilu ukazatelů: varianty porovnané podle ukazatelů nezávislých na firmě","A test dataset built from real public figures, with its answer sealed first":"Testovací datová sada sestavená ze skutečných veřejných čísel, s odpovědí předem zapečetěnou","The processed data file and map coordinates as client deliverables":"Soubor zpracovaných dat a souřadnice map jako výstupy pro klienta","A competitor analysis as the second acceptance case":"Analýza konkurence jako druhý přijímací případ","After the MVP":"Po MVP","Planned, but not needed for the first client.":"Plánováno, ale pro prvního klienta to není potřeba.","More model types: pricing, market entry, investment, make or buy, hiring, financing":"Další typy modelů: cenotvorba, vstup na trh, investice, vyrobit, nebo koupit, nábor, financování","Reports in English":"Zprávy v angličtině","Maps compared across years, and maps redrawn when a scenario changes the data":"Mapy porovnané mezi roky a mapy překreslené, když scénář změní data","mindmap":"myšlenková mapa","Machine learning: weights learned from outcomes and past shocks, customer and product groups, delivery-time models":"Strojové učení: váhy naučené ze skutečných výsledků a z minulých šoků, skupiny zákazníků a produktů, modely dodacích lhůt","Further statistical methods that need rows a client rarely has yet":"Další statistické metody, které potřebují řádky, jaké klient zatím málokdy má","Methods tab":"záložka Metody","Out":"Mimo","Decided against, or frozen.":"Zamítnuto, nebo zmrazeno.","The AI-respondent survey: frozen now, archived after MVP acceptance":"Průzkum s AI respondenty: nyní zmrazen, po přijetí MVP archivován","Respondent maps, the panel and the population":"Mapy respondentů, panel a populace","The old -§ strategy map":"Stará strategická mapa -§","Sending client data to an outside machine-learning service":"Odesílání dat klienta do vnější služby strojového učení","Legal advice: the law is cited, never interpreted for the client":"Právní poradenství: právní předpis se cituje, klientovi se nikdy nevykládá","Waiting for a decision":"Čeká na rozhodnutí","§ questions are open. Each has its background and a proposed answer on the":"Otevřených otázek: §. Ke každé najdete souvislosti a navrženou odpověď na záložce","tab.":".","For you, the product owner":"Pro vás, vlastníka produktu","Which scope is the MVP: everything, or one study as the spine?":"Jaký rozsah má MVP: všechno, nebo jedna studie jako páteř?","Is the indicator profile in the MVP, and as what?":"Patří profil ukazatelů do MVP a v jaké podobě?","Does the fixed-price Czech §PL back up the Polish §PL?":"Zálohuje český §PL s pevnou cenou polský §PL?","Financial statements: review PDFs by hand, or buy structured data?":"Účetní závěrky: procházet PDF ručně, nebo koupit strukturovaná data?","Do M-§ to M-§ and TD-§ define the MVP's acceptance?":"Určují M-§ až M-§ a TD-§ přijetí MVP?","Is the competitor analysis the second acceptance case?":"Je analýza konkurence druhým přijímacím případem?","Who builds the test dataset from real figures, and when?":"Kdo sestaví testovací datovou sadu ze skutečných čísel a kdy?","Does the client also get the processed data and the map coordinates?":"Dostane klient také zpracovaná data a souřadnice map?","Public data connectors: in the MVP or after it?":"Napojení na veřejná data: v MVP, nebo až po něm?","Which machine-learning use comes first after the MVP?":"Které využití strojového učení přijde po MVP jako první?","What is the first real client study?":"Jaká bude první studie pro skutečného klienta?","For the methodologist":"Pro metodologa","What “close” means on the indicator profile":"Co znamená „blízko“ u profilu ukazatelů","How each indicator is put on one scale":"Jak se každý ukazatel převádí na společnou škálu","Where the weights act on the indicator profile":"Kde v profilu ukazatelů působí váhy","Minimum rows for each configuration":"Nejmenší počet řádků pro každou konfiguraci","What does height mean on the units and months maps?":"Co znamená výška na mapách jednotek a měsíců?","Fan widths and the number of weight settings":"Šířky vějíře a počet nastavení vah","The methodologist's register entries":"Zápisy metodologa v registru metod","Raised by the coordinator":"Vznesl koordinátor","The plan files still use the § Nov wording for the maps":"Soubory plánů stále používají pro mapy znění z §. listopadu","Is flagging tax rules regulated tax advice in Czech law?":"Je upozorňování na daňová pravidla podle českého práva regulovaným daňovým poradenstvím?","Which decision types get a model template after cost scenarios?":"Které typy rozhodnutí dostanou po nákladových scénářích šablonu modelu?","How does the client see a shared stop?":"Jak klient uvidí sdílenou zastávku?","Where to read next":"Kde číst dál","Executive":"Vedení","What are we building, what is still open, and when is it done?":"Co stavíme, co je ještě otevřené a kdy bude hotovo?","what has been decided, in your words, and what waits for you":"co je rozhodnuto, vašimi slovy, a co čeká na vás","the twelve statements that define a finished MVP":"dvanáct tvrzení, podle kterých se pozná hotové MVP","how much work sits in each wave":"kolik práce je v každé vlně","Build team":"Tým stavby","What exactly happens in each step, and in what order do we build it?":"Co přesně se děje v každém kroku a v jakém pořadí to stavíme?","each step's process, data objects, plan chunks and what is not designed yet":"postup každého kroku, jeho datové objekty, díly plánu a to, co ještě není navrženo","what every step receives and passes on":"co každý krok přijímá a co předává dál","every plan chunk by wave":"všechny díly plánu po vlnách","Methodologist":"Metodolog","Which methods need my approval, and what do you propose for each?":"Které metody potřebují mé schválení a co u každé navrhujete?","the ten calculation steps, each map's test and your thirteen questions":"deset kroků výpočtu, zkouška každé mapy a vašich třináct otázek","six methods for the MVP, each with a question for you":"šest metod pro MVP, každá s otázkou pro vás","filter “for Aram” to see only what waits for you":"filtr „pro Arama“ ukáže jen to, co čeká na vás","Four documents, one scope":"Čtyři dokumenty, jeden rozsah","The MVP is described in three artifacts and one scope record in the repo. They were compared on § Nov §. This page now carries what the others say and marks what is still undecided.":"MVP popisují tři artefakty a jeden záznam rozsahu v repozitáři. Porovnali jsme je §. listopadu §. Tato stránka teď obsahuje to, co říkají ostatní, a označuje, co je stále nerozhodnuté.","Document":"Dokument","What it is for":"K čemu slouží","The example it uses":"Jaký příklad používá","MVP scope, version §":"Rozsah MVP, verze §","§ Nov §":"§. listopadu §","A scope record in the repo (prototypes/obchodni-model/MVP-SCOPE.md), with your decisions of § and § Nov: one study as the spine, what is parked, five two-week waves and how the MVP is accepted. There is a ten-page Czech version for executives beside it.":"Záznam rozsahu v repozitáři (prototypes/obchodni-model/MVP-SCOPE.md) s vašimi rozhodnutími z §. a §. listopadu: jedna studie jako páteř, co je odloženo, pět dvoutýdenních vln a jak se MVP přijímá. Vedle něj je desetistránková česká verze pro vedení.","ChemVitro: a site decision, the case behind “report §”.":"ChemVitro: rozhodnutí o lokalitě, případ, ze kterého vychází „zpráva §“.","This page. The whole MVP: the nine steps, who does what, what is decided and open, the build order and the tests that say it is done.":"Tato stránka. Celé MVP: devět kroků, kdo co dělá, co je rozhodnuto a co otevřeno, pořadí stavby a testy, které říkají, že je hotovo.","Velis Commerce: where to store and ship its orders, seven options. The numbers illustrate the journey; nothing is computed.":"Velis Commerce: kde skladovat a odkud odesílat objednávky, sedm variant. Čísla ilustrují cestu; nic není spočítáno.","The textbook for the maps, in Czech (“Životní cykly Sociomapy”): the two map types and five configurations, each with its test, its limits and what it may claim.":"Učebnice map, česky („Životní cykly Sociomapy“): dva typy map a pět konfigurací, každá se svou zkouškou, svými mezemi a s tím, co smí tvrdit.","A delivery firm renewing its fleet, six options. Invented data, computed by the real engine.":"Doručovací firma obnovuje vozový park, šest variant. Vymyšlená data, spočítaná skutečným výpočetním jádrem.","AIA MVP (mindmap)":"AIA MVP (myšlenková mapa)","§–§ Nov §":"§.–§. listopadu §","The indicator-map idea: options compared on company-independent indicators, one weighted table per map, its open decisions and a test dataset close to reality.":"Myšlenka mapy ukazatelů: varianty porovnané podle ukazatelů nezávislých na firmě, jedna vážená tabulka na mapu, její otevřená rozhodnutí a testovací datová sada blízká skutečnosti.","“Which of § sites for the plant?” No data yet.":"„Která z § lokalit pro závod?“ Zatím bez dat.","Where they differed":"V čem se lišily","Topic":"Téma","What differed":"Co se lišilo","What this page does":"Co dělá tato stránka","Which scope is current":"Který rozsah platí","The master plan and this page keep the § Nov decision: everything stays in the MVP and no single study is its spine (A§). The scope record of § Nov says your words of § Nov replaced A§: one study, report §, is the spine, and a list of things is parked. It also plans five two-week waves where this page shows four, and accepts the MVP on an independent calculation with known answers before the case.":"Hlavní plán a tato stránka drží rozhodnutí z §. listopadu: v MVP zůstává všechno a žádná jednotlivá studie není jeho páteří (A§). Záznam rozsahu z §. listopadu říká, že vaše slova z §. listopadu nahradila A§: páteří je jedna studie, zpráva §, a seznam věcí je odložen. Plánuje také pět dvoutýdenních vln, kde tato stránka ukazuje čtyři, a přijímá MVP na nezávislém výpočtu se známými odpověďmi ještě před případem.","This page keeps the wider scope and marks what the § Nov record parks. Nothing was removed. Your decision.":"Tato stránka drží širší rozsah a označuje, co záznam z §. listopadu odkládá. Nic nebylo odstraněno. Rozhodnutí je na vás.","open":"otevřeno","What “the MVP” is":"Co je „MVP“","The mindmap calls the indicator map the MVP. This page's MVP is the nine-step study, and the indicator map is one proposed map inside it.":"Myšlenková mapa označuje za MVP mapu ukazatelů. Na této stránce je MVP studie o devíti krocích a mapa ukazatelů je jedna navržená mapa uvnitř ní.","Shown as proposed everywhere on this page. Your decision.":"Všude na této stránce je uvedena jako navržená. Rozhodnutí je na vás.","Four method choices":"Čtyři volby metody","The mindmap leaves open what “close” means, how indicators are put on one scale, where the weights act and the minimum number of rows. This page stated two of them as settled and left one out.":"Myšlenková mapa nechává otevřené, co znamená „blízko“, jak se ukazatele převádějí na společnou škálu, kde působí váhy a jaký je nejmenší počet řádků. Tato stránka dvě z těchto věcí uváděla jako uzavřené a jednu vynechala.","All four are now open questions for the methodologist, with what each option costs.":"Všechny čtyři jsou teď otevřené otázky pro metodologa, s tím, co která varianta stojí.","The word “ML”":"Slovo „ML“","The mindmap says ML is out of the MVP. This page had six “ML” methods in it. They are different things: the mindmap means weights that learn from outcomes; the six are fixed statistical methods.":"Myšlenková mapa říká, že ML do MVP nepatří. Tato stránka v něm měla šest metod „ML“. Jde o různé věci: myšlenková mapa myslí váhy, které se učí ze skutečných výsledků; těch šest jsou pevně dané statistické metody.","Decided on § Nov: machine learning follows the MVP. The tab is now “Methods & ML” and ends with the candidates and what each needs first.":"Rozhodnuto §. listopadu: strojové učení přijde až po MVP. Záložka se teď jmenuje „Metody a ML“ a končí kandidáty a tím, co každý z nich nejdřív potřebuje.","corrected":"opraveno","What the client receives":"Co klient dostane","The mindmap lists three deliverables: the maps with coordinates, the processed data file and the report. This page hands over the report only.":"Myšlenková mapa uvádí tři výstupy pro klienta: mapy se souřadnicemi, soubor zpracovaných dat a zprávu. Tato stránka předává jen zprávu.","Raised as a question.":"Vzneseno jako otázka.","Public data connectors":"Napojení na veřejná data","After the MVP in the mindmap; in waves W§–W§ in the build order.":"V myšlenkové mapě až po MVP; v pořadí stavby ve vlnách W§–W§.","The test dataset":"Testovací datová sada","The mindmap asks for a dataset built from real figures, with planted traps. This page had only the rule that its answer is sealed first.":"Myšlenková mapa žádá datovou sadu sestavenou ze skutečných čísel, s vloženými pastmi. Tato stránka měla jen pravidlo, že se její odpověď zapečetí předem.","The traps are now on the Sociomapa tab; who builds it is a question.":"Pasti jsou teď na záložce Sociomapa; kdo sadu sestaví, je otázka.","Three figures":"Tři čísla","The futures map's weakest agreement was quoted as both § and § (they are two samples). The expert radius was §–§ (the runs give §–§). The weight result did not say which client weights it used.":"Nejslabší shoda mapy budoucností byla uvedena jako § i jako § (jde o dva vzorky). Poloměr u expertů byl §–§ (uložené běhy dávají §–§). Výsledek vah neříkal, které váhy klienta použil.","Corrected against the stored runs of the lifecycle page. Every other figure checked matched.":"Opraveno podle uložených běhů stránky životních cyklů. Všechna ostatní kontrolovaná čísla souhlasila.","Sociomapa tab":"záložka Sociomapa","A scenario map's grade":"Stupeň jistoty mapy scénářů","“Modelled” here and in the plan; “odhad” (estimate) in the methodology, and there is no grade called modelled.":"Zde a v plánu „modelováno“ (Modelled); v metodice „odhad“. Stupeň jistoty s názvem „modelováno“ neexistuje.","“Odhad” on this page. The plan files still carry the § Nov wording.":"Na této stránce „Odhad“. Soubory plánů stále nesou znění z §. listopadu.","They agree on the rest: two map types and five configurations, one engine, a test for each configuration, and the rule that a map supports the recommendation and never makes it.":"Ve zbytku se shodují: dva typy map a pět konfigurací, jedno výpočetní jádro, zkouška pro každou konfiguraci a pravidlo, že mapa doporučení podporuje, ale nikdy ho sama nevydává.","Words used on this page":"Slova používaná na této stránce","Czech names are the ones the product shows on screen. English is given beside each.":"České názvy jsou ty, které produkt ukazuje na obrazovce. Vedle každého je uveden anglický.","The study":"Studie","The client's decision written down: the options, the limits and the rule for choosing.":"Rozhodnutí klienta v písemné podobě: varianty, limity a rozhodovací pravidlo.","Option":"Varianta","One of the choices the client is deciding between: a site, a supplier, a way to finance.":"Jedna z možností, mezi kterými se klient rozhoduje: lokalita, dodavatel, způsob financování.","Decision rule":"Rozhodovací pravidlo","A sentence written before any result that says which option wins, for example “the lowest five-year cost, with at most a § % chance of a loss above § mil. Kč”.":"Věta napsaná před jakýmkoli výsledkem, která říká, která varianta vyhrává, například „nejnižší pětileté náklady, s pravděpodobností nejvýše § %, že ztráta přesáhne § mil. Kč“.","AIA's AI research lead. She proposes; a person accepts or rejects each proposal.":"AI vedoucí výzkumu v AIA. Navrhuje; každý návrh přijme nebo odmítne člověk.","Researcher":"Výzkumník","The person at AIA who runs the study and approves the report.":"Člověk v AIA, který studii vede a schvaluje zprávu.","Methodologist (Metodika)":"Metodolog (Metodika)","A. Bahbouh. He approves each estimating method before a client sees its result without a label.":"A. Bahbouh. Schvaluje každou metodu odhadu dřív, než klient uvidí její výsledek bez označení.","Guarantor":"Garant","The named person at the client who stands behind the range of one input.":"Jmenovitě určený člověk u klienta, který stojí za rozsahem jednoho vstupu.","The report as bare points, each with its picture and its proof, checked before any prose is written.":"Zpráva v holých bodech, každý s obrázkem a dokladem, zkontrolovaná dřív, než se napíše souvislý text.","The evidence":"Doklady","Grade":"Stupeň jistoty","A label on every number that says how sure it is: calculated, estimated, from the client's data, public source, judgement or law.":"Označení u každého čísla, které říká, jak je číslo jisté: výpočet, odhad, z dat klienta, veřejný zdroj, úsudek nebo právní předpis.","Estimate (odhad)":"Odhad (estimate)","A number from a statistical method, so it has a range. Until the method is registered it is printed with “metoda čeká na schválení metodikem”.":"Číslo ze statistické metody, proto má rozsah. Dokud metoda není zapsaná v registru, tiskne se s označením „metoda čeká na schválení metodikem“.","Register":"Registr metod","The methodologist's list of approved methods. A map configuration enters it after it passes its planted-answer test.":"Seznam schválených metod, který vede metodolog. Konfigurace mapy se do něj zapíše poté, co projde zkouškou s vloženou odpovědí.","Data contract":"Datová smlouva","The agreement on which columns of a client file may be used and how. Personal columns stay out.":"Dohoda o tom, které sloupce souboru klienta se smějí použít a jak. Sloupce s osobními údaji zůstávají mimo.","Future":"Budoucnost","One possible combination of the uncertain inputs (prices, wages, demand). The model computes § of them.":"Jedna možná kombinace nejistých vstupů (ceny, mzdy, poptávka). Model jich počítá §.","Approval ledger":"Kniha schválení","The record of who accepted what and when.":"Záznam o tom, kdo co přijal a kdy.","Machine learning (ML)":"Strojové učení (ML)","Methods that learn a rule from data instead of being given one. None is in the MVP; they follow it.":"Metody, které se pravidlo naučí z dat, místo aby ho dostaly zadané. V MVP není žádná; přijdou po něm.","The maps":"Mapy","AIA's map of business options. Two objects sit close when the rows of a table rate them alike; the height shows how well each does.":"Mapa obchodních variant v AIA. Dva objekty leží blízko, když je řádky tabulky hodnotí podobně; výška ukazuje, jak dobře si každý vede.","Object and row":"Objekt a řádek","Objects are what the map places (usually the options). Rows are what rates them: futures, weight settings, experts, units or months.":"Objekty jsou to, co mapa rozmisťuje (obvykle varianty). Řádky jsou to, co je hodnotí: budoucnosti, nastavení vah, experti, jednotky nebo měsíce.","Scenario map":"Mapa scénářů","A map whose rows a model computed. It is tested by asking whether the same picture comes out under other assumptions.":"Mapa, jejíž řádky spočítal model. Zkouší se otázkou, zda při jiných předpokladech vyjde stejný obraz.","Observed-data map":"Mapa naměřených dat","A map whose rows someone recorded. It is tested by drawing the rows again and seeing what holds.":"Mapa, jejíž řádky někdo zaznamenal. Zkouší se tak, že se řádky losují znovu a sleduje se, co vydrží.","Configuration":"Konfigurace","One of the five kinds of row a map can be built from. Each has its own preparation, test and allowed claims.":"Jeden z pěti druhů řádků, ze kterých lze mapu sestavit. Každý má vlastní přípravu, zkoušku a povolená tvrzení.","Planted-answer test":"Zkouška s vloženou odpovědí","A test on invented data in which we hid a known structure. The map must find it, and must draw nothing in data that has none.":"Zkouška na vymyšlených datech, do kterých jsme ukryli známou strukturu. Mapa ji musí najít a v datech, která žádnou nemají, nesmí nakreslit nic.","Fan of weights":"Vějíř vah","Many weight settings spread around the client's own weights, from narrow to wide.":"Mnoho nastavení vah rozložených kolem vlastních vah klienta, od úzkého vějíře po široký.","The engine in AIA that computes every map, also written “-§”. Its layout method is called BB§ in older documents.":"Výpočetní jádro v AIA, které počítá každou mapu; píše se také „-§“. Jeho metoda rozložení se ve starších dokumentech jmenuje BB§.","The build":"Stavba","Plan chunk":"Díl plánu","One buildable piece of a plan file in the repo (.planning/plans). Its id, such as SYS§, is shown in small type.":"Jedna část souboru plánu v repozitáři (.planning/plans), kterou lze postavit samostatně. Její id, například SYS§, je uvedeno malým písmem.","Wave":"Vlna","Chunks that are built together. W§ is the foundations, W§ the acceptance.":"Díly, které se staví společně. W§ jsou základy, W§ přijetí.","Marks":"Značky","Keep, Change, Cut, Later and Discuss, plus a note, on every item of this page. They are saved for everyone.":"Ponechat, Změnit, Vyřadit, Později a Probrat, k tomu poznámka, u každé položky této stránky. Ukládají se pro všechny.","Velis, the fleet and ChemVitro":"Velis, vozový park a ChemVitro","Three invented cases. Velis (warehouses) walks through the nine steps on this page. The fleet (vans) is the map example computed by the real engine. ChemVitro (a site decision) is the case of the § Nov scope record.":"Tři smyšlené případy. Velis (sklady) provází devíti kroky na této stránce. Vozový park (dodávky) je příklad mapy spočítaný skutečným výpočetním jádrem. ChemVitro (rozhodnutí o lokalitě) je případ ze záznamu rozsahu z §. listopadu.","Views":"Pohledy","Language":"Jazyk","The MVP, step by step":"MVP krok za krokem","of §":"z §","What we are building":"Co stavíme","AIA helps a company make one business decision, and shows the proof behind the answer.":"AIA pomáhá firmě udělat jedno obchodní rozhodnutí a ukazuje doklady, o které se odpověď opírá.","The client asks":"Klient se ptá","Where should we store and ship our orders?":"Kde máme skladovat a odkud odesílat objednávky?","One decision, a handful of options, a lot of money.":"Jedno rozhodnutí, několik variant, hodně peněz.","Writes it down, gathers, computes":"Zapíše, shromáždí, spočítá","The decision in writing, the client's data, public facts, and every option computed across thousands of possible futures.":"Rozhodnutí v písemné podobě, data klienta, veřejná fakta a každá varianta spočítaná v tisících možných budoucností.","The client gets":"Klient dostane","A recommendation with its proof":"Doporučení s doklady","A pilot plan and a report in which every number links to where it came from.":"Plán pilotu a zprávu, ve které každé číslo odkazuje na to, odkud pochází.","‹ Back":"‹ Zpět","Next ›":"Další ›","Use the arrow keys to move between slides.":"Mezi snímky se pohybujte šipkami na klávesnici.","Slides":"Snímky","Slide §: What we are building":"Snímek §: Co stavíme","Slide §: Why it is needed":"Snímek §: Proč je to potřeba","Why it is needed":"Proč je to potřeba","Slide §: One study, nine steps":"Snímek §: Jedna studie, devět kroků","One study, nine steps":"Jedna studie, devět kroků","Slide §: First: what exactly are we deciding?":"Snímek §: Nejdřív: o čem přesně rozhodujeme?","First: what exactly are we deciding?":"Nejdřív: o čem přesně rozhodujeme?","Slide §: Then: what do we know?":"Snímek §: Potom: co víme?","Then: what do we know?":"Potom: co víme?","Slide §: The calculation":"Snímek §: Výpočet","The calculation":"Výpočet","Slide §: What the calculation shows":"Snímek §: Co výpočet ukazuje","What the calculation shows":"Co výpočet ukazuje","Slide §: What the client receives":"Snímek §: Co klient dostane","Slide §: Why the numbers can be trusted":"Snímek §: Proč se číslům dá věřit","Why the numbers can be trusted":"Proč se číslům dá věřit","Slide §: What is in the MVP, and what is not":"Snímek §: Co je v MVP a co ne","Slide §: How it gets built, and when it is done":"Snímek §: Jak se staví a kdy je hotovo","How it gets built, and when it is done":"Jak se staví a kdy je hotovo","Slide §: After the MVP":"Snímek §: Po MVP","Slide §: What we need from you":"Snímek §: Co potřebujeme od vás","What we need from you":"Co od vás potřebujeme","A large decision often rests on one spreadsheet and one person's judgement. Afterwards nobody can say where a number came from.":"Velké rozhodnutí často stojí na jedné tabulce a na úsudku jednoho člověka. Později už nikdo neumí říct, odkud které číslo pochází.","Today":"Dnes","With AIA":"S AIA","One number for each input":"Jedno číslo pro každý vstup","A range for each input, with a named person behind it":"Rozsah pro každý vstup a jmenovaná osoba, která za ním stojí","The rule for choosing is picked after the results are seen":"Rozhodovací pravidlo se volí, až když jsou vidět výsledky","The rule for choosing is written before any result":"Rozhodovací pravidlo je zapsané dřív než jakýkoli výsledek","Numbers nobody can trace":"Čísla, která nikdo nedohledá","One scenario":"Jeden scénář","Thousands of possible futures":"Tisíce možných budoucností","Every study follows the same path. The next five slides walk through it on one invented example: Velis, a Czech e-shop deciding where to store and ship its orders.":"Každá studie jde stejnou cestou. Dalších pět snímků ji provede na jednom vymyšleném příkladu: Velis, český e-shop, se rozhoduje, kde skladovat objednávky a odkud je odesílat.","Before any number, the decision is written down: the options, the limits and the rule for choosing between them.":"Dřív než přijde první číslo, se rozhodnutí zapíše: varianty, limity a rozhodovací pravidlo pro výběr mezi nimi.","Step §":"Krok §","The client says what they need to decide. Ada, the AI lead, sorts the brief, asks the questions that matter, and helps write down the options and the rule for choosing between them, before anyone looks at a number.":"Klient řekne, o čem potřebuje rozhodnout. Ada, AI vedoucí výzkumu, zadání roztřídí, položí důležité otázky a pomůže zapsat varianty a rozhodovací pravidlo pro výběr mezi nimi, dřív než se kdokoli podívá na první číslo.","Velis (fictional)":"Velis (smyšlený příklad)","Velis Commerce, a Czech e-shop, asks where its orders should be stored and shipped from. Seven options come out of it: keep the Czech §PL, build its own warehouse, move to a Polish §PL, or a mix.":"Velis Commerce, český e-shop, se ptá, kde má své objednávky skladovat a odkud je odesílat. Vzejde z toho sedm variant: zůstat u českého §PL, postavit vlastní sklad, přejít k polskému §PL, nebo obojí zkombinovat.","Three sources. The client's own files, public facts, and people's estimates of what nobody can know for sure.":"Tři zdroje. Vlastní soubory klienta, veřejná fakta a odhady lidí o tom, co nikdo nemůže vědět jistě.","The client's own files (orders, invoices, price lists) come in here. A data contract says exactly which columns may be used and how. Personal data is removed before anything is calculated, and every number keeps a note of the file and row it came from.":"Sem přicházejí vlastní soubory klienta (objednávky, faktury, ceníky). Datová smlouva přesně říká, které sloupce se smějí použít a jak. Osobní údaje se odstraní dřív, než se cokoli počítá, a u každého čísla zůstává poznámka, ze kterého souboru a řádku pochází.","Velis uploads its order history and its current §PL's invoices. The contract keeps order dates, weights and fees; customer names never leave the file.":"Velis nahraje historii objednávek a faktury od svého současného §PL. Smlouva ponechá datumy objednávek, hmotnosti a poplatky; jména zákazníků soubor nikdy neopustí.","AIA looks up what the client can't know from their own files: market prices, wages, rents, the law. Every fact is a word-for-word quote from a saved source, and the value is taken from that quote by code, so nothing is made up.":"AIA dohledá, co klient ze svých souborů vědět nemůže: tržní ceny, mzdy, nájmy, právní předpisy. Každý fakt je doslovná citace z uloženého zdroje a hodnotu z této citace vybírá kód, takže nic není vymyšlené.","Warehouse rents in Czechia and Poland, wage growth, fuel prices and courier fees, each with its quote, source and date.":"Nájmy skladů v Česku a Polsku, růst mezd, ceny paliv a poplatky kurýrům, vše s citací, zdrojem a datem.","Nothing in the future is a single number. Each input gets a low, likely and high value and a named person at the client who stands behind it. Inputs that tend to rise or fall together are linked, so the model's futures stay realistic.":"Nic v budoucnosti není jedno jediné číslo. Každý vstup dostane nízkou, pravděpodobnou a vysokou hodnotu a jmenovanou osobu u klienta, která za ním stojí. Vstupy, které obvykle rostou nebo klesají společně, se propojí, aby budoucnosti v modelu zůstaly realistické.","Polish warehouse rent: low, likely and high, guaranteed by Velis's COO. Wages and rents are linked so they rise together.":"Nájem polského skladu: nízká, pravděpodobná a vysoká hodnota, garantem je provozní ředitel společnosti Velis. Mzdy a nájmy jsou propojené, takže rostou společně.","One model computes every option in thousands of possible futures. The same inputs always give the same answer.":"Jeden model spočítá každou variantu v tisících možných budoucností. Stejné vstupy dají vždy stejnou odpověď.","One cash-flow model computes each option. It is built from a short, fixed list of line types and formulas, so it is always checkable. It runs the likely case plus § random futures drawn from the ranges, and the same inputs always give the same answer.":"Každou variantu počítá jeden model peněžních toků. Je sestaven z krátkého, pevného seznamu typů řádků a vzorců, takže ho lze vždy zkontrolovat. Spočítá pravděpodobný případ a k němu § náhodných budoucností vylosovaných z rozsahů. Stejné vstupy dají vždy stejnou odpověď.","All seven warehouse options are computed over the same § futures: rents, wages, fees and lost orders drawn from their ranges.":"Všech sedm variant skladování se počítá na stejných § budoucnostech: nájmy, mzdy, poplatky a ztracené objednávky se losují ze svých rozsahů.","The rule is applied exactly as it was written. A map then shows which options behave alike, and how firm that picture is.":"Pravidlo se použije přesně tak, jak bylo zapsáno. Mapa pak ukáže, které varianty se chovají podobně a jak pevný ten obraz je.","The rule written in Zadání is applied exactly as written. Each option shows its typical result with a § % range, the chance it beats today, and the chance of a loss beyond the limit. Then the same decision is seen through finance, accounting, operations, logistics and the market.":"Pravidlo zapsané v kroku Zadání se použije přesně tak, jak je zapsáno. U každé varianty je vidět typický výsledek s rozsahem § %, šance, že překoná dnešní stav, a šance na ztrátu za limitem. Potom se na totéž rozhodnutí díváme očima financí, účetnictví, provozu, logistiky a trhu.","The Polish §PL with express delivery wins most often. The fixed-price Czech §PL is the safest. The hybrid adds risk and no gain.":"Nejčastěji vítězí polský §PL s expresním doručením. Nejbezpečnější je český §PL s pevnou cenou. Kombinovaná varianta přidává riziko a žádný zisk.","Where the rows come from decides the map. Rows a model computes (futures, weight settings) make a scenario map, tested for stability under assumptions written first. Rows someone recorded (experts, units, months) make an observed-data map, resampled the way the rows depend on each other. The map supports the recommendation; the decision rule makes it.":"O mapě rozhoduje, odkud pocházejí řádky. Z řádků, které spočítá model (budoucnosti, nastavení vah), vzniká mapa scénářů. Její stabilita se zkouší za předpokladů zapsaných předem. Z řádků, které někdo zaznamenal (experti, jednotky, měsíce), vzniká mapa naměřených dat. Ta se převzorkuje tak, jak na sobě řádky závisejí. Mapa doporučení podpírá; určuje ho rozhodovací pravidlo.","On the futures map the two warehouse options sit together and so do the two Polish ones. Whether the fixed-price Czech §PL backs up the Polish §PL is read from the joint-loss table beside the map, not from the map.":"Na mapě budoucností leží obě varianty se skladem u sebe a obě polské také. Zda český §PL s pevnou cenou zálohuje polský §PL, se čte z tabulky společných ztrát vedle mapy, ne z mapy.","First the report as bare points, each with its proof. Only then the written report.":"Nejprve zpráva jako holé body, každý se svým dokladem. Teprve potom psaná zpráva.","Before any prose is written, the report is laid out as chapters and points. Each point has its visual (a table, chart or map) and a link to its proof. A point without proof can't go further, so the report can only say what was shown.":"Než se napíše souvislý text, zpráva se rozvrhne do kapitol a bodů. Každý bod má svůj vizuál (tabulku, graf nebo mapu) a odkaz na svůj doklad. Bod bez dokladu nemůže jít dál, takže zpráva může říkat jen to, co bylo doloženo.","“The Polish §PL with express wins in § % of futures”: linked to the model run, its method and the inputs it used.":"„Polský §PL s expresem vítězí v § % budoucností“: s odkazem na běh modelu, jeho metodu a vstupy, které použil.","The report puts words around exactly the points that were closed in the outline, nothing more. It gives a recommendation, a plan with a pilot, and what to watch afterwards. Every number keeps its grade and its link. Estimates from methods not yet approved are clearly labelled.":"Zpráva slovy rozvádí přesně ty body, které byly uzavřeny v osnově, nic víc. Přináší doporučení, plán s pilotem a to, co potom sledovat. Každé číslo si nese svůj stupeň jistoty a svůj odkaz. Odhady z metod, které ještě nejsou schválené, jsou zřetelně označené.","A Czech report for Velis's board: move to the Polish §PL with express via a pilot, keep the fixed-price Czech contract as insurance, and watch delivery delays.":"Zpráva v češtině pro představenstvo společnosti Velis: přejít přes pilot k polskému §PL s expresem, českou smlouvu s pevnou cenou ponechat jako pojistku a sledovat zpoždění dodávek.","Four rules run through every step, and every number carries one of six grades that say how sure it is.":"Každým krokem procházejí čtyři pravidla a každé číslo nese jeden ze šesti stupňů, které říkají, jak je jisté.","Ada, the AI lead":"Ada, AI vedoucí výzkumu","Proposes; a person decides.":"Navrhuje; rozhoduje člověk.","Approves every estimating method.":"Schvaluje každou metodu odhadu.","Data protection & law":"Ochrana dat a právo","Contracts, personal data, cited law.":"Smlouvy, osobní údaje, citované předpisy.","The evidence chain":"Řetěz dokladů","Every number has a grade and a source link.":"Každé číslo má stupeň jistoty a odkaz na zdroj.","Calculated":"Výpočet","Plain arithmetic on accepted inputs.":"Prostá aritmetika nad přijatými vstupy.","Estimated":"Odhad","A statistical estimate, with a range.":"Statistický odhad s rozsahem.","From the client's data":"Z dat klienta","Read or summarised from the client's own files.":"Přečteno nebo shrnuto z vlastních souborů klienta.","Public source":"Veřejný zdroj","A quote in a saved public source.":"Citace v uloženém veřejném zdroji.","Judgement":"Úsudek","A named person's view, labelled as such.":"Názor jmenované osoby, takto označený.","Law":"Právní předpis","A cited provision, with its version date.":"Citované ustanovení s datem znění.","The MVP is the smallest version a real client could use from the first conversation to the approved report.":"MVP je nejmenší verze, kterou by skutečný klient mohl používat od prvního rozhovoru po schválenou zprávu.","and § more":"a ještě §","The full lists are on the":"Úplné seznamy jsou na záložce","The work is cut into pieces that can each be built and tested alone. They are grouped into four waves, built in order.":"Práce je rozdělena na díly, z nichž každý lze postavit a otestovat samostatně. Díly jsou seskupeny do čtyř vln, které se staví po sobě.","Four waves":"Čtyři vlny","Foundations":"Základy","What everything else stands on: contracts, the business brief, data routes, the first legal rules.":"Na čem stojí všechno ostatní: smlouvy, obchodní zadání, datové cesty, první právní pravidla.","The platform":"Platforma","The model, its inputs and the results screens.":"Model, jeho vstupy a obrazovky s výsledky.","Estimates and maps":"Odhady a mapy","The methods Metodika has to approve, and Sociomapa systémů.":"Metody, které musí schválit Metodika, a Sociomapa systémů.","Acceptance":"Přijetí","The whole journey, end to end, tested.":"Celá cesta od začátku do konce, otestovaná.","Done means § statements are true":"Hotovo znamená, že platí § tvrzení","Each is checked by an automatic test. Three of them:":"Každé ověřuje automatický test. Tři z nich:","The rule is written first":"Pravidlo se zapisuje jako první","The decision rule is written before the results and judged exactly as written.":"Rozhodovací pravidlo je zapsáno před výsledky a vyhodnocuje se přesně tak, jak je zapsáno.","Every number links to its source":"Každé číslo odkazuje na svůj zdroj","Every number on Výsledky, in the outline and in the report links to its source: file and row or page, a public input with its response hash, or a model run with its method version.":"Každé číslo v kroku Výsledky, v osnově i ve zprávě odkazuje na svůj zdroj: soubor a řádek nebo stránku, veřejný vstup s hashem odpovědi, nebo běh modelu s verzí metody.","The report says only what's proven":"Zpráva říká jen to, co je doloženo","The report says only what the closed outline holds; an unverified point cannot enter it.":"Zpráva říká jen to, co obsahuje uzavřená osnova; neověřený bod se do ní nedostane.","All of them are on the":"Všechna jsou na záložce","Planned, and not needed for the first client.":"Plánováno, pro prvního klienta to není potřeba.","What follows":"Co následuje","Machine learning":"Strojové učení","Machine learning fol jných budoucnostech a při jakých vahách?","futures × options, weight settings × options":"budoucnosti × varianty, nastavení vah × varianty","row mean removed → aia-sociomap-§":"po odečtení řádkového průměru → aia-sociomap-§","height = mean result; stability test":"výška = průměrný výsledek; zkouška stability","Platform":"Platforma","One composable cash-flow model":"Jeden stavebnicový model peněžních toků","decided · W§":"rozhodnuto · W§","Every model is built from the same parts, so every model can be checked.":"Každý model se skládá ze stejných částí, takže každý model lze zkontrolovat.","income":"příjem","capital":"kapitál","fixed cost":"fixní náklad","variable cost":"variabilní náklad","one-off":"jednorázová položka","capacity rules":"pravidla kapacity","timing rules":"pravidla načasování","closed formula vocabulary":"uzavřený slovník vzorců","Ada proposes lines, the researcher accepts each":"Ada navrhuje položky, výzkumník přijímá každou zvlášť","The run is stored and repeatable from its seed.":"Běh je uložen a lze ho zopakovat ze stejného seedu.","One composable cash-flow model; cost scenarios its first template":"Jeden stavebnicový model peněžních toků; nákladové scénáře jsou jeho první šablonou","NPV before and after tax; the rule reads one":"NPV před zdaněním a po zdanění; rozhodovací pravidlo čte jednu z nich","Pricing, market entry, capex, make-or-buy, hiring, financing… Order sets what real clients can run first.":"Ceny, vstup na trh, investice, vyrobit či koupit, nábor, financování… Pořadí určuje, co mohou skuteční klienti spustit jako první.","The likely case plus § futures, every result stored and repeatable.":"Pravděpodobný případ a k němu § budoucností; každý výsledek je uložen a lze ho zopakovat.","Each option's saving in each future, and its weighted §–§ score under each weight setting.":"Úspora každé varianty v každé budoucnosti a její vážené skóre §–§ při každém nastavení vah.","Add something to Model…":"Přidejte něco ke kroku Model…","Step § · Evidence · needs a calculation":"Krok § · Evidence · vyžaduje výpočet","Graded results":"Výsledky se stupněm jistoty","Every result has its grade and a link to the method that made it.":"Každý výsledek má svůj stupeň jistoty a odkaz na metodu, která ho vytvořila.","Market size is top-down (MKT§, MKT§, MKT§)":"Velikost trhu se počítá shora dolů (MKT§, MKT§, MKT§)","Grades: the code's grades kept, CALCULATED and ESTIMATED added, one table":"Stupně jistoty: stupně z kódu zůstávají, přibývají CALCULATED a ESTIMATED, jedna tabulka","The headline is the median with its § % interval":"Hlavním údajem je medián se svým §% intervalem","A result's grade follows its method, not its inputs":"Stupeň jistoty výsledku se řídí jeho metodou, ne jeho vstupy","Verdicts like \"realistické\" are the researcher's labelled judgement":"Verdikty jako „realistické“ jsou úsudek výzkumníka a jsou tak označeny","The rule's verdict, typical values with ranges, finance, accounting, operations and market, each with its grade.":"Verdikt rozhodovacího pravidla, typické hodnoty s rozsahy, finance, účetnictví, provoz a trh, vše se svým stupněm jistoty.","Add something to Výsledky…":"Přidejte něco ke kroku Výsledky…","Step § · Evidence":"Krok § · Evidence","Map, test and claim":"Mapa, zkouška a tvrzení","The configuration's own test ran and is printed as it came out; the map is registered or labelled internal.":"Vlastní zkouška konfigurace proběhla a její výsledek je uveden tak, jak dopadl; mapa je zapsaná v registru, nebo označená jako interní.","The MVP's maps show clusters of options":"Mapy v MVP ukazují shluky variant","Respondent maps omitted; the rest in the MVP as two map types and five configurations":"Mapy respondentů jsou vynechány; zbytek je v MVP jako dva typy map a pět konfigurací","The maps are released in the MVP once their planted-answer fixtures pass and the register entry is approved":"Mapy se v MVP uvolní, jakmile projdou jejich zkoušky s vloženou odpovědí a je schválen zápis v registru metod","The map supports the recommendation; the decision rule makes it":"Mapa doporučení podporuje; vytváří ho rozhodovací pravidlo","Called Sociomapa systémů, never SOMECS; A. Bahbouh checks name and licence":"Název je Sociomapa systémů, nikdy SOMECS; název a licenci ověří A. Bahbouh","The old -§ strategy map is superseded and off the path":"Stará strategická mapa -§ je nahrazena a stojí mimo hlavní cestu","Your § Nov mindmap (AIA MVP) describes the MVP as indicator tables, then maps, then a report: rows are company-independent indicators, columns the options, one weighted table per map. This page keeps the nine-step study as the MVP and proposes the indicator profile as the observed-data map's sixth configuration, resampled by indicator family, with its own test dataset and register entry (R§-Q§). Recommended: adopt it as the sixth configuration.":"Vaše myšlenková mapa z §. listopadu (AIA MVP) popisuje MVP jako tabulky ukazatelů, potom mapy a potom zprávu: řádky jsou ukazatele nezávislé na firmě, sloupce jsou varianty a každá mapa má jednu váženou tabulku. Tato stránka ponechává jako MVP studii o devíti krocích a navrhuje profil ukazatelů jako šestou konfiguraci mapy naměřených dat, převzorkovanou po rodinách ukazatelů, s vlastní testovací datovou sadou a vlastním zápisem v registru metod (R§-Q§). Doporučení: přijmout ho jako šestou konfiguraci.","Two options can be close because they score alike, or because their strengths and weaknesses follow the same pattern even at different levels. The mindmap leaves this open; every other map here uses the same pattern. Proposed: build both on the test dataset and keep the one that exposes its traps.":"Dvě varianty mohou být blízko, protože mají podobné hodnoty, nebo protože jejich silné a slabé stránky mají stejný průběh, i když na jiné úrovni. Myšlenková mapa to nechává otevřené; všechny ostatní mapy zde používají stejný průběh. Návrh: postavit obě verze na testovací datové sadě a ponechat tu, která odhalí její nástrahy.","for Aram":"pro Arama","Indicators come in Kč, km and %. A rank ignores how large the gaps are. A §–§ range lets one extreme option stretch the scale. A z-score depends on which options are in the set. This page proposes the median and MAD per indicator. To decide on the test dataset: does the leader or the grouping change between methods?":"Ukazatele jsou v Kč, km a %. Pořadí nebere v úvahu, jak velké jsou rozdíly. Rozsah §–§ dovolí jedné krajní variantě roztáhnout stupnici. Z-skóre závisí na tom, které varianty jsou v sadě. Tato stránka navrhuje medián a MAD pro každý ukazatel. Rozhodnout na testovací datové sadě: mění se mezi metodami vedoucí varianta nebo seskupení?","In the height only: the weights decide which option is best and the layout stays neutral. In the similarity too: a heavy indicator also pulls options together or apart. The weight-settings map already tests the order under other weights.":"Jen ve výšce: váhy rozhodují, která varianta je nejlepší, a rozložení zůstává neutrální. I v podobnosti: ukazatel s velkou vahou navíc varianty přitahuje k sobě nebo je od sebe oddaluje. Mapa nastavení vah už pořadí při jiných vahách zkouší.","sociomapa-systemu (SYS§–SYS§) and M-§ in the master plan speak of four “modes”, grade MODELLED, § scenarios and edges on the scenario map. The methodology of § Nov has two types and five configurations, grade odhad, § § futures and no lines on a scenario map. Proposed: bring the plan files to the methodology before SYS§ starts.":"Plán sociomapa-systemu (SYS§–SYS§) a M-§ v hlavním plánu mluví o čtyřech „režimech“, stupni MODELLED, § scénářích a hranách na mapě scénářů. Metodika z §. listopadu má dva typy a pět konfigurací, stupeň odhad, § § budoucností a na mapě scénářů žádné čáry. Návrh: uvést soubory plánů do souladu s metodikou, než začne SYS§.","The example failed at § and § experts, § depots and § months; Velis placed objects without relation lines below § rows. Proposed: each minimum set from its planted-answer test and printed on the map.":"Příklad selhal při § a § expertech, § depech a § měsících; Velis při méně než § řádcích umístil objekty bez čar vztahů. Návrh: každé minimum určit z jeho zkoušky s vloženou odpovědí a uvést ho na mapě.","The objects there are indicators, so a mean result means nothing. Until decided, both are drawn without terrain.":"Objekty jsou tam ukazatele, takže průměrný výsledek nic neznamená. Dokud není rozhodnuto, kreslí se obě mapy bez terénu.","A share of first place changes with the fan width (§ % wide, § % narrow), and four settings were too few in the crossed grid. Proposed: print all three widths; set the grid's settings count.":"Podíl prvních míst se mění s šířkou vějíře (§ % široký, § % úzký) a čtyři nastavení byla ve zkřížené mřížce příliš málo. Návrh: uvádět všechny tři šířky; stanovit počet nastavení v mřížce.","The map can't answer this: removing the row mean removes the shared level a joint loss is made of. Proposed: answer it from the joint-loss table beside the futures map.":"Na to mapa odpovědět nemůže: odečtením řádkového průměru zmizí společná úroveň, ze které společná ztráta vzniká. Návrh: odpovídat z tabulky společných ztrát vedle mapy budoucností.","Each configuration needs its own entry after its planted-answer test. The § Oct approval covers people's ratings only. His open questions are on the Sociomapa tab.":"Každá konfigurace potřebuje vlastní zápis po své zkoušce s vloženou odpovědí. Schválení z §. října se týká jen hodnocení od lidí. Jeho otevřené otázky jsou na záložce Sociomapa.","A map snapshot, its test result, the tables beside it, and what it may and may not claim.":"Zachycený stav mapy, výsledek její zkoušky, tabulky vedle ní a to, co mapa smí a nesmí tvrdit.","Add something to Sociomapa…":"Přidejte něco ke kroku Sociomapa…","Step § · Předání":"Krok § · Předání","Closed outline":"Uzavřená osnova","Shared stop (optional)":"Sdílená zastávka (volitelná)","Client receives":"Klient dostává","Client's people":"Lidé klienta","Every stop is closed and no point is unproven.":"Každá zastávka je uzavřená a žádný bod není bez dokladu.","The stage is called Osnova zprávy, the report outline":"Krok se jmenuje Osnova zprávy","All six diagram stacks are in the MVP":"Všech šest sad diagramů je v MVP","An unverified point holds the hand-off until resolved":"Neověřený bod zdrží předávku, dokud není vyřešen","Optional shared review of a closed stop with the client's decision-makers":"Volitelná společná kontrola uzavřené zastávky s lidmi, kteří u klienta rozhodují","A read-only page from AIA, or an export? Who may comment, and how is agreement recorded?":"Stránka z AIA jen pro čtení, nebo export? Kdo smí komentovat a jak se zaznamená souhlas?","Every point with its visual and its proof; every stop closed.":"Každý bod se svou vizualizací a svým dokladem; každá zastávka uzavřená.","A closed stop the client's decision-makers can review.":"Uzavřená zastávka, kterou mohou zkontrolovat lidé, kteří u klienta rozhodují.","Add something to Osnova zprávy…":"Přidejte něco ke kroku Osnova zprávy…","Approved report":"Schválená zpráva","A person approves; any warning about an unapproved method is recorded.":"Schvaluje člověk; každé upozornění na neschválenou metodu se zaznamená.","Unregistered estimates reach the client labelled, with an approval warning":"Odhady nezapsané v registru se ke klientovi dostanou označené, s upozorněním při schvalování","Reports are Czech in the MVP; English after":"Zprávy jsou v MVP česky; anglicky až potom","The mindmap lists three deliverables: the maps (PNG or PDF, with coordinates), the processed data file (raw, oriented, normalised, weighted, sources) and the report. This page hands over the report only.":"Myšlenková mapa uvádí tři výstupy: mapy (PNG nebo PDF, se souřadnicemi), soubor zpracovaných dat (surová, orientovaná, normalizovaná, vážená, zdroje) a zprávu. Tato stránka předává jen zprávu.","Internal and client versions, as DOCX and PDF.":"Interní verze a verze pro klienta, ve formátech DOCX a PDF.","Add something to Zpráva…":"Přidejte něco ke kroku Zpráva…","Runs across the steps":"Probíhá napříč kroky","Close":"Zavřít","Every change she proposes is accepted or rejected by a person, one by one":"Každou změnu, kterou navrhne, přijímá nebo odmítá člověk, jednu po druhé","Anything that costs money starts only from a card that shows the price":"Vše, co stojí peníze, se spouští jen z karty, na které je vidět cena","Sorting the brief is an ordinary conversation turn":"Roztřídění zadání je běžná odpověď v konverzaci","Proposes options, analyses, linked inputs and report points":"Navrhuje varianty, analýzy, provázané vstupy a body zprávy","Never writes a number without a source":"Nikdy nenapíše číslo bez zdroje","Registers each map configuration once its planted-answer test passes":"Zapisuje do registru metod každou konfiguraci mapy, jakmile projde její zkouška s vloženou odpovědí","Unapproved estimates are labelled, with a warning when the report is approved":"Neschválené odhady jsou označené a při schvalování zprávy se zobrazí upozornění","A validation pack for every method":"Validační balíček pro každou metodu","The § Oct engine approval covers people's ratings only, not the business configurations":"Schválení výpočetního jádra z §. října se týká jen hodnocení od lidí, ne podnikových konfigurací","Checks the name and licence: “Sociomapa systémů”, never SOMECS":"Ověřuje název a licenci: „Sociomapa systémů“, nikdy SOMECS","The data contract is agreed on the Data step":"Datová smlouva se sjednává v kroku Data","Real client data is always under the strict data gates":"Skutečná data klienta vždy procházejí přísnými datovými kontrolami","A person's name from a register needs a balancing test first":"Jméno osoby z rejstříku vyžaduje nejprve balanční test","Czech and EU tax, contract and employment law, cited, never legal advice":"České a unijní daňové, smluvní a pracovní právo: citované, nikdy jako právní rada","Files are shown as Důvěrný (confidential) or Veřejný (public), nothing more technical":"Soubory se zobrazují jako Důvěrný nebo Veřejný, bez dalších technických údajů","Six grades say how sure a number is (below)":"Šest stupňů jistoty říká, jak jisté číslo je (níže)","A result's grade follows the method that made it":"Stupeň jistoty výsledku se řídí metodou, která ho vytvořila","The headline is the typical value with its range":"Hlavním údajem je typická hodnota se svým rozsahem","Links are checked by code; a broken one stops the hand-off":"Odkazy kontroluje kód; nefunkční odkaz předávku zastaví","Every acceptance is recorded in the approval ledger":"Každé přijetí se zapíše do knihy schválení","Inputs and outputs":"Vstupy a výstupy","Every arrow is one hand-off, from the step that makes it to each step that uses it. Click a step to see only what goes into it and out of it. Use it to check that nothing is made that nobody uses, and nothing is used that nobody makes.":"Každá šipka je jedna předávka: od kroku, který ji vytváří, ke každému kroku, který ji používá. Klikněte na krok a uvidíte jen to, co do něj přichází a co z něj odchází. Ověříte tak, že nevzniká nic, co nikdo nepoužívá, a že se nepoužívá nic, co nikdo nevytváří.","The brief: The client → § Zadání":"Zadání: Klient → § Zadání","Client files: The client → § Zadání":"Soubory klienta: Klient → § Zadání","Client files: The client → § Data":"Soubory klienta: Klient → § Data","Named people: The client → § Předpoklady":"Lidé uvedení jménem: Klient → § Předpoklady","Named people: The client → § Sociomapa":"Lidé uvedení jménem: Klient → § Sociomapa","Public sources: Public sources → § Rešerše":"Veřejné zdroje: Veřejné zdroje → § Rešerše","The decision: § Zadání → § Model":"Rozhodnutí: § Zadání → § Model","The decision: § Zadání → § Výsledky":"Rozhodnutí: § Zadání → § Výsledky","The decision: § Zadání → § Osnova zprávy":"Rozhodnutí: § Zadání → § Osnova zprávy","Chosen analyses: § Zadání → § Rešerše":"Vybrané analýzy: § Zadání → § Rešerše","Chosen analyses: § Zadání → § Osnova zprávy":"Vybrané analýzy: § Zadání → § Osnova zprávy","What data is needed: § Zadání → § Data":"Jaká data jsou potřeba: § Zadání → § Data","What data is needed: § Zadání → § Rešerše":"Jaká data jsou potřeba: § Zadání → § Rešerše","The model's parts: § Zadání → § Předpoklady":"Části modelu: § Zadání → § Předpoklady","The model's parts: § Zadání → § Model":"Části modelu: § Zadání → § Model","Client numbers: § Data → § Předpoklady":"Čísla klienta: § Data → § Předpoklady","Client numbers: § Data → § Výsledky":"Čísla klienta: § Data → § Výsledky","Client numbers: § Data → § Osnova zprávy":"Čísla klienta: § Data → § Osnova zprávy","Estimates from client data: § Data → § Předpoklady":"Odhady z dat klienta: § Data → § Předpoklady","Data quality report: § Data → § Osnova zprávy":"Zpráva o kvalitě dat: § Data → § Osnova zprávy","Public inputs: § Rešerše → § Předpoklady":"Veřejné vstupy: § Rešerše → § Předpoklady","Findings per analysis: § Rešerše → § Osnova zprávy":"Zjištění podle analýz: § Rešerše → § Osnova zprávy","Legal provisions: § Rešerše → § Předpoklady":"Právní ustanovení: § Rešerše → § Předpoklady","Legal provisions: § Rešerše → § Osnova zprávy":"Právní ustanovení: § Rešerše → § Osnova zprávy","Input ranges: § Předpoklady → § Model":"Rozsahy vstupů: § Předpoklady → § Model","Linked inputs: § Předpoklady → § Model":"Provázané vstupy: § Předpoklady → § Model","Fixed settings: § Předpoklady → § Model":"Pevná nastavení: § Předpoklady → § Model","Fixed settings: § Předpoklady → § Výsledky":"Pevná nastavení: § Předpoklady → § Výsledky","The model run: § Model → § Výsledky":"Běh modelu: § Model → § Výsledky","Futures and weight settings: § Model → § Sociomapa":"Budoucnosti a nastavení vah: § Model → § Sociomapa","Graded results: § Výsledky → § Osnova zprávy":"Výsledky se stupněm jistoty: § Výsledky → § Osnova zprávy","Map, test and claim: § Sociomapa → § Osnova zprávy":"Mapa, zkouška a tvrzení: § Sociomapa → § Osnova zprávy","Closed outline: § Osnova zprávy → § Zpráva":"Uzavřená osnova: § Osnova zprávy → § Zpráva","Shared stop (optional): § Osnova zprávy → Client receives":"Sdílená zastávka (volitelná): § Osnova zprávy → Klient dostává","Approved report: § Zpráva → Client receives":"Schválená zpráva: § Zpráva → Klient dostává","Public":"Veřejné","sources":"zdroje","§ in · § out":"§ dovnitř · § ven","Client":"Klient","receives":"dostává","As a table":"Jako tabulka","Step":"Krok","Inputs, and where they come from":"Vstupy a odkud přicházejí","What happens":"Co se děje","Outputs, and where they go":"Výstupy a kam odcházejí","Sources":"Zdroje","to":"do","Hand-offs between the steps":"Předávky mezi kroky","Into Public sources":"Přichází do veřejných zdrojů","Nothing comes in: this is where material starts.":"Nic nepřichází: tady materiál začíná.","Out of Public sources":"Odchází z veřejných zdrojů","Into The client":"Přichází ke klientovi","Out of The client":"Odchází od klienta","Into § Zadání":"Přichází do kroku § Zadání","Out of § Zadání":"Odchází z kroku § Zadání","Into § Data":"Přichází do kroku § Data","Out of § Data":"Odchází z kroku § Data","Into § Rešerše":"Přichází do kroku § Rešerše","Out of § Rešerše":"Odchází z kroku § Rešerše","Into § Předpoklady":"Přichází do kroku § Předpoklady","Out of § Předpoklady":"Odchází z kroku § Předpoklady","Into § Model":"Přichází do kroku § Model","Out of § Model":"Odchází z kroku § Model","Into § Výsledky":"Přichází do kroku § Výsledky","Out of § Výsledky":"Odchází z kroku § Výsledky","Into § Sociomapa":"Přichází do kroku § Sociomapa","Out of § Sociomapa":"Odchází z kroku § Sociomapa","Into § Osnova zprávy":"Přichází do kroku § Osnova zprávy","Out of § Osnova zprávy":"Odchází z kroku § Osnova zprávy","Into § Zpráva":"Přichází do kroku § Zpráva","Out of § Zpráva":"Odchází z kroku § Zpráva","Into Client receives":"Přichází do „Klient dostává“","Out of Client receives":"Odchází z „Klient dostává“","Nothing goes further: this is where it ends.":"Nic nejde dál: tady
