], "contents": ["number, value, place (file/sheet/row/page), kind", "client estimates with interval and row count", "contract version, copy SHA-256"]}, {"name": "Data check results", "to": ["vysledky"], "contents": ["accepted check report", "outlier decisions", "capacity finding"]}, {"name": "Provenance for points", "to": ["osnova", "zprava"], "contents": ["link: file, contract version, rows or page", "label 'z dat klienta', source and period"]}], "gaps": ["Until the methodology owner's 'client data' module exists (MQ-18: support, metric, interval) every client number refuses client_support_rule_unapproved: what does the Data step show and what reaches Předpoklady in the meantime?", "When a client re-uploads a corrected file (a new reading), how does the stale contract, its bindings and the assumptions built on it surface, and must the researcher re-accept field by field?", "Who defines a derived column (PSČ → kraj, město nad 100 tis.): code with a declared lookup, Ada, or the researcher, and is the derived column itself classified personal?", "Is a pseudonymous customer id ('ne · pseudonym z CRM' on MV1) personal data under the contract rule, and who decides that policy?", "How does the researcher declare a reconciliation pair or a control total for CR1 (which screen, which fields), and what tolerance turns a difference into a flag?", "What are the full-grid reader's analysis bounds (#3a), and what does a refused oversize file offer the researcher?", "Do PDF document numbers have a contract version or change record of their own, and does replacing the PDF invalidate them?", "Which matched-groups method (W8) is the first Metodika method, and who specifies its matching variables and interval?"]}, "reserse": {"purpose": "Bring in public evidence for the chosen frameworks and the model: findings that are quotes in captured sources, typed numbers extracted by code, public register and statistics values and cited legal provisions, each accepted by a person before it is used.", "actors": ["Researcher", "Ada", "Code"], "process": [{"n": 1, "phase": "Plan", "actor": "Code", "action": "Turn selected frameworks into research subjects", "detail": "Each framework selected in Zadání that needs research becomes subjects of the Design Research plan; a deselected framework takes its subjects out of the next run.", "fields": ["framework", "subjects", "ceiling USD"], "rule": "The ceiling is pinned at enqueue.", "output": "Design Research plan subjects.", "onFail": null, "screen": "Z4 · Deep Research … USD nejvýš", "source": "analysis-frameworks#AF3", "status": "planned"}, {"n": 2, "phase": "Start", "actor": "Researcher", "action": "Ask Ada for a priced run", "detail": "'Požádat Adu o Deep Research…' opens Ada's priced card in the Lead pane; the researcher approves it there.", "fields": ["Požádat Adu o Deep Research…", "ceiling", "study budget", "Historie běhů"], "rule": "No paid start from a stage; a priced route runs only once its organization approved every live setting (ADR 0022); a priced call is held against the study budget before it leaves.", "output": "A Deep Research run with its ceiling pinned.", "onFail": "Over budget or unapproved settings: the card is refused by name (live_settings_unapproved, outside_wallet).", "screen": "MV2 / MV2b · Požádat Adu o Deep Research…", "source": "W12 · ADR 0022 · #550", "status": "decided"}, {"n": 3, "phase": "Gate", "actor": "Code", "action": "Admit every fetch through RetrievalGate", "detail": "Every query and URL leaves through the gate, which reads the data source register (legal status, cost, rate limit, licence, retention, whether a field names a natural person) and adds per-source rate limits, a robots.txt / text-and-data-mining reservation check and a retention limit on mined copies.", "fields": ["source", "legal status", "licence", "rate limit", "retention", "names a person"], "rule": "ARES at most 500 a minute; TDM opt-out honoured; NEN data behind its login never collected; VIES validated once, never stored; the register is read by the gate, never by a model.", "output": "Fetch allowed or refused.", "onFail": "Each refusal named.", "screen": "MV2 · 02 Odkud data bereme a co smíme", "source": "deep-research-v2#DRV0 · public-data-routes#PDR0 · ADR 0046 decision 7", "status": "planned"}, {"n": 4, "phase": "Structured routes", "actor": "Ada", "action": "Propose a query key for a register or series", "detail": "For SDMX (Eurostat, ECB), ČNB, ARES, the commercial register, TED, ISVZ and Sbírka listin the model proposes a query key; code fetches.", "fields": ["route", "query key", "response hash"], "rule": "Every admitted value byte-equal to the API's response; recorded doubles and golden responses pinned by hash.", "output": "Route responses as typed input candidates.", "onFail": null, "screen": "MV2 · 02 rejstřík zdrojů", "source": "public-data-routes#PDR1 · #PDR2 · #PDR6 · ADR 0046 decision 6", "status": "planned"}, {"n": 5, "phase": "Findings", "actor": "Code", "action": "Ground each finding in a captured quote", "detail": "Code picks subjects and tracks, sends every query and fetch, captures content-addressed snapshots and keeps a finding only when its quote is in a source the same track retrieved.", "fields": ["finding", "quote", "source", "snapshot hash"], "rule": "A finding is a quote in a captured source, or nothing (frozen engine).", "output": "Findings in the sealed bundle.", "onFail": "Ungrounded quote: no finding.", "screen": "MV2b · Zjištění (citace)", "source": "ADR 0046 decision 6 · ADR 0017", "status": "decided"}, {"n": 6, "phase": "Extraction", "actor": "Code", "action": "Extract typed inputs from quotes", "detail": "Between verify and synthesize, a rule-based extractor takes value and unit from accepted findings' quotes and structured responses; the model proposes only the concept and the period.", "fields": ["Vstup", "Hodnota", "jednotka", "Období", "Rozsah", "Zdroj a licence", "k datu"], "rule": "Extractor used only after value and unit e: 8 %", "guarantor", "alternative rates shown on Výsledky", "tax rate: 21 % (legal point)", "depreciation group: 5 (legal point)", "legal point: law, provision, version date, quote, snapshot hash"], "states": ["proposed", "accepted", "stale (provision changed)"]}], "handoffs_out": [{"name": "Accepted inputs, distributions and correlations", "to": ["model"], "contents": ["each input's low/base/high, unit, currency", "provenance and pins (contract version, copy SHA-256, knowledge revision)", "distribution by source", "accepted rank-correlation matrix", "fixed parameters: discount rate, tax rate, depreciation"]}, {"name": "The inputs table with provenance and labels", "to": ["vysledky", "osnova", "zprava"], "contents": ["Předpoklad, Min, Základ, Max, Zdroj, Ručí", "label: z dat klienta / předpoklad / veřejný zdroj", "legal points used (for the disclaimer)"]}], "gaps": ["How is a client-data estimate's \"own distribution\" represented and passed to Monte Carlo (parametric fit, bootstrap draws, interval only), and how are a mixture's components and weights recorded when people disagree (W14)?", "Who is the guarantor of a client-data input? W15 says a person at the client, but the canvas shows \"data o zpožděních · výzkumník\"; and is the guarantor a client contact record, a free name, or a member?", "Which alternative discount rates are tested and who picks them? W16 fixes the rate, but CM7's text still calls it \"an input with a range like any other\"; the canvas says 6 % and 10 % without a rule.", "What exactly marks results stale after an input changes (Ada's \"Výpočet je potřeba spustit znovu\"), and is the stale state shown on Výsledky and in Osnova zprávy?", "Where and by whom is an input marked measurable (CR6's measurable_by: survey), now that the survey lane is frozen and Předpoklady's table has no such column?", "How does a Deep Research typed value (deep-research-v2's numeric extraction: value, unit, period, range) map onto Min/Základ/Max: is its range the source's, or does a person still state one?"]}, "model": {"purpose": "Compose one cash-flow model from the accepted inputs (line items of closed kinds, drivers, timing, scenarios), freeze it as a revision and compute every deterministic and Monte Carlo result reproducibly at a known 0.00 USD.", "actors": ["Researcher", "Ada", "Code", "Metodika"], "process": [{"n": 1, "phase": "Scope", "actor": "Code", "action": "Load the variants from Zadání", "detail": "The options accepted in Zadání (Z3 02) become the model's scenarios: the baseline B (today) plus the rest, each with a one-line description; an option that breaks a hard constraint stays for comparison, flagged.", "fields": ["Varianty", "baseline", "description", "constraint flag (\"porušuje slib ve městech\")"], "rule": "At most twelve scenarios including the baseline (Q4)", "output": "Scenario list on the Model Revision", "onFail": "too_many_scenarios refused by name", "screen": "M3 · 01 Varianty", "source": "cost-model-study#CP1, #CM3 · Q4 · KM3Model board", "status": "planned"}, {"n": 2, "phase": "Scope", "actor": "Code", "action": "Load the target quantity, horizon and timing", "detail": "From Zadání Z5: the quantity compared (contribution after logistics: retained orders × 300 Kč minus logistics, investment and switch, plus residual value), NPV at the study rate, before tax, over 7 years 2026-2032.", "fields": ["Ukazatel", "horizon", "step (měsíce / roky)", "discount rate", "before/after tax read by the rule"], "rule": "The rule reads one NPV (before tax here, as Zadání said), the other is shown beside it (W18)", "output": "The model's objective and horizon", "onFail": null, "screen": "M3 · 02 Hybné veličiny a časování · Ukazatel; Z5 01-02", "source": "ADR 0046 W18 · cost-model-study#CM7 · Z5Model board", "status": "decided"}, {"n": 3, "phase": "Build", "actor": "Researcher", "action": "Define drivers", "detail": "A driver is an input, or a × b / a ÷ b of inputs, e.g. orders in year t = 410 000 × (1 + growth)^t.", "fields": ["driver name", "expression", "inputs read"], "rule": "Drivers from the closed vocabulary; no cycles", "output": "Drivers on the working content", "onFail": "driver_cycle refused by name", "screen": "M3 · 02 · Objednávky v roce t", "source": "cost-model-study#CM1", "status": "planned"}, {"n": 4, "phase": "Build", "actor": "Ada", "action": "Propose line items", "detail": "Ada proposes the model's items from the data and Zadání (here 11 items), each a per-change operation with its kind, formula and the variants it applies to.", "fields": ["Položka", "Druh", "Vzorec v základu", "Varianty"], "rule": "Ada states and computes no number not in its context; proposals generic over the type's declared operations", "output": "Proposed items waiting for accept", "onFail": "On a Class-C-only route the Lead's turn parks by name", "screen": "M3 · 03 Položky modelu; Ada pane", "source": "ADR 0046 W17 · cost-model-study#CP9", "status": "decided"}, {"n": 5, "phase": "Build", "actor": "Researcher", "action": "Accept or edit each line item", "detail": "Each item takes a kind from the closed set PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ; the researcher accepts or dismisses each proposal and edits items in place.", "fields": ["Položka", "Druh", "Vzorec v základu", "Varianty", "year (rok 0, rok 7, 2027)"], "rule": "Kinds from the closed set (W17); accepted under APPROVE_GATE as a lead_edit", "output": "Accepted items on the model's working content", "onFail": "A dismissed proposal changes nothing", "screen": "M3 · 03 Položky modelu", "source": "ADR 0046 W17 · cost-model-study#CP2, #CP9", "status": "decided"}, {"n": 6, "phase": "Build", "actor": "Code", "action": "Check each formula against the vocabulary", "detail": "A formula may use only the closed vocabulary; the cost template's forms are FIXED per period, VARIABLE rate × driver, STEP per block × ceil(driver ÷ block), CAPITAL annuity over life and rate; units must agree.", "fields": ["formula", "inputs read", "units"], "rule": "Closed vocabulary; reject, never coerce", "output": "A validated item", "onFail": "Refused by name: unit_mismatch, currency_mismatch, no_provenance (an input with no provenance)", "screen": null, "source": "cost-model-study#CP2, #CM1, #CP1 · ADR 0046 W17", "status": "planned"}, {"n": 7, "phase": "Build", "actor": "Researcher", "action": "Set timing and capacity rules", "detail": "Timing: all options with 3PL CZ in 2026, the hall ready in 12 months, a 6-month notice so a switch earliest 1. 7. 2027 (half-year 2027); capacity: orders above the hall's capacity routed to 3PL CZ at its fee.", "fields": ["Časování", "start date", "notice period", "capacity", "overflow rule"], "rule": "A notice period from a cited provision or contract is a timing constraint the researcher accepts", "output": "Timing and capacity rules on the items", "onFail": null, "screen": "M3 · 02 · Časování; 03 row \"Přebytek nad kapacitou haly\"", "source": "ADR 0046 W17 · legal-context#LGL3, #LGL6", "status": "decided"}, {"n": 8, "phase": "Build", "actor": "Researcher", "action": "Edit each scenario as overrides", "detail": "A scenario is its overrides of the baseline (e.g. B2 fixed price 50,50 Kč for 5 years), shown against it; the baseline and the scenario being edited stay side by side at every width.", "fields": ["scenario", "overridden inputs/items", "baseline value"], "rule": "Overrides only; the shared items and timing stay the same so the numbers do not contradict", "output": "Scenario overrides on the working content", "onFail": null, "screen": "M3 · 01 Varianty, 03 column Varianty", "source": "cost-model-study#CM3", "status": "planned"}, {"n": 9, "phase": "Build", "actor": "Code", "action": "Show the base-case preview", "detail": "Each option's difference against B with every input at base, as a bar (e.g. C2 +8,8 mil. Kč NPV 7 let), labelled výpočet, with the note that uncertainty is on Výsledky.", "fields": ["rozdíl proti B v základu", "option"], "rule": "Deterministic, grade výpočet (W21)", "output": "A preview, not the headline", "onFail": "An unknown input makes the total neznámé, naming it", "screen": "M3 · 04 Výsledek v základním scénáři", "source": "KM3Model board · cost-model-study#CM2", "status": "proposed"}, {"n": 10, "phase": "Submit", "actor": "Researcher", "action": "Submit the Model Revision", "detail": "The working content becomes an immutable Model Revision: type id and version, elements, inputs, scenarios and decision rule, its canonical JSON and SHA-256, naming its working revision; a ledger row with the hash of its input list in the same transaction.", "fields": ["type_id", "type_version", "elements", "inputs", "scenarios", "DecisionRule", "sha256", "working_revision"], "rule": "Under APPROVE_GATE; ledger subject business_model", "output": "A submitted Model Revision", "onFail": "A stale save 409; a stale pinned input blocks submission until a person picks again", "screen": null, "source": "cost-model-study#CP1, #CP3, #CP5, #CP6", "status": "planned"}, {"n": 11, "phase": "Run", "actor": "Researcher", "action": "Start the computation", "detail": "\"Spustit výpočet · 0,00 USD\" (or the typed request to Ada, \"Spusť výpočet\") starts a business_model run: prepare, compute, report.", "fields": ["Spustit výpočet", "ceiling 0,00 USD"], "rule": "Known 0.00 USD ceiling; no hold, no charge, no confirmation", "output": "A run queued", "onFail": null, "screen": "M3 · header \"Spustit výpočet · 0,00 USD\"; Ada pane", "source": "cost-model-study#CP5", "status": "planned"}, {"n": 12, "phase": "Run", "actor": "Code", "action": "Freeze the run's inputs and pins", "detail": "Prepare freezes the revision and each dataset input by artifact id and SHA-256, and pins the type id and version, the Metodika module version and the seed drawn once at start.", "fields": ["revision sha256", "dataset artifact ids + sha256", "type pin", "module version", "seed"], "rule": "The run never reads the working copy", "output": "A frozen run identity", "onFail": null, "screen": null, "source": "cost-model-study#CP5, #CP2, #CP10", "status": "planned"}, {"n": 13, "phase": "Run", "actor": "Code", "action": "Compute the deterministic results", "detail": "Per line and per year totals; break-even on a driver in a stated range; one-way sensitivity ±10 %; cumulative cost with capital in year 0 and the payback year; NPV before and after tax and discounted payback, in Decimal.", "fields": ["totals", "break_even", "curve", "sensitivity", "cumulative", "payback", "NPV before tax", "NPV after tax"], "rule": "Break-even exact only where the driver enters through one monotone form; unknown propagated by name, never zero", "output": "CALCULATED results (výpočet)", "onFail": "break_even_not_exact (naming the driver), none_in_range, identical, none_within_horizon", "screen": null, "source": "cost-model-study#CM2, #CM7 · ADR 0046 W18", "status": "planned"}, {"n": 14, "phase": "Run", "actor": "Code", "action": "Compute exact ranges and dominance", "detail": "Every total's and difference's exact range by vertex enumeration over the low/high grid cut into closed STEP cells; dominance where A is below B at every vertex; otherwise the inputs that flip the ranking with their flip values.", "fields": ["range per total", "dominance", "flip inputs", "flip values"], "rule": "Exactness check first (each input through one monotone form); vertex cap 2^14", "output": "Ranges, dominance and flip values", "onFail": "range_not_exact (naming the input, Monte Carlo becomes the range view), range_too_large", "screen": null, "source": "cost-model-study#CR2", "status": "planned"}, {"n": 15, "phase": "Run", "actor": "Code", "action": "Run the Monte Carlo", "detail": "20 000 draws per stream under PCG64 and the run's seed, distributions from Předpoklady, correlations imposed by Iman-Conover; P(option better than B) with its standard error, the difference's 90 % interval, each scenario's percentiles.", "fields": ["N", "seed", "streams", "P", "standard error", "p5", "p50", "p95"], "rule": "Converged when five streams agree on P within ±0.01 and on the 5th/95th percentiles within tolerance; else N doubles to 160 000", "output": "ESTIMATED results (odhad), stored with the seed", "onFail": "not_converged", "screen": "M3 Ada pane (\"Hotovo za 6 s: základní výpočet a 20 000 losů\")", "source": "cost-model-study#CR3 · sign-off S4", "status": "planned"}, {"n": 16, "phase": "Run", "actor": "Code", "action": "Compute sensitivity and value of information", "detail": "Sobol first-order and total indices (Jansen, bootstrap intervals) for independent inputs, partial rank correlation when inputs are correlated; EVPPI per input from the draws in 20 equal-frequency bins.", "fields": ["Sobol S1", "Sobol ST", "PRCC", "EVPPI per input"], "rule": "PRCC replaces Sobol when any accepted correlation exists; EVPPI material at ≥ 5 % of the absolute expected difference", "output": "ESTIMATED sensitivity and value-of-information results", "onFail": "Sobol not shown for correlated inputs, the page says why", "screen": null, "source": "cost-model-study#CR4, #CR6 · sign-off S5, S7", "status": "planned"}, {"n": 17, "phase": "Store", "actor": "Code", "action": "Store results and keep reruns identical", "detail": "Results are stored as artifacts and never recomputed on read; a rerun under the same pins gives the same bytes; a retry with unchanged inputs reuses the results; the page keeps the run history, comparison and a JSON export.", "fields": ["results artifact", "Historie běhů", "Porovnat běhy", "Exportovat model (JSON)"], "rule": "Determinism harness: no clock, no randomness outside the seed; the usage ledger holds no row", "output": "Results ready; Výsledky unlocked", "onFail": null, "screen": "M3 · header (Historie běhů, Porovnat běhy, Exportovat model (JSON))", "source": "cost-model-study#CP2, #CP5, #CP10", "status": "planned"}], "objects": [{"name": "Model Revision", "fields": ["type_id / type_version (cost_scenarios v1 as first template)", "elements: drivers, line items, timing", "inputs (frozen from Předpoklady)", "scenarios: baseline + ≤ 11", "DecisionRule", "fixed parameters", "canonical JSON", "sha256", "working_revision"], "states": ["working", "submitted"]}, {"name": "Line item (Položka)", "fields": ["name", "kind: PŘÍJEM | KAPITÁL | FIXNÍ | VARIABILNÍ | JEDNORÁZOVĚ", "formula (closed vocabulary)", "variants it applies to", "year / timing", "capacity rule"], "states": ["proposed", "accepted", "dismissed"]}, {"name": "Scenario (Varianta)", "fields": ["id: A, A2, B, B2, C, C2, H", "name", "description", "baseline: bool", "overrides", "constraint flag"], "states": []}, {"name": "Run (business_model)", "fields": ["steps: prepare, compute, report", "revision sha256", "dataset artifact ids + sha256", "type pin", "Metodika module version", "seed", "N", "ceiling: 0,00 USD"], "states": ["queued", "running", "completed", "not_converged", "failed"]}, {"name": "Results artifact", "fields": ["CALCULATED outputs: totals, break-even, curve, sensitivity, cumulative, payback, NPV before/after tax", "ESTIMATED outputs: P, SE, percentiles, Sobol/PRCC, EVPPI", "ranges, dominance, flip values", "each output: grade, method id, version"], "states": []}], "handoffs_out": [{"name": "Stored results of the run", "to": ["vysledky"], "contents": ["CALCULATED and ESTIMATED refs with grade, method id and version", "median, 90 % interval and base value per option", "ranges, dominance, flip values", "Sobol/PRCC, EVPPI", "seed, pins"]}, {"name": "Monte Carlo scenarios for the scenario map", "to": ["sociomapa"], "contents": ["the run's scenarios as objects", "draws (≥ 800) per option", "chosen result refs as properties"]}, {"name": "Method and model description for the report", "to": ["osnova", "zprava"], "contents": ["line items and kinds", "timing and capacity rules", "method ids, versions, register status", "what is not modelled"]}], "gaps": ["What is the closed formula vocabulary of the composable model (W17)? CM1 defines four cost forms; the canvas uses revenue, residual value, growth exponents and conditional overrides. Which operators exist, and how do PŘÍJEM and JEDNORÁZOVĚ items enter CM2's exactness and break-even rules?", "How are capacity and timing rules expressed (overflow to another supplier, a 12-month build, a 6-month notice, half-year 2027), and do they create STEP cells for the exact-range enumeration?", "Is \"Submit\" a separate act? The canvas has one \"Spustit výpočet\" button, while CP5/CP6 require a submitted revision under APPROVE_GATE with a ledger row before a run.", "Model step size: Zadání Z5 02 offers months or years, and Provoz's LP is monthly, but CM2/CM7 compute per year. Does one model run produce monthly figures for Provoz, or is the monthly LP a separate computation over the same inputs?", "How does Ada's proposal of a whole item set (11 items) become per-change operations a researcher can accept in one pass without approving numbers it did not ground?", "Which model type template is pinned when the decision is not a cost comparison (contribution, revenue): is cost_scenarios v1 renamed or replaced by a cash-flow type, and what is its id?"]}, "vysledky": {"purpose": "Show the stored results per view, judge the person's own decision rule on them, and say what would change the decision and what is worth verifying, each number with its grade and method.", "actors": ["Code", "Researcher", "Ada", "Metodika"], "process": [{"n": 1, "phase": "Frame", "actor": "Code", "action": "Open the views the selection switched on", "detail": "The tabs Rozhodnutí, Finance, Účetnictví, Provoz, Logistika and Trh appear as Zadání's framework selection switched them on; a framework whose data contract is missing says which file it waits for.", "fields": ["tabs", "framework selection", "missing file"], "rule": "Each computed framework switches on its view (AF4)", "output": "The result views for this run", "onFail": "\"analýza není vybraná\" for an unselected framework, with a link to Zadání · Analýzy do zprávy", "screen": "M4 · tab bar; M4f · 05", "source": "analysis-frameworks#AF4 · ADR 0046 decision 4", "status": "planned"}, {"n": 2, "phase": "Grades", "actor": "Code", "action": "Mark every number's grade by method", "detail": "A deterministic formula prints výpočet even over an estimated input; Monte Carlo and statistics print odhad; an estimate whose method is not registered is marked odhad (interní) on screen and, in a client report, \"metoda čeká na schválení metodikem\" with an approval warning.", "fields": ["grade", "method id", "method version", "register status"], "rule": "Grade follows the method (W21); register entry decides client label (CP10, W27)", "output": "Each value carries its grade chip", "onFail": "Never refused for an unregistered method (W27); the warning is recorded on the approval's ledger row", "screen": "M4 · banner and section chips (výpočet / odhad (interní))", "source": "ADR 0046 W21, W27 · cost-model-study#CP8, #CP10, #CR8", "status": "decided"}, {"n": 3, "phase": "Headline", "actor": "Code", "action": "Lead with the median and its interval", "detail": "Each option's headline is the median with its 90 % interval from the draws; the base-case value appears only as \"v základu\" in a smaller line.", "fields": ["Medián proti B", "90% interval", "v základu"], "rule": "W20: median + 90 % interval leads", "output": "Headline figures on every tab", "onFail": null, "screen": "M4 · 01; M4b · 01 (\"(−3,5 až +18,6) · v základu +8,8\")", "source": "ADR 0046 W20 · cost-model-study#CP8", "status": "decided"}, {"n": 4, "phase": "Rozhodnutí", "actor": "Code", "action": "Judge the stated decision rule", "detail": "The rule written in Zadání before the data (here: highest median if better than B with P ≥ 0,80 and a loss over 10 mil. Kč in at most 10 % of futures, the city delivery promise not worsened) is judged per option.", "fields": ["Varianta", "Medián proti B", "90% interval", "P(lepší než B)", "P(ztráta > 10 mil.)", "Slib ve městech", "Pravidlo"], "rule": "Judged as written; default confidence 0,90 / 0,10 only when the rule names none, said on the page; dominance printed beside", "output": "Verdict: doporučeno, nerozhodnuto (naming the top inputs), splněno/nesplněno per option", "onFail": "No rule: no recommendation, \"rozhodovací pravidlo chybí\"; a rule changed after results is marked", "screen": "M4 · 01 Doporučení podle pravidla", "source": "cost-model-study#CR7 · Z3 · R2", "status": "planned"}, {"n": 5, "phase": "Rozhodnutí", "actor": "Code", "action": "Draw the difference's distribution", "detail": "A histogram of the recommended option minus B across 20 000 futures with the 5 % and 95 % marks and the share right of zero (86 %).", "fields": ["C2 − B", "5 %", "95 %", "share > 0"], "rule": "Charts drawn from stored refs only", "output": "The distribution chart", "onFail": null, "screen": "M4 · 02 Rozdíl C2 − B ve 20 000 budoucnostech", "source": "cost-model-study#CR8", "status": "planned"}, {"n": 6, "phase": "Rozhodnutí", "actor": "Code", "action": "Show what turns the result", "detail": "A tornado: each input at its low (blue) and high (orange) bound, the rest at base, ordered by swing; Sobol or partial-rank-correlation bars beside it, with the flip inputs and their flip values.", "fields": ["input", "low swing", "high swing", "Sobol / PRCC", "flip value"], "rule": "Ordered by swing; Sobol only for independent inputs", "output": "Sensitivity view", "onFail": "Correlated inputs: PRCC shown and the page says why Sobol is not", "screen": "M4 · 03 Co výsledek otáčí", "source": "cost-model-study#CM4, #CR2, #CR4, #CR8", "status": "planned"}, {"n": 7, "phase": "Rozhodnutí", "actor": "Code", "action": "Draw the break-even", "detail": "The options' totals across a driver's range drawn through the exact curve points, every crossing marked (C = B at 4,7 %, C2 = B at 7,2 % order loss), the data's range shaded, and the price flip (3PL PL fee 37,4 Kč).", "fields": ["driver", "range", "crossings", "data range"], "rule": "Points are exact evaluations: a fixed 64-point grid, both sides of every STEP jump, every crossing", "output": "Break-even chart", "onFail": "break_even_not_exact, none_in_range said in words", "screen": "M4 · 04 Bod zvratu", "source": "cost-model-study#CM2, #CM4", "status": "planned"}, {"n": 8, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the forecast and its backtest", "detail": "The kept forecast over history, its backtest against the baseline on the same 6 held-out months (Holt-Winters MASE 0,67 against seasonal naive 1,29), and that its errors set the order-growth range.", "fields": ["method", "baseline", "MASE", "held-out MAE", "backtest window"], "rule": "Used only if it beats the baseline on held-out error (MAE in the plan; MASE pending decision 10 (3))", "output": "Forecast view", "onFail": "The baseline is used and said", "screen": "M4 · 05 Předpověď objednávek, ověřená zpětně", "source": "cost-model-study#CR5, #CR8 · ADR 0046 decision 10 (3)", "status": "planned"}, {"n": 9, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the value of information", "detail": "EVPPI per input in Kč, before and after the latest data, with how each could be verified; the total value of perfect information (3,8 → 2,4 mil. Kč). This is the only place a crown value of information appears.", "fields": ["Předpoklad", "Před daty", "Po nich", "Jak ověřit", "EVPI"], "rule": "Material at ≥ 5 % of the absolute expected difference; an offer creates nothing until a person starts it", "output": "Value-of-information table and verification offers", "onFail": null, "screen": "M4 · 06 Hodnota informace: co ještě ověřit", "source": "cost-model-study#CR6 · ADR 0046 W3", "status": "planned"}, {"n": 10, "phase": "Rozhodnutí", "actor": "Code", "action": "Show the verdict at other discount rates", "detail": "The verdict recomputed at the alternative rates beside the study's fixed rate (the canvas names 6 % and 10 % around 8 %).", "fields": ["rate", "verdict per rate"], "rule": "One rate decides; the others are shown, never used to pick", "output": "Rate sensitivity of the verdict", "onFail": null, "screen": "not drawn on M4; stated on M2 · 02 Pevné parametry", "source": "ADR 0046 W16, decision 10 (4)", "status": "decided"}, {"n": 11, "phase": "Finance", "actor": "Code", "action": "Build the business case per option", "detail": "Per option against B: investment, NPV at 8 % as median and interval (odhad) with \"v základu\", NPV after tax at 21 % with legal depreciation, IRR and discounted payback at base (výpočet).", "fields": ["Investice", "NPV (8 %) · medián a 90% interval", "po dani", "IRR", "Návratnost (diskontovaná)"], "rule": "IRR by a stated root rule; the rule reads the NPV Zadání named, the other beside it", "output": "Business-case table", "onFail": "multiple_irr (each root listed), no_irr, none_within_horizon", "screen": "M4b · 01 Business case", "source": "cost-model-study#CM7 · quantitative-families#FIN2 · ADR 0046 W18", "status": "planned"}, {"n": 12, "phase": "Finance", "actor": "Code", "action": "Show cash flow by year and price break-evens", "detail": "The recommended option's yearly benefit and outlay against B with the discounted cumulative line and the payback marked; each price's break-even alone, others at base, for supplier negotiation.", "fields": ["year", "roční přínos", "roční výdaj", "kumulovaně", "Cena", "Dnes", "Bod zvratu"], "rule": "Each price varied alone (one-way)", "output": "Cash-flow chart and price break-even table", "onFail": null, "screen": "M4b · 02 Peněžní tok; 03 Ceny pro bod zvratu", "source": "quantitative-families#FIN4, #FIN6 · cost-model-study#CR2", "status": "planned"}, {"n": 13, "phase": "Finance", "actor": "Code", "action": "Estimate price elasticity from client data", "detail": "A log-log fit of orders on delivery price from the client's own price change (−0,38, 90 % interval −0,45 až −0,22), and the discount that would win back lost orders.", "fields": ["elasticity", "90% interval", "source event", "discount", "net effect"], "rule": "A registered Metodika method; internal until registered", "output": "An ESTIMATED elasticity marked odhad (interní)", "onFail": null, "screen": "M4b · 04 Cenová elasticita a cena dopravy", "source": "quantitative-families#FIN5 · ADR 0046 W8", "status": "planned"}, {"n": 14, "phase": "Účetnictví", "actor": "Code", "action": "Show baseline statements and plan against actual", "detail": "The 2025 P&L and balance sheet from the client's ledger export through the chart-of-accounts mapping, reconciled with the 3PL invoices; plan against actual per line as absolute and share.", "fields": ["Výsledovka 2025", "Rozvaha k 31. 12. 2025", "Plán", "Skutečnost", "Rozdíl"], "rule": "Every account mapped; price/volume/mix only where the contract declares quantities", "output": "Statements and variance (z dat klienta)", "onFail": "Unmapped account refused by name; does_not_balance named with the difference", "screen": "M4c · 01 Výchozí stav 2025; 02 Plán proti skutečnosti", "source": "quantitative-families#ACC1, #ACC2, #ACC4", "status": "planned"}, {"n": 15, "phase": "Účetnictví", "actor": "Code", "action": "Project health ratios per option", "detail": "EBITDA, margin, net debt / EBITDA, ROCE and current ratio in 2028 for each option at base, with the financing assumption stated (hall from a loan, switch from cash).", "fields": ["Ukazatel", "2025", "per option · 2028"], "rule": "Closed list of ratios, each with its formula", "output": "Ratio table (výpočet)", "onFail": "A zero denominator is undefined, never infinity or 0", "screen": "M4c · 03 Ukazatele zdraví firmy v roce 2028", "source": "quantitative-families#ACC3 · KM8Accounting board (per-option projection)", "status": "proposed"}, {"n": 16, "phase": "Provoz", "actor": "Code", "action": "Plan capacity, routing and stock", "detail": "Monthly order forecast against supplier capacity; a monthly linear program (HiGHS) minimising logistics cost and lost contribution under Zadání's constraints, with the routing plan and savings; safety stock per warehouse layout.", "fields": ["měsíc", "kapacita", "Kudy expedovat", "binding constraints", "Pojistná zásoba"], "rule": "Solver and version pinned; binding constraints and shadow prices in words; safety stock z × σ × √L (canvas also the square-root pooling rule)", "output": "Capacity risk, optimal plan and stock", "onFail": "infeasible, unbounded named with the solver's reason", "screen": "M4d · 01 Předpověď proti kapacitě; 02 Optimální plán; 03 Zásoby", "source": "quantitative-families#OR1, #OR2, #OR3 · KM9Operations board", "status": "planned"}, {"n": 17, "phase": "Logistika", "actor": "Code", "action": "Compute the selected logistics frameworks", "detail": "Cost-to-serve by zone, make-or-buy and 3PL total cost, warehouse sizing against growth, service level and OTIF, each from client data under its contract and public inputs.", "fields": ["Zóna", "Podíl objednávek", "Rozdíl na objednávku", "Investice", "Kapacita", "OTIF"], "rule": "Computed by code; only selected frameworks run", "output": "Logistics views", "onFail": "OTIF \"čeká na data\": missing promised and actual delivery dates named, \"Vyžádat data o doručení\"", "screen": "M4f · 01-05", "source": "analysis-frameworks#AF7, #AF4", "status": "planned"}, {"n": 18, "phase": "Trh", "actor": "Researcher", "action": "Size the market and judge the growth plan", "detail": "TAM, SAM and SOM top-down from cited public findings and the client's revenue; the growth plan's implied share per range end, each rated by the researcher as a labelled judgement (realistické, ověřit).", "fields": ["TAM", "SAM", "SOM", "Růst Velis ročně", "Podíl v segmentu 2032", "Hodnocení výzkumníka (úsudek)"], "rule": "Each chain step its own label, the chain printing the weakest; findings enter only as public_source; a verdict word is the researcher's judgement", "output": "Market view; then \"Přidat do osnovy zprávy\" hands chosen results on", "onFail": "A finding whose source no person added cannot be an input", "screen": "M4e · 01-03; header \"Přidat do osnovy zprávy\", \"Exportovat CSV / XLSX\", \"Porovnat běhy\"", "source": "quantitative-families#MKT2, #MKT4, #MKT5 · ADR 0046 W22, A10", "status": "planned"}], "objects": [{"name": "Result ref", "fields": ["ref id", "option", "quantity", "grade: výpočet | odhad", "method id / version", "register status", "median, p5, p95", "v základu", "inputs read"], "states": ["internal (odhad (interní))", "registered", "stale"]}, {"name": "Verdict", "fields": ["DecisionRule (option, quantity, comparison, threshold, confidence, risk bound, constraint)", "stated at", "changed after results: bool", "per option: splněno / nesplněno", "doporučeno | nerozhodnuto", "default confidence used: bool", "dominance"], "states": ["no rule", "judged", "marked changed after results"]}, {"name": "Value-of-information row", "fields": ["input", "EVPPI before", "EVPPI after", "Jak ověřit", "material: bool", "offer"], "states": ["offered", "started"]}, {"name": "Result view (tab)", "fields": ["tab: Rozhodnutí | Finance | Účetnictví | Provoz | Logistika | Trh", "framework", "sections", "data waited for"], "states": ["computed", "čeká na data", "analýza není vybraná"]}], "handoffs_out": [{"name": "Chosen results as report-outline points", "to": ["osnova"], "contents": ["result refs with grade and method", "charts as specs over stored refs", "verdict with its rule", "researcher judgements with author"]}, {"name": "Properties for the map", "to": ["sociomapa"], "contents": ["options as objects", "chosen results (NPV, interval width, P(cheapest)) as properties", "scale extremes and direction"]}, {"name": "Results for the report", "to": ["zprava"], "contents": ["CALCULATED numbers", "ESTIMATED numbers labelled with method status", "method appendix (id, version, register status)"]}, {"name": "Requests for missing data", "to": ["data"], "contents": ["file or columns a view waits for (e.g. promised and actual delivery dates)"]}], "gaps": ["The canvas's rule is multi-option with a risk bound (P(loss > 10 mil.) ≤ 10 %) and a hard constraint (the city promise); CR7 defines a pairwise rule (one option, one threshold, a confidence). How is a rule over seven options with a risk bound and constraints represented and judged, and who checks a constraint like \"Slib ve městech\"?", "Client surface for unregistered estimates: W27 says they reach the client report labelled with an approval warning, but CP10 still refuses them on the client surface and M4's banner says the client report carries only výpočet and ranges. Which is built?", "Where do the Finance, Účetnictví and Provoz figures per option come from? quantitative-families computes statements from a ledger and ratios from statements, but the canvas projects 2028 statements and ratios per option and a monthly LP: what links the cash-flow model to those projections?", "The verification offer: CR6 offers \"Ověřit výzkumem\" (a survey study), which the freeze removed; the canvas's \"Jak ověřit\" lists data requests and contract terms. What does a material EVPPI now offer, and what does it create?", "Where is the verdict at other discount rates drawn, and which rates (W16)? M4 has no section for it.", "What does \"Přidat do osnovy zprávy\" hand over: a single number, a whole section, a chart spec? And what happens to an added point when the run is rerun or a result goes stale?", "The exact range table and dominance (CR2, CR8) are planned for Výsledky but not drawn on M4; where do they sit beside the Monte Carlo table?"]}, "sociomapa": {"purpose": "Show which objects the rows rate alike, and how firm that picture is, by one engine and two map types; it supports the recommendation and never makes it.", "actors": ["Researcher", "Ada", "Code", "Metodika", "Client's people"], "process": [{"n": 1, "phase": "Configuration", "actor": "Ada", "action": "Propose the configuration", "detail": "From where the rows come from and what is asked, Ada proposes one of the five configurations, with its two declarations: do the objects share a scale, and how do the rows depend.", "fields": ["map type", "configuration", "shared scale", "row dependence"], "rule": "Proposed before any map is computed, never after (MOD-3.3).", "output": "The configuration pinned on the study's Sociomapa run.", "onFail": "A configuration not in the register can still run, labelled internal.", "screen": null, "source": "lifecycle page · MOD-13.1 · R2-Q15", "status": "decided"}, {"n": 2, "phase": "Configuration", "actor": "Researcher", "action": "Confirm or change it", "detail": "The researcher accepts the proposal or picks another configuration; the choice is recorded.", "fields": ["configuration", "who", "when"], "rule": "A valve: nothing is computed before it is confirmed.", "output": "The confirmed configuration.", "onFail": null, "screen": null, "source": "MODULES.md module 13", "status": "planned"}, {"n": 3, "phase": "Rows", "actor": "Code", "action": "Build the table", "detail": "Futures and weight settings from the model run under its seed; experts' ratings from the rating form; units and months from the client's data contract.", "fields": ["source", "row count", "objects", "seed"], "rule": "Each table named and saved, so every map traces to its exact table.", "output": "The row matrix.", "onFail": "Fewer rows than the configuration's minimum: refused by name.", "screen": null, "source": "sociomapa-systemu#SYS9 #SYS10 #SYS11 · mindmap", "status": "planned"}, {"n": 4, "phase": "Preparation", "actor": "Metodika", "action": "Declare the preparation", "detail": "Row mean removed (futures, experts); a 0–10 value scale then row mean (weights); z across units; trend removed then z (months); direction aligned for every indicator.", "fields": ["transformation", "direction", "declared at"], "rule": "Frozen before any result; a change after is a new revision the report names.", "output": "The declared preparation, pinned with the run.", "onFail": null, "screen": null, "source": "sociomapa-systemu#SYS2 · MOD-11.1", "status": "planned"}, {"n": 5, "phase": "Map", "actor": "Code", "action": "Compute the map", "detail": "aia-sociomap-5: pair relations (baseline-corrected r̃, or correlation of standardised columns), layout on the ruler, heights and terrain where defined, split-half agreement.", "fields": ["r̃ per pair", "layout method", "iterations", "converged", "heights", "split-half"], "rule": "One engine for every configuration; a configuration is data, not code.", "output": "The map.", "onFail": null, "screen": null, "source": "engine_v2.compute_object_map · AIA_SOCIOMAP_V5", "status": "decided"}, {"n": 6, "phase": "Test", "actor": "Code", "action": "Run the scenario test", "detail": "Futures: the map under driver correlation 0, 0,4 and 0,8 and on a new sample; Spearman of distances ≥ 0,8 for every two. Weights: shares of first place in three fan widths.", "fields": ["assumptions", "samples", "ρ per pair of maps", "shares first / tied"], "rule": "No p-values: the model makes as many rows as we ask for.", "output": "The stability verdict and the shares.", "onFail": "Printed as is; distances are then not read.", "screen": null, "source": "lifecycle page: Budoucnosti, Nastavení vah", "status": "planned"}, {"n": 7, "phase": "Test", "actor": "Code", "action": "Run the observed-data test", "detail": "Experts: whole experts resampled, one radius 1,2 × median spread. Units: 400 bootstraps, a pair drawn when its 95 % interval excludes zero. Months: 1 000 IAAFT surrogates, Benjamini–Yekutieli, effective months.", "fields": ["resamples", "radius", "intervals", "q", "n_eff"], "rule": "Resample the way the rows depend on each other.", "output": "The test result per pair or per map.", "onFail": "A pair that fails is not drawn.", "screen": null, "source": "lifecycle page: Experti, Jednotky, Měsíce", "status": "planned"}, {"n": 8, "phase": "Tables", "actor": "Code", "action": "Build the tables beside the map", "detail": "Heights; joint losses (futures); shares of first place (weights); intervals (units); effective months (months).", "fields": ["table", "counts"], "rule": "Every share printed with both counts.", "output": "The companion tables.", "onFail": null, "screen": null, "source": "lifecycle page § 5", "status": "planned"}, {"n": 9, "phase": "Claims", "actor": "Code", "action": "State what the map may claim", "detail": "The configuration's claim and never-claim list, on screen and in the report; three results printed: converged, fidelity, verdict.", "fields": ["claim", "never-claims", "three results"], "rule": "Never one word for credibility.", "output": "The claim text.", "onFail": null, "screen": null, "source": "lifecycle page § 7", "status": "decided"}, {"n": 10, "phase": "Register", "actor": "Metodika", "action": "Label it by its register status", "detail": "Internal until the methodologist registers the configuration, after its planted-answer test passes; printed as “odhad (metoda čeká na schválení metodikem)”.", "fields": ["register status", "grade"], "rule": "The 21 Oct approval covers people's ratings only.", "output": "The label on the map.", "onFail": null, "screen": null, "source": "domain/sociomap_register.py · R2-Q16", "status": "decided"}, {"n": 11, "phase": "Hand-off", "actor": "Researcher", "action": "Add the map's points to the outline", "detail": "The map snapshot, its test and tables, and its claim become points in Osnova zprávy.", "fields": ["map artifact id", "points"], "rule": "An unproven point holds the hand-off.", "output": "Map points in the outline.", "onFail": null, "screen": null, "source": "research-findings-stage#FND10", "status": "planned"}], "objects": [{"name": "Sociomapa run", "fields": ["map type", "configuration", "declared preparation", "method id + version", "register status", "source table id", "test result", "three results", "claim text"], "states": ["computed", "internal (awaiting register)", "registered", "superseded"]}, {"name": "Indicator table", "fields": ["indicator", "unit", "source + date", "direction", "weight", "group", "value per object"], "states": ["draft", "frozen"]}, {"name": "Expert rating", "fields": ["expert name", "criterion", "option", "score 0–10", "when"], "states": ["missing", "scored"]}, {"name": "Map snapshot", "fields": ["map artifact id", "view", "render artifact (by hash)", "approval"], "states": ["stored", "approved"]}], "handoffs_out": [{"name": "Map points", "to": ["osnova"], "contents": ["claim text", "configuration", "test result", "tables beside the map", "register status", "never-claim list"]}, {"name": "Map figure", "to": ["osnova", "zprava"], "contents": ["stored snapshot render", "three results", "label 'metoda čeká na schválení metodikem'"]}], "gaps": ["What height means on the units and months maps (open, methodologist).", "Whether the indicator profile is a sixth configuration (R2-Q22).", "The minimum rows for each configuration, from its planted-answer test.", "The fan widths and the number of weight settings for the crossed grid.", "The declared error rate a no-relation world may show before a register entry.", "What happens to the map when the model is rerun or the Předpoklady change: stale, recomputed, or reopened?"]}, "osnova": {"purpose": "Lay out the report as its bare points (each claim or number with its visual and a resolving link to its source or method) so a person can verify everything before any prose is written.", "actors": ["Researcher", "Ada", "Code", "Client's people"], "process": [{"n": 1, "phase": "Structure", "actor": "Ada", "action": "Propose the outline's chapters", "detail": "Ada proposes the report outline (chapters and sections in report order) from the brief, the selected frameworks and the study's results; the canvas shows 5 chapters and 17 points.", "fields": ["chapter", "section", "order", "framework", "chapter kind"], "rule": "A person accepts each change; an outline the person has not approved does not compose (ledger subject ": "A ledger row per check; stale points named.", "onFail": "Set aside: the point is marked stale.", "screen": "MV2b (Rešerše: přijetí, odložení, rozpor)", "source": "research-findings-stage#FND3 · MV7 U6", "status": "planned"}, {"n": 5, "phase": "Points", "actor": "Researcher", "action": "Add a point", "detail": "'Přidat → Bod': a point with a number (e.g. 3.1), its kind (finding, data point, method point, conclusion, recommendation), its sentence and its refs, each number printed with its grade label.", "fields": ["point no.", "kind", "text", "refs", "grade label", "visual", "stop"], "rule": "Every number and claim must link to its source or method.", "output": "A point in the outline.", "onFail": "No resolving link: unverified.", "screen": "MV4 · Přidat · Bod", "source": "research-findings-stage#FND0 #FND2", "status": "planned"}, {"n": 6, "phase": "Points", "actor": "Researcher", "action": "Write a labelled judgement", "detail": "A researcher's own judgement (e.g. a Porter force strength, 'realistické') enters as a point with its own grade, úsudek, and the author's name; Ada may propose it with a reason, but only a person writes it.", "fields": ["text", "author", "grade: úsudek", "reason"], "rule": "Never mixed with sourced points; the Lead never writes a judgement point.", "output": "A judgement point.", "onFail": null, "screen": "KM6 · Stupně čísel · úsudek", "source": "ADR 0046 A3 · W10 · W22 · analysis-frameworks#AF0", "status": "decided"}, {"n": 7, "phase": "Points", "actor": "Ada", "action": "Propose a point, visual or move", "detail": "Ada proposes one change at a time as a card with Přijmout / Zahodit (canvas: a shipping discount point with its graph).", "fields": ["proposal", "point", "visual", "Přijmout", "Zahodit"], "rule": "A number enters only as a ref it was given; a paid lookup only through the Lead's priced card.", "output": "An accepted or dismissed proposal, recorded.", "onFail": "Dismissed: nothing changes.", "screen": "MV4 · Ada 10:22 · Přijmo Fail": "A cell without a ref is refused.", "screen": "MV4 · Přidat · Tabulka; 'Tabulka · finance variant · každá buňka odkaz'", "source": "research-findings-stage#FND4 · diagrams#DG6", "status": "planned"}, {"n": 11, "phase": "Visuals", "actor": "Researcher", "action": "Draw a graph from a table", "detail": "'Přidat → Graf': a Vega-Lite spec over the table (bar, line, stacked, scatter, interval), every mark linked to its point; validated against the schema before shown; rendered with the viz tokens, the same on screen and in the DOCX.", "fields": ["chart kind", "spec", "series refs", "alt text", "long description"], "rule": "The spec validates before anything is shown; each series is exactly the artifact's refs.", "output": "A chart spec (canvas: median and 90 % interval against B, each dot linked to run M-0412).", "onFail": "An invalid spec is not shown.", "screen": "MV4 · Přidat · Graf", "source": "research-findings-stage#FND5 · diagrams#DG1 #DG3", "status": "planned"}, {"n": 12, "phase": "Visuals", "actor": "Researcher", "action": "Draw a process diagram", "detail": "'Přidat → Diagram: BPMN, datové toky, stavy, sekvence…': a typed spec (BPMN XML, Mermaid, Graphviz) edited in place, each element that states a fact linked to its point.", "fields": ["diagram kind", "steps", "actors", "decisions", "flows", "element refs"], "rule": "Validated per engine (bpmn-moddle against BPMN 2.0, the Mermaid parser) before shown; every edit a revision-checked working-copy operation.", "output": "A diagram spec (canvas: execution plan with the 6/2027 decision point).", "onFail": "An invalid spec is refused before display.", "screen": "MV4 · 4 'Procesní diagram · kroky a rozhodovací bod'", "source": "research-findings-stage#FND6 · diagrams#DG4 #DG8", "status": "planned"}, {"n": 13, "phase": "Visuals", "actor": "Researcher", "action": "Insert a framework template", "detail": "'Šablona analýzy: SWOT, PESTEL, Porter…': a fixed-layout template from typed data, its slots filled with linked points.", "fields": ["template", "slots", "slot points"], "rule": "Sourced points or labelled judgements only.", "output": "A template visual (canvas: SWOT).", "onFail": null, "screen": "MV4 · Přidat · Šablona analýzy", "source": "diagrams#DG5 · analysis-frameworks#AF6", "status": "planned"}, {"n": 14, "phase": "Points", "actor": "Researcher", "action": "Add a legal point", "detail": "A legal point (law, provision, version date, verbatim quote, snapshot hash) enters with a kind and a grade of its own, and flags the report for the 'not legal advice' disclaimer.", "fields": ["law", "provision", "version date", "quote", "snapshot hash", "grade: právní předpis"], "rule": "The quote is literally in the captured provision; the researcher accepts it.", "output": "A legal point; the disclaimer flag on the report.", "onFail": "Quote not found: refused.", "screen": "KM6 · Stupně čísel · právní předpis", "source": "legal-context#LGL5 #LGL2 · W19", "status": "planned"}, {"n": 15, "phase": "Stops", "actor": "Researcher", "action": "Open, name and close a stop", "detail": "The researcher groups points into named stops and closes each; the closer and date are shown (canvas: 'Zastávka 1 · Rozhodnutí a čísla · uzavřela J. Malá 30. 10.'; others 'otevřená · uzavírá výzkumník').", "fields": ["stop name", "points", "state", "closed by", "closed at"], "rule": "A person closes a stop; nothing reaches Zpráva from an open stop.", "output": "A closed stop.", "onFail": "Reopening a stop marks the report draft stale and names the points that moved.", "screen": "MV4 · Zastávka 1–3", "source": "research-findings-stage#FND8", "status": "planned"}, {"n": 16, "phase": "Review", "actor": "Client's people", "action": "Review a shared stop", "detail": "Optionally, the researcher shares a closed stop with the client's decision-makers as a read-only page (points, visuals, sources); their comments and agreement go to the approval ledger.", "fields": ["share link", "comments", "agreement", "who", "when"], "rule": "Optional; a ledger subject admitted by migration before its writer.", "output": "Comments and agreement recorded; the report then written from it.", "onFail": null, "screen": null, "source": "W26 · research-findings-stage#FND12", "status": "decided"}, {"n": 17, "phase": "Stops", "actor": "Researcher", "action": "Filter to unverified points", "detail": "'Jen neověřené body' shows only the points without a resolving source and how many hold the hand-off.", "fields": ["filter", "unverified count"], "rule": null, "output": "The list of points blocking the hand-off.", "onFail": null, "screen": "MV4 · 'Jen neověřené body · 1 bod bez zdroje drží předání'", "source": "MV4 (canvas) · W25", "status": "proposed"}, {"n": 18, "phase": "Hand-off", "actor": "Researcher", "action": "Hand off to Zpráva", "detail": "'Předat do Zprávy' sends the closed stops to Zpráva.", "fields": ["Předat do Zprávy", "closed stops", "unverified count"], "rule": "Blocked while any point is unverified, until its source is found or the point is removed; nothing is dropped silently.", "output": "Zpráva receives the closed points and visuals.", "onFail": "The button stays held, naming the unverified point(s).", "screen": "MV4 · Předat do Zprávy", "source": "W25 · research-findings-stage#FND8 #FND2 · M-9", "status": "decided"}], "objects": [{"name": "Report outline", "fields": ["chapters (ordered)", "sections", "framework per chapter", "chapter kind + version", "working revision", "report_outline ledger rows"], "states": ["proposed", "accepted", "stale"]}, {"name": "Outline point", "fields": ["number: 3.1", "kind: finding | data point | method point | conclusion | recommendation | judgement | legal", "text", "refs[]", "grade label: výpočet | odhad (interní) | z dat klienta | veřejný zdroj | úsudek | právní předpis", "author (judgement)", "visual id", "stop id", "link state"], "states": ["verified", "unverified", "stale"]}, {"name": "Visual", "fields": ["kind: table | chart | diagram | template", "engine: Vega-Lite | Mermaid | bpmn-js | Graphviz | template", "spec", "spec version", "element/cell refs", "alt text", "long description", "render artifact (by spec hash)"], "states": ["proposed", "accepted", "invalid"]}, {"name": "Stop", "fields": ["name", "points", "closed by", "closed at", "shared review comments", "client agreement"], "states": ["open", "closed", "reopened"]}, {"name": "Finding check", "fields": ["finding id", "check", "who", "when", "ledger row"], "states": ["kept", "set aside", "needs checking"]}], "handoffs_out": [{"name": "Closed stops", "to": ["zprava"], "contents": ["chapter and section order", "points with kind, text, refs and grade", "visual specs and stored renders", "provenance links", "judgement authors", "legal-point disclaimer flag", "stale/moved points on reopen"]}, {"name": "Shared review page", "to": ["client"], "contents": ["a closed stop's points", "visuals", "sources", "comment and agreement form"]}], "gaps": ["What does a point's text become in Zpráva: is it reused verbatim, or paraphrased by the writer? How is FND9's 'the report states no point the outline does not hold' checked mechanically, sentence by point?", "Is 'verified' only 'the link resolves' (FND2), or must a person also confirm each point? What does a conclusion or recommendation (e.g. 1.1 'pravidlo splněno') link to: the rule evaluation, the run, or both?", "When a model rerun, a new Předpoklady revision or a new Deep Research run changes a referenced number, what happens to points, visuals and closed stops? Are they stale automatically, reopened, or pinned to the old run?", "Is FND0's outline the same type as situation-reports RC1's ReportOutline / ChapterKind? Which plan owns it, and is the ledger subject report_outline shared?", "How are points assigned to stops? Must all stops be closed before the hand-off, or can Zpráva start from the stops already closed (MV4 shows stops 2 and 3 open)?", "Shared review: how do the client's decision-makers (not members) get access, what does 'agreement' bind, and does it gate the hand-off or the approval?", "Ledger subjects for the finding check, the stop close and the shared review: which names, and admitted by which migration?"]}, "zprava": {"purpose": "Write the report's prose around exactly the closed outline points, keeping every number traceable and labelled, then have a person approve one exact version and export it to the client.", "actors": ["Ada", "Code", "Researcher", "Metodika", "Client"], "process": [{"n": 1, "phase": "Compose", "actor": "Ada", "action": "Write prose around closed points", "detail": "The writer drafts each section's prose around the closed points in the outline's order, leading with the recommendation and the execution plan; every printed number is a locked, tagged content control holding its ref. Czech in the MVP.", "fields": ["section", "closed points", "prose", "locked ref controls", "language: cs"], "rule": "Every printed number and claim keeps its provenance link; English comes after the MVP.", "output": "A draft report version ('Koncept · čeká na schválení').", "onFail": null, "screen": "KM6 · body; Ada 9:10", "source": "research-findings-stage#FND9 · situation-reports#RC6 (writer LO9b) · artifact-report RPT8a · W28", "status": "planned"}, {"n": 2, "phase": "Check", "actor": "Code", "action": "Check the prose against the outline", "detail": "Before approval, code checks that the report states no point the outline does not hold, and the sentence check marks a comparison made in words with no ledger number in the sentence.", "fields": ["sentence", "cited refs", "outline point ids", "unsupported_comparison mark"], "rule": "Report ⊆ closed outline; the sentence check marks, never refuses.", "output": "Check results attached to the draft.", "onFail": "A sentence with no outline point is flagged before approval.", "screen": null, "source": "research-findings-stage#FND9 · M-9 · report-delivery RD7", "status": "planned"}, {"n": 3, "phase": "Grades", "actor": "Code", "action": "Print each number's grade", "detail": "Each number prints its grade label beside it: výpočet, odhad (interní), z dat klienta, veřejný zdroj, úsudek, právní předpis; a grade follows its method, not its inputs; the legend is printed.", "fields": ["grade", "label", "ref", "Stupně čísel legend"], "rule": "One table maps every grade to its Czech label and admission rule; deterministic formulas are výpočet, Monte Carlo and statistics are odhad.", "output": "Labelled numbers and the grade legend.", "onFail": "An unknown total prints 'neznámé' with its missing input (CP8).", "screen": "KM6 · Stupně čísel", "source": "cost-model-study#CP8 · A5 · W21", "status": "decided"}, {"n": 4, "phase": "Headline", "actor": "Code", "action": "Lead with the median and interval", "detail": "Each option's headline is the median with its 90 % interval; the base case appears only as 'v základu'; NPV is printed before and after tax.", "fields": ["median", "90 % interval", "v základu", "NPV before tax", "NPV after tax"], "rule": "Median plus interval leads; the decision rule reads one tax view, the other sits beside it.", "output": "Headline sentences (canvas: '+7,3 mil. Kč … −3,5 až +18,6; po dani +7,0').", "onFail": null, "screen": "KM6 · Doporučení; Finance paragraph", "source": "W20 · W18 · cost-model-study#CP8 #CM7", "status": "decided"}, {"n": 5, "phase": "Labels", "actor": "Code", "action": "Label judgements and external context", "detail": "A researcher's judgement prints as one, with its author ('podle úsudku výzkumníka realistický'); an external Deep Research finding is labelled as external context, never as client data or respondent evidence.", "fields": ["judgement author", "external context label", "source"], "rule": "Never mixed with sourced points.", "output": "Labelled sentences.", "onFail": null, "screen": "KM6 · Trh a cena", "source": "A3 · W22 · research-findings-stage#FND9 · ADR 0021", "status": "decided"}, {"n": 6, "phase": "Labels", "actor": "Code", "action": "Label unregistered methods", "detail": "An estimate whose method A. Bahbouh has not registered still reaches the client version, labelled 'metoda čeká na schválení metodikem'.", "fields": ["method id", "register status", "label"], "rule": "Include, labelled, warn; never refused.", "output": "Labelled estimates in the client version.", "onFail": null, "screen": "KM6 · Ada 9:10", "source": "W27 · M-5 · ADR 0046 decision 5", "status": "decided"}, {"n": 7, "phase": "Labels", "actor": "Code", "action": "Print the legal disclaimer", "detail": "Wherever a legal point is used, the report prints that it is not legal advice.", "fields": ["legal points used", "disclaimer text"], "rule": "The disclaimer is printed in every report that uses a legal point.", "output": "The disclaimer block.", "onFail": null, "screen": "KM6 · Stupně čísel · právní předpis 'Zpráva není právní rada'", "source": "legal-context#LGL5 #LGL0 · W19", "status": "planned"}, {"n": 8, "phase": "Appendix", "actor": "Code", "action": "Append methods and sources", "detail": "A method appendix names each method's id, version, pinned defaults and register status; a sources appendix lists each file (with pages), data contract version, method version and seed.", "fields": ["Metoda", "Verze", "Registr", "files and pages", "contract version", "seed"], "rule": "Every method used is listed with its register status.", "output": "'Metody a registr' and 'Příloha · Odkud čísla jsou'.", "onFail": null, "screen": "KM6 · Metody a registr; Příloha · Odkud čísla jsou", "source": "cost-model-study#CR9 · domain report sources manifest (research-findings-stage § What is reused)", "status": "planned"}, {"n": 9, "phase": "Variant", "actor": "Researcher", "action": "Switch internal and client versions", "detail": "'Interní' / 'Pro klienta' switches between the internal draft and the client version of the same report.", "fields": ["Interní", "Pro klienta"], "rule": "CR9: the client version carries CALCULATED and registered ESTIMATED numbers only; W27 later admits unregistered estimates, labelled.", "output": "The variant shown.", "onFail": null, "screen": "KM6 · Interní / Pro klienta", "source": "KM6 (canvas) · cost-model-study#CR9 · W27", "status": "proposed"}, {"n": 10, "phase": "Figures", "actor": "Code", "action": "Insert figures from stored renders", "detail": "Each figure comes from its stored server render, never browser bytes, numbered with the outline, with a caption naming its sources and alt text.", "fields": ["figure no.", "render artifact", "caption sources", "alt text"], "rule": "The same spec renders the same bytes.", "output": "Figures in the DOCX.", "onFail": "No stored render: the figure is not printed.", "screen": null, "source": "diagrams#DG9 #DG2 · research-findings-stage#FND5", "status": "planned"}, {"n": 11, "phase": "Edit", "actor": "Researcher", "action": "Edit the draft in the editor", "detail": "Zpráva opens in the report editor (ONLYOFFICE) instead of a preview; the numbers stay in locked controls, and a saved version records what it changed in code-written text.", "fields": ["editor version", "saved by", "changed controls", "loose numbers"], "rule": "Locked controls; a save's changes recorded.", "output": "A saved koncept version.", "onFail": "Unsaved edits hold the approval.", "screen": "MV7 · 03 'Zpráva v editoru'", "source": "MV7 (canvas) · artifact-report RPT8a–RPT8f", "status": "proposed"}, {"n": 12, "phase": "Revise", "actor": "Researcher", "action": "Go back to the outline", "detail": "'Zpět do osnovy' reopens the outline; reopening a stop marks the draft stale and names the points that moved.", "fields": ["Zpět do osnovy", "stale draft", "moved points"], "rule": "A draft from a reopened stop is stale.", "output": "A stale draft, with the moved points named.", "onFail": null, "screen": "KM6 · Zpět do osnovy", "source": "research-findings-stage#FND8", "status": "planned"}, {"n": 13, "phase": "Approve", "actor": "Researcher", "action": "Approve one exact version", "detail": "'Schválit' approves exactly the stored version shown, once; the client report's checks and the unregistered-method warnings appear in the dialog and are recorded on the approval's ledger row; the report kind is business_model.", "fields": ["version (stored_at)", "report kind: business_model", "warnings", "approver", "self-approval rule"], "rule": "Warnings, never a refusal; no author approving their own line where self-approval is off.", "output": "An approved version with its ledger row.", "onFail": "report_version_stale once the line moved on; report_edits_unsaved until a save holds every edit.", "screen": "KM6 · Schválit", "source": "W27 · report-delivery RD0 · cost-model-study#CP8 · artifact-report RPT8f", "status": "decided"}, {"n": 14, "phase": "Export", "actor": "Researcher", "action": "Download DOCX and PDF", "detail": "'Stáhnout DOCX' / 'Stáhnout PDF' download the version shown, each file checked to be that version.", "fields": ["Stáhnout DOCX", "Stáhnout PDF", "artifact id", "review state"], "rule": "The file downloaded is the version approved.", "output": "The client deliverable.", "onFail": null, "screen": "KM6 · Stáhnout DOCX · Stáhnout PDF", "source": "research-findings-stage#FND9 · cost-model-study#CP8 · MV0 'Zpráva z osnovy, schválení a export'", "status": "planned"}, {"n": 15, "phase": "Approve", "actor": "Researcher", "action": "Review the version history", "detail": "'Historie verzí' lists the report's versions; today only a menu item.", "fields": ["version", "saved by", "when", "approval"], "rule": null, "output": "A version list.", "onFail": null, "screen": "KM6 · Historie verzí; MV7 · 03", "source": "MV7 (canvas)", "status": "proposed"}], "objects": [{"name": "Report version", "fields": ["artifact id", "report kind: business_model", "variant: internal | client", "stored_at", "document model contract", "source outline revision", "grade legend", "language: cs"], "states": ["koncept", "stale", "approved", "superseded"]}, {"name": "Printed ref", "fields": ["ref id", "control tag", "grade label", "provenance link", "outline point id", "label: metoda čeká na schválení metodikem"], "states": []}, {"name": "Approval", "fields": ["version approved", "approver", "at", "warnings", "self-approved", "ledger row"], "states": ["recorded"]}, {"name": "Method appendix entry", "fields": ["method id", "version", "pinned defaults", "register status: výpočet | čeká | registered"], "states": []}], "handoffs_out": [{"name": "Approved report", "to": ["client"], "contents": ["DOCX and PDF of the approved version", "recommendation and execution plan", "median + 90 % interval headlines", "grade labels and legend", "method and register appendix", "sources appendix", "unregistered-method labels", "legal disclaimer where used"]}], "gaps": ["Which rule decides what the client version carries? CR9 (CALCULATED and registered ESTIMATED only) and the map banner on MV3 conflict with W27 (unregistered estimates go in, labelled, with a warning). Does a MODELLED map figure follow W27 too?", "Who writes the prose, the writer worker (LO9b) or Ada? At what granularity does a person accept it (section, paragraph)? What does it cost, and which budget pays?", "How is a sentence mapped to its outline point so that 'states nothing the outline does not hold' can be checked? What happens to connective or summarising sentences that carry no point?", "If a person edits the report in the editor and adds a claim or changes a locked number, does that go back to the outline, or is it refused?", "Is the internal version and the client version one approval or two? Is business_model the report kind for a study that has no model?", "Does a stop the client agreed to in the shared review (W26) appear in the report or in its approval record?"]}};

function designHtml(s){

function drawConnectors(){
  document.querySelectorAll(".lanes").forEach(box=>{
    const svg=box.querySelector("svg.conn"); if(!svg)return;
    const b=box.getBoundingClientRect(); svg.setAttribute("width",b.width); svg.setAttribute("height",b.height); svg.setAttribute("viewBox",`0 0 ${b.width} ${b.height}`);
    const cards=[...box.querySelectorAll(".pcard")].map(c=>c.getBoundingClientRect());
    let d="";
    for(let i=0;i<cards.length-1;i++){const a=cards[i],c=cards[i+1];const x1=a.left+a.width/2-b.left,y1=a.bottom-b.top,x2=c.left+c.width/2-b.left,y2=c.top-b.top;const my=y1+(y2-y1)/2;
      d+=Math.abs(x1-x2)<2?`M${x1},${y1}V${y2-2}`:`M${x1},${y1}V${my}H${x2}V${y2-2}`}
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--strong)" stroke-width="1.6"/>`;
  });
}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(drawConnectors,100)});

  const waiting=["owner","aram","coord"].map(w=>{const qs=QUESTIONS.filter(q=>q[4]===w);return `<div class="card"><div class="row"><h3>${WHO_LABEL[w]}</h3><span class="grow"></span><span class="chip open">${qs.length}</span></div><ul class="qlist">${qs.map(q=>`<li><span>${esc(q[2])}</span><span class="tech">${esc(q[0])}</span></li>`).join("")}</ul></div>`}).join("");
  const docs=DOCS.map(([n,u,what,ex,d])=>`<tr><td><b>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`:esc(n)}</b><div class="cap">${esc(d)}</div></td><td>${esc(what)}</td><td>${esc(ex)}</td></tr>`).join("");
  const diffs=DIFFS.map(([t,was,now,ref,st])=>`<tr><td><b>${esc(t)}</b></td><td>${esc(was)}</td><td>${esc(now)}<div class="row" style="margin-top:6px"><span class="chip ${st==="open"?"open":"done"}">${st==="open"?"open":"corrected"}</span><span class="tech">${esc(ref)}</span></div></td></tr>`).join("");
  const gloss=GLOSSARY.map(([g,ts])=>`<div class="gcol"><h3>${esc(g)}</h3><dl>${ts.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl></div>`).join("");
  v.innerHTML=`<div class="ov-hero">
   <div><div class="eyebrow">What we are building, and how</div>
    <h2>One business decision, from the client's question to a report that shows its proof</h2>
    <p class="ov-lede">A client brings a decision, for example where to store and ship its orders. AIA writes the decision down, collects the client's own data and public facts, computes every option across thousands of possible futures, and delivers a report in which every number links to where it came from.</p>
    <dl class="ov-three">
     <dt>What the client gets</dt><dd>A recommendation with a pilot plan, the tables and maps behind it, and a report that says only what was proven.</dd>
     <dt>Why it can be trusted</dt><dd>The rule for choosing is written before any result. Every number carries a grade and a link to its source. A method the methodologist has not approved is printed as an estimate, with a label.</dd>
     <dt>What the MVP is</dt><dd>The smallest version a real client could use from the first conversation to the approved report: one study type, one model type, five kinds of map, a report in Czech.</dd>
    </dl></div>
   <div class="panel ov-status"><div class="ph">${ico("check")}<h3>Where the plan stands</h3></div><div class="pb"><dl class="ov-stat">${stat.map(([l,n,h])=>`<dt><a href="#${h}">${esc(l)}</a></dt><dd>${n}</dd>`).join("")}</dl><p class="cap" style="margin:0">Counted from the plan files on develop (b675b5ed), the decision record and each step's design on this page. Version of ${VERSION}. Kept in the repo at prototypes/mvp-map.</p></div></div>

   <div class="gloss">${gloss}</div></div>`;
}

/* ================= sociomapa: the proposed indicator profile, from the 9 Nov mindmap ================= */
const MODE_GROUPS=[
 ["scenario","Scenario map","A model computes the rows. The claim is about the model and its assumptions, not about the market.",["futures","weights","crossed"]],
 ["observed","Observed-data map","Someone recorded the rows. The claim is about the data that was written down.",["experts","units","months"]]
];
const PROFILE_STEPS=[
 ["Brief","One decision question, 5 to 20 options, one snapshot date for every value, and the client's weights written before any map."],
 ["Indicator table","One named, saved table per map. Each row has its name, unit, source and date, direction (higher or lower is better), weight and group. A missing value stays missing and the company is asked for it."],
 ["Processing","Raw values are never overwritten. Check units, currencies and dates; turn every row so that higher is better; put the rows on one scale; apply the weights. One processed-data file per table."],
 ["Map","Relations between the options from the prepared table, then layout, height and terrain from aia-sociomap-5. Maps from different tables are turned and mirrored onto each other, nothing more, so they can be compared side by side."],
 ["Report","How to read the maps, the state of the world from Deep Research, which rows it could move and in which direction, what happens if one weight doubles, and the limits."]
];
const PROFILE_TRAPS=[
 ["Double counting","Two rows that measure the same thing, such as fuel price and transport cost."],
 ["A misleading leader","Best on paper, fails on one hidden indicator."],
 ["An outlier","One extreme value that stretches the scale."],
 ["A wrong direction","A row where lower is better but it is read as higher."],
 ["Real-world mess","Missing and stale values, two official numbers that disagree, mixed currencies, weights that contradict the stated goal, a world event the research should find."]
];
function modeCard(m,gid){const chip=m.id==="crossed"?'<span class="chip w1">MVP · an option</span>':m.mvp?'<span class="chip w1">MVP</span>':'<span class="chip post">proposed</span>';
  return `<div class="card ${m.mvp?"mvp":"later"}"><div class="row"><h3>${esc(m.name)}</h3><span class="grow"></span>${chip}</div><span class="cap">${esc(m.en)}</span>
    <div class="claim">“${esc(m.claim)}”</div><dl class="kv"><dt>One row</dt><dd>${esc(m.rows)}</dd><dt>Grade</dt><dd>${esc(m.grade)}</dd><dt>Example</dt><dd>${esc(m.velis)}</dd></dl><span class="tech">${esc(m.plans)}</span>${marksHtml("mode:"+m.id)}${noteHtml("mode:"+m.id)}</div>`}
function modesHtml(){return MODE_GROUPS.map(([gid,name,sub,ids])=>`<div class="mgroup mg-${gid}"><div class="mgh"><h3>${esc(name)}</h3><p>${esc(sub)}</p></div><div class="cols c3">${ids.map(id=>modeCard(MODES.find(m=>m.id===id),gid)).join("")}</div></div>`).join("")}
function profileHtml(){const open=["Q-PROFILE","Q-CLOSE","Q-NORM","Q-WACT","Q-MINROWS","Q-DATASET"].map(id=>QUESTIONS.find(q=>q[0]===id)).filter(Boolean);
  return `<div class="section" id="profile"><h2>Proposed: the indicator profile map</h2><p class="lede">From the 9 Nov mindmap. The options are compared on facts that do not depend on the company's own view: economics, location, current state and financials. Each map comes from one weighted table, so changing the rows or the weights gives a different map. It is not in the MVP until you decide (Q-PROFILE).</p>
   <ol class="psteps">${PROFILE_STEPS.map(([t,p],i)=>`<li><span class="n">${i+1}</span><b>${esc(t)}</b><p>${esc(p)}</p></li>`).join("")}</ol>
   <div class="cols c3" style="margin-top:16px">
    ${modeCard(MODES.find(m=>m.id==="profile"))}
    <div class="card"><h3>Open before it can be built</h3><ul class="qlist">${open.map(q=>`<li><span>${esc(q[2])}</span><span class="tech">${esc(q[0])} · ${q[4]==="aram"?"for Aram":"for you"}</span></li>`).join("")}</ul><p class="cap">Each is explained on the <a href="#decisions">Decisions</a> tab.</p></div>
    <div class="card"><h3>Its test dataset, with the answer sealed first</h3><p class="cap">Built from real places and public figures where they exist. Which option is right, under which weights and why, is written down and sealed before any map is made (TD-1). Each trap has an expected effect on the map.</p><dl class="kv traps">${PROFILE_TRAPS.map(([t,p])=>`<dt>${esc(t)}</dt><dd>${esc(p)}</dd>`).join("")}</dl></div>
   </div>${marksHtml("profile:pipeline")}${noteHtml("profile:pipeline")}</div>`}

(async()=>{

  setSave("Saved","ok");
  db.collection("marks").onSnapshot(s=>{const fresh={};s.docs.forEach(d=>{const v=d.data();if(v&&v.id)fresh[v.id]={stance:v.stance||"",note:v.note||"",answer:v.answer||"",star:v.star||false}});
    for(const [k,v] of Object.entries(marks))if(!fresh[k]&&(v.stance||v.note||v.answer))fresh[k]=v;
    marks=fresh;lsSave();rerenderSoft()},e=>setSave("Sync stopped","warn"));
  db.collection("ideas").onSnapshot(s=>{const fresh={};s.docs.forEach(d=>{fresh[d.id]=d.data()});ideas=fresh;lsSave();rerenderSoft()},e=>{});
})();
