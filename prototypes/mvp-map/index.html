le once the line moved on; report_edits_unsaved until a save holds every edit.":"report_version_stale, jakmile se řada verzí posunula dál; report_edits_unsaved, dokud uložení nezachytí všechny úpravy.","Download DOCX and PDF":"Stáhnout DOCX a PDF","'Stáhnout DOCX' / 'Stáhnout PDF' download the version shown, each file checked to be that version.":"'Stáhnout DOCX' / 'Stáhnout PDF' stáhne zobrazenou verzi; u každého souboru se ověří, že jde právě o tuto verzi.","artifact id":"id artefaktu","review state":"stav kontroly","The file downloaded is the version approved.":"Stažený soubor je schválená verze.","The client deliverable.":"Výstup pro klienta.","Review the version history":"Prohlédnout historii verzí","'Historie verzí' lists the report's versions; today only a menu item.":"'Historie verzí' vypíše verze reportu; zatím je to jen položka nabídky.","version":"verze","A version list.":"Seznam verzí.","Report version":"Verze reportu","variant: internal | client":"varianta: interní | pro klienta","document model contract":"kontrakt modelu dokumentu","source outline revision":"revize zdrojové osnovy","grade legend":"legenda stupňů","Printed ref":"Vytištěný odkaz","control tag":"značka prvku","provenance link":"odkaz na původ","outline point id":"id bodu osnovy","Approval":"Schválení (záznam)","version approved":"schválená verze","self-approved":"schváleno autorem","Method appendix entry":"Záznam v příloze metod","pinned defaults":"zafixované výchozí hodnoty","DOCX and PDF of the approved version":"DOCX a PDF schválené verze","recommendation and execution plan":"doporučení a plán realizace","median + § % interval headlines":"hlavní čísla: medián + § % interval","grade labels and legend":"štítky stupňů a legenda","method and register appendix":"příloha metod a registru","sources appendix":"příloha zdrojů","unregistered-method labels":"štítky metod nezapsaných v registru","legal disclaimer where used":"právní upozornění, kde je použito","Which rule decides what the client version carries? CR§ (CALCULATED and registered ESTIMATED only) and the map banner on MV§ conflict with W§ (unregistered estimates go in, labelled, with a warning). Does a MODELLED map figure follow W§ too?":"Které pravidlo rozhoduje, co nese verze pro klienta? CR§ (jen CALCULATED a ESTIMATED zapsané v registru) a banner mapy na MV§ jsou v rozporu s W§ (odhady nezapsané v registru se zařadí, označené a s upozorněním). Řídí se W§ i obrázek mapy se stupněm MODELLED?","Who writes the prose, the writer worker (LO§b) or Ada? At what granularity does a person accept it (section, paragraph)? What does it cost, and which budget pays?":"Kdo píše text: pisatel (worker LO§b), nebo Ada? Po jakých částech ho člověk přijímá (oddíl, odstavec)? Kolik to stojí a z kterého rozpočtu se to platí?","How is a sentence mapped to its outline point so that 'states nothing the outline does not hold' can be checked? What happens to connective or summarising sentences that carry no point?":"Jak se věta přiřadí ke svému bodu osnovy, aby šlo ověřit, že report 'neuvádí nic, co osnova neobsahuje'? Co se stane se spojovacími nebo shrnujícími větami, které žádný bod nenesou?","If a person edits the report in the editor and adds a claim or changes a locked number, does that go back to the outline, or is it refused?":"Když člověk upraví report v editoru a přidá tvrzení nebo změní uzamčené číslo, vrátí se to do osnovy, nebo se to odmítne?","Is the internal version and the client version one approval or two? Is business_model the report kind for a study that has no model?":"Je interní verze a verze pro klienta jedno schválení, nebo dvě? Je business_model druhem reportu i u studie, která nemá model?","Does a stop the client agreed to in the shared review (W§) appear in the report or in its approval record?":"Objeví se zastávka, se kterou klient souhlasil ve sdílené kontrole (W§), v reportu, nebo v záznamu o jeho schválení?","Decide the evidence policy for a client's dataset columns (deferred by the owner, §-§-§), and settle ADR §'s three open questions":"Rozhodnout zásady pro doklady ze sloupců datové sady klienta (vlastník odložil §-§-§) a vyřešit tři otevřené otázky ADR §","The origin CLIENT_REPORTED and its fourth reading in origin_kind, every label reading it":"Původ CLIENT_REPORTED a jeho čtvrtá hodnota v origin_kind, včetně všech štítků, které ji čtou","The data contract as a type, and the route a person accepts it through (approval ledger)":"Datová smlouva jako typ a cesta, kterou ji člověk přijme (kniha schválení)","The data quality report the person accepts (W§, after §a): missing, duplicate and out-of-range counts per used column over every row, versioned and hashed, shown before accept; a truncated reading cannot be accepted":"Report o kvalitě dat, který člověk přijímá (W§, po §a): počty chybějících, duplicitních a mimorozsahových hodnot v každém použitém sloupci přes všechny řádky, s verzí a hashem, zobrazený před přijetím; zkrácené čtení nelze přijmout","The analysis copy holds only the columns the accepted contract names, each classified by a person; nothing personal stored for analysis or sent to a model":"Analytická kopie obsahuje jen sloupce, které uvádí přijatá smlouva, každý klasifikovaný člověkem; nic osobního se pro analýzu neukládá ani neposílá modelu","A full-grid reader over the kept original bytes under stated analysis bounds, refusing by name above them, never a partial copy (W§, before §a)":"Čtečka celé mřížky nad uchovanými původními bajty, uvnitř stanovených mezí analýzy; nad nimi odmítá s uvedením důvodu, nikdy nevytvoří částečnou kopii (W§, před §a)","The hash-verified accessor and the scope the client-data step runs under (W§)":"Přístup k datům ověřený hashem a rozsah, pod kterým krok s daty klienta běží (W§)","Deterministic computations per shape: descriptive tables and benchmark gaps":"Deterministické výpočty podle tvaru dat: popisné tabulky a odstupy od benchmarku","Admission and the client-reported grade in domain/evidence, and the report's marks":"Přijetí a stupeň z dat klienta (client-reported) v domain/evidence a značky v reportu","A client's own survey: its own Sociomap through the existing engine, never merged":"Vlastní průzkum klienta: jeho vlastní Sociomapa přes stávající jádro, nikdy se neslučuje","The Lead and the analysis modules see only admitted client-reported results, never rows":"Ada a analytické moduly vidí jen přijaté výsledky z dat klienta, nikdy řádky","Brief materials pick a client dataset; `brief_signature` and `design_material` carry the source id and the contract version, with one fixture for Python and TypeScript":"Podklady zadání vybírají datovou sadu klienta; `brief_signature` a `design_material` nesou id zdroje a verzi smlouvy, s jedněmi testovacími daty pro Python i TypeScript","The client-data steps placed in the run: a graph node, a contract-version pin on the run, an impact root, and which run's report prints them; class and lineage for client-reported numbers sent to a model, the class gates enforcing in any deployment that holds a real client's data (ADR § Q§, A§)":"Kroky s daty klienta zařazené do běhu: uzel grafu, zafixovaná verze smlouvy na běhu, kořen dopadu a report kterého běhu je tiskne; třída a původ čísel z dat klienta posílaných modelu; brány tříd vynucované v každém nasazení, které drží data skutečného klienta (ADR § Q§, A§)","W§ proposed Brief-material/signature interface and shared fixture; uploaded datasets remain ineligible until an accepted data contract exists":"W§ navrhl rozhraní podkladů a signatury zadání a sdílená testovací data; nahrané datové sady zůstávají nezpůsobilé, dokud neexistuje přijatá datová smlouva","The data contract and its quality report accepted on the study's Data step (ADR § W§, superseding D-§'s Brief drawer); Zadání lists only the files it needs":"Datová smlouva a její report o kvalitě se přijímají v kroku Data studie (ADR § W§, nahrazuje zásuvku Zadání z D-§); Zadání uvádí jen soubory, které potřebuje","A number from a client's document (a PDF contract or offer): Ada proposes it with its page, code checks it appears literally on that page (Deep Research's grounding rule), the researcher accepts each; one not found on its page refused by name (ADR § W§)":"Číslo z dokumentu klienta (smlouva nebo nabídka v PDF): Ada ho navrhne i se stranou, kód ověří, že je na té straně doslova (pravidlo opory z Deep Research), výzkumník přijme každé zvlášť; číslo, které na své straně není, se odmítne s uvedením důvodu (ADR § W§)","An estimate from client rows (e.g. orders lost after a delay, from matched groups) as a Metodika method with its interval and row count, internal until the methodology owner registers it (ADR § W§)":"Odhad z řádků klienta (např. objednávky ztracené po zpoždění, ze spárovaných skupin) jako metoda Metodiky s intervalem a počtem řádků, interní, dokud ho vlastník metodiky nezapíše do registru metod (ADR § W§)","The processing record for named natural persons taken from public registers: purpose, legal basis (legitimate interest), the balancing-test template, retention, recipients; written with the legal counsel the owner names, before any such field reaches a study":"Záznam o zpracování pro lidi uvedené jménem ve veřejných rejstřících: účel, právní základ (oprávněný zájem), šablona balančního testu, doba uchování, příjemci; sepsaný s právním poradcem, kterého vlastník jmenuje, dřív než se jakékoli takové pole dostane do studie","Which register fields name a natural person (ARES statutory bodies, the commercial register's officers and owners, sole traders), as data in the source register (public-data-routes PDR§); those fields withheld until RPD§ passes":"Která pole rejstříků uvádějí člověka jménem (statutární orgány v ARES, členové orgánů a vlastníci v obchodním rejstříku, živnostníci), vedená jako data v rejstříku zdrojů (public-data-routes PDR§); tato pole jsou zadržena, dokud neprojde RPD§","The balancing test as an approval-ledger subject (a migration admits it to ApprovalSubject before its writer): per client and source, recorded by a person, read before a withheld field is released to a study":"Balanční test jako subjekt knihy schválení (migrace ho přidá do ApprovalSubject dřív, než vznikne kód, který ho zapisuje): pro každého klienta a zdroj, zaznamenaný člověkem a přečtený před uvolněním zadrženého pole do studie","Art. § notices: where a notice is owed, its record; where an exemption applies, the reason recorded; both on the approval ledger":"Oznámení podle čl. §: kde je oznámení povinné, jeho záznam; kde platí výjimka, zaznamenaný důvod; obojí v knize schválení","Retention and erasure of register-derived personal data through study-data-lifecycle's delete path, with the horizons RPD§ sets":"Uchování a výmaz osobních údajů z rejstříků přes cestu mazání ze study-data-lifecycle, s lhůtami, které stanoví RPD§","Minimisation: a field naming a person never sent to a model unless RPD§'s record allows that use, Class A by rule (material_rules), masked on screen as client_datasets masks personal columns":"Minimalizace: pole, které uvádí člověka jménem, se nikdy nepošle modelu, pokud to záznam RPD§ nedovolí; podle pravidla třída A (material_rules), na obrazovce maskované stejně, jako client_datasets maskuje osobní sloupce","Compose one cash-flow model from the accepted inputs (line items of closed kinds, drivers, timing, scenarios), freeze it as a revision and compute every deterministic and Monte Carlo result reproducibly at a known § USD.":"Sestavit jeden model peněžních toků z přijatých vstupů (položky uzavřených druhů, faktory, načasování, scénáře), zmrazit ho jako revizi a reprodukovatelně spočítat každý deterministický výsledek i výsledek Monte Carlo za známou cenu § USD.","Scope":"Rozsah","Load the variants from Zadání":"Načíst varianty ze Zadání","The options accepted in Zadání (Z§ §) become the model's scenarios: the baseline B (today) plus the rest, each with a one-line description; an option that breaks a hard constraint stays for comparison, flagged.":"Varianty přijaté v Zadání (Z§ §) se stanou scénáři modelu: výchozí scénář B (dnešní stav) a ostatní, každý s jednořádkovým popisem. Varianta, která porušuje pevné omezení, zůstává pro srovnání a je označená.","baseline":"výchozí scénář","description":"popis","At most twelve scenarios including the baseline (Q§)":"Nejvýše dvanáct scénářů včetně výchozího (Q§)","Scenario list on the Model Revision":"Seznam scénářů v revizi modelu","too_many_scenarios refused by name":"too_many_scenarios: odmítnuto s uvedením důvodu","Load the target quantity, horizon and timing":"Načíst cílovou veličinu, horizont a načasování","From Zadání Z§: the quantity compared (contribution after logistics: retained orders × § Kč minus logistics, investment and switch, plus residual value), NPV at the study rate, before tax, over § years §-§.":"Ze Zadání Z§: porovnávaná veličina (příspěvek po logistice: udržené objednávky × § Kč minus logistika, investice a přechod, plus zůstatková hodnota), NPV při sazbě studie, před zdaněním, za § let §-§.","horizon":"horizont","discount rate":"diskontní sazba","before/after tax read by the rule":"pravidlo čte hodnotu před zdaněním, nebo po zdanění","The rule reads one NPV (before tax here, as Zadání said), the other is shown beside it (W§)":"Pravidlo čte jedno NPV (zde před zdaněním, jak uvádí Zadání), druhé se ukazuje vedle něj (W§)","The model's objective and horizon":"Cíl a horizont modelu","Build":"Sestavení","Define drivers":"Definovat faktory","A driver is an input, or a × b / a ÷ b of inputs, e.g. orders in year t = § § × (§ + growth)^t.":"Faktor je vstup nebo a × b či a ÷ b ze vstupů, např. objednávky v roce t = § § × (§ + růst)^t.","driver name":"název faktoru","expression":"výraz","inputs read":"čtené vstupy","Drivers from the closed vocabulary; no cycles":"Faktory z uzavřeného slovníku; bez cyklů","Drivers on the working content":"Faktory v pracovním obsahu","driver_cycle refused by name":"driver_cycle: odmítnuto s uvedením důvodu","Propose line items":"Navrhnout položky","Ada proposes the model's items from the data and Zadání (here § items), each a per-change operation with its kind, formula and the variants it applies to.":"Ada navrhne položky modelu z dat a ze Zadání (zde § položek), každou jako samostatnou operaci změny s druhem, vzorcem a variantami, na které se vztahuje.","Ada states and computes no number not in its context; proposals generic over the type's declared operations":"Ada neuvádí ani nepočítá žádné číslo, které nemá v kontextu; návrhy jsou obecné nad operacemi, které typ deklaruje","Proposed items waiting for accept":"Navržené položky čekají na přijetí","On a Class-C-only route the Lead's turn parks by name":"Pokud je k dispozici jen trasa pro třídu dat C, tah Ady se odloží s uvedením důvodu","Accept or edit each line item":"Přijmout nebo upravit každou položku","Each item takes a kind from the closed set PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ; the researcher accepts or dismisses each proposal and edits items in place.":"Každá položka má druh z uzavřené množiny PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ. Výzkumník každý návrh přijme nebo zahodí a položky upravuje na místě.","year (rok §, rok §, §)":"rok (rok §, rok §, §)","Kinds from the closed set (W§); accepted under APPROVE_GATE as a lead_edit":"Druhy z uzavřené množiny (W§); přijímá se pod APPROVE_GATE jako lead_edit","Accepted items on the model's working content":"Přijaté položky v pracovním obsahu modelu","A dismissed proposal changes nothing":"Zahozený návrh nic nemění","Check each formula against the vocabulary":"Ověřit každý vzorec proti slovníku","A formula may use only the closed vocabulary; the cost template's forms are FIXED per period, VARIABLE rate × driver, STEP per block × ceil(driver ÷ block), CAPITAL annuity over life and rate; units must agree.":"Vzorec smí používat jen uzavřený slovník. Formy nákladové šablony jsou FIXED za období, VARIABLE sazba × faktor, STEP za blok × ceil(faktor ÷ blok) a CAPITAL anuita podle životnosti a sazby. Jednotky musí souhlasit.","formula":"vzorec","units":"jednotky","Closed vocabulary; reject, never coerce":"Uzavřený slovník; odmítnout, nikdy nepřevádět","A validated item":"Ověřená položka","Refused by name: unit_mismatch, currency_mismatch, no_provenance (an input with no provenance)":"Odmítnuto s uvedením důvodu: unit_mismatch, currency_mismatch, no_provenance (vstup bez původu)","Set timing and capacity rules":"Nastavit pravidla načasování a kapacity","Timing: all options with §PL CZ in §, the hall ready in § months, a §-month notice so a switch earliest §. §. § (half-year §); capacity: orders above the hall's capacity routed to §PL CZ at its fee.":"Načasování: všechny varianty s §PL CZ v roce §, hala hotová za § měsíců, výpovědní lhůta § měsíců, takže přechod nejdříve §. §. § (pololetí §). Kapacita: objednávky nad kapacitu haly jdou k §PL CZ za jeho poplatek.","start date":"datum začátku","notice period":"výpovědní lhůta","capacity":"kapacita","overflow rule":"pravidlo přetečení","A notice period from a cited provision or contract is a timing constraint the researcher accepts":"Výpovědní lhůta z citovaného ustanovení nebo smlouvy je časové omezení, které výzkumník přijme","Timing and capacity rules on the items":"Pravidla načasování a kapacity u položek","Edit each scenario as overrides":"Upravit každý scénář jako přepisy","A scenario is its overrides of the baseline (e.g. B§ fixed price § Kč for § years), shown against it; the baseline and the scenario being edited stay side by side at every width.":"Scénář tvoří jeho přepisy výchozího scénáře (např. B§ pevná cena § Kč na § let), zobrazené proti němu. Výchozí a upravovaný scénář zůstávají vedle sebe při každé šířce.","scenario":"scénář","overridden inputs/items":"přepsané vstupy/položky","baseline value":"výchozí hodnota","Overrides only; the shared items and timing stay the same so the numbers do not contradict":"Jen přepisy; společné položky a načasování zůstávají stejné, aby si čísla neodporovala","Scenario overrides on the working content":"Přepisy scénářů v pracovním obsahu","Show the base-case preview":"Ukázat náhled základního případu","Each option's difference against B with every input at base, as a bar (e.g. C§ +§ mil. Kč NPV § let), labelled výpočet, with the note that uncertainty is on Výsledky.":"Rozdíl každé varianty proti B se všemi vstupy na základní hodnotě jako sloupec (např. C§ +§ mil. Kč NPV § let), označený výpočet, s poznámkou, že nejistota je v kroku Výsledky.","option":"varianta","A preview, not the headline":"Náhled, ne hlavní výsledek","An unknown input makes the total neznámé, naming it":"Při neznámém vstupu je součet neznámé a stránka uvede, o který vstup jde","Submit":"Odeslání","Submit the Model Revision":"Odeslat revizi modelu","The working content becomes an immutable Model Revision: type id and version, elements, inputs, scenarios and decision rule, its canonical JSON and SHA-§, naming its working revision; a ledger row with the hash of its input list in the same transaction.":"Pracovní obsah se stane neměnnou revizí modelu: id a verze typu, prvky, vstupy, scénáře a rozhodovací pravidlo, její kanonický JSON a SHA-§, s odkazem na pracovní revizi. Ve stejné transakci vznikne záznam v knize schválení s hashem seznamu vstupů.","Under APPROVE_GATE; ledger subject business_model":"Pod APPROVE_GATE; předmět v knize schválení business_model","A submitted Model Revision":"Odeslaná revize modelu","A stale save §; a stale pinned input blocks submission until a person picks again":"Zastaralé uložení vrátí §; zastaralý připnutý vstup blokuje odeslání, dokud člověk nevybere znovu","Start the computation":"Spustit výpočet","\"Spustit výpočet · § USD\" (or the typed request to Ada, \"Spusť výpočet\") starts a business_model run: prepare, compute, report.":"„Spustit výpočet · § USD“ (nebo Adě napsaný požadavek „Spusť výpočet“) spustí běh business_model: prepare, compute, report.","ceiling § USD":"strop § USD","Known § USD ceiling; no hold, no charge, no confirmation":"Známý strop § USD; žádná rezervace částky, žádná platba, žádné potvrzení","A run queued":"Běh zařazený do fronty","Freeze the run's inputs and pins":"Zmrazit vstupy a připnuté verze běhu","Prepare freezes the revision and each dataset input by artifact id and SHA-§, and pins the type id and version, the Metodika module version and the seed drawn once at start.":"Krok prepare zmrazí revizi a každý datový vstup podle id artefaktu a SHA-§. Připne id a verzi typu, verzi modulu Metodika a seed vylosovaný jednou na začátku.","revision sha§":"revize sha§","dataset artifact ids + sha§":"id artefaktů datových sad + sha§","type pin":"připnutý typ","module version":"verze modulu","The run never reads the working copy":"Běh nikdy nečte pracovní verzi","A frozen run identity":"Zmrazená identita běhu","Compute the deterministic results":"Spočítat deterministické výsledky","Per line and per year totals; break-even on a driver in a stated range; one-way sensitivity ±§ %; cumulative cost with capital in year § and the payback year; NPV before and after tax and discounted payback, in Decimal.":"Součty po řádcích a po letech; bod zvratu podle faktoru v daném rozsahu; jednorozměrná citlivost ±§ %; kumulativní náklady s kapitálem v roce § a rok návratnosti; NPV před zdaněním i po něm a diskontovaná doba návratnosti, vše v typu Decimal.","totals":"součty","curve":"křivka","sensitivity":"citlivost","cumulative":"kumulativně","payback":"návratnost","NPV before tax":"NPV před zdaněním","NPV after tax":"NPV po zdanění","Break-even exact only where the driver enters through one monotone form; unknown propagated by name, never zero":"Bod zvratu je přesný jen tam, kde faktor vstupuje jedinou monotónní formou; neznámá hodnota se šíří s uvedením jména, nikdy jako nula","break_even_not_exact (naming the driver), none_in_range, identical, none_within_horizon":"break_even_not_exact (s uvedením faktoru), none_in_range, identical, none_within_horizon","Compute exact ranges and dominance":"Spočítat přesné rozsahy a dominanci","Every total's and difference's exact range by vertex enumeration over the low/high grid cut into closed STEP cells; dominance where A is below B at every vertex; otherwise the inputs that flip the ranking with their flip values.":"Přesný rozsah každého součtu a rozdílu výčtem vrcholů mřížky nízká/vysoká, rozdělené na uzavřené buňky STEP. Dominance, když je A v každém vrcholu pod B. Jinak vstupy, které obrátí pořadí, a hodnoty, při nichž se pořadí obrátí.","range per total":"rozsah pro každý součet","flip inputs":"vstupy, které obrátí pořadí","flip values":"hodnoty obratu pořadí","Exactness check first (each input through one monotone form); vertex cap §^§":"Nejdřív kontrola přesnosti (každý vstup jedinou monotónní formou); nejvýše §^§ vrcholů","Ranges, dominance and flip values":"Rozsahy, dominance a hodnoty obratu pořadí","range_not_exact (naming the input, Monte Carlo becomes the range view), range_too_large":"range_not_exact (s uvedením vstupu; rozsah pak ukazuje Monte Carlo), range_too_large","Run the Monte Carlo":"Spustit Monte Carlo","§ § draws per stream under PCG§ and the run's seed, distributions from Předpoklady, correlations imposed by Iman-Conover; P(option better than B) with its standard error, the difference's § % interval, each scenario's percentiles.":"§ § losů na proud s PCG§ a seedem běhu, rozdělení z kroku Předpoklady, korelace vnucené metodou Iman-Conover. P(varianta je lepší než B) se směrodatnou chybou, § % interval rozdílu a percentily každého scénáře.","streams":"proudy","standard error":"směrodatná chyba","Converged when five streams agree on P within ±§ and on the §th/§th percentiles within tolerance; else N doubles to § §":"Konverguje, když se pět proudů shodne na P v rozmezí ±§ a na §./§. percentilu v toleranci; jinak se N zdvojnásobí až na § §","ESTIMATED results (odhad), stored with the seed":"Výsledky ESTIMATED (odhad), uložené se seedem","Compute sensitivity and value of information":"Spočítat citlivost a hodnotu informace","Sobol first-order and total indices (Jansen, bootstrap intervals) for independent inputs, partial rank correlation when inputs are correlated; EVPPI per input from the draws in § equal-frequency bins.":"Indexy Sobol prvního řádu a celkové (Jansen, bootstrap intervaly) pro nezávislé vstupy, parciální pořadová korelace, když jsou vstupy korelované. EVPPI pro každý vstup z losů v § intervalech se stejnou četností.","EVPPI per input":"EVPPI pro každý vstup","PRCC replaces Sobol when any accepted correlation exists; EVPPI material at ≥ § % of the absolute expected difference":"PRCC nahradí Sobol, jakmile existuje přijatá korelace; EVPPI je podstatná od ≥ § % absolutní hodnoty očekávaného rozdílu","ESTIMATED sensitivity and value-of-information results":"Výsledky citlivosti a hodnoty informace ESTIMATED","Sobol not shown for correlated inputs, the page says why":"U korelovaných vstupů se Sobol nezobrazí; stránka uvede proč","Store":"Uložení","Store results and keep reruns identical":"Uložit výsledky a zajistit totožné opakované běhy","Results are stored as artifacts and never recomputed on read; a rerun under the same pins gives the same bytes; a retry with unchanged inputs reuses the results; the page keeps the run history, comparison and a JSON export.":"Výsledky se ukládají jako artefakty a při čtení se nikdy nepřepočítávají. Opakovaný běh se stejnými připnutými verzemi dá tytéž bajty. Opakovaný pokus s nezměněnými vstupy použije hotové výsledky. Stránka uchovává historii běhů, srovnání a export do JSON.","results artifact":"artefakt výsledků","Determinism harness: no clock, no randomness outside the seed; the usage ledger holds no row":"Kontrola determinismu: žádné hodiny, žádná náhoda mimo seed; v knize spotřeby nevznikne žádný záznam","Model Revision":"Revize modelu","type_id / type_version (cost_scenarios v§ as first template)":"type_id / type_version (cost_scenarios v§ jako první šablona)","elements: drivers, line items, timing":"elements: faktory, položky, načasování","inputs (frozen from Předpoklady)":"inputs (zmrazené z kroku Předpoklady)","scenarios: baseline + ≤ §":"scenarios: výchozí + ≤ §","fixed parameters":"pevné parametry","canonical JSON":"kanonický JSON","working":"rozpracovaná","submitted":"odeslaná","name":"název","formula (closed vocabulary)":"vzorec (uzavřený slovník)","variants it applies to":"varianty, na které se vztahuje","year / timing":"rok / načasování","capacity rule":"pravidlo kapacity","Scenario (Varianta)":"Scénář (Varianta)","baseline: bool":"výchozí: bool","overrides":"přepisy","constraint flag":"příznak omezení","Run (business_model)":"Běh (business_model)","steps: prepare, compute, report":"kroky: prepare, compute, report","Metodika module version":"verze modulu Metodika","ceiling: § USD":"strop: § USD","queued":"ve frontě","running":"běží","completed":"dokončeno","failed":"selhalo","Results artifact":"Artefakt výsledků","CALCULATED outputs: totals, break-even, curve, sensitivity, cumulative, payback, NPV before/after tax":"Výstupy CALCULATED: součty, bod zvratu, křivka, citlivost, kumulativní hodnoty, návratnost, NPV před zdaněním/po zdanění","ESTIMATED outputs: P, SE, percentiles, Sobol/PRCC, EVPPI":"Výstupy ESTIMATED: P, SE, percentily, Sobol/PRCC, EVPPI","ranges, dominance, flip values":"rozsahy, dominance, hodnoty obratu pořadí","each output: grade, method id, version":"každý výstup: stupeň jistoty, id metody, verze","Stored results of the run":"Uložené výsledky běhu","CALCULATED and ESTIMATED refs with grade, method id and version":"odkazy CALCULATED a ESTIMATED se stupněm jistoty, id metody a verzí","median, § % interval and base value per option":"medián, § % interval a základní hodnota pro každou variantu","seed, pins":"seed, připnuté verze","Monte Carlo scenarios for the scenario map":"Scénáře Monte Carlo pro mapu scénářů","the run's scenarios as objects":"scénáře běhu jako objekty","draws (≥ §) per option":"losy (≥ §) pro každou variantu","chosen result refs as properties":"vybrané odkazy na výsledky jako vlastnosti","Method and model description for the report":"Popis metody a modelu pro report","line items and kinds":"položky a jejich druhy","timing and capacity rules":"pravidla načasování a kapacity","method ids, versions, register status":"id metod, verze, stav v registru metod","what is not modelled":"co se nemodeluje","What is the closed formula vocabulary of the composable model (W§)? CM§ defines four cost forms; the canvas uses revenue, residual value, growth exponents and conditional overrides. Which operators exist, and how do PŘÍJEM and JEDNORÁZOVĚ items enter CM§'s exactness and break-even rules?":"Jaký je uzavřený slovník vzorců skládaného modelu (W§)? CM§ definuje čtyři nákladové formy; plátno používá výnosy, zůstatkovou hodnotu, exponenty růstu a podmíněné přepisy. Které operátory existují a jak vstupují položky PŘÍJEM a JEDNORÁZOVĚ do pravidel CM§ pro přesnost a bod zvratu?","How are capacity and timing rules expressed (overflow to another supplier, a §-month build, a §-month notice, half-year §), and do they create STEP cells for the exact-range enumeration?":"Jak se zapisují pravidla kapacity a načasování (přetečení k jinému dodavateli, stavba za § měsíců, výpovědní lhůta § měsíců, pololetí §)? Vytvářejí buňky STEP pro výčet přesného rozsahu?","Is \"Submit\" a separate act? The canvas has one \"Spustit výpočet\" button, while CP§/CP§ require a submitted revision under APPROVE_GATE with a ledger row before a run.":"Je „Odeslat“ samostatný úkon? Plátno má jediné tlačítko „Spustit výpočet“, zatímco CP§/CP§ vyžadují před během odeslanou revizi pod APPROVE_GATE se záznamem v knize schválení.","Model step size: Zadání Z§ § offers months or years, and Provoz's LP is monthly, but CM§/CM§ compute per year. Does one model run produce monthly figures for Provoz, or is the monthly LP a separate computation over the same inputs?":"Časový krok modelu: Zadání Z§ § nabízí měsíce nebo roky a LP v Provozu je měsíční, ale CM§/CM§ počítají po letech. Dá jeden běh modelu měsíční čísla pro Provoz, nebo je měsíční LP samostatný výpočet nad stejnými vstupy?","How does Ada's proposal of a whole item set (§ items) become per-change operations a researcher can accept in one pass without approving numbers it did not ground?":"Jak se Adin návrh celé sady položek (§ položek) promění v jednotlivé operace změny, které výzkumník přijme najednou, aniž by schválil čísla, která Ada nepodložila?","Which model type template is pinned when the decision is not a cost comparison (contribution, revenue): is cost_scenarios v§ renamed or replaced by a cash-flow type, and what is its id?":"Která šablona typu modelu se připne, když rozhodnutí není srovnání nákladů (příspěvek, výnosy)? Přejmenuje se cost_scenarios v§, nebo ji nahradí typ peněžních toků, a jaké má id?","Lay out the report as its bare points (each claim or number with its visual and a resolving link to its source or method) so a person can verify everything before any prose is written.":"Rozvrhnout report do holých bodů (každé tvrzení nebo číslo s vizuálem a dohledatelným odkazem na zdroj nebo metodu), aby člověk mohl vše ověřit dřív, než vznikne souvislý text.","Structure":"Struktura","Propose the outline's chapters":"Navrhnout kapitoly osnovy","Ada proposes the report outline (chapters and sections in report order) from the brief, the selected frameworks and the study's results; the canvas shows § chapters and § points.":"Ada navrhne osnovu reportu (kapitoly a oddíly v pořadí reportu) ze zadání, vybraných analytických rámců a výsledků studie; plátno ukazuje § kapitol a § bodů.","chapter":"kapitola","section":"oddíl","order":"pořadí","chapter kind":"druh kapitoly","A person accepts each change; an outline the person has not approved does not compose (ledger subject report_outline).":"Každou změnu přijímá člověk. Z osnovy, kterou člověk neschválil, se report nesestaví (předmět v knize schválení report_outline).","A draft outline on the study's working project (revision-checked saves).":"Návrh osnovy v pracovním projektu studie (ukládání s kontrolou revize).","A stale save is refused by revision.":"Zastaralé uložení se odmítne podle revize.","Create each framework's point slots":"Vytvořit pole pro body každého rámce","Every framework selected in Zadání becomes a chapter or part of one, with its point slots (SWOT's four quadrants, PESTEL's six factors, Porter's five forces).":"Každý analytický rámec vybraný v Zadání se stane kapitolou nebo její částí s poli pro body (čtyři kvadranty SWOT, šest faktorů PESTEL, pět Porterových sil).","framework id":"id rámce","slot":"pole","quadrant/factor":"kvadrant/faktor","A framework point is a typed reference or a labelled judgement, never unlabelled text.":"Bod rámce je typovaný odkaz nebo označený úsudek, nikdy neoznačený text.","Empty slots under the framework's chapter (e.g. §b Shrnutí: SWOT, SS§–HR§).":"Prázdná pole v kapitole rámce (např. §b Shrnutí: SWOT, SS§–HR§).","A slot point without a resolving source is refused.":"Bod v poli bez dohledatelného zdroje se odmítne.","Points":"Body","Offer findings and results as candidates":"Nabídnout zjištění a výsledky jako kandidáty","Every accepted Design and Interpretation Research finding, every typed value, model result and map point is offered as a candidate point.":"Každé přijaté zjištění z Design Research a Interpretation Research, každá typovaná hodnota, výsledek modelu a bod mapy se nabídne jako kandidát na bod.","finding id":"id zjištění","typed value id":"id typované hodnoty","model run id":"id běhu modelu","kind":"druh","Only accepted items are offered; the sealed bundle is never written.":"Nabízejí se jen přijaté položky; do zapečetěného balíku se nikdy nezapisuje.","A candidate list for the researcher and Ada.":"Seznam kandidátů pro výzkumníka a Adu.","Check each finding":"Zkontrolovat každé zjištění","The researcher marks each finding kept, set aside or needs checking; the check goes to the approval ledger and never changes the sealed bundle.":"Výzkumník u každého zjištění označí ponecháno, odloženo nebo ke kontrole. Kontrola se zapíše do knihy schválení a zapečetěný balík nikdy nemění.","check: kept | set aside | needs checking":"kontrola: ponecháno | odloženo | ke kontrole","A point whose source is set aside goes stale and is named.":"Bod, jehož zdroj je odložený, zastará a je výslovně uveden.","A ledger row per check; stale points named.":"Záznam v knize schválení pro každou kontrolu; zastaralé body výslovně uvedené.","Set aside: the point is marked stale.":"Odloženo: bod se označí jako zastaralý.","Add a point":"Přidat bod","'Přidat → Bod': a point with a number (e.g. §), its kind (finding, data point, method point, conclusion, recommendation), its sentence and its refs, each number printed with its grade label.":"'Přidat → Bod': bod s číslem (např. §), druhem (zjištění, datový bod, metodický bod, závěr, doporučení), větou a odkazy. Každé číslo se vypíše s označením stupně jistoty.","point no.":"č. bodu","refs":"odkazy","grade label":"označení stupně jistoty","visual":"vizuál","stop":"zastávka","Every number and claim must link to its source or method.":"Každé číslo a tvrzení musí odkazovat na svůj zdroj nebo metodu.","A point in the outline.":"Bod v osnově.","No resolving link: unverified.":"Bez dohledatelného odkazu: neověřeno.","Write a labelled judgement":"Zapsat označený úsudek","A researcher's own judgement (e.g. a Porter force strength, 'realistické') enters as a point with its own grade, úsudek, and the author's name; Ada may propose it with a reason, but only a person writes it.":"Vlastní úsudek výzkumníka (např. síla jedné z Porterových sil, 'realistické') vstupuje jako bod s vlastním stupněm jistoty úsudek a se jménem autora. Ada ho smí navrhnout s důvodem, ale zapsat ho může jen člověk.","A judgement point.":"Bod s úsudkem.","Propose a point, visual or move":"Navrhnout bod, vizuál nebo přesun","Ada proposes one change at a time as a card with Přijmout / Zahodit (canvas: a shipping discount point with its graph).":"Ada navrhuje vždy jednu změnu jako kartu s Přijmout / Zahodit (na plátně: bod o slevě na dopravu s grafem).","proposal":"návrh","point":"bod","A number enters only as a ref it was given; a paid lookup only through the Lead's priced card.":"Číslo vstupuje jen jako odkaz, který Ada dostala; placené vyhledávání jen přes Adinu kartu s cenou.","An accepted or dismissed proposal, recorded.":"Přijatý nebo zahozený návrh se zaznamená.","Dismissed: nothing changes.":"Zahozeno: nic se nemění.","Links":"Odkazy","Resolve every link":"Dohledat každý odkaz","Code resolves each number and claim from stored ids: a Deep Research quote in its captured snapshot, a typed value and its route response, a client column under its contract version, a model run and its Metodika method, a map and its method.":"Kód dohledá každé číslo a tvrzení z uložených id: citaci z Deep Research v zachyceném snímku, typovanou hodnotu a odpověď její trasy, sloupec klienta v dané verzi datové smlouvy, běh modelu a jeho metodu z modulu Metodika, mapu a její metodu.","source type":"typ zdroje","stored id":"uložené id","A link resolves from stored ids or the point is unverified.":"Odkaz se dohledá z uložených id, jinak je bod neověřený.","Verified / unverified per point; the header count (canvas: '§ z § bodů ověřeno').":"Ověřeno / neověřeno u každého bodu; počet v záhlaví (na plátně: '§ z § bodů ověřeno').","Open a number's provenance":"Otevřít původ čísla","Clicking a number opens 'Odkud je …': kind, run, method and register status, draws and seed, inputs, verification; a quote shows verbatim with its snapshot SHA-§; a client number its file, contract version and row count.":"Kliknutí na číslo otevře 'Odkud je …': druh, běh, metodu a stav v registru metod, losy a seed, vstupy, ověření. Citace se ukáže doslovně se SHA-§ svého snímku, číslo klienta se souborem, verzí datové smlouvy a počtem řádků.","citation + SHA-§":"citace + SHA-§","The source shown beside the point.":"Zdroj zobrazený vedle bodu.","Visuals":"Vizuály","Build a table from points":"Sestavit tabulku z bodů","'Přidat → Tabulka': a typed table spec built from accepted points, every cell a ref with its link, units and periods carried; the same table on screen and in the DOCX.":"'Přidat → Tabulka': typovaná specifikace tabulky sestavená z přijatých bodů. Každá buňka je odkaz i s propojením na zdroj, jednotky a období se přenášejí. Stejná tabulka na obrazovce i v DOCX.","table kind":"druh tabulky","cell refs":"odkazy buněk","periods":"období","Never a number written by a model or typed without a source.":"Nikdy číslo napsané modelem nebo zadané bez zdroje.","A table spec on the outline (canvas: finance by option).":"Specifikace tabulky v osnově (na plátně: finance podle variant).","A cell without a ref is refused.":"Buňka bez odkazu se odmítne.","Draw a graph from a table":"Nakreslit graf z tabulky","'Přidat → Graf': a Vega-Lite spec over the table (bar, line, stacked, scatter, interval), every mark linked to its point; validated against the schema before shown; rendered with the viz tokens, the same on screen and in the DOCX.":"'Přidat → Graf': specifikace Vega-Lite nad tabulkou (sloupcový, spojnicový, skládaný, bodový, intervalový), každá značka propojená se svým bodem. Před zobrazením se ověří proti schématu. Vykreslí se s tokeny pro vizualizace, stejně na obrazovce i v DOCX.","chart kind":"druh grafu","spec":"specifikace","series refs":"odkazy řad","alt text":"alternativní text","long description":"dlouhý popis","The spec validates before anything is shown; each series is exactly the artifact's refs.":"Specifikace se ověří dřív, než se cokoli zobrazí; každá řada odpovídá přesně odkazům artefaktu.","A chart spec (canvas: median and § % interval against B, each dot linked to run M-§).":"Specifikace grafu (na plátně: medián a § % interval proti B, každý bod propojený s během M-§).","An invalid spec is not shown.":"Neplatná specifikace se nezobrazí.","Draw a process diagram":"Nakreslit procesní diagram","'Přidat → Diagram: BPMN, datové toky, stavy, sekvence…': a typed spec (BPMN XML, Mermaid, Graphviz) edited in place, each element that states a fact linked to its point.":"'Přidat → Diagram: BPMN, datové toky, stavy, sekvence…': typovaná specifikace (BPMN XML, Mermaid, Graphviz) upravovaná na místě. Každý prvek, který uvádí fakt, je propojený se svým bodem.","diagram kind":"druh diagramu","steps":"kroky","actors":"aktéři","decisions":"rozhodnutí","flows":"toky","element refs":"odkazy prvků","Validated per engine (bpmn-moddle against BPMN §, the Mermaid parser) before shown; every edit a revision-checked working-copy operation.":"Před zobrazením se ověří zvlášť pro každý nástroj (bpmn-moddle proti BPMN §, parser Mermaid); každá úprava je operace nad pracovní verzí s kontrolou revize.","A diagram spec (canvas: execution plan with the §/§ decision point).":"Specifikace diagramu (na plátně: plán realizace s rozhodovacím bodem §/§).","An invalid spec is refused before display.":"Neplatná specifikace se odmítne před zobrazením.","Insert a framework template":"Vložit šablonu analytického rámce","'Šablona analýzy: SWOT, PESTEL, Porter…': a fixed-layout template from typed data, its slots filled with linked points.":"'Šablona analýzy: SWOT, PESTEL, Porter…': šablona s pevným rozložením z typovaných dat, její pole vyplněná propojenými body.","template":"šablona","slots":"pole","slot points":"body v polích","Sourced points or labelled judgements only.":"Jen body se zdrojem nebo označené úsudky.","A template visual (canvas: SWOT).":"Vizuál ze šablony (na plátně: SWOT).","Add a legal point":"Přidat právní bod","A legal point (law, provision, version date, verbatim quote, snapshot hash) enters with a kind and a grade of its own, and flags the report for the 'not legal advice' disclaimer.":"Právní bod (předpis, ustanovení, datum znění, doslovná citace, hash snímku) vstupuje s vlastním druhem a stupněm jistoty. Report pak dostane příznak pro upozornění 'nejde o právní radu'.","The quote is literally in the captured provision; the researcher accepts it.":"Citace je doslovně v zachyceném ustanovení; výzkumník ji přijme.","A legal point; the disclaimer flag on the report.":"Právní bod; report nese příznak upozornění.","Quote not found: refused.":"Citace nenalezena: odmítnuto.","Stops":"Zastávky","Open, name and close a stop":"Otevřít, pojmenovat a uzavřít zastávku","The researcher groups points into named stops and closes each; the closer and date are shown (canvas: 'Zastávka § · Rozhodnutí a čísla · uzavřela J. Malá §. §.'; others 'otevřená · uzavírá výzkumník').":"Výzkumník seskupí body do pojmenovaných zastávek a každou uzavře. Zobrazí se, kdo a kdy ji uzavřel (na plátně: 'Zastávka § · Rozhodnutí a čísla · uzavřela J. Malá §. §.'; ostatní 'otevřená · uzavírá výzkumník').","stop name":"název zastávky","state":"stav","closed by":"kdo uzavřel","closed at":"kdy uzavřeno","A person closes a stop; nothing reaches Report from an open stop.":"Zastávku uzavírá člověk; z otevřené zastávky se do kroku Report nedostane nic.","A closed stop.":"Uzavřená zastávka.","Reopening a stop marks the report draft stale and names the points that moved.":"Znovuotevření zastávky označí koncept reportu jako zastaralý a uvede body, které se změnily.","Review a shared stop":"Posoudit sdílenou zastávku","Optionally, the researcher shares a closed stop with the client's decision-makers as a read-only page (points, visuals, sources); their comments and agreement go to the approval ledger.":"Výzkumník může uzavřenou zastávku sdílet s lidmi, kteří u klienta rozhodují, jako stránku jen pro čtení (body, vizuály, zdroje). Jejich komentáře a souhlas se zapíšou do knihy schválení.","share link":"odkaz pro sdílení","comments":"komentáře","agreement":"souhlas","Optional; a ledger subject admitted by migration before its writer.":"Volitelné; předmět v knize schválení zavede migrace dřív, než vznikne kód, který ho zapisuje.","Comments and agreement recorded; the report then written from it.":"Zaznamenané komentáře a souhlas; report se pak píše z této zastávky.","Filter to unverified points":"Filtrovat neověřené body","'Jen neověřené body' shows only the points without a resolving source and how many hold the hand-off.":"'Jen neověřené body' ukáže jen body bez dohledatelného zdroje a kolik z nich zdržuje předávku.","unverified count":"počet neověřených","The list of points blocking the hand-off.":"Seznam bodů, které blokují předávku.","Hand off to Report":"Předat do kroku Report","'Předat do Zprávy' sends the closed stops to Report.":"'Předat do Zprávy' pošle uzavřené zastávky do kroku Report.","closed stops":"uzavřené zastávky","Blocked while any point is unverified, until its source is found or the point is removed; nothing is dropped silently.":"Blokováno, dokud je některý bod neověřený, tedy dokud se nenajde jeho zdroj nebo se bod neodstraní. Nic se tiše nevypouští.","Report receives the closed points and visuals.":"Krok Report dostane uzavřené body a vizuály.","The button stays held, naming the unverified point(s).":"Tlačítko zůstane zablokované a uvede neověřené body.","chapters (ordered)":"kapitoly (seřazené)","framework per chapter":"rámec pro každou kapitolu","chapter kind + version":"druh kapitoly + verze","report_outline ledger rows":"záznamy report_outline v knize schválení","Outline point":"Bod osnovy","number: §":"číslo: §","kind: finding | data point | method point | conclusion | recommendation | judgement | legal":"druh: zjištění | datový bod | metodický bod | závěr | doporučení | úsudek | právní","author (judgement)":"autor (úsudek)","visual id":"id vizuálu","stop id":"id zastávky","link state":"stav odkazu","verified":"ověřeno","unverified":"neověřeno","Visual":"Vizuál","kind: table | chart | diagram | template":"druh: tabulka | graf | diagram | šablona","engine: Vega-Lite | Mermaid | bpmn-js | Graphviz | template":"nástroj: Vega-Lite | Mermaid | bpmn-js | Graphviz | šablona","spec version":"verze specifikace","element/cell refs":"odkazy prvků/buněk","render artifact (by spec hash)":"vykreslený artefakt (podle hashe specifikace)","invalid":"neplatné","shared review comments":"komentáře ze sdíleného posouzení","client agreement":"souhlas klienta","closed":"uzavřeno","reopened":"znovu otevřeno","Finding check":"Kontrola zjištění","check":"kontrola","ledger row":"záznam v knize schválení","set aside":"odloženo","Closed stops":"Uzavřené zastávky","chapter and section order":"pořadí kapitol a oddílů","points with kind, text, refs and grade":"body s druhem, textem, odkazy a stupněm jistoty","visual specs and stored renders":"specifikace vizuálů a uložená vykreslení","provenance links":"odkazy na původ","judgement authors":"autoři úsudků","legal-point disclaimer flag":"příznak upozornění u právních bodů","stale/moved points on reopen":"zastaralé nebo přesunuté body po znovuotevření","Shared review page":"Stránka sdíleného posouzení","a closed stop's points":"body uzavřené zastávky","visuals":"vizuály","comment and agreement form":"formulář pro komentář a souhlas","What does a point's text become in Report: is it reused verbatim, or paraphrased by the writer? How is FND§'s 'the report states no point the outline does not hold' checked mechanically, sentence by point?":"Čím se text bodu stane v kroku Report: použije se doslovně, nebo ho pisatel přeformuluje? Jak se strojově, větu po bodu, ověří pravidlo FND§ 'report neuvádí žádný bod, který osnova neobsahuje'?","Is 'verified' only 'the link resolves' (FND§), or must a person also confirm each point? What does a conclusion or recommendation (e.g. § 'pravidlo splněno') link to: the rule evaluation, the run, or both?":"Znamená 'ověřeno' jen 'odkaz se dohledá' (FND§), nebo musí každý bod potvrdit i člověk? Na co odkazuje závěr nebo doporučení (např. § 'pravidlo splněno'): na vyhodnocení pravidla, na běh, nebo na obojí?","When a model rerun, a new Předpoklady revision or a new Deep Research run changes a referenced number, what happens to points, visuals and closed stops? Are they stale automatically, reopened, or pinned to the old run?":"Když opakovaný běh modelu, nová revize kroku Předpoklady nebo nový běh Deep Research změní číslo, na které bod odkazuje, co se stane s body, vizuály a uzavřenými zastávkami? Zastarají automaticky, otevřou se znovu, nebo zůstanou připnuté ke starému běhu?","Is FND§'s outline the same type as situation-reports RC§'s ReportOutline / ChapterKind? Which plan owns it, and is the ledger subject report_outline shared?":"Je osnova z FND§ stejný typ jako ReportOutline / ChapterKind z RC§ v plánu situation-reports? Který plán ji vlastní a je předmět report_outline v knize schválení společný?","How are points assigned to stops? Must all stops be closed before the hand-off, or can Report start from the stops already closed (MV§ shows stops § and § open)?":"Jak se body přiřazují k zastávkám? Musí být před předávkou uzavřené všechny zastávky, nebo může Report začít z již uzavřených (MV§ ukazuje zastávky § a § otevřené)?","Shared review: how do the client's decision-makers (not members) get access, what does 'agreement' bind, and does it gate the hand-off or the approval?":"Sdílené posouzení: jak získají přístup lidé, kteří u klienta rozhodují (nejsou členy)? K čemu zavazuje 'souhlas'? Podmiňuje předávku, nebo schválení?","Ledger subjects for the finding check, the stop close and the shared review: which names, and admitted by which migration?":"Předměty v knize schválení pro kontrolu zjištění, uzavření zastávky a sdílené posouzení: jaké mají názvy a která migrace je zavede?","The business Zadání as data: the eight parts (decision and goal; options and constraints; rule and risk; customers; data and uncertainties; execution and output; analyses, through analysis-frameworks; the model's parts), each with its source citation and the step it hands to; the decision core's fields and the model switch \"Potřebuje rozhodnutí výpočet?\"; revision-checked on the study's working copy (artifact-brief, working-copy-edit-ops); one fixture read by Python and TypeScript":"Obchodní Zadání jako data: osm částí (rozhodnutí a cíl; varianty a omezení; pravidlo a riziko; zákazníci; data a nejistoty; realizace a výstup; analýzy přes analysis-frameworks; části modelu), každá s citací zdroje a krokem, kterému ji předává; pole jádra rozhodnutí a přepínač modelu „Potřebuje rozhodnutí výpočet?“; s kontrolou revize v pracovní verzi studie (artifact-brief, working-copy-edit-ops); jedna sada testovacích dat, kterou čte Python i TypeScript","Popis (board Z§): the one required field, files kept as the client's sources in the study's Vstupy folder (study-files#SF§), Ada's \"Co ještě pomůže\" suggestions; a missing file stays an open item and later becomes a wide-range assumption":"Popis (tabule Z§): jediné povinné pole; soubory uložené jako zdroje klienta ve složce Vstupy studie (study-files#SF§); Adiny návrhy „Co ještě pomůže“; chybějící soubor zůstane otevřenou položkou a později se z něj stane předpoklad se širokým rozsahem","Triage as an ordinary Lead turn (board Z§): the eight parts proposed with their sources, each accepted, edited or dropped (ADR §); options Ada adds marked as hers; every question that matters, ordered by importance, the first three open and the rest under \"Další otázky (n)\" (W§); each question's reason in words, never a crown amount (W§)":"Třídění jako běžný tah Ady (tabule Z§): osm částí navržených se zdroji, každá přijatá, upravená nebo zahozená (ADR §); varianty, které přidá Ada, označené jako její; každá podstatná otázka seřazená podle důležitosti, první tři otevřené a ostatní pod „Další otázky (n)“ (W§); důvod každé otázky slovy, nikdy částkou v korunách (W§)","The decision core (board Z§): decision, owner, deadline and goal; options and constraints, which become the model's variants; the rule (measure, threshold, risk limit) recorded before the first computation, any change recorded and marked in the report (cost-model-study#CR§, M-§); objectives that each serve the decision; how certain the answer must be; the model switch, Ada proposing and the researcher confirming, the model steps shown only on yes (W§)":"Jádro rozhodnutí (tabule Z§): rozhodnutí, vlastník, termín a cíl; varianty a omezení, ze kterých se stanou varianty modelu; pravidlo (měřítko, práh, limit rizika) zaznamenané před prvním výpočtem, každá jeho změna zaznamenaná a vyznačená v reportu (cost-model-study#CR§, M-§); cíle, z nichž každý slouží rozhodnutí; jak jistá musí být odpověď; přepínač modelu: Ada navrhne, výzkumník potvrdí, kroky modelu se ukážou jen při ano (W§)","Readiness R§-R§ (board Z§): R§-R§ checked by code and holding the hand-off, R§-R§ the Lead's advice holding nothing; chips under the stage header, each opening its detail":"Připravenost R§-R§ (tabule Z§): R§-R§ kontroluje kód a zdržují předávku, R§-R§ jsou Adiny rady a nezdržují nic; štítky pod záhlavím kroku, každý otevře svůj detail","The hand-off: what Data, Předpoklady, Model and Zpráva take over, each as a proposal, nothing overwritten; a later edit of Zadání offered to the steps downstream as a proposal":"Předávka: co převezmou Data, Předpoklady, Model a Report, každý jako návrh, nic se nepřepíše; pozdější úprava Zadání se nabídne krokům dál v toku jako návrh","The journey: the fictional Velis brief from one sentence to its hand-off at §, §, § and § px on the scripted Lead; zero paid calls":"Průchod: smyšlené zadání Velis od jedné věty po předávku při šířce §, §, § a § px se skriptovanou Adou; žádné placené volání","Make the client's own files usable as evidence: each tabular file under an accepted data contract and quality report, each document number checked on its page, every model number bound to a column or page and checked before use.":"Zpřístupnit vlastní soubory klienta jako doklady: každý tabulkový soubor má přijatou datovou smlouvu a report kvality, každé číslo z dokumentu je ověřené na své stránce a každé číslo modelu je navázané na sloupec nebo stránku a před použitím ověřené.","Intake":"Příjem","List every file with who asked for it":"Vypsat každý soubor a kdo si ho vyžádal","The study's files sit among the client's sources in the study's Vstupy folder; each row says what is inside, its contract summary, which Zadání part requested it and its status; Deep Research's market inputs appear as a row too.":"Soubory studie leží mezi zdroji klienta ve složce Vstupy studie. Každý řádek uvádí, co soubor obsahuje, shrnutí jeho smlouvy, která část Zadání si ho vyžádala a jeho stav. Tržní vstupy z Deep Research se zobrazí také jako řádek.","Data step's file table.":"Tabulka souborů kroku Data.","A file Zadání asked for and nobody delivered stays an open item.":"Soubor, který Zadání vyžádalo a nikdo ho nedodal, zůstává otevřenou položkou.","Reading":"Čtení","Read the whole grid from the original":"Přečíst celou tabulku z originálu","A full-grid reader over the kept original bytes, not the stored preview reading, under stated analysis bounds.":"Čtečka celé tabulky pracuje nad uloženými původními bajty, ne nad uloženým náhledovým čtením, a to ve stanovených mezích analýzy.","rows read / rows total":"přečtené řádky / řádky celkem","sheet":"list","bound":"mez","Above the bounds the reader refuses by name; never a partial copy; a reading carrying rows_bound or sheets_bound cannot be accepted.":"Nad mezemi čtečka odmítne s uvedením důvodu. Nikdy nevznikne částečná kopie. Čtení s příznakem rows_bound nebo sheets_bound nelze přijmout.","A complete grid for the contract and the quality report ('celý list, § § z § § řádků').":"Úplná tabulka pro smlouvu a report kvality ('celý list, § § z § § řádků').","'zkrácené čtení nelze přijmout': refused by name.":"'zkrácené čtení nelze přijmout': odmítnuto s uvedením důvodu.","Contract":"Smlouva","Propose a data contract for a tabular file":"Navrhnout datovou smlouvu pro tabulkový soubor","Per column: kind, role in the contract (identifikátor, segment, období, zásah, výsledek), personal or not, whether it goes into the analysis copy (ano, vyřazen, jen odvozené), a masked sample; derived columns proposed in place of personal ones (PSČ → kraj, město nad § tis.).":"Pro každý sloupec: typ, role ve smlouvě (identifikátor, segment, období, zásah, výsledek), zda obsahuje osobní údaje, zda jde do analytické kopie (ano, vyřazen, jen odvozené) a maskovaný vzorek. Místo osobních sloupců se navrhnou odvozené (PSČ → kraj, město nad § tis.).","A dataset is not usable on upload alone; the contract is a frozen type.":"Soubor dat není použitelný jen tím, že se nahraje. Smlouva je zmrazený typ.","Contract v§ in state 'návrh' ('návrh Ady, upravil výzkumník').":"Smlouva v§ ve stavu 'návrh' ('návrh Ady, upravil výzkumník').","Classify every used column":"Klasifikovat každý použitý sloupec","The researcher names each column used and classifies it personal or not; samples of personal columns are masked; a column the personal-data hints flag is refused unless the researcher overrides it explicitly.":"Výzkumník pojmenuje každý použitý sloupec a určí, zda obsahuje osobní údaje. Vzorky osobních sloupců jsou maskované. Sloupec, který označí nápověda k osobním údajům, se odmítne, pokud ho výzkumník výslovně nepovolí.","column":"sloupec","personal: yes/no":"osobní: ano/ne","override (recorded with the contract)":"výjimka (zaznamenaná se smlouvou)","Allowlist: only columns the contract names are ever copied; a column classified personal is refused; a hint-flagged column without an override is refused by name (Q§ b).":"Seznam povolených: kopírují se jen sloupce, které smlouva jmenuje. Sloupec klasifikovaný jako osobní se odmítne. Sloupec označený nápovědou bez výjimky se odmítne s uvedením důvodu (Q§ b).","Column classification on the contract draft.":"Klasifikace sloupců v návrhu smlouvy.","Hint-flagged column without override: refused by name.":"Sloupec označený nápovědou bez výjimky: odmítnuto s uvedením důvodu.","Quality":"Kvalita","Compute the quality report over every row":"Spočítat report kvality přes všechny řádky","Missing, duplicate and out-of-range counts per used column, plus comparable groups, period and currency and reading completeness; versioned and SHA-§ hashed; shown before accept.":"Počty chybějících hodnot, duplicit a hodnot mimo rozsah pro každý použitý sloupec, k tomu srovnatelné skupiny, období, měna a úplnost čtení. Report má verzi a otisk SHA-§ a zobrazí se před přijetím.","Reads every row; a truncated reading cannot be accepted.":"Čte každý řádek. Zkrácené čtení nelze přijmout.","Quality report vN stored on the contract.":"Report kvality vN uložený u smlouvy.","Truncated reading: refused by name.":"Zkrácené čtení: odmítnuto s uvedením důvodu.","Decide each quality finding":"Rozhodnout o každém zjištění kvality","Duplicates removed from the analysis copy with their count in the protocol; out-of-range values kept as missing; nothing imputed; each marked 'rozhodl výzkumník'.":"Duplicity se z analytické kopie odstraní a jejich počet se zapíše do protokolu. Hodnoty mimo rozsah zůstanou jako chybějící. Nic se nedoplňuje. Každé rozhodnutí nese označení 'rozhodl výzkumník'.","duplicates: remove/keep":"duplicity: odstranit/ponechat","out-of-range: as missing":"mimo rozsah: jako chybějící","note":"poznámka","Missing stays missing; never imputed.":"Chybějící zůstává chybějící; nikdy se nedoplňuje.","Decisions recorded with the quality report.":"Rozhodnutí zaznamenaná s reportem kvality.","Accept the contract version":"Přijmout verzi smlouvy","'Přijmout smlouvu v§' accepts exactly this contract and quality report; until then the file does not enter any computation.":"'Přijmout smlouvu v§' přijme právě tuto smlouvu a report kvality. Do té doby soubor nevstupuje do žádného výpočtu.","contract version":"verze smlouvy","quality report SHA-§":"SHA-§ reportu kvality","Accepted under APPROVE_GATE with an approval-ledger row in the same transaction (Q§ a); accepted on the Data step, not in Zadání (W§).":"Přijímá se pod APPROVE_GATE s řádkem v knize schválení ve stejné transakci (Q§ a). Přijímá se v kroku Data, ne v Zadání (W§).","Contract state 'přijato' with date; ledger row as the researcher's decision.":"Stav smlouvy 'přijato' s datem; řádek v knize schválení jako rozhodnutí výzkumníka.","Not accepted: analysis refuses the dataset by name; the Brief lists it as a source 'not available to analysis'.":"Nepřijato: analýza soubor dat odmítne s uvedením důvodu. Zadání ho uvádí jako zdroj 'nedostupný pro analýzu'.","Build the analysis copy":"Sestavit analytickou kopii","The copy holds only the contract's named columns (and derived ones); the original stays the client's source, scoped to the client.":"Kopie obsahuje jen sloupce jmenované ve smlouvě (a odvozené). Originál zůstává zdrojem klienta, dostupným jen v rozsahu klienta.","contract id + version":"id smlouvy + verze","columns":"sloupce","rows":"řádky","No unnamed column in the copy, an artifact or a model request.":"Žádný nejmenovaný sloupec v kopii, v artefaktu ani v požadavku na model.","client_dataset_copies row (migration lane M§), read through the hash-verified accessor.":"Řádek client_dataset_copies (migrační dráha M§), čtený přes přístupovou vrstvu, která ověřuje otisk.","Document numbers":"Čísla z dokumentů","Propose a number from a client document":"Navrhnout číslo z dokumentu klienta","For a PDF contract or offer Ada proposes each number with its page (e.g. § Kč, smlouva_§PL_CZ.pdf s. §); code checks the number appears literally on that page; the researcher accepts each.":"U smlouvy nebo nabídky v PDF navrhne Ada každé číslo i se stránkou (např. § Kč, smlouva_§PL_CZ.pdf s. §). Kód ověří, že číslo na té stránce doslova stojí. Výzkumník každé číslo přijme.","value":"hodnota","unit":"jednotka","file":"soubor","page":"stránka","accept":"přijmout","Deep Research's grounding rule: literally on the stated page.":"Pravidlo ukotvení z Deep Research: doslova na uvedené stránce.","Not found on its page: refused by name.":"Nenalezeno na své stránce: odmítnuto s uvedením důvodu.","Bindings":"Vazby","Bind each model number to its place":"Navázat každé číslo modelu na jeho místo","Every number the model takes is shown with its value, where it comes from (sheet and sum, row, page) and its kind (z dat klienta, veřejné zdroje); a dataset input is the sum, count or mean of a contract column over a stated filter and period.":"Každé číslo, které model přebírá, se zobrazí s hodnotou, původem (list a součet, řádek, stránka) a druhem (z dat klienta, veřejné zdroje). Vstup ze souboru dat je součet, počet nebo průměr sloupce ze smlouvy přes uvedený filtr a období.","'nic se nedopočítává': nothing is computed that has no place in a file.":"'nic se nedopočítává': nepočítá se nic, co nemá místo v souboru.","Data bindings for Předpoklady and Model.":"Datové vazby pro Předpoklady a Model.","A number with no place stays missing.":"Číslo bez místa zůstává chybějící.","Checks":"Kontroly","Run data checks before use":"Spustit kontroly dat před použitím","Reconciliation of declared pairs across files and stated totals (difference in unit and as a share), period coverage and currency, outliers by modified z (MAD > §), seasonality only with two full cycles; the canvas adds hall capacity against the forecast.":"Odsouhlasení deklarovaných dvojic mezi soubory a proti uvedeným součtům (rozdíl v jednotkách a jako podíl), pokrytí období a měna, odlehlé hodnoty podle modifikovaného z (MAD > §), sezónnost jen při dvou úplných cyklech. Plátno navíc porovná kapacitu haly s prognózou.","Seasonality without two cycles reads 'nelze ověřit'; check report versioned and hashed.":"Sezónnost bez dvou cyklů se zobrazí jako 'nelze ověřit'. Report kontrol má verzi a otisk.","Check report ('Kontrola dat §/§').":"Report kontrol ('Kontrola dat §/§').","A missing month is named; an input reading a missing value is unknown.":"Chybějící měsíc se jmenovitě uvede. Vstup, který čte chybějící hodnotu, je neznámý.","Decide flags and accept the check report":"Rozhodnout o příznacích a přijmout report kontrol","Each outlier is kept or excluded on record (e.g. November §, Black Friday, kept); capacity findings decided ('od § přebytek přes §PL CZ'); the check report is accepted with the binding.":"Každá odlehlá hodnota se se záznamem ponechá nebo vyřadí (např. listopad §, Black Friday, ponecháno). Rozhodne se o zjištěních ke kapacitě ('od § přebytek přes §PL CZ'). Report kontrol se přijme spolu s vazbou.","outlier: keep/exclude":"odlehlá hodnota: ponechat/vyřadit","decision note":"poznámka k rozhodnutí","accepted by":"přijal","date":"datum","Accepted by the person as part of the binding; missing stays missing.":"Přijímá člověk jako součást vazby; chybějící zůstává chybějící.","Estimates":"Odhady","Estimate a quantity from client rows":"Odhadnout veličinu z řádků klienta","A Metodika method computes an estimate from the copy, e.g. order loss after a §+ day delay from matched groups (§ § delayed vs § § controls, same month, region and purchase frequency), with its interval and row count.":"Metoda z Metodiky spočítá z kopie odhad, např. ztrátu objednávek po zpoždění o §+ den ze spárovaných skupin (§ § zpožděných proti § § kontrolním, stejný měsíc, kraj a frekvence nákupů), s intervalem a počtem řádků.","estimate":"odhad","row count":"počet řádků","method id":"id metody","matched groups":"spárované skupiny","A Metodika method; 'odhad (interní)' until the methodology owner registers it.":"Metoda z Metodiky; 'odhad (interní)', dokud ji vlastník metodiky nezapíše do registru metod.","Client-reported summary, e.g. § % (§–§ %), § % in large cities (§–§ %).":"Souhrn z dat klienta, např. § % (§–§ %), § % ve velkých městech (§–§ %).","Admission":"Přijetí","Admit client-reported results only":"Přijmout jen výsledky z dat klienta","Numbers carry origin CLIENT_REPORTED and the label 'z dat klienta', the source and period disclosed once per report; the Lead and the analysis modules see admitted results, never rows; shown beside modelled results, never mixed.":"Čísla nesou původ CLIENT_REPORTED a označení 'z dat klienta'. Zdroj a období se uvedou jednou za report. Ada a analytické moduly vidí přijaté výsledky, nikdy řádky. Zobrazují se vedle modelových výsledků, nikdy se s nimi nemíchají.","origin":"původ","label":"označení","source + period":"zdroj + období","Support, metric and interval rule is a versioned Metodika module ('client data'); until its first version every client number refuses client_support_rule_unapproved.":"Pravidlo pro podporu, metriku a interval je verzovaný modul Metodiky ('Data klienta'). Dokud nemá první verzi, každé číslo klienta se odmítne s client_support_rule_unapproved.","Admitted client-reported claims.":"Přijatá tvrzení z dat klienta.","Pin contract and copy on the run":"Připnout smlouvu a kopii k běhu","The run records the contract version and the copy's SHA-§; client-reported numbers sent to a model carry a class and a lineage.":"Běh zaznamená verzi smlouvy a SHA-§ kopie. Čísla z dat klienta poslaná modelu nesou třídu a záznam původu.","copy SHA-§":"SHA-§ kopie","class":"třída","lineage":"záznam původu","Class gates enforce in any deployment holding a real client's data (A§); develop advisory on fictional data.":"Brány tříd se vynucují v každém nasazení, které drží data skutečného klienta (A§). Na develop se smyšlenými daty jen upozorňují.","Run pin and impact root.":"Připnutí k běhu a kořen dopadu.","A route not approved for the class: refused.":"Cesta neschválená pro danou třídu: odmítnuto.","Offer summaries to Předpoklady and the outline":"Nabídnout souhrny Předpokladům a osnově","Accepted summaries become assumptions on Předpoklady ('ztráta objednávek při +§ dni'); in the report each number links to its file, contract v§ and rows.":"Přijaté souhrny se stanou předpoklady v kroku Předpoklady ('ztráta objednávek při +§ dni'). V reportu každé číslo odkazuje na svůj soubor, smlouvu v§ a řádky.","assumption":"předpoklad","value + interval":"hodnota + interval","link: file, contract, rows":"odkaz: soubor, smlouva, řádky","Only accepted summaries, never rows.":"Jen přijaté souhrny, nikdy řádky.","Proposals on Předpoklady; provenance links for Osnova reportu.":"Návrhy v Předpokladech; odkazy na původ pro Osnovu reportu.","version: §":"verze: §","ledger row id":"id řádku v knize schválení","stale (other version, source or reading)":"zastaralá (jiná verze, zdroj nebo čtení)","Quality report":"Report kvality","per column: missing, duplicates, out_of_range":"pro každý sloupec: missing, duplicates, out_of_range","comparable groups":"srovnatelné skupiny","period + currency":"období + měna","reading: § § / § § rows":"čtení: § § / § § řádků","computed":"spočítán","accepted with contract":"přijat se smlouvou","refused (truncated)":"odmítnut (zkrácené čtení)","Analysis copy":"Analytická kopie","columns named":"jmenované sloupce","built":"sestavena","Document number":"Číslo z dokumentu","value: §":"hodnota: §","file: smlouva_§PL_CZ.pdf":"soubor: smlouva_§PL_CZ.pdf","page: §":"stránka: §","refused (not on page)":"odmítnuto (není na stránce)","Data check report":"Report kontrol dat","reconciliation: pair, difference (unit, share)":"odsouhlasení: dvojice, rozdíl (jednotky, podíl)","coverage: §/§":"pokrytí: §/§","currency: CZK":"měna: CZK","outliers: month, MAD z, keep/exclude":"odlehlé hodnoty: měsíc, MAD z, ponechat/vyřadit","version + hash":"verze + otisk","accepted_by + date":"accepted_by + datum","Bound numbers and admitted summaries":"Navázaná čísla a přijaté souhrny","number, value, place (file/sheet/row/page), kind":"číslo, hodnota, místo (soubor/list/řádek/stránka), druh","client estimates with interval and row count":"odhady z dat klienta s intervalem a počtem řádků","contract version, copy SHA-§":"verze smlouvy, SHA-§ kopie","Data check results":"Výsledky kontrol dat","accepted check report":"přijatý report kontrol","outlier decisions":"rozhodnutí o odlehlých hodnotách","capacity finding":"zjištění ke kapacitě","Provenance for points":"Původ pro body","link: file, contract version, rows or page":"odkaz: soubor, verze smlouvy, řádky nebo stránka","label 'z dat klienta', source and period":"označení 'z dat klienta', zdroj a období","Until the methodology owner's 'client data' module exists (MQ-§: support, metric, interval) every client number refuses client_support_rule_unapproved: what does the Data step show and what reaches Předpoklady in the meantime?":"Dokud nebude existovat modul 'Data klienta' vlastníka metodiky (MQ-§: podpora, metrika, interval), každé číslo klienta se odmítne s client_support_rule_unapproved. Co mezitím ukazuje krok Data a co se dostane do Předpokladů?","When a client re-uploads a corrected file (a new reading), how does the stale contract, its bindings and the assumptions built on it surface, and must the researcher re-accept field by field?":"Když klient znovu nahraje opravený soubor (nové čtení), jak se ukáže zastaralá smlouva, její vazby a předpoklady na ní postavené? Musí výzkumník znovu přijmout pole po poli?","Who defines a derived column (PSČ → kraj, město nad § tis.): code with a declared lookup, Ada, or the researcher, and is the derived column itself classified personal?":"Kdo definuje odvozený sloupec (PSČ → kraj, město nad § tis.): kód s deklarovanou převodní tabulkou, Ada, nebo výzkumník? A je samotný odvozený sloupec klasifikován jako osobní?","Is a pseudonymous customer id ('ne · pseudonym z CRM' on MV§) personal data under the contract rule, and who decides that policy?":"Je pseudonymní id zákazníka ('ne · pseudonym z CRM' na MV§) podle pravidla smlouvy osobní údaj? A kdo o této zásadě rozhoduje?","How does the researcher declare a reconciliation pair or a control total for CR§ (which screen, which fields), and what tolerance turns a difference into a flag?":"Jak výzkumník deklaruje dvojici k odsouhlasení nebo kontrolní součet pro CR§ (na které obrazovce, v jakých polích)? A jaká tolerance udělá z rozdílu příznak?","What are the full-grid reader's analysis bounds (#§a), and what does a refused oversize file offer the researcher?":"Jaké jsou meze analýzy pro čtečku celé tabulky (#§a)? A co nabídne výzkumníkovi, když odmítne příliš velký soubor?","Do PDF document numbers have a contract version or change record of their own, and does replacing the PDF invalidate them?":"Mají čísla z dokumentů PDF vlastní verzi smlouvy nebo záznam změn? A zneplatní je výměna PDF?","Which matched-groups method (W§) is the first Metodika method, and who specifies its matching variables and interval?":"Která metoda spárovaných skupin (W§) bude první metodou Metodiky? A kdo určí její párovací proměnné a interval?","Platform types: Quantity (Amount, Rate, Count, Ratio, Duration; Decimal, currency, period), Input with its provenance (client_dataset, stated, public_source; research_result declared and refused until built), Scenario, the Model Revision envelope and its canonical hash; reject-not-coerce validation":"Typy platformy: Quantity (Amount, Rate, Count, Ratio, Duration; Decimal, měna, období), Input s původem (client_dataset, stated, public_source; research_result je deklarovaný a odmítaný, dokud nebude postaven), Scenario, obálka Model Revision a její kanonický otisk; validace odmítá, nepřevádí","The model-type contract, composable (ADR § W§): one cash-flow model whose line items come from a closed set of kinds (PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ, with capacity and timing rules) and whose formulas come from a closed vocabulary, Ada proposing items and the researcher accepting; templates as data (cost scenarios first); ModelTypeSpec kept for a template's results with each output's grade, charts, report blocks and proposal operations; the registry, a run's pin of template id and version; the determinism test harness":"Kontrakt typu modelu, skládací (ADR § W§): jeden model peněžních toků, jehož položky pocházejí z uzavřené množiny druhů (PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ, s pravidly kapacity a načasování) a jehož vzorce pocházejí z uzavřeného slovníku; Ada navrhuje položky, výzkumník je přijímá; šablony jako data (nejdřív nákladové scénáře); ModelTypeSpec zůstává pro výsledky šablony, se stupněm každého výstupu, grafy, bloky reportu a operacemi návrhů; registr, připnutí id a verze šablony k běhu; testovací nástroj determinismu","The model inside the one study and its working copy (ADR § decision §, A§ \"One merged study\": no StudyKind.BUSINESS_MODEL): a model content kind on the research study's owned working project (revision-checked saves, the operation log), present only when Zadání says a model is needed, and the immutable Model Revision":"Model uvnitř jedné studie a její pracovní verze (ADR § rozhodnutí §, A§ „Jedna sloučená studie“: žádné StudyKind.BUSINESS_MODEL): obsahový druh model ve vlastním pracovním projektu výzkumné studie (ukládání s kontrolou revize, log operací), přítomný jen tehdy, když Zadání říká, že je model potřeba, a neměnná Model Revision","Data bindings: an input from a dataset's analysis copy under its accepted contract (sum, count, mean over a stated filter and period), admitted CLIENT_REPORTED with MQ-§'s support, the contract version and copy SHA-§ pinned":"Datové vazby: vstup z analytické kopie souboru dat podle její přijaté smlouvy (součet, počet, průměr přes uvedený filtr a období), přijatý jako CLIENT_REPORTED s podporou podle MQ-§, s připnutou verzí smlouvy a SHA-§ kopie","The run: workflow type business_model (prepare, compute, report), inputs frozen by artifact id and SHA-§, a known § USD ceiling for a CALCULATED type, results stored as artifacts; the ledger subject business_model for a submitted revision":"Běh: typ workflow business_model (prepare, compute, report), vstupy zmrazené podle id artefaktu a SHA-§, známý strop § USD pro typ CALCULATED, výsledky uložené jako artefakty; předmět business_model v knize schválení pro odeslanou revizi","The API: /studies/{id}/model content, revisions, submit, runs, results; study-scoped, refused for any other kind; the client page's count":"API: /studies/{id}/model: obsah, revize, odeslání, běhy, výsledky; vázané na studii, pro jakýkoli jiný druh odmítnuto; počet na stránce klienta","The web platform: the model steps inside the one study (ADR § decision §; no \"Modely\" area, Q§ superseded), the model type chosen in Zadání, Data, Předpoklady, Model and Výsledky in the study's stage track (research-findings-stage FND§); Data (each dataset's contract state) and Předpoklady (every input with unit and provenance, edited in place) generic over the type's schema":"Webová platforma: kroky modelu uvnitř jedné studie (ADR § rozhodnutí §; žádná oblast „Modely“, Q§ nahrazena), typ modelu zvolený v Zadání, kroky Data, Předpoklady, Model a Výsledky v řadě kroků studie (research-findings-stage FND§); Data (stav smlouvy každého souboru dat) a Předpoklady (každý vstup s jednotkou a původem, upravovaný na místě) obecně nad schématem typu","The report frame and grades: PrintGrade CALCULATED (výpočet) and its admission beside admit_numeric_claims, and the one table mapping every grade to its Czech label and admission rule (the code's grades kept, CALCULATED and ESTIMATED added, the researcher's labelled judgement a grade of its own; ADR § Q§; a grade follows its method, not its inputs, W§; a public source, a labelled judgement and a cited legal provision in the same table, W§, W§, W§; every headline the median with its § % interval, the base case only as v základu, W§), the platform template frame (question, type blocks, inputs table, method, sources), report kind business_model approvable through approve_report, three chart kinds (absolute stacked bar, tornado, line with marked points) in the model and the renderer":"Rámec reportu a stupně: PrintGrade CALCULATED (výpočet) a jeho přijetí vedle admit_numeric_claims; jedna tabulka, která každému stupni přiřazuje český název a pravidlo přijetí (stupně z kódu zůstávají, přidány CALCULATED a ESTIMATED, označený úsudek výzkumníka jako samostatný stupeň; ADR § Q§; stupeň se řídí metodou, ne vstupy, W§; veřejný zdroj, označený úsudek a citovaný právní předpis ve stejné tabulce, W§, W§, W§; každé hlavní číslo jako medián s § % intervalem, základní případ jen jako v základu, W§); rámec šablony platformy (otázka, bloky typu, tabulka vstupů, metoda, zdroje); druh reportu business_model, schvalitelný přes approve_report; tři druhy grafů (absolutní skládaný sloupcový, tornádo, čára s vyznačenými body) v modelu i ve vykreslovači","The Lead: lead_artifacts rows for the five stages, a model read tool, MaterialRule.BUSINESS_MODEL (Class A), per-change proposal operations generic over a type's declared operations, accepted through the Lead's edit path":"Lead: řádky lead_artifacts pro pět kroků, nástroj pro čtení modelu, MaterialRule.BUSINESS_MODEL (třída A), operace návrhů po jednotlivých změnách, obecné nad deklarovanými operacemi typu, přijímané cestou úprav Leadu","Cost scenarios as the composable model's first template (ADR § W§), its types: Driver (input, or a × b / a ÷ b), the four cost-line kinds (FIXED, VARIABLE, STEP, CAPITAL annuity), at most twelve scenarios (Q§, raised §-§-§); registered as model type cost_scenarios v§":"Nákladové scénáře jako první šablona skládacího modelu (ADR § W§), jejich typy: Driver (vstup, nebo a × b / a ÷ b), čtyři druhy nákladových řádků (FIXED, VARIABLE, STEP, CAPITAL anuita), nejvýše dvanáct scénářů (Q§, zvýšeno §-§-§); zapsané do registru jako typ modelu cost_scenarios v§","Cost scenarios, compute: totals per year, exact break-even on one driver in a stated range (where the driver enters through one monotone form, else refused by name), one-way sensitivity, cumulative cost over N stated years with capital in year § and the payback year; unknown propagated by name; the warehouse golden fixture":"Nákladové scénáře, výpočet: součty za každý rok, přesný bod zvratu pro jeden faktor v
