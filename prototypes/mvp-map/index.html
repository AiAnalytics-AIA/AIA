a contract; a column the contract doesn't name, or a personal column, never leaves the analysis copy.":"Soubor klienta vstoupí do výpočtu jen na základě přijaté datové smlouvy; sloupec, který smlouva neuvádí, nebo sloupec s osobními údaji nikdy neopustí analytickou kopii.","Same inputs, same answer":"Stejné vstupy, stejná odpověď","The same inputs and seed give the same bytes, for calculations and estimates alike.":"Stejné vstupy a stejný seed dávají stejné bajty, u výpočtů i u odhadů.","Unapproved estimates are labelled":"Neschválené odhady nesou označení","An estimate whose method is not approved reaches a client only labelled, and the approval records the warning.":"Odhad, jehož metoda není schválená, se ke klientovi dostane jen s označením a schválení zaznamená varování.","Public data copied exactly":"Veřejná data se přebírají přesně","A public value equals the source's response byte for byte; VIES is never stored; a field naming a person is hidden without a balancing test.":"Veřejná hodnota se shoduje s odpovědí zdroje bajt po bajtu; VIES se nikdy neukládá; pole, které jmenuje osobu, je bez balančního testu skryté.","Research findings are real quotes":"Zjištění z rešerše jsou skutečné citace","A Deep Research finding is a quote in a captured source; citations at least § % accurate, unsupported statements under § %.":"Zjištění z Deep Research je citace v zachyceném zdroji; přesnost citací je aspoň § %, nepodložených tvrzení je méně než § %.","Each map passes its planted-answer test":"Každá mapa projde svou zkouškou s vloženou odpovědí","Every configuration finds the structure planted in its fixture and, in a world with no relation, draws no more than its declared error rate: scenario maps by stability under assumptions written first, observed-data maps by resampling the way their rows depend.":"Každá konfigurace najde strukturu vloženou do svých zkušebních dat a ve světě bez vztahu nekreslí víc, než kolik připouští její předem uvedená míra chyb. Mapy scénářů se zkoušejí stabilitou při předpokladech zapsaných předem, mapy naměřených dat převzorkováním podle toho, jak na sobě jejich řádky závisejí.","The answer is sealed before the map":"Odpověď se zapečetí dřív, než vznikne mapa","Each test dataset's ground truth (which option, under which weights, why, and each trap's expected effect) is written and sealed before any map is made; the maps and the report are scored against it.":"Správná odpověď každé testovací datové sady (která varianta, při jakých vahách, proč a jaký účinek se čeká od každé pasti) se zapíše a zapečetí dřív, než vznikne jakákoli mapa; mapy i zpráva se hodnotí podle ní.","The whole journey runs, nothing paid":"Celá cesta proběhne a nic se neplatí","The whole fictional Velis journey runs over HTTP and in a browser on recorded answers, with zero paid calls, within the study's spend limit.":"Celá cesta smyšleného případu Velis proběhne přes HTTP i v prohlížeči na nahraných odpovědích, bez jediného placeného volání a v rámci limitu výdajů studie.","The cost-model journey":"Cesta nákladového modelu","From upload to the approved report, for the first model template (cost-model-study CM§).":"Od nahrání dat po schválenou zprávu, pro první šablonu modelu (cost-model-study CM§).","Every item on this page can be marked Keep, Change, Cut, Later or Discuss and given a note; hover over an item to see the buttons. Marks are saved for everyone who opens the page. This tab collects them as text, ready to copy into the plan files.":"Každou položku na této stránce můžete označit značkou Ponechat, Změnit, Vyřadit, Později nebo Probrat a připsat k ní poznámku; tlačítka se zobrazí, když na položku najedete myší. Značky se ukládají pro všechny, kdo stránku otevřou. Tato záložka je sbírá jako text připravený ke zkopírování do souborů plánů.","Keep:":"Ponechat:","Change:":"Změnit:","Cut:":"Vyřadit:","Later:":"Později:","Discuss:":"Probrat:","notes:":"poznámky:","added:":"přidáno:","Copy as text":"Zkopírovat jako text","Loading…":"Načítám…","Saving…":"Ukládám…","Saved":"Uloženo","Sync stopped":"Synchronizace se zastavila","Not saved: error":"Neuloženo: chyba","less":"méně","more":"více","Copied":"Zkopírováno","Selected: press Ctrl/Cmd+C":"Vybráno: stiskněte Ctrl/Cmd+C","Note ✓":"Poznámka ✓","Nothing decided here.":"Zde není nic rozhodnuto.","remove":"odebrat"}</script>

const PLANS = {"decision-brief": [{"id": "DB0", "done": false, "text": "The business Zadání as data: the eight parts (decision and goal; options and constraints; rule and risk; customers; data and uncertainties; execution and output; analyses, through analysis-frameworks; the model's parts), each with its source citation and the step it hands to; the decision core's fields and the model switch \"Potřebuje rozhodnutí výpočet?\"; revision-checked on the study's working copy (artifact-brief, working-copy-edit-ops); one fixture read by Python and TypeScript", "wave": "W1"}, {"id": "DB1", "done": false, "text": "Popis (board Z1): the one required field, files kept as the client's sources in the study's Vstupy folder (study-files#SF6), Ada's \"Co ještě pomůže\" suggestions; a missing file stays an open item and later becomes a wide-range assumption", "wave": "W2"}, {"id": "DB2", "done": false, "text": "Triage as an ordinary Lead turn (board Z2): the eight parts proposed with their sources, each accepted, edited or dropped (ADR 0026); options Ada adds marked as hers; every question that matters, ordered by importance, the first three open and the rest under \"Další otázky (n)\" (W2); each question's reason in words, never a crown amount (W3)", "wave": "W2"}, {"id": "DB3", "done": false, "text": "The decision core (board Z3): decision, owner, deadline and goal; options and constraints, which become the model's variants; the rule (measure, threshold, risk limit) recorded before the first computation, any change recorded and marked in the report (cost-model-study#CR7, M-4); objectives that each serve the decision; how certain the answer must be; the model switch, Ada proposing and the researcher confirming, the model steps shown only on yes (W4)", "wave": "W2"}, {"id": "DB4", "done": false, "text": "Readiness R1-R7 (board Z7): R1-R5 checked by code and holding the hand-off, R6-R7 the Lead's advice holding nothing; chips under the stage header, each opening its detail", "wave": "W2"}, {"id": "DB5", "done": false, "text": "The hand-off: what Data, Předpoklady, Model and Zpráva take over, each as a proposal, nothing overwritten; a later edit of Zadání offered to the steps downstream as a proposal", "wave": "W2"}, {"id": "DB6", "done": false, "text": "The journey: the fictional Velis brief from one sentence to its hand-off at 1440, 1100, 768 and 390 px on the scripted Lead; zero paid calls", "wave": "W3"}], "client-data-in-analysis": [{"id": "0", "done": false, "text": "Decide the evidence policy for a client's dataset columns (deferred by the owner, 2026-10-19), and settle ADR 0027's three open questions", "wave": "W1"}, {"id": "1", "done": false, "text": "The origin CLIENT_REPORTED and its fourth reading in origin_kind, every label reading it", "wave": "W1"}, {"id": "2", "done": false, "text": "The data contract as a type, and the route a person accepts it through (approval ledger)", "wave": "W1"}, {"id": "2a", "done": false, "text": "The data quality report the person accepts (W3, after 3a): missing, duplicate and out-of-range counts per used column over every row, versioned and hashed, shown before accept; a truncated reading cannot be accepted", "wave": "W1"}, {"id": "3", "done": false, "text": "The analysis copy holds only the columns the accepted contract names, each classified by a person; nothing personal stored for analysis or sent to a model", "wave": "W1"}, {"id": "3a", "done": false, "text": "A full-grid reader over the kept original bytes under stated analysis bounds, refusing by name above them, never a partial copy (W3, before 2a)", "wave": "W1"}, {"id": "3b", "done": false, "text": "The hash-verified accessor and the scope the client-data step runs under (W3)", "wave": "W1"}, {"id": "4", "done": false, "text": "Deterministic computations per shape: descriptive tables and benchmark gaps", "wave": "W3"}, {"id": "5", "done": false, "text": "Admission and the client-reported grade in domain/evidence, and the report's marks", "wave": "W3"}, {"id": "6", "done": false, "text": "A client's own survey: its own Sociomap through the existing engine, never merged", "wave": "PARKED"}, {"id": "7", "done": false, "text": "The Lead and the analysis modules see only admitted client-reported results, never rows", "wave": "W3"}, {"id": "8", "done": false, "text": "Brief materials pick a client dataset; `brief_signature` and `design_material` carry the source id and the contract version, with one fixture for Python and TypeScript", "wave": "W1"}, {"id": "9", "done": false, "text": "The client-data steps placed in the run: a graph node, a contract-version pin on the run, an impact root, and which run's report prints them; class and lineage for client-reported numbers sent to a model, the class gates enforcing in any deployment that holds a real client's data (ADR 0046 Q2, A4)", "wave": "W1"}, {"id": "8a", "done": true, "text": "W0 proposed Brief-material/signature interface and shared fixture; uploaded datasets remain ineligible until an accepted data contract exists", "wave": "W0"}, {"id": "10", "done": false, "text": "The data contract and its quality report accepted on the study's Data step (ADR 0046 W6, superseding D-37's Brief drawer); Zadání lists only the files it needs", "wave": "W1"}, {"id": "11", "done": false, "text": "A number from a client's document (a PDF contract or offer): Ada proposes it with its page, code checks it appears literally on that page (Deep Research's grounding rule), the researcher accepts each; one not found on its page refused by name (ADR 0046 W7)", "wave": "W2"}, {"id": "12", "done": false, "text": "An estimate from client rows (e.g. orders lost after a delay, from matched groups) as a Metodika method with its interval and row count, internal until the methodology owner registers it (ADR 0046 W8)", "wave": "W3"}], "deep-research-v2": [{"id": "DRV0", "done": false, "text": "The gate's three additions before a structured or archive route goes live: per-source rate limits (ARES 500 a minute), a robots.txt and text-and-data-mining reservation check before any fetch for mining, a retention limit on mined copies; each refusal named", "wave": "W1"}, {"id": "DRV1", "done": false, "text": "The typed input as a contract: value, unit, period, range, source, licence and as-of date, with the labelled Czech set (300+ sentences from annual reports, ČSÚ releases and price lists, two annotators) pinned as a fixture", "wave": "W2"}, {"id": "DRV2", "done": false, "text": "The rule-based extractor in code: the model proposes the concept and the period only; value and unit F1 >= 0.90 on the labelled set before it is used", "wave": "W2"}, {"id": "DRV3", "done": false, "text": "The extraction step between verify and synthesize: typed inputs extracted from accepted findings' quotes and from structured routes (public-data-routes), each accepted by a person before it reaches a model input (public_source) or a findings table", "wave": "W2"}, {"id": "DRV4", "done": false, "text": "Citation precision and recall in verify (a run shows accuracy and unsupported claims; recall is the method's tested level from the evaluation set, never a per-run number, ADR 0046 W11): DeepTRACE's citation accuracy and thoroughness, the judge calibrated on 100 human-labelled statement-source pairs (kappa reported), and a link-health check; targets accuracy >= 90 %, unsupported < 10 %, thoroughness >= 50 %", "wave": "W2"}, {"id": "DRV5", "done": false, "text": "Source credibility v2 (tiers named Úřední / Oborový / Ostatní, never A/B/C, ADR 0046 W9): declared (source, claim type) tables, a Code-of-Practice checklist for statistics, a review date and a four-year stale flag; a score proposed by a model refused", "wave": "W3"}, {"id": "DRV6", "done": false, "text": "Triangulation: each numeric claim decomposed into sub-questions, agreement or contradiction recorded per typed input, a person resolves a contradiction (macro-F1 measured on a labelled Czech set)", "wave": "W3"}, {"id": "DRV7", "done": false, "text": "As-of-date research: Memento TimeGate and Wayback CDX beside the Common Crawl index, a new 'as of' purpose; every archive finding carries its capture's own datetime within a declared tolerance", "wave": "W3"}, {"id": "DRV8", "done": false, "text": "Scheduled monitoring: structured series polled by their own update annotations (Eurostat UPDATE_DATA), pages at an estimated change rate, an alert only when an extracted value changes", "wave": "W4"}, {"id": "DRV9", "done": false, "text": "Precedents and case outcomes as a purpose: candidates only, each confirmed by a person; no outcome predicted", "wave": "UNSCHEDULED"}], "public-data-routes": [{"id": "PDR0", "done": false, "text": "The data source register as data: each source's legal status, cost, rate limit, licence, retention, and whether a field names a natural person, from the pivot research's § Data source register; read by RetrievalGate, never by a model", "wave": "W1"}, {"id": "PDR1", "done": false, "text": "SDMX: Eurostat and the ECB Data Portal as one route family; the model proposes a query key, code fetches, every admitted value byte-equal to the API's response; recorded doubles and golden responses pinned by hash", "wave": "W2"}, {"id": "PDR2", "done": false, "text": "ČNB: the daily fixing and ARAD series, within ČNB's limit on automated access", "wave": "W2"}, {"id": "PDR3", "done": false, "text": "GLEIF: entity and ownership matching (its licence confirmed first)", "wave": "W2"}, {"id": "PDR4", "done": false, "text": "EU TED: procurement notices and awards", "wave": "W2"}, {"id": "PDR5", "done": false, "text": "ISVZ open data live: isvz-notice-1 from recorded to a live route; NEN data behind its login never collected, refused by name", "wave": "W2"}, {"id": "PDR6", "done": false, "text": "ARES extended (firm counts by NACE, counterparty checks) and the commercial register's open data (dataor.justice.cz); fields that name a natural person wait for register-personal-data RPD1-RPD2", "wave": "W2"}, {"id": "PDR7", "done": false, "text": "Sbírka listin financial statements: PDF and XHTML read with located segments (client_sources' readers), both Czech P&L layouts, every extracted value reviewed by a person before use; the review's cost measured, which decides PDR10", "wave": "W3"}, {"id": "PDR8", "done": false, "text": "VIES: a one-off VAT validation, the answer never stored or retransmitted", "wave": "W2"}, {"id": "PDR9", "done": false, "text": "ČÚZK REST API-KN after registration (the owner registers), parcels as a high-value dataset; the paid WSDP outputs priced on the tool-cost ledger", "wave": "W3"}, {"id": "PDR10", "done": false, "text": "Commercial structured data (Merk, Cribis, MagnusWeb, Orbis, Creditinfo): the owner's buy-or-build decision from PDR7's measured cost; nothing contracted by this plan", "wave": "UNSCHEDULED"}], "register-personal-data": [{"id": "RPD0", "done": false, "text": "The processing record for named natural persons taken from public registers: purpose, legal basis (legitimate interest), the balancing-test template, retention, recipients; written with the legal counsel the owner names, before any such field reaches a study", "wave": "W1"}, {"id": "RPD1", "done": false, "text": "Which register fields name a natural person (ARES statutory bodies, the commercial register's officers and owners, sole traders), as data in the source register (public-data-routes PDR0); those fields withheld until RPD2 passes", "wave": "W1"}, {"id": "RPD2", "done": false, "text": "The balancing test as an approval-ledger subject (a migration admits it to ApprovalSubject before its writer): per client and source, recorded by a person, read before a withheld field is released to a study", "wave": "W2"}, {"id": "RPD3", "done": false, "text": "Art. 14 notices: where a notice is owed, its record; where an exemption applies, the reason recorded; both on the approval ledger", "wave": "W2"}, {"id": "RPD4", "done": false, "text": "Retention and erasure of register-derived personal data through study-data-lifecycle's delete path, with the horizons RPD0 sets", "wave": "W3"}, {"id": "RPD5", "done": false, "text": "Minimisation: a field naming a person never sent to a model unless RPD0's record allows that use, Class A by rule (material_rules), masked on screen as client_datasets masks personal columns", "wave": "W2"}], "legal-context": [{"id": "LGL0", "done": false, "text": "Scope and the disclaimer, written with the legal counsel the owner names: what AIA flags (tax, contract and employment law; Czech and EU), the report's \"not legal advice\" text, the researcher's acceptance of each legal point; recorded before any legal point reaches a study", "wave": "W1"}, {"id": "LGL1", "done": false, "text": "e-Sbírka and EUR-Lex as gate routes (public-data-routes): a provision fetched by its identifier in the version in force on a stated date, captured content-addressed, its licence and rate limits in the source register", "wave": "W2"}, {"id": "LGL2", "done": false, "text": "The legal point as a type: the law, the provision, the version date, the verbatim quote and its snapshot hash; a quote must be literally in the captured provision (Deep Research's grounding rule)", "wave": "W2"}, {"id": "LGL3", "done": false, "text": "Legal parameters and constraints: a point becomes a Předpoklady parameter (corporate tax rate, depreciation groups and methods, VAT, minimum wage, overtime premium, notice periods) or a Model constraint, each accepted by the researcher; the after-tax view (cost-model-study#CM7) reads them", "wave": "W3"}, {"id": "LGL4", "done": false, "text": "Version watch: a study's legal points re-checked against the version in force at the report's date; a changed provision marks the results that depend on it stale (deep-research-v2 DRV7, DRV8)", "wave": "W3"}, {"id": "LGL5", "done": false, "text": "The legal point in the report outline and the report: a kind and a grade of its own, the disclaimer printed wherever one is used", "wave": "W3"}, {"id": "LGL6", "done": false, "text": "The journey: the fictional Velis study's after-tax view from the cited corporate tax rate and depreciation provisions, and a notice period as a timing constraint, on recorded doubles; zero paid calls", "wave": "W4"}], "cost-model-study": [{"id": "CP1", "done": false, "text": "Platform types: Quantity (Amount, Rate, Count, Ratio, Duration; Decimal, currency, period), Input with its provenance (client_dataset, stated, public_source; research_result declared and refused until built), Scenario, the Model Revision envelope and its canonical hash; reject-not-coerce validation", "wave": "W2"}, {"id": "CP2", "done": false, "text": "The model-type contract, composable (ADR 0046 W17): one cash-flow model whose line items come from a closed set of kinds (PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ, with capacity and timing rules) and whose formulas come from a closed vocabulary, Ada proposing items and the researcher accepting; templates as data (cost scenarios first); ModelTypeSpec kept for a template's results with each output's grade, charts, report blocks and proposal operations; the registry, a run's pin of template id and version; the determinism test harness", "wave": "W2"}, {"id": "CP3", "done": false, "text": "The model inside the one study and its working copy (ADR 0046 decision 3, A2 \"One merged study\": no StudyKind.BUSINESS_MODEL): a model content kind on the research study's owned working project (revision-checked saves, the operation log), present only when Zadání says a model is needed, and the immutable Model Revision", "wave": "W2"}, {"id": "CP4", "done": false, "text": "Data bindings: an input from a dataset's analysis copy under its accepted contract (sum, count, mean over a stated filter and period), admitted CLIENT_REPORTED with MQ-18's support, the contract version and copy SHA-256 pinned", "wave": "W2"}, {"id": "CP5", "done": false, "text": "The run: workflow type business_model (prepare, compute, report), inputs frozen by artifact id and SHA-256, a known 0.00 USD ceiling for a CALCULATED type, results stored as artifacts; the ledger subject business_model for a submitted revision", "wave": "W2"}, {"id": "CP6", "done": false, "text": "The API: /studies/{id}/model content, revisions, submit, runs, results; study-scoped, refused for any other kind; the client page's count", "wave": "W2"}, {"id": "CP7", "done": false, "text": "The web platform: the model steps inside the one study (ADR 0046 decision 3; no \"Modely\" area, Q8 superseded), the model type chosen in Zadání, Data, Předpoklady, Model and Výsledky in the study's stage track (research-findings-stage FND1); Data (each dataset's contract state) and Předpoklady (every input with unit and provenance, edited in place) generic over the type's schema", "wave": "W2"}, {"id": "CP8", "done": false, "text": "The report frame and grades: PrintGrade CALCULATED (výpočet) and its admission beside admit_numeric_claims, and the one table mapping every grade to its Czech label and admission rule (the code's grades kept, CALCULATED and ESTIMATED added, the researcher's labelled judgement a grade of its own; ADR 0046 Q1; a grade follows its method, not its inputs, W21; a public source, a labelled judgement and a cited legal provision in the same table, W10, W19, W22; every headline the median with its 90 % interval, the base case only as v základu, W20), the platform template frame (question, type blocks, inputs table, method, sources), report kind business_model approvable through approve_report, three chart kinds (absolute stacked bar, tornado, line with marked points) in the model and the renderer", "wave": "W2"}, {"id": "CP9", "done": false, "text": "The Lead: lead_artifacts rows for the five stages, a model read tool, MaterialRule.BUSINESS_MODEL (Class A), per-change proposal operations generic over a type's declared operations, accepted through the Lead's edit path", "wave": "W2"}, {"id": "CM1", "done": false, "text": "Cost scenarios as the composable model's first template (ADR 0046 W17), its types: Driver (input, or a × b / a ÷ b), the four cost-line kinds (FIXED, VARIABLE, STEP, CAPITAL annuity), at most twelve scenarios (Q4, raised 2026-10-30); registered as model type cost_scenarios v1", "wave": "W2"}, {"id": "CM2", "done": false, "text": "Cost scenarios, compute: totals per year, exact break-even on one driver in a stated range (where the driver enters through one monotone form, else refused by name), one-way sensitivity, cumulative cost over N stated years with capital in year 0 and the payback year; unknown propagated by name; the warehouse golden fixture", "wave": "W2"}, {"id": "CM3", "done": false, "text": "Cost scenarios, the Model stage: lines, drivers and scenarios edited in place (input standard I1-I11)", "wave": "W2"}, {"id": "CM4", "done": false, "text": "Cost scenarios, charts: scenario comparison stacked by line, cumulative cost with the payback year, break-even lines with the crossing marked, the sensitivity tornado; the same drawing on Výsledky and in the DOCX", "wave": "W2"}, {"id": "CM5", "done": false, "text": "Cost scenarios, report blocks and method text", "wave": "W2"}, {"id": "CM6", "done": false, "text": "The journey: the warehouse case as fictional inputs (24 months), AC-16 over HTTP and a browser journey from upload to the approved report, ESTIMATED in the client report labelled as awaiting registration, its approval warning recorded (ADR 0046 W27); zero paid calls without the Lead", "wave": "W2"}, {"id": "CM7", "done": false, "text": "NPV of each scenario's costs and discounted payback at the study's one declared discount rate (CALCULATED), before and after tax, the rule reading the one Zadání names and the other shown beside it; tax rate and depreciation from legal-context#LGL3 (ADR 0046 W16, W18)", "wave": "W2"}, {"id": "CP10", "done": false, "text": "The ESTIMATED grade on the platform: interval or percentiles, seed and method version pinned, results stored, the rerun-equals-bytes test; the method register (internal until A. Bahbouh's entry approves); the Metodika module 'Nákladové modely' holding every default as written (final, Q13), versioned, pinned per run", "wave": "W3"}, {"id": "CR1", "done": false, "text": "Data checks before use: reconciliation across files and against stated totals, period coverage and currency, robust outlier flags, seasonality only with two cycles; accepted by the person as part of the binding; missing stays missing", "wave": "W3"}, {"id": "CR2", "done": false, "text": "Ranges: low / base / high and a guarantor on every input, a person at the client, a value fixed by contract fixed unless the contract allows a change (ADR 0046 W15), the discount rate a fixed study parameter with its guarantor and the verdict shown at other rates (W16); exact range of every total by vertex enumeration over closed STEP cells (each end with that cell's step count, one-sided limits included), only where code verifies every input enters through one monotone form (else range_not_exact, cap 2^14); dominance, and the inputs that flip the ranking with their flip values", "wave": "W3"}, {"id": "CR3", "done": false, "text": "Monte Carlo (ESTIMATED): each input's distribution by its source, a client-data estimate its own distribution, a person's range PERT, people who disagree a mixture (ADR 0046 W14); correlations Ada proposes in a Souvislosti table with a strength and a reason, each accepted by the researcher, independence stated (W13), by Iman-Conover, a non-PSD matrix refused; PCG64 under the run's seed; five-stream convergence check; P(A cheaper than B) with its standard error and the 90 % interval of the difference", "wave": "W3"}, {"id": "CR4", "done": false, "text": "Global sensitivity (ESTIMATED): Sobol first-order and total (Jansen, bootstrap intervals) for independent inputs, partial rank correlation when inputs are correlated, beside the tornado", "wave": "W3"}, {"id": "CR5", "done": false, "text": "Backtested forecasts (ESTIMATED): naive, seasonal naive, drift and Holt-Winters additive; rolling-origin backtest scoring the candidate and the baseline on the same held-out origins; a forecast whose held-out MAE is not strictly below the baseline's not used, said in words; MASE and MAPE reported, not the gate; its errors become the volume input's range and distribution", "wave": "W3"}, {"id": "CR6", "done": false, "text": "Value of information (ESTIMATED): EVPPI per input from the Monte Carlo draws; an input marked measurable by a survey with material EVPPI offers the Výzkum path, a research study proposed with its question, nothing started", "wave": "W3"}, {"id": "CR7", "done": false, "text": "The decision rule (Z3): the person's own rule, stated before the data (option, quantity, threshold, optionally the confidence needed), judged as written; the default confidence 0.90 / 0.10 only when the rule names none, said on the page; no rule, no recommendation (R2); dominance beside it; internal until the Monte Carlo method is registered", "wave": "W3"}, {"id": "CR8", "done": false, "text": "The method on screen: the data-check review on Data; on Výsledky the range table, dominance and flip inputs, the probability and zone, the difference's distribution, the Sobol or rank-correlation bars, the forecast with its backtest, the value-of-information table; every ESTIMATED value marked odhad (interní) until registered", "wave": "W3"}, {"id": "CR9", "done": false, "text": "The method in the report: blocks for each layer, a method appendix naming each method's id, version and register status, the client report carrying only CALCULATED and registered ESTIMATED numbers", "wave": "W3"}, {"id": "CS1", "done": false, "text": "The properties table: objects are the run's scenarios; properties are chosen results (CALCULATED or ESTIMATED refs) and stated scenario attributes, each with declared scale extremes and direction", "wave": "W3"}, {"id": "CS2", "done": false, "text": "The objects × properties fuzzy matrix (new FuzzySource): Euclidean, Manhattan or correlation similarity after scale extremes, converted to 0-1 by the registered rule; checked against SOMECS Input fig. 6", "wave": "W3"}, {"id": "CS3", "done": false, "text": "Layout and fit: the H-Model candidate or the -5 layout (A. Bahbouh's choice), Spearman accuracy, significance through sociomapping-engine 2c; results stored, the rerun equal in bytes", "wave": "W3"}, {"id": "CS4", "done": false, "text": "The WIND height on the layout: one chosen property, the surface from sociomapping-engine 4b with the registered exponent, radius and grid; ESTIMATED, internal until registered", "wave": "W3"}, {"id": "CS5", "done": false, "text": "The map on Výsledky and in the report: the WIND view from sociomapping-engine 11, the property chosen as height, fit and its significance, odhad (interní) until registered; beside a linked survey's respondent map, never merged", "wave": "W3"}, {"id": "CR10", "done": false, "text": "The method validation pack: each method against its published reference as tests (Ishigami, PERT moments, Iman-Conover, MASE, a closed-form EVPPI), and the report the method owner signs", "wave": "W3"}], "quantitative-families": [{"id": "ACC1", "done": false, "text": "The chart-of-accounts mapping in a dataset's data contract: each account to a statement line and sign, period and currency per column", "wave": "W3"}, {"id": "ACC2", "done": false, "text": "Statements: profit and loss and balance sheet from a trial balance or ledger export through the mapping; balance checks refused by name", "wave": "W3"}, {"id": "ACC3", "done": false, "text": "Ratios: a closed, defined list (liquidity, leverage, margins, turnover), each with its formula and a division by zero named", "wave": "W3"}, {"id": "ACC4", "done": false, "text": "Budget against actual: variance per line, with price, volume and mix decomposition where the contract declares quantities", "wave": "W3"}, {"id": "ACC5", "done": false, "text": "Accounting stages, charts and report blocks", "wave": "W3"}, {"id": "FIN1", "done": false, "text": "The cash-flow schedule: flows by year with a stated discount rate and horizon", "wave": "W3"}, {"id": "FIN2", "done": false, "text": "IRR (a stated root rule; several or no roots refused by name) over the MVP's NPV and payback, extended to any cash-flow schedule", "wave": "W3"}, {"id": "FIN3", "done": false, "text": "Scenarios and one-way sensitivity on NPV and IRR, reusing cost scenarios' machinery", "wave": "W3"}, {"id": "FIN4", "done": false, "text": "Pricing break-even: contribution margin, units and revenue to break even", "wave": "W3"}, {"id": "FIN5", "done": false, "text": "Price elasticity fitted from the client's price and volume data (ESTIMATED; its method owner's register entry)", "wave": "W3"}, {"id": "FIN6", "done": false, "text": "Finance stages, charts and report blocks", "wave": "W3"}, {"id": "OR1", "done": false, "text": "EOQ and reorder point (CALCULATED); safety stock from a stated demand deviation (CALCULATED) or one fitted from data (ESTIMATED)", "wave": "W3"}, {"id": "OR2", "done": false, "text": "Linear optimisation: variables, constraints and an objective as typed elements; HiGHS pinned through scipy; the optimum, binding constraints and shadow prices in words; infeasible and unbounded as named results", "wave": "W3"}, {"id": "OR3", "done": false, "text": "Demand forecasting as a model type of its own, on the MVP's backtested methods (cost-model-study CR5), for any demand series", "wave": "W3"}, {"id": "OR4", "done": false, "text": "Monte Carlo, global sensitivity and value of information on any CALCULATED type, generalising the MVP's (cost-model-study CR3, CR4, CR6)", "wave": "W3"}, {"id": "OR5", "done": false, "text": "Operations research stages, charts and report blocks", "wave": "W3"}, {"id": "MKT1", "done": false, "text": "The research_result provenance: one admitted claim of an approved research run of the same client, carrying its own grade (modelled under ADR 0024), its run, ref and artifact SHA-256", "wave": "PARKED"}, {"id": "MKT2", "done": false, "text": "TAM, SAM and SOM top-down as a chain of inputs, each step its own label, the chain printing the weakest", "wave": "W3"}, {"id": "MKT3", "done": false, "text": "Bottom-up from a survey's admitted share × a population count (research_result), its interval carried, labelled modelováno", "wave": "PARKED"}, {"id": "MKT4", "done": false, "text": "A market-sizing Deep Research purpose (an ADR 0021 amendment): queries from a person's Class B focus, never from the model; findings enter only as public_source", "wave": "W3"}, {"id": "MKT5", "done": false, "text": "Market-sizing stages, charts and report blocks", "wave": "W3"}, {"id": "LINK1", "done": false, "text": "The survey beside a model: a model revision cites one approved research run of the same client, and its report gains the run's approved map snapshot and admitted key numbers as a chapter, never combined into a model number", "wave": "PARKED"}], "analysis-frameworks": [{"id": "AF0", "done": false, "text": "The catalogue as data: every framework with its id, group, the question it answers, how it is produced (computed by code, cited Deep Research points, synthesis, named experts), its inputs (client data, Deep Research, experts), its grade, its report outline chapter kind and its MVP flag; versioned, one fixture read by Python and TypeScript; a framework point is a typed reference (an accepted finding, an admitted client-data claim, a model result, an expert's score) or the researcher's own judgement, labelled with its grade and author (ADR 0046 A3), never unlabelled free text (W1)", "wave": "W1"}, {"id": "AF1", "done": false, "text": "The default sets: decision type to the frameworks Ada proposes, as data the owner approves; the Lead proposes a set with one reason per framework, the researcher accepts per change (ADR 0026); a framework that needs register fields naming persons is never proposed before its balancing test (W2)", "wave": "W2"}, {"id": "AF2", "done": false, "text": "The Zadání picker (prototype board Z4): the groups, a toggle per framework, what each needs, the Deep Research cost ceiling of the selection, the report outline chapters and the expert forms it creates; saved on the study's working copy; post-MVP frameworks shown and disabled (W2)", "wave": "W2"}, {"id": "AF3", "done": false, "text": "The selection drives Deep Research: each framework that needs research becomes subjects of the Design Research plan, its ceiling pinned at enqueue; a deselected framework takes its subjects out of the next run (W2, after deep-research-v2 DRV0)", "wave": "W2"}, {"id": "AF4", "done": false, "text": "The selection drives the model: each computed framework switches on its view on Výsledky (Finance, Účetnictví, Provoz, Logistika, Trh) through cost-model-study and quantitative-families; a framework whose data contract is missing says which file it waits for (W3)", "wave": "W3"}, {"id": "AF5", "done": false, "text": "The selection drives the experts: each expert-scored framework (the Blue Ocean strategy canvas, the risk register, RACI, the architecture frameworks) creates a scoring form for named raters, through situation-reports EX1's expert panel (W3)", "wave": "W3"}, {"id": "AF6", "done": false, "text": "The selection drives the report outline: each framework a chapter or a part of one, with its point slots (SWOT's four quadrants, PESTEL's six factors, Porter's five forces); a point without a resolving source link is refused (research-findings-stage FND2) (W2)", "wave": "W2"}, {"id": "AF7", "done": false, "text": "Logistics frameworks: cost-to-serve, make-or-buy and 3PL total cost of ownership, network and warehouse location (centre of gravity), service level and OTIF, transport cost by zone, warehouse sizing, each computed by code from client data under its contract and public inputs (W3)", "wave": "W3"}, {"id": "AF8", "done": false, "text": "Corporate governance and enterprise architecture frameworks: ownership and group structure (after register-personal-data RPD2), RACI, risk management (COSO ERM, ISO 31000), compliance obligations, internal control; the capability map, current and target state with the gap, systems and data flows, the operating model; expert-scored or cited, never written by a model (W3)", "wave": "W3"}, {"id": "AF9", "done": false, "text": "The journey: a fictional study picks its frameworks in Zadání and gets a report outline with SWOT, PESTEL, Porter, TAM/SAM/SOM and cost-to-serve chapters, every point linked to its source; recorded doubles, zero paid calls (W4)", "wave": "W4"}, {"id": "AF10", "done": false, "text": "After the MVP: the portfolio frameworks (Ansoff, BCG, GE-McKinsey, VRIO, value chain, McKinsey 7S) enabled in the picker", "wave": "POST"}], "sociomapa-systemu": [{"id": "SYS0", "done": false, "text": "The methodology owner's ten questions (the pivot research's § Questions for the methodology lead) sent to A. Bahbouh as one message with each recommendation, with the SOMECS name and the published method's licence for him to check (ADR 0046 Q4); each answer recorded here as it comes; no replaced statistic built before its answer", "wave": "W1"}, {"id": "SYS1", "done": false, "text": "The synthetic validation suite, generators only: null worlds (independent random walks, AR(1) at 0.3, 0.7 and 0.95, seasonal series with no cross-relation), known factors (12 KPIs from 3 factors), a sparse VAR(1), contamination (10 % outliers, one level shift), compositional shares, 40 units × 10 drivers, 800 scenarios × 7 options from a cost model with a known Iman-Conover correlation; 1,000 seeded replicates at T or n 24, 36, 60, 120; fixtures pinned by SHA-256 like F1-F9", "wave": "W1"}, {"id": "SYS1b", "done": false, "text": "The suite run over today's -5 statistics, as the baseline the replacements are judged against; the spike's three sets (36 × 12, 40 × 10, 800 × 7) re-run with planted ground truth and its script committed", "wave": "W1"}, {"id": "SYS2", "done": false, "text": "Declared preprocessing per variable before results are seen: unit, transformation (log, log-ratio for shares), detrend or difference, deseasonalise only with two cycles, robust standardisation; reported beside every relation (answers 2, 6)", "wave": "W2"}, {"id": "SYS3", "done": false, "text": "The relation statistic: Pearson on the transformed series, or a skipped correlation where outliers are flagged, fixed before results are seen (answer 6)", "wave": "W2"}, {"id": "SYS4", "done": false, "text": "The baseline: per-variable surrogates (IAAFT by default) after detrending, checked to reproduce each series' autocorrelation; for scenarios, the imposed input correlation (answer 5)", "wave": "W2"}, {"id": "SYS5", "done": false, "text": "Pair floors replaced by an autocorrelation-adjusted effective-sample-size floor, the formula and the floor from the synthetic power curves (answer 3)", "wave": "W2"}, {"id": "SYS6", "done": false, "text": "Multiple testing: Benjamini-Yekutieli by default, q and the method reported; a resampling-calibrated FDR only on the methodology owner's approval after the suite (answer 1)", "wave": "W2"}, {"id": "SYS7", "done": false, "text": "Credibility: a block bootstrap of rows (block length declared) with Procrustes-aligned displacement per object in place of split-half; stability only, no intervals, below the minimum length (answer 4); for the scenario map no block bootstrap: stability across seeds and assumptions, with and without each future's mean (ADR 0046 decision 5)", "wave": "W2"}, {"id": "SYS8", "done": false, "text": "Fit beside the layout: stress-1 and stress per point against a random-data benchmark and a permutation test; the layout, terrain and determinism unchanged", "wave": "W2"}, {"id": "SYS9", "done": false, "text": "The scenario mode: rows a model's Monte Carlo scenarios (>= 800, cost-model-study CR3), the imposed correlation as the baseline, grade MODELLED, the claim 'in this model, A and B move together'; consumed by cost-model-study CS1-CS5", "wave": "W3"}, {"id": "SYS10", "done": false, "text": "The expert mode: options or competitors scored by named people on criteria, grade MODELLED with the inputs stated; consumed by situation-reports EX1-EX2", "wave": "W3"}, {"id": "SYS11", "done": false, "text": "The unit and period modes, only after the suite passes at the methodology owner's thresholds (answer 7): units placed with density above a stated n, periods as a trajectory, failing edges not drawn, regimes only from a declared break; ESTIMATED, INTERNAL_ONLY until registered", "wave": "W4"}, {"id": "SYS12", "done": false, "text": "Each mode a Metodika register entry of its own (ADR 0023), INTERNAL_ONLY until approved; the never-claim list as copy on screen and in the report; the name Sociomapa systémů, never SOMECS, and A. Bahbouh's check of the name and the published method's licence recorded before any client reads it (ADR 0046 Q4, A12)", "wave": "W4"}], "situation-reports": [{"id": "SR0", "done": false, "text": "ADR 0045 accepted; the legal counsel who approves the terms library (Q18) named", "wave": "W2"}, {"id": "RC1", "done": false, "text": "Chapter kinds and the outline: a registry of versioned chapter kinds, ReportOutline, the four recipes as preset outlines composed byte for byte as today; generalises cost-model-study CP8's frame", "wave": "W3"}, {"id": "EX1", "done": false, "text": "Expert scoring: an expert panel (named experts, role, internal or the client's), a scoring form over objects × criteria with scale extremes and direction, the expert_rating provenance, aggregation by the registered weights and discrepancy threshold; a missing score stays missing", "wave": "W3"}, {"id": "EX2", "done": false, "text": "The somecs_expert model type on ADR 0044's platform, reusing cost-model-study CS2-CS5 (fuzzy matrix, layout and fit, WIND, view) with criteria as properties", "wave": "W3"}, {"id": "RC2", "done": false, "text": "The outline proposed by the Lead and approved by a person (ledger subject report_outline), per change", "wave": "W4"}, {"id": "RC3", "done": false, "text": "Chapters across studies of one client: artifacts pinned by id and SHA-256, another client's refused, every source in the manifest", "wave": "W4"}, {"id": "RC4", "done": false, "text": "Fixed method texts as versioned data, signed by the methodology owner; a report pins the versions it printed", "wave": "W4"}, {"id": "RC5", "done": false, "text": "Contract parties and terms: the client profile's registration fields (Class A), the organization's own, a terms text library approved as Q18 decides", "wave": "W4"}, {"id": "RC6", "done": false, "text": "New chapter kinds: segment profiling and prioritisation, competitor profiles (Deep Research, cited), phased strategy, risks with mitigation, KPI framework; every number a ref, prose through the writer and the sentence check", "wave": "W4"}, {"id": "EX3", "done": false, "text": "SOMECS's native output table (Incons, Cons, Asymm, Card, Card*, S(i), S(i)_Sd, d(i), Hm(i)) once each has a register entry with its formula; export E10 as the check", "wave": "W4"}, {"id": "MM1", "done": false, "text": "Bulk maps: one stored snapshot per height variable of a model, coded labels with their key, an appendix without comment", "wave": "W4"}, {"id": "MM2", "done": false, "text": "Cut-out maps (výřezové): zooms on regions or coherence groups chosen by the registered selection rule, each commented where cited", "wave": "W4"}, {"id": "FW1", "done": false, "text": "Imported fieldwork: the origin Q17 decides, a questionnaire's answers imported under a data contract and mapped to the study's design items, MQ-18's survey rule, its own Sociomap, never merged with the AI panel", "wave": "UNSCHEDULED"}], "research-findings-stage": [{"id": "FND0", "done": false, "text": "The report outline (Osnova zprávy) as data, and the ADR it needs: the report's structure (chapters and sections in the report's own order) where each section holds points, not prose; a point is a claim or a number with its kind (finding, data point, method point, conclusion, recommendation), its visual (table, graph, process diagram, map or none) and its provenance link; the stage after Sociomapa and before Zpráva on the study's working project (revision-checked saves); a stop as a named checkpoint the researcher closes; the ADR 0026 decision-4 record for this new kind of report material (W1, a contract before any code)", "wave": "W1"}, {"id": "FND1", "done": false, "text": "The one study's stage track (ADR 0046 decision 3, A2 \"One merged study\"): the canvas's nine steps in five groups (Zadání; Data, Rešerše, Předpoklady; Model; Výsledky, Sociomapa; Osnova zprávy, Zpráva), the model steps shown only when Zadání says a model is needed; the survey stages (Dotazník to Analýza) left out of new studies and read-only on a study that holds survey content or runs, the routes refusing a write by name (survey_lane_frozen), nothing deleted before the lane is archived (mvp-master-plan#MP19)", "wave": "W1"}, {"id": "FND2", "done": false, "text": "The provenance link: every number and claim in the report outline is a hyperlink to what stands behind it, resolved by code from stored ids: a Deep Research finding's quote in its captured snapshot, a typed value and its route response, a client dataset's column under its accepted contract version, a model run's result and its method entry in Metodika, a map and its method; a point whose link does not resolve shows as unverified and cannot reach Zpráva", "wave": "W1"}, {"id": "FND3", "done": false, "text": "Findings in: every accepted Design Research and Interpretation Research finding and every typed value (deep-research-v2 DRV3) offered as a point; the researcher's check per finding (kept, set aside, needs checking) recorded in the approval ledger, never changing the sealed bundle; a point whose source is set aside goes stale, named", "wave": "W2"}, {"id": "FND4", "done": false, "text": "Tables: built from accepted points, every cell a ref with its link, units and periods carried; never a number written by a model or typed without a source", "wave": "W2"}, {"id": "FND5", "done": false, "text": "Graphs from those tables (bar, line, stacked, scatter), drawn with the viz tokens, every mark linked to its point; the same drawing on screen and in the DOCX (report_docx charts)", "wave": "W2"}, {"id": "FND6", "done": false, "text": "Process diagrams and other visuals: a registry of visual kinds; a process diagram as typed data (steps, actors, decisions, flows) edited in place (input standard I1-I11), each element that states a fact linked to its point; rendered as SVG in the stage and the report", "wave": "W2"}, {"id": "FND7", "done": false, "text": "The Lead in the stage: it reads the report outline, the findings and the data through its read tools, proposes the outline, a point, a visual or a move per change, and a person accepts (ADR 0026); a paid lookup only through the card (lead-orchestration)", "wave": "W2"}, {"id": "FND8", "done": false, "text": "Stops: the researcher opens, names and closes each; the closed stops are what Zpráva receives; reopening one marks the report draft stale and names the points that moved; an unverified point holds the hand-off until its source is found or it is removed (ADR 0046 W25)", "wave": "W2"}, {"id": "FND9", "done": false, "text": "Zpráva written from the report outline: the report's prose around the closed points in the same outline, every printed number and claim keeping its provenance link (with artifact-report RPT8a's tagged content controls); the report states no point the report outline does not hold, checked before approval; an external finding labelled as external context; Czech in the MVP, English after (ADR 0046 W28)", "wave": "W3"}, {"id": "FND10", "done": false, "text": "The Sociomapa stage, before the report outline: the scenario map (cost-model-study CS1-CS5) when the study has a model, an expert map (situation-reports EX1-EX2), or a unit or period map once sociomapa-systemu SYS11 passes; its option clusters and hedges (ADR 0046 A6) offered to the report outline as points with their method link", "wave": "W3"}, {"id": "FND11", "done": false, "text": "The journey: a fictional research study from the brief to an approved report through a report outline holding one table, one graph, one process diagram and an expert map, every link resolving, over recorded Deep Research; zero paid calls", "wave": "W4"}, {"id": "FND12", "done": false, "text": "The shared review (ADR 0046 W26): a closed stop shared with the client's decision-makers as a read-only page (points, visuals, sources), their comments and agreement recorded on the approval ledger (a subject admitted by migration before its writer); optional, the report then written from it", "wave": "W3"}], "diagrams": [{"id": "DG0", "done": false, "text": "The spike, before any dependency is added: every MVP visual type in the coverage table below rendered server-side through its proposed engine, on fictional data, with IBM Plex, the design tokens' palette and Czech number formats (7,2 %, 41 000); bytes equal on a second render; each engine's licence and the map boundaries' data licence read and recorded; all six stacks are in the MVP (ADR 0046 A13, \"All six in MVP\"), so the spike proves each for its types and reports a type it cannot render, never dropping a stack (no product code, zero paid calls)", "wave": "W1"}, {"id": "DG1", "done": false, "text": "The visual as a type: kind (chart, diagram, table, framework template), engine, spec, a source reference on every element that states a fact or a number, alt text and long description, spec version; validated per engine (the Vega-Lite and Vega schemas, the Mermaid parser, bpmn-moddle against BPMN 2.0, the template's own schema) before anything is shown; one fixture read by Python and TypeScript", "wave": "W1"}, {"id": "DG2", "done": false, "text": "The renderer in the worker: deterministic SVG and PNG from a stored spec (vl-convert for Vega-Lite and Vega; Graphviz; a pinned headless renderer for Mermaid, bpmn-js and ECharts, refused by name when absent); fonts and palette from the tokens; stored as artifacts keyed by the spec's hash; the same spec renders the same bytes", "wave": "W2"}, {"id": "DG3", "done": false, "text": "Charts on Vega-Lite and Vega: every chart type of the coverage table as a tested preset (forest plot, tornado, waterfall, fan chart, Gantt, heat map, strategy canvas, quadrant bubble matrix, treemap, radar, choropleth and flow map), each number a reference; Sankey and chord on ECharts only if DG0 finds Mermaid's Sankey insufficient", "wave": "W2"}, {"id": "DG4", "done": false, "text": "Process and system diagrams: BPMN 2.0 (pools, lanes, gateways, events) on bpmn-js; flowchart, state, sequence, entity-relationship, mind map, timeline, Gantt, C4 and Sankey on Mermaid; data-flow diagrams, causal loops with polarity and decision trees on Graphviz; free node diagrams on React Flow with elkjs layout", "wave": "W2"}, {"id": "DG5", "done": false, "text": "Framework templates: typed data drawn by AIA's own deterministic SVG layout, one template per shape (SWOT 2×2, PESTEL six factors, Porter's five forces, Ansoff 2×2, value chain, McKinsey 7S, business model canvas, ERRC grid, Ishikawa, DuPont tree, SIPOC, capability map, current and target state); BCG and GE-McKinsey drawn as DG3 quadrant charts", "wave": "W2"}, {"id": "DG6", "done": false, "text": "Tables as one typed spec: plain, cross-tab, matrix (RACI), heat table, comparison with conditional marks, financial statement with indented subtotals; every cell a reference; the same table on screen (TanStack Table) and in the DOCX (report_docx tables)", "wave": "W2"}, {"id": "DG7", "done": false, "text": "The Lead's visual tools: it proposes a visual as a typed spec, per change, through the edit vocabulary (ADR 0026); the spec is validated before the researcher sees it; a number enters only as a reference it was given, never typed by the model; read tools for the visuals that exist", "wave": "W2"}, {"id": "DG8", "done": false, "text": "Editors on screen: the bpmn-js modeller, Mermaid text with a live preview, a chart form over the Vega-Lite spec, a form per framework template, React Flow for free node diagrams; every edit a working-copy operation, revision-checked", "wave": "W3"}, {"id": "DG9", "done": false, "text": "Into the report: each figure from its stored render, never browser bytes (the map snapshot's rule, report-delivery RD4); caption with its sources, alt text, numbered with the outline; the report outline links each element to its source (research-findings-stage FND2)", "wave": "W3"}, {"id": "DG10", "done": false, "text": "Accessibility and the design system: alt text and a long description on every visual, the palette's contrast and colour-vision checks (scripts/check-design.mjs) extended to diagram and template colours, print sizes for the DOCX", "wave": "W3"}, {"id": "DG11", "done": false, "text": "After the MVP: ArchiMate notation (no open-source web renderer found; a symbol set on React Flow, or Archi's exchange format), value stream maps, customer journey maps, Sociomap-style overlays on diagrams", "wave": "POST"}]};

const QUESTIONS=[
 ["Q-SPINE","all","Which scope is the MVP: everything, or one study as the spine?","Two records in the repo disagree. The master plan and ADR 0046 keep your decision A1 of 2 Nov: everything stays in the MVP and no single study is its spine. This page is built on that. The scope record of 9 Nov (prototypes/obchodni-model/MVP-SCOPE.md, version 3) says your words of 8 Nov replaced A1: the study behind report 2, a site decision, is the spine. It parks the analysis frameworks, accounting and market size, operations research, the data connectors, Sobol sensitivity, the diagram stacks, the shared client review and the personal-data register. It plans five two-week waves, and accepts the MVP on an independent calculation with known answers before the case. If the 9 Nov record stands, the steps, the build order and the Done-when tab here have to be cut down to it.","owner"],
 ["Q-PROFILE","sociomapa","Is the indicator profile in the MVP, and as what?","Your 9 Nov mindmap (AIA MVP) describes the MVP as indicator tables, then maps, then a report: rows are company-independent indicators, columns the options, one weighted table per map. This page keeps the nine-step study as the MVP and proposes the indicator profile as the observed-data map's sixth configuration, resampled by indicator family, with its own test dataset and register entry (R2-Q22). Recommended: adopt it as the sixth configuration.","owner"],
 ["Q-CLOSE","sociomapa","What “close” means on the indicator profile","Two options can be close because they score alike, or because their strengths and weaknesses follow the same pattern even at different levels. The mindmap leaves this open; every other map here uses the same pattern. Proposed: build both on the test dataset and keep the one that exposes its traps.","aram"],
 ["Q-NORM","sociomapa","How each indicator is put on one scale","Indicators come in Kč, km and %. A rank ignores how large the gaps are. A 0–1 range lets one extreme option stretch the scale. A z-score depends on which options are in the set. This page proposes the median and MAD per indicator. To decide on the test dataset: does the leader or the grouping change between methods?","aram"],
 ["Q-WACT","sociomapa","Where the weights act on the indicator profile","In the height only: the weights decide which option is best and the layout stays neutral. In the similarity too: a heavy indicator also pulls options together or apart. The weight-settings map already tests the order under other weights.","aram"],
 ["Q-PLANWORDS","sociomapa","The plan files still use the 2 Nov wording for the maps","sociomapa-systemu (SYS0–SYS12) and M-8 in the master plan speak of four “modes”, grade MODELLED, 800 scenarios and edges on the scenario map. The methodology of 10 Nov has two types and five configurations, grade odhad, 20 000 futures and no lines on a scenario map. Proposed: bring the plan files to the methodology before SYS2 starts.","coord"],
 ["Q-MINROWS","sociomapa","Minimum rows for each configuration","The example failed at 4 and 7 experts, 15 depots and 24 months; Velis placed objects without relation lines below 10 rows. Proposed: each minimum set from its planted-answer test and printed on the map.","aram"],
 ["Q-HEIGHT","sociomapa","What does height mean on the units and months maps?","The objects there are indicators, so a mean result means nothing. Until decided, both are drawn without terrain.","aram"],
 ["Q-FAN","sociomapa","Fan widths and the number of weight settings","A share of first place changes with the fan width (68 % wide, 99,7 % narrow), and four settings were too few in the crossed grid. Proposed: print all three widths; set the grid's settings count.","aram"],
 ["Q-HEDGE","sociomapa","Does the fixed-price Czech 3PL back up the Polish 3PL?","The map can't answer this: removing the row mean removes the shared level a joint loss is made of. Proposed: answer it from the joint-loss table beside the futures map.","owner"],
 ["Q-METH","sociomapa","The methodologist's register entries","Each configuration needs its own entry after its planted-answer test. The 21 Oct approval covers people's ratings only. His open questions are on the Sociomapa tab.","aram"],
 ["Q-TAXADV","reserse","Is flagging tax rules regulated tax advice in Czech law?","Zákon č. 523/1992 Sb. reserves tax advice to registered advisers. Where is the line between quoting a provision and advising? Needs counsel before LGL0.","coord"],
 ["Q-TEMPL","model","Which decision types get a model template after cost scenarios?","Pricing, market entry, capex, make-or-buy, hiring, financing… Order sets what real clients can run first.","coord"],
 ["Q-SBIRKA","reserse","Financial statements: review PDFs by hand, or buy structured data?","ADR 0046 decision 7: decide after measuring the review's cost (PDR7). Merk, Cribis and others are priced.","owner"],
 ["Q-ACC","all","Do M-1 to M-10 and TD-1 define the MVP's acceptance?","Proposed for MP17, which redefines MVP-ACCEPT-2 with its tests. Needs your approval.","owner"],
 ["Q-COMP","all","Is the competitor analysis the second acceptance case?","It would prove the modules are reusable, and it is where the indicator profile would be tested first (R2-Q20). Recommended: in the MVP, once its chunks are estimated.","owner"],
 ["Q-SHARE","osnova","How does the client see a shared stop?","A read-only page from AIA, or an export? Who may comment, and how is agreement recorded?","coord"],
 ["Q-DATASET","all","Who builds the test dataset from real figures, and when?","The mindmap asks for a new dataset as close to reality as possible: real places, real public statistics and prices, with planted traps (double counting, a misleading leader, an outlier, a wrong direction) and real-world mess. TD-1 seals its answer before any map. No plan chunk builds it yet. Velis and the fleet are invented.","owner"],
 ["Q-XLSX","zprava","Does the client also get the processed data and the map coordinates?","The mindmap lists three deliverables: the maps (PNG or PDF, with coordinates), the processed data file (raw, oriented, normalised, weighted, sources) and the report. This page hands over the report only.","owner"],
 ["Q-FETCH","reserse","Public data connectors: in the MVP or after it?","The mindmap puts automatic data fetching after the MVP (“can integrate into phase 2/3”). The build order has the public data routes, 11 chunks, in waves W1 to W3.","owner"],
 ["Q-MLFIRST","all","Which machine-learning use comes first after the MVP?","You decided on 11 Nov that machine learning follows the MVP. The candidates are at the end of the Methods & ML tab: weights learned from outcomes or from past shocks, customer and product groups, delivery-time models, odd-row detection. Each needs data the MVP does not produce: the outcomes of real studies, or tens of thousands of client rows. Proposed: choose the first one when the first real client study is known (Q-FIRST), and record what happened after each decision from the first study on, so there is something to learn from.","owner"],

function label(id){
  if(id.startsWith("chunk:")){const [,p,c]=id.split(":");const ch=(PLANS[p]||[]).find(x=>x.id===c);return `${p}#${c} — ${ch?ch.text.slice(0,140):""}`}

  if(id.startsWith("q:")){const d=QUESTIONS.find(x=>"q:"+x[0]===id);return d?`Open: ${d[2]}`:id}
  if(id.startsWith("acc:")){const a=ACCEPT.find(x=>"acc:"+x[0]===id);return a?`Acceptance ${a[0]} — ${a[2]}`:id}
  if(id.startsWith("aq:")){const a=AQ.find(x=>"aq:"+x[0]===id);return `Methodology Q${a[0]} — ${a[1]}`}
  if(id.startsWith("view:")){const w=VIEWS.find(x=>"view:"+x.id===id);return `Map view — ${w?w.name:id}`}

  if(id.startsWith("pipe:")){const p=PIPE.find(x=>"pipe:"+x.n===id);return `Map step ${p.n} — ${p.t}`}
  if(id.startsWith("does:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — ${st.does[+i][0]}`}
  if(id.startsWith("lane:")){const [,l,i]=id.split(":");const ln=LANES.find(x=>x.id===l);return `${ln.name} — ${ln.items[+i]}`}
  if(id.startsWith("idea:")){const v=ideas[id.slice(5)];return v?`New ${v.kind} (${STAGES.find(s=>s.id===v.stage).name}) — ${v.text}`:id}
  if(id.startsWith("ml:")){const a=ML.find(x=>"ml:"+x.id===id),b=ML_LATER.find(x=>"ml:"+x[0]===id);return `Machine learning — ${a?a.name:b?b[1]:id}`}
  if(id.startsWith("proc:")){const [,s,n]=id.split(":");const p=(SPEC[s]?.process||[]).find(x=>x.n===+n);const st=STAGES.find(x=>x.id===s);return p?`${st.name} process ${n} — ${p.action} (${p.actor})`:id}
  if(id.startsWith("mt:")){const k=id.slice(3);const t=k.startsWith("tpl:")?MT.templates.find(x=>x.id===k.slice(4)):k.startsWith("fam:")?MT.families.find(x=>x.id===k.slice(4)):MT[k];return `Model type — ${t?t.name:k}`}
  if(id.startsWith("gap:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — not designed yet: ${(SPEC[s]?.gaps||[])[+i]}`}
  if(id.startsWith("art:")){const a=ARTS.find(x=>"art:"+x.id===id);return a?`Hand-off — ${a.name} (${nodeName(a.from)} → ${a.to.map(nodeName).join(", ")})`:id}
  if(id.startsWith("gate:")){const s=STAGES.find(x=>"gate:"+x.id===id);return `${s.name} — before it moves on: ${GATES[s.id]}`}
  if(id==="socio:kept")return "Sociomapa — what's kept from today's engine";
  if(id==="profile:pipeline")return "Sociomapa — the proposed indicator profile map";
  return id}
function summaryText(){
  const L=[];L.push("# AIA MVP brainstorm — "+new Date().toISOString().slice(0,10));
  for(const [k,l] of STANCES){const ids=Object.keys(marks).filter(i=>marks[i].stance===k);if(!ids.length)continue;L.push("","## "+l);for(const i of ids)L.push("- "+label(i)+(marks[i].note?"\n  Note: "+marks[i].note:""))}
  const aqs=Object.keys(marks).filter(i=>i.startsWith("aq:")&&marks[i].answer);if(aqs.length){L.push("","## Methodology answers");for(const i of aqs)L.push("- "+label(i)+": "+marks[i].answer+(marks[i].note?" — "+marks[i].note:""))}
  const notes=Object.keys(marks).filter(i=>marks[i].note&&!marks[i].stance&&!(i.startsWith("aq:")&&marks[i].answer));if(notes.length){L.push("","## Notes");for(const i of notes)L.push("- "+label(i)+"\n  "+marks[i].note)}
  const ids=Object.entries(ideas);if(ids.length){L.push("","## Added in the session");for(const [iid,v] of ids){const m=marks["idea:"+iid]||{};L.push(`- [${STAGES.find(s=>s.id===v.stage).name}] ${v.kind}: ${v.text}`+(m.stance?` (${m.stance})`:"")+(m.note?"\n  Note: "+m.note:""))}}
  return L.join("\n");
}

1: the decision has an owner, a date and a business goal (code, holds the hand-off).", "output": "Decision core block 01 on the working copy.", "onFail": "R1 chip not done; hand-off held.", "screen": "Z3 · 01 Rozhodnutí a cíl firmy", "source": "decision-brief#DB3 · decision-brief#DB4 · Z7 R1", "status": "planned"}, {"n": 9, "phase": "Rozhodnutí", "actor": "Ada", "action": "Propose whether a computation is needed", "detail": "Ada proposes 'Potřebuje výpočet?' from the decision type; the researcher confirms. Yes shows Data, Předpoklady, Model, Výsledky and the Model sub-step, and adds the badge 'Obchodní model' beside 'Výzkum'; no goes from Rešerše to Osnova zprávy.", "fields": ["Potřebuje výpočet? Ano/Ne", "proposed by", "confirmed by", "badge"], "rule": "Ada proposes, the researcher confirms; the model steps exist only on yes.", "output": "Model switch on the study; the stage track and the model content kind change (CP3).", "onFail": null, "screen": "Z3 · 01 Potřebuje výpočet?", "source": "W4 · W5 · decision-brief#DB3 · research-findings-stage#FND1 · cost-model-study#CP3", "status": "decided"}, {"n": 10, "phase": "Rozhodnutí", "actor": "Researcher", "action": "List options and constraints", "detail": "Options as keyed rows (A, A2, B, B2, C, C2, H) with a description, a cited page and who added them ('klient' or 'Ada · přijato'); 'Přidat možnost'. Constraints every option must meet, each with its source (e.g. 'smlouva_3PL_CZ.pdf s. 8').", "fields": ["option key", "option text", "detail + source page", "who", "constraint", "constraint source", "Přidat možnost"], "rule": "R2: at least two options, or one against 'nic neměnit'; constraints written down (code, holds the hand-off).", "output": "Options become the model's variants; constraints its timing and capacity rules.", "onFail": "R2 not done; hand-off held.", "screen": "Z3 · 02 Možnosti a omezení", "source": "decision-brief#DB3 · Z7 R2", "status": "planned"}, {"n": 11, "phase": "Rozhodnutí", "actor": "Researcher", " adline and study budget.", "fields": ["C1..Cn", "slouží", "Kdo čte", "V jaké podobě", "Pilot", "Co se bude hlídat", "Rozsah a rozpočet"], "rule": "R4: every objective serves the decision or its execution (code); R7: execution, scope, budget and deadline fit (Lead's advice, holds nothing).", "output": "Objectives (read downstream from Zadání) and the execution block.", "onFail": "R4 fails: hand-off held; R7: advice only.", "screen": "Z3 · 04 Cíle; 05 Provedení a výstup", "source": "decision-brief#DB3 · decision-brief#DB4 · Z7", "status": "planned"}, {"n": 14, "phase": "Analýzy", "actor": "Ada", "action": "Propose analysis frameworks for the decision", "detail": "Ada proposes a set from the catalogue (seven groups) for the decision type, one reason per framework; each row shows what it needs (data klienta, rešerše, experti), how it is produced (výpočet, rešerše citováno, syntéza se zdroji, experti jmenovaní, odhad) and its report chapter. Post-MVP frameworks shown disabled ('po MVP').", "fields": ["framework", "question it answers", "needs: D / R / E", "grade", "→ chapter", "Ada mark", "toggle"], "rule": "Default sets per decision type are data the owner approves; a framework needing register fields naming persons is never proposed before its balancing test.", "output": "Framework proposal on the working copy.", "onFail": "A framework needing persons' register data: left out, Ada says why.", "screen": "Z4 · groups 02–08", "source": "analysis-frameworks#AF1 · analysis-frameworks#AF0 · W2", "status": "planned"}, {"n": 15, "phase": "Analýzy", "actor": "Researcher", "action": "Toggle frameworks; see what the selection costs", "detail": "The researcher accepts or changes each framework; a live summary shows selected n of m (Ada proposed k), the Deep Research cost ceiling of the selection out of the study budget, the report-outline chapters and the number of expert scoring forms.", "fields": ["Vybráno n z m", "Deep Research … USD nejvýš", "Kapitoly osnovy", "Hodnocení expertů n formulářů"], "rule": "Accepted per change (ADR 0026).", "output": "Framework selection saved on the working copy; later drives DR subjects (AF3), model views (AF4), expert forms (AF5), outline chapters (AF6).", "onFail": null, "screen": "Z4 · 01 Co výběr znamená", "source": "analysis-frameworks#AF2", "status": "planned"}, {"n": 16, "phase": "Model", "actor": "Ada", "action": "Propose the model's parts (only with a model)", "detail": "Target quantity and what it is compared against, horizon and step (měsíce / roky), the views to compute, model boundaries (inside / outside and why), a file → number inventory with status, key assumptions P1…Pn with value or range, source and guarantor, and what could flip the result.", "fields": ["Cílová veličina", "Horizont", "Co model spočítá", "Hranice modelu", "Data: soubor → číslo", "Klíčové předpoklady", "Kdo ručí", "Co by mohlo výsledek otočit"], "rule": "R5: quantity, horizon, boundaries, data and assumptions with a guarantor present (code, holds the hand-off); nothing missing may be missing silently.", "output": "The model's parts on the working copy; 'Na kroku Data se každé číslo přiváže…' – only an inventory here.", "onFail": "A missing number: 'Požádat o plán přechodu' / 'Vyžádat data o zpožděních' or 'Vzít jako předpoklad s rozsahem'; R5 fails until resolved.", "screen": "Z5 · 01–07", "source": "decision-brief#DB0 · decision-brief#DB4 · Z5", "status": "planned"}, {"n": 17, "phase": "Připravenost", "actor": "Code", "action": "Check readiness R1–R7", "detail": "R1–R5 checked by code and holding the hand-off; R6 (no unmeasurable words) and R7 (scope, budget, deadline) are the Lead's advice. Chips under the stage header, each opening its detail; R6 offers a rewrite ('výrazně' → 'aspoň 45 %').", "fields": ["R1–R7 chip", "Připravenost k předání", "Přijmout přepis", "Nechat"], "rule": "R1–R5 hold; R6–R7 hold nothing.", "output": "Readiness state: Blokováno / Připraveno.", "onFail": "'Chybí: R3 Pravidlo a riziko' with the rea s, so uncertainty enters the model on record.", "actors": ["Researcher", "Ada", "Code", "Client", "Metodika"], "process": [{"n": 1, "phase": "Seed", "actor": "Code", "action": "List every input the model reads", "detail": "The rows come from Zadání's model parts (Z5 05 Data, Z5 06 Klíčové předpoklady) and the model type's declared inputs; each is approved again here with the value Model will actually use.", "fields": ["Předpoklad", "Min", "Základ", "Max", "Zdroj", "Ručí", "Stav"], "rule": "Every input the pinned type reads has a row; the type's schema decides the columns (generic over the type).", "output": "One row per input, state proposed until accepted", "onFail": "An input with no row cannot feed Model; unknown is said as neznámé, never 0", "screen": "M2 · 01 Předpoklady modelu; Z5 06 note \"Na kroku Předpoklady se každý předpoklad schvaluje znovu\"", "source": "cost-model-study#CP7 · Z5Model board", "status": "planned"}, {"n": 2, "phase": "Bind", "actor": "Researcher", "action": "Bind an input to a client dataset", "detail": "The input is the sum, count or mean of a contract-named column over a stated filter on contract-named columns and a stated period, computed over the dataset's analysis copy and admitted CLIENT_REPORTED (not a sample).", "fields": ["source_id", "contract_id", "contract_version", "column", "aggregation", "filter", "period", "reading_sha256"], "rule": "Column and filter columns named by an accepted contract; the contract version is the one the input names", "output": "ClientDataset provenance with the contract version and copy SHA-256 pinned; Zdroj shows the file (e.g. zpozdeni_2024.xlsx) and the label z dat klienta", "onFail": "Refused by name: an unnamed column, an unaccepted contract, another contract version; a new contract version makes the pinned input stale and the revision unsubmittable until a person picks again", "screen": "M2 · 01, rows \"Ztráta objednávek při doručení +1 den\", \"Podíl ztráty ve velkých městech\"", "source": "cos
