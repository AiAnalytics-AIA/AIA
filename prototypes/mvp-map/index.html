<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AIA MVP Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Built for a shared screen: 17px body, one idea per tile, icons and colour by step group.
   Plain words first; the technical detail (plan ids, method names) sits underneath in a smaller line. */
:root{
  --bg:#f6f7f8; --raised:#ffffff; --sunken:#eef0f2; --border:#dfe3e7; --strong:#7d858d;
  --ink:#13171b; --muted:#454e57; --faint:#5c656e;
  --signal:#0f6577; --signal-wash:#e1eff2; --signal-tint:#f1f7f8; --on-signal:#ffffff;
  --you:#a33a05; --you-wash:#fdeee2; --ok:#1d7a4e; --ok-wash:#e2f3ea; --bad:#c22b2f; --bad-wash:#fcebeb;
  --world:#5d6872; --world-wash:#eceff2; --ai-wash:#f2f6f7; --ai-edge:#cbd7da;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#4a3aa7; --v6:#d4558a;
  --stage:#14171c; --t1:#2c3e9e; --t3:#2aa3d8; --t5:#2bb53f; --t7:#e7ee31; --t10:#c8302a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1113; --raised:#15191c; --sunken:#0a0c0e; --border:#262c31; --strong:#626d76;
  --ink:#e8ecee; --muted:#b3bcc3; --faint:#929ca4;
  --signal:#4fb2c3; --signal-wash:#12272c; --signal-tint:#0f1c20; --on-signal:#0e1113;
  --you:#ffb07a; --you-wash:#3a2416; --ok:#4cc38a; --ok-wash:#12301f; --bad:#ff6f6c; --bad-wash:#3a1a1c;
  --world:#9aa7b2; --world-wash:#1d2328; --ai-wash:#182024; --ai-edge:#34434a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#9085e9; --v6:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1113; --raised:#15191c; --sunken:#0a0c0e; --border:#262c31; --strong:#626d76;
  --ink:#e8ecee; --muted:#b3bcc3; --faint:#929ca4;
  --signal:#4fb2c3; --signal-wash:#12272c; --signal-tint:#0f1c20; --on-signal:#0e1113;
  --you:#ffb07a; --you-wash:#3a2416; --ok:#4cc38a; --ok-wash:#12301f; --bad:#ff6f6c; --bad-wash:#3a1a1c;
  --world:#9aa7b2; --world-wash:#1d2328; --ai-wash:#182024; --ai-edge:#34434a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#9085e9; --v6:#d55181; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--raised)}
a{color:var(--signal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--raised);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:12px}
.brand h1{font:600 24px/1.2 var(--serif);margin:0}
nav.views{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav.views a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500;font-size:16px;display:inline-flex;gap:8px;align-items:center}
nav.views a svg{width:20px;height:20px}
nav.views a[aria-current="page"]{background:var(--signal-wash);color:var(--ink)}
nav.views a:hover{color:var(--ink)}
.save{font:14px var(--sans);color:var(--faint);white-space:nowrap}
.save.ok{color:var(--ok)} .save.warn{color:var(--you)}
main{padding-block:28px 80px}
h2{font:600 36px/1.15 var(--serif);margin:0 0 8px;text-wrap:balance}
h3{font-size:20px;font-weight:600;margin:0;line-height:1.3}
h4{font-size:17px;font-weight:600;margin:0}
.lede{color:var(--muted);max-width:72ch;margin:0 0 20px;font-size:19px}
.cap{font-size:15px;color:var(--faint)}
.tech{font:14px/1.45 var(--mono);color:var(--faint)}
.mono{font-family:var(--mono)}
.eyebrow{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:2px 10px;border-radius:999px;font:500 14px/20px var(--sans);border:1px solid var(--border);background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.w1{background:var(--signal-wash);color:var(--ink);border-color:transparent}
.chip.w2{background:var(--ok-wash);color:var(--ink);border-color:transparent}
.chip.w3{background:var(--you-wash);color:var(--ink);border-color:transparent}
.chip.w4{background:var(--world-wash);color:var(--ink);border-color:transparent}
.chip.parked,.chip.post,.chip.uns{background:transparent;color:var(--faint);border-style:dashed}
.chip.done{background:var(--ok);color:var(--on-signal);border-color:transparent}
.chip.open{background:var(--you-wash);color:var(--you);border-color:transparent;font-weight:600}
.chip.dec{background:var(--signal-wash);color:var(--ink);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 18px;border-radius:8px;border:1px solid var(--strong);background:var(--raised);cursor:pointer;font-weight:500;font-size:16px}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
input[type=search],input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--strong);border-radius:8px;padding:8px 12px;min-width:0;min-height:44px}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--signal)}

/* group colours */
.g0{--g:var(--world)} .g1{--g:var(--v1)} .g2{--g:var(--v3)} .g3{--g:var(--v4)} .g4{--g:var(--v2)} .g5{--g:var(--v6)}
.badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--g) 16%,var(--raised));color:var(--g);flex:none}
.badge .ico{width:28px;height:28px}
.badge.big{width:72px;height:72px;border-radius:20px}.badge.big .ico{width:40px;height:40px}

/* ---- process map ---- */
.map{background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:18px;overflow-x:auto}
.mapgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0 14px;min-width:1180px}
.grp{grid-row:1;border-top:5px solid var(--g);padding-top:8px;margin-bottom:14px}
.grp b{font-size:17px;display:block}
.grp span{font-size:15px;color:var(--faint)}
.node{grid-row:2;position:relative;text-align:left;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:11px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:236px;min-width:0}
.node:hover{border-color:var(--g)}
.node[aria-pressed="true"]{border-color:var(--g);background:color-mix(in srgb,var(--g) 7%,var(--raised));box-shadow:0 6px 18px color-mix(in srgb,var(--g) 22%,transparent)}
.node .num{font:600 15px var(--sans);color:var(--g)}
.node .nm{font-weight:600;font-size:clamp(16px,1.2vw,21px);line-height:1.15}
.node .what{font-size:15px;color:var(--muted);line-height:1.35}
.node .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.node .model-only{font:600 13px var(--sans);color:var(--you)}
.node .ct{font-size:14px;color:var(--faint)}
.node .ct b{color:var(--ink)}
.node:not(:last-child)::after{content:"";position:absolute;right:-13px;top:34px;border:6px solid transparent;border-left:8px solid var(--strong)}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--faint);line-height:1.1}
.stats span{display:flex;flex-direction:column}
.stats b{font-size:19px;color:var(--ink);font-weight:600}
.stats .o b{color:var(--you)} .stats .k b{color:var(--ok)}
.wbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.wbar i{display:block;height:100%}
.story{grid-row:3;margin-top:10px;font:15px/1.35 var(--serif);color:var(--ink);background:var(--sunken);border-radius:10px;padding:10px 12px;border-left:4px solid var(--g)}
.lane{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0 14px;min-width:1180px;margin-top:10px}
.lanebar{border-radius:10px;padding:10px 14px;font-size:16px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid transparent;text-align:left;background:var(--sunken)}
.lanebar b{font-weight:600;white-space:nowrap}
.lanebar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanebar[aria-pressed="true"]{border-color:var(--signal)}
.lane.ada .lanebar{background:var(--ai-wash);border-color:var(--ai-edge)}
.lane.met .lanebar{background:var(--you-wash)}
.lane.law .lanebar{background:var(--world-wash)}
.lane.ev .lanebar{background:var(--signal-wash)}
.lane .lanebar[aria-pressed="true"]{border-color:var(--ink)}
.legendrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:12px 0 0;font-size:15px;color:var(--muted)}
.legendrow i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* ---- stage detail ---- */
.panel{background:var(--raised);border:1px solid var(--border);border-radius:14px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel>.pb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.sthead{padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 24px;align-items:start;border-bottom:1px solid var(--border)}
@media (max-width:800px){.sthead{grid-template-columns:auto minmax(0,1fr)}.sthead .nav{grid-column:1/-1}}
.sthead h2{font-size:40px;margin:0}
.sthead .en{font:500 20px var(--sans);color:var(--faint);margin-left:10px}
.explain{font-size:20px;line-height:1.5;margin:10px 0 0;max-width:70ch}
.velis{display:flex;gap:14px;align-items:flex-start;margin:16px 0 0;padding:14px 18px;border-radius:12px;background:var(--sunken);border-left:5px solid var(--g);max-width:90ch}
.velis b{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--g);display:block;margin-bottom:2px}
.velis p{margin:0;font:18px/1.45 var(--serif)}
.flowrow{display:grid;grid-template-columns:minmax(240px,1fr) 40px minmax(0,2.3fr) 40px minmax(240px,1fr);gap:0;align-items:stretch;padding:24px}
@media (max-width:1100px){.flowrow{grid-template-columns:1fr}.flowrow .arr{transform:rotate(90deg);height:40px}}
.iobox{border-radius:12px;padding:16px;background:var(--sunken);display:flex;flex-direction:column;gap:6px}
.iobox .eyebrow{color:var(--g)}
.iobox p{margin:0;font-size:17px}
.arr{display:grid;place-items:center;color:var(--strong)}
.arr .ico{width:32px;height:32px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:2px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--raised);position:relative}
.tile .tn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font:600 15px var(--sans)}
.tile h4{font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.tile .marks{margin-top:auto;padding-top:6px}
@media (hover:hover){.tile .marks,.item .marks,.card .marks,.acard .marks{opacity:0;transition:opacity .12s}
 .tile:hover .marks,.tile:focus-within .marks,.item:hover .marks,.item:focus-within .marks,.card:hover .marks,.card:focus-within .marks,.acard:hover .marks,.acard:focus-within .marks,.marks.has{opacity:1}}
.tile.marked-keep,.item.marked-keep{border-color:var(--ok)} .tile.marked-change,.item.marked-change{border-color:var(--you)} .tile.marked-cut,.item.marked-cut{border-color:var(--bad)} .tile.marked-later,.item.marked-later{border-color:var(--world)} .tile.marked-discuss,.item.marked-discuss{border-color:var(--signal)}
.tile.marked-cut h4,.tile.marked-cut p{text-decoration:line-through;opacity:.7}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.item{border:2px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;background:var(--raised)}
.item .idc{font:500 14px var(--mono);color:var(--faint);white-space:nowrap;padding-top:3px}
.item .tx{font-size:17px;min-width:0}
.item .tx.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.q{background:color-mix(in srgb,var(--you) 5%,var(--raised))}
.item.q .idc{color:var(--you)}
.marks{display:inline-flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.mk{border:1px solid var(--border);background:var(--raised);border-radius:8px;font:500 14px var(--sans);padding:4px 10px;cursor:pointer;min-height:34px;color:var(--muted)}
.mk:hover{border-color:var(--strong);color:var(--ink)}
.mk[aria-pressed="true"].keep{background:var(--ok);color:var(--on-signal);border-color:var(--ok)}
.mk[aria-pressed="true"].change{background:var(--you);color:var(--bg);border-color:var(--you)}
.mk[aria-pressed="true"].cut{background:var(--bad);color:var(--on-signal);border-color:var(--bad)}
.mk[aria-pressed="true"].later{background:var(--world);color:var(--bg);border-color:var(--world)}
.mk[aria-pressed="true"].discuss{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
.mk.note[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
.notebox{grid-column:1/-1}
.quote{font-family:var(--serif);font-size:16px;color:var(--muted);border-left:3px solid var(--strong);padding-left:10px;margin-top:4px}
.more{background:none;border:0;color:var(--signal);cursor:pointer;font-size:15px;padding:0;min-height:32px}
.empty{color:var(--faint);font-size:16px;padding:6px 0;margin:0}
.ideaform{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:560px){.ideaform{grid-template-columns:1fr}}
details.builders{margin-top:20px}
details.builders>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;font-size:20px;font-weight:600}
details.builders>summary::-webkit-details-marker{display:none}
details.builders>summary .chev{transition:transform .15s}
details.builders[open]>summary .chev{transform:rotate(90deg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--raised);padding:6px 14px;cursor:pointer;font-size:15px;font-weight:500;min-height:40px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.planhead{font-size:16px;font-weight:600;margin-top:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* grades */
.grades{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grades{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.grades{grid-template-columns:1fr 1fr}}
.grade{border-radius:12px;padding:14px;background:var(--sunken);border-top:5px solid var(--gc);display:flex;flex-direction:column;gap:4px}
.grade b{font-size:18px}
.grade p{margin:0;font-size:15px;color:var(--muted);line-height:1.4}
.grade .ex{font:15px/1.4 var(--serif);color:var(--ink)}

/* ---- sociomapa ---- */
.cols{display:grid;gap:16px}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))} .c3{grid-template-columns:repeat(3,minmax(0,1fr))} .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1200px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.c4,.c3,.c2{grid-template-columns:1fr}}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.mvp{border-top:5px solid var(--signal)} .card.later{border-top:5px dashed var(--strong)}
.card p{margin:0}
.claim{font:600 19px/1.35 var(--serif)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:16px;margin:0}
.kv dt{color:var(--faint)} .kv dd{margin:0}
.section{margin-top:36px}
.section>h2{font-size:30px}
.readmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.readmap{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.readmap{grid-template-columns:1fr}}
.rm{background:var(--raised);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.rm svg{display:block;width:100%;height:auto;background:var(--stage)}
.rm div{padding:12px 16px}
.rm b{font-size:18px;display:block}
.rm p{margin:4px 0 0;color:var(--muted);font-size:16px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1200px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pstep{border:2px solid var(--border);border-radius:12px;background:var(--raised);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.pstep:hover{border-color:var(--strong)}
.pstep[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-tint);box-shadow:0 6px 18px color-mix(in srgb,var(--signal) 20%,transparent)}
.pstep .top{display:flex;align-items:center;gap:10px}
.pstep .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 16px var(--sans);flex:none}
.pstep.kept .n{background:var(--strong)}
.pstep .t{font-weight:600;font-size:18px;line-height:1.25}
.pstep .s{font-size:15px;color:var(--muted);line-height:1.35}
.pstep .tag{margin-top:auto}
.stepdetail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:1000px){.stepdetail{grid-template-columns:1fr}}
.bigplain{font-size:21px;line-height:1.5;margin:6px 0 14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
.cmp>div{padding:14px;font-size:16px}
.cmp>div:first-child{background:var(--sunken);border-right:1px solid var(--border)}
.cmp b{display:block;font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px}
.why{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:17px;padding:12px 14px;border-radius:10px;background:var(--you-wash)}
.demo{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}
@media (max-width:1000px){.demo{grid-template-columns:1fr}}
.mapbox{background:var(--stage);border-radius:14px;overflow:hidden;position:relative}

/* ---- waves ---- */

<script>
const PLANS = {"decision-brief": [{"id": "DB0", "done": false, "text": "The business Zadání as data: the eight parts (decision and goal; options and constraints; rule and risk; customers; data and uncertainties; execution and output; analyses, through analysis-frameworks; the model's parts), each with its source citation and the step it hands to; the decision core's fields and the model switch \"Potřebuje rozhodnutí výpočet?\"; revision-checked on the study's working copy (artifact-brief, working-copy-edit-ops); one fixture read by Python and TypeScript", "wave": "W1"}, {"id": "DB1", "done": false, "text": "Popis (board Z1): the one required field, files kept as the client's sources in the study's Vstupy folder (study-files#SF6), Ada's \"Co ještě pomůže\" suggestions; a missing file stays an open item and later becomes a wide-range assumption", "wave": "W2"}, {"id": "DB2", "done": false, "text": "Triage as an ordinary Lead turn (board Z2): the eight parts proposed with their sources, each accepted, edited or dropped (ADR 0026); options Ada adds marked as hers; every question that matters, ordered by importance, the first three open and the rest under \"Další otázky (n)\" (W2); each question's reason in words, never a crown amount (W3)", "wave": "W2"}, {"id": "DB3", "done": false, "text": "The decision core (board Z3): decision, owner, deadline and goal; options and constraints, which become the model's variants; the rule (measure, threshold, risk limit) recorded before the first computation, any change recorded and marked in the report (cost-model-study#CR7, M-4); objectives that each serve the decision; how certain the answer must be; the model switch, Ada proposing and the researcher confirming, the model steps shown only on yes (W4)", "wave": "W2"}, {"id": "DB4", "done": false, "text": "Readiness R1-R7 (board Z7): R1-R5 checked by code and holding the hand-off, R6-R7 the Lead's advice holding nothing; chips under the stage header, each opening its detail", "wave": "W2"}, {"id": "DB5", "done": false, "text": "The hand-off: what Data, Předpoklady, Model and Zpráva take over, each as a proposal, nothing overwritten; a later edit of Zadání offered to the steps downstream as a proposal", "wave": "W2"}, {"id": "DB6", "done": false, "text": "The journey: the fictional Velis brief from one sentence to its hand-off at 1440, 1100, 768 and 390 px on the scripted Lead; zero paid calls", "wave": "W3"}], "client-data-in-analysis": [{"id": "0", "done": false, "text": "Decide the evidence policy for a client's dataset columns (deferred by the owner, 2026-10-19), and settle ADR 0027's three open questions", "wave": "W1"}, {"id": "1", "done": false, "text": "The origin CLIENT_REPORTED and its fourth reading in origin_kind, every label reading it", "wave": "W1"}, {"id": "2", "done": false, "text": "The data contract as a type, and the route a person accepts it through (approval ledger)", "wave": "W1"}, {"id": "2a", "done": false, "text": "The data quality report the person accepts (W3, after 3a): missing, duplicate and out-of-range counts per used column over every row, versioned and hashed, shown before accept; a truncated reading cannot be accepted", "wave": "W1"}, {"id": "3", "done": false, "text": "The analysis copy holds only the columns the accepted contract names, each classified by a person; nothing personal stored for analysis or sent to a model", "wave": "W1"}, {"id": "3a", "done": false, "text": "A full-grid reader over the kept original bytes under stated analysis bounds, refusing by name above them, never a partial copy (W3, before 2a)", "wave": "W1"}, {"id": "3b", "done": false, "text": "The hash-verified accessor and the scope the client-data step runs under (W3)", "wave": "W1"}, {"id": "4", "done": false, "text": "Deterministic computations per shape: descriptive tables and benchmark gaps", "wave": "W3"}, {"id": "5", "done": false, "text": "Admission and the client-reported grade in domain/evidence, and the report's marks", "wave": "W3"}, {"id": "6", "done": false, "text": "A client's own survey: its own Sociomap through the existing engine, never merged", "wave": "PARKED"}, {"id": "7", "done": false, "text": "The Lead and the analysis modules see only admitted client-reported results, never rows", "wave": "W3"}, {"id": "8", "done": false, "text": "Brief materials pick a client dataset; `brief_signature` and `design_material` carry the source id and the contract version, with one fixture for Python and TypeScript", "wave": "W1"}, {"id": "9", "done": false, "text": "The client-data steps placed in the run: a graph node, a contract-version pin on the run, an impact root, and which run's report prints them; class and lineage for client-reported numbers sent to a model, the class gates enforcing in any deployment that holds a real client's data (ADR 0046 Q2, A4)", "wave": "W1"}, {"id": "8a", "done": true, "text": "W0 proposed Brief-material/signature interface and shared fixture; uploaded datasets remain ineligible until an accepted data contract exists", "wave": "W0"}, {"id": "10", "done": false, "text": "The data contract and its quality report accepted on the study's Data step (ADR 0046 W6, superseding D-37's Brief drawer); Zadání lists only the files it needs", "wave": "W1"}, {"id": "11", "done": false, "text": "A number from a client's document (a PDF contract or offer): Ada proposes it with its page, code checks it appears literally on that page (Deep Research's grounding rule), the researcher accepts each; one not found on its page refused by name (ADR 0046 W7)", "wave": "W2"}, {"id": "12", "done": false, "text": "An estimate from client rows (e.g. orders lost after a delay, from matched groups) as a Metodika method with its interval and row count, internal until the methodology owner registers it (ADR 0046 W8)", "wave": "W3"}], "deep-research-v2": [{"id": "DRV0", "done": false, "text": "The gate's three additions before a structured or archive route goes live: per-source rate limits (ARES 500 a minute), a robots.txt and text-and-data-mining reservation check before any fetch for mining, a retention limit on mined copies; each refusal named", "wave": "W1"}, {"id": "DRV1", "done": false, "text": "The typed input as a contract: value, unit, period, range, source, licence and as-of date, with the labelled Czech set (300+ sentences from annual reports, ČSÚ releases and price lists, two annotators) pinned as a fixture", "wave": "W2"}, {"id": "DRV2", "done": false, "text": "The rule-based extractor in code: the model proposes the concept and the period only; value and unit F1 >= 0.90 on the labelled set before it is used", "wave": "W2"}, {"id": "DRV3", "done": false, "text": "The extraction step between verify and synthesize: typed inputs extracted from accepted findings' quotes and from structured routes (public-data-routes), each accepted by a person before it reaches a model input (public_source) or a findings table", "wave": "W2"}, {"id": "DRV4", "done": false, "text": "Citation precision and recall in verify (a run shows accuracy and unsupported claims; recall is the method's tested level from the evaluation set, never a per-run number, ADR 0046 W11): DeepTRACE's citation accuracy and thoroughness, the judge calibrated on 100 human-labelled statement-source pairs (kappa reported), and a link-health check; targets accuracy >= 90 %, unsupported < 10 %, thoroughness >= 50 %", "wave": "W2"}, {"id": "DRV5", "done": false, "text": "Source credibility v2 (tiers named Úřední / Oborový / Ostatní, never A/B/C, ADR 0046 W9): declared (source, claim type) tables, a Code-of-Practice checklist for statistics, a review date and a four-year stale flag; a score proposed by a model refused", "wave": "W3"}, {"id": "DRV6", "done": false, "text": "Triangulation: each numeric claim decomposed into sub-questions, agreement or contradiction recorded per typed input, a person resolves a contradiction (macro-F1 measured on a labelled Czech set)", "wave": "W3"}, {"id": "DRV7", "done": false, "text": "As-of-date research: Memento TimeGate and Wayback CDX beside the Common Crawl index, a new 'as of' purpose; every archive finding carries its capture's own datetime within a declared tolerance", "wave": "W3"}, {"id": "DRV8", "done": false, "text": "Scheduled monitoring: structured series polled by their own update annotations (Eurostat UPDATE_DATA), pages at an estimated change rate, an alert only when an extracted value changes", "wave": "W4"}, {"id": "DRV9", "done": false, "text": "Precedents and case outcomes as a purpose: candidates only, each confirmed by a person; no outcome predicted", "wave": "UNSCHEDULED"}], "public-data-routes": [{"id": "PDR0", "done": false, "text": "The data source register as data: each source's legal status, cost, rate limit, licence, retention, and whether a field names a natural person, from the pivot research's § Data source register; read by RetrievalGate, never by a model", "wave": "W1"}, {"id": "PDR1", "done": false, "text": "SDMX: Eurostat and the ECB Data Portal as one route family; the model proposes a query key, code fetches, every admitted value byte-equal to the API's response; recorded doubles and golden responses pinned by hash", "wave": "W2"}, {"id": "PDR2", "done": false, "text": "ČNB: the daily fixing and ARAD series, within ČNB's limit on automated access", "wave": "W2"}, {"id": "PDR3", "done": false, "text": "GLEIF: entity and ownership matching (its licence confirmed first)", "wave": "W2"}, {"id": "PDR4", "done": false, "text": "EU TED: procurement notices and awards", "wave": "W2"}, {"id": "PDR5", "done": false, "text": "ISVZ open data live: isvz-notice-1 from recorded to a live route; NEN data behind its login never collected, refused by name", "wave": "W2"}, {"id": "PDR6", "done": false, "text": "ARES extended (firm counts by NACE, counterparty checks) and the commercial register's open data (dataor.justice.cz); fields that name a natural person wait for register-personal-data RPD1-RPD2", "wave": "W2"}, {"id": "PDR7", "done": false, "text": "Sbírka listin financial statements: PDF and XHTML read with located segments (client_sources' readers), both Czech P&L layouts, every extracted value reviewed by a person before use; the review's cost measured, which decides PDR10", "wave": "W3"}, {"id": "PDR8", "done": false, "text": "VIES: a one-off VAT validation, the answer never stored or retransmitted", "wave": "W2"}, {"id": "PDR9", "done": false, "text": "ČÚZK REST API-KN after registration (the owner registers), parcels as a high-value dataset; the paid WSDP outputs priced on the tool-cost ledger", "wave": "W3"}, {"id": "PDR10", "done": false, "text": "Commercial structured data (Merk, Cribis, MagnusWeb, Orbis, Creditinfo): the owner's buy-or-build decision from PDR7's measured cost; nothing contracted by this plan", "wave": "UNSCHEDULED"}], "register-personal-data": [{"id": "RPD0", "done": false, "text": "The processing record for named natural persons taken from public registers: purpose, legal basis (legitimate interest), the balancing-test template, retention, recipients; written with the legal counsel the owner names, before any such field reaches a study", "wave": "W1"}, {"id": "RPD1", "done": false, "text": "Which register fields name a natural person (ARES statutory bodies, the commercial register's officers and owners, sole traders), as data in the source register (public-data-routes PDR0); those fields withheld until RPD2 passes", "wave": "W1"}, {"id": "RPD2", "done": false, "text": "The balancing test as an approval-ledger subject (a migration admits it to ApprovalSubject before its writer): per client and source, recorded by a person, read before a withheld field is released to a study", "wave": "W2"}, {"id": "RPD3", "done": false, "text": "Art. 14 notices: where a notice is owed, its record; where an exemption applies, the reason recorded; both on the approval ledger", "wave": "W2"}, {"id": "RPD4", "done": false, "text": "Retention and erasure of register-derived personal data through study-data-lifecycle's delete path, with the horizons RPD0 sets", "wave": "W3"}, {"id": "RPD5", "done": false, "text": "Minimisation: a field naming a person never sent to a model unless RPD0's record allows that use, Class A by rule (material_rules), masked on screen as client_datasets masks personal columns", "wave": "W2"}], "legal-context": [{"id": "LGL0", "done": false, "text": "Scope and the disclaimer, written with the legal counsel the owner names: what AIA flags (tax, contract and employment law; Czech and EU), the report's \"not legal advice\" text, the researcher's acceptance of each legal point; recorded before any legal point reaches a study", "wave": "W1"}, {"id": "LGL1", "done": false, "text": "e-Sbírka and EUR-Lex as gate routes (public-data-routes): a provision fetched by its identifier in the version in force on a stated date, captured content-addressed, its licence and rate limits in the source register", "wave": "W2"}, {"id": "LGL2", "done": false, "text": "The legal point as a type: the law, the provision, the version date, the verbatim quote and its snapshot hash; a quote must be literally in the captured provision (Deep Research's grounding rule)", "wave": "W2"}, {"id": "LGL3", "done": false, "text": "Legal parameters and constraints: a point becomes a Předpoklady parameter (corporate tax rate, depreciation groups and methods, VAT, minimum wage, overtime premium, notice periods) or a Model constraint, each accepted by the researcher; the after-tax view (cost-model-study#CM7) reads them", "wave": "W3"}, {"id": "LGL4", "done": false, "text": "Version watch: a study's legal points re-checked against the version in force at the report's date; a changed provision marks the results that depend on it stale (deep-research-v2 DRV7, DRV8)", "wave": "W3"}, {"id": "LGL5", "done": false, "text": "The legal point in the report outline and the report: a kind and a grade of its own, the disclaimer printed wherever one is used", "wave": "W3"}, {"id": "LGL6", "done": false, "text": "The journey: the fictional Velis study's after-tax view from the cited corporate tax rate and depreciation provisions, and a notice period as a timing constraint, on recorded doubles; zero paid calls", "wave": "W4"}], "cost-model-study": [{"id": "CP1", "done": false, "text": "Platform types: Quantity (Amount, Rate, Count, Ratio, Duration; Decimal, currency, period), Input with its provenance (client_dataset, stated, public_source; research_result declared and refused until built), Scenario, the Model Revision envelope and its canonical hash; reject-not-coerce validation", "wave": "W2"}, {"id": "CP2", "done": false, "text": "The model-type contract, composable (ADR 0046 W17): one cash-flow model whose line items come from a closed set of kinds (PŘÍJEM, KAPITÁL, FIXNÍ, VARIABILNÍ, JEDNORÁZOVĚ, with capacity and timing rules) and whose formulas come from a closed vocabulary, Ada proposing items and the researcher accepting; templates as data (cost scenarios first); ModelTypeSpec kept for a template's results with each output's grade, charts, report blocks and proposal operations; the registry, a run's pin of template id and version; the determinism test harness", "wave": "W2"}, {"id": "CP3", "done": false, "text": "The model inside the one study and its working copy (ADR 0046 decision 3, A2 \"One merged study\": no StudyKind.BUSINESS_MODEL): a model content kind on the research study's owned working project (revision-checked saves, the operation log), present only when Zadání says a model is needed, and the immutable Model Revision", "wave": "W2"}, {"id": "CP4", "done": false, "text": "Data bindings: an input from a dataset's analysis copy under its accepted contract (sum, count, mean over a stated filter and period), admitted CLIENT_REPORTED with MQ-18's support, the contract version and copy SHA-256 pinned", "wave": "W2"}, {"id": "CP5", "done": false, "text": "The run: workflow type business_model (prepare, compute, report), inputs frozen by artifact id and SHA-256, a known 0.00 USD ceiling for a CALCULATED type, results stored as artifacts; the ledger subject business_model for a submitted revision", "wave": "W2"}, {"id": "CP6", "done": false, "text": "The API: /studies/{id}/model content, revisions, submit, runs, results; study-scoped, refused for any other kind; the client page's count", "wave": "W2"}, {"id": "CP7", "done": false, "text": "The web platform: the model steps inside the one study (ADR 0046 decision 3; no \"Modely\" area, Q8 superseded), the model type chosen in Zadání, Data, Předpoklady, Model and Výsledky in the study's stage track (research-findings-stage FND1); Data (each dataset's contract state) and Předpoklady (every input with unit and provenance, edited in place) generic over the type's schema", "wave": "W2"}, {"id": "CP8", "done": false, "text": "The report frame and grades: PrintGrade CALCULATED (výpočet) and its admission beside admit_numeric_claims, and the one table mapping every grade to its Czech label and admission rule (the code's grades kept, CALCULATED and ESTIMATED added, the researcher's labelled judgement a grade of its own; ADR 0046 Q1; a grade follows its method, not its inputs, W21; a public source, a labelled judgement and a cited legal provision in the same table, W10, W19, W22; every headline the median with its 90 % interval, the base case only as v základu, W20), the platform template frame (question, type blocks, inputs table, method, sources), report kind business_model approvable through approve_report, three chart kinds (absolute stacked bar, tornado, line with marked points) in the model and the renderer", "wave": "W2"}, {"id": "CP9", "done": false, "text": "The Lead: lead_artifacts rows for the five stages, a model read tool, MaterialRule.BUSINESS_MODEL (Class A), per-change proposal operations generic over a type's declared operations, accepted through the Lead's edit path", "wave": "W2"}, {"id": "CM1", "done": false, "text": "Cost scenarios as the composable model's first template (ADR 0046 W17), its types: Driver (input, or a × b / a ÷ b), the four cost-line kinds (FIXED, VARIABLE, STEP, CAPITAL annuity), at most twelve scenarios (Q4, raised 2026-10-30); registered as model type cost_scenarios v1", "wave": "W2"}, {"id": "CM2", "done": false, "text": "Cost scenarios, compute: totals per year, exact break-even on one driver in a stated range (where the driver enters through one monotone form, else refused by name), one-way sensitivity, cumulative cost over N stated years with capital in year 0 and the payback year; unknown propagated by name; the warehouse golden fixture", "wave": "W2"}, {"id": "CM3", "done": false, "text": "Cost scenarios, the Model stage: lines, drivers and scenarios edited in place (input standard I1-I11)", "wave": "W2"}, {"id": "CM4", "done": false, "text": "Cost scenarios, charts: scenario comparison stacked by line, cumulative cost with the payback year, break-even lines with the crossing marked, the sensitivity tornado; the same drawing on Výsledky and in the DOCX", "wave": "W2"}, {"id": "CM5", "done": false, "text": "Cost scenarios, report blocks and method text", "wave": "W2"}, {"id": "CM6", "done": false, "text": "The journey: the warehouse case as fictional inputs (24 months), AC-16 over HTTP and a browser journey from upload to the approved report, ESTIMATED in the client report labelled as awaiting registration, its approval warning recorded (ADR 0046 W27); zero paid calls without the Lead", "wave": "W2"}, {"id": "CM7", "done": false, "text": "NPV of each scenario's costs and discounted payback at the study's one declared discount rate (CALCULATED), before and after tax, the rule reading the one Zadání names and the other shown beside it; tax rate and depreciation from legal-context#LGL3 (ADR 0046 W16, W18)", "wave": "W2"}, {"id": "CP10", "done": false, "text": "The ESTIMATED grade on the platform: interval or percentiles, seed and method version pinned, results stored, the rerun-equals-bytes test; the method register (internal until A. Bahbouh's entry approves); the Metodika module 'Nákladové modely' holding every default as written (final, Q13), versioned, pinned per run", "wave": "W3"}, {"id": "CR1", "done": false, "text": "Data checks before use: reconciliation across files and against stated totals, period coverage and currency, robust outlier flags, seasonality only with two cycles; accepted by the person as part of the binding; missing stays missing", "wave": "W3"}, {"id": "CR2", "done": false, "text": "Ranges: low / base / high and a guarantor on every input, a person at the client, a value fixed by contract fixed unless the contract allows a change (ADR 0046 W15), the discount rate a fixed study parameter with its guarantor and the verdict shown at other rates (W16); exact range of every total by vertex enumeration over closed STEP cells (each end with that cell's step count, one-sided limits included), only where code verifies every input enters through one monotone form (else range_not_exact, cap 2^14); dominance, and the inputs that flip the ranking with their flip values", "wave": "W3"}, {"id": "CR3", "done": false, "text": "Monte Carlo (ESTIMATED): each input's distribution by its source, a client-data estimate its own distribution, a person's range PERT, people who disagree a mixture (ADR 0046 W14); correlations Ada proposes in a Souvislosti table with a strength and a reason, each accepted by the researcher, independence stated (W13), by Iman-Conover, a non-PSD matrix refused; PCG64 under the run's seed; five-stream convergence check; P(A cheaper than B) with its standard error and the 90 % interval of the difference", "wave": "W3"}, {"id": "CR4", "done": false, "text": "Global sensitivity (ESTIMATED): Sobol first-order and total (Jansen, bootstrap intervals) for independent inputs, partial rank correlation when inputs are correlated, beside the tornado", "wave": "W3"}, {"id": "CR5", "done": false, "text": "Backtested forecasts (ESTIMATED): naive, seasonal naive, drift and Holt-Winters additive; rolling-origin backtest scoring the candidate and the baseline on the same held-out origins; a forecast whose held-out MAE is not strictly below the baseline's not used, said in words; MASE and MAPE reported, not the gate; its errors become the volume input's range and distribution", "wave": "W3"}, {"id": "CR6", "done": false, "text": "Value of information (ESTIMATED): EVPPI per input from the Monte Carlo draws; an input marked measurable by a survey with material EVPPI offers the Výzkum path, a research study proposed with its question, nothing started", "wave": "W3"}, {"id": "CR7", "done": false, "text": "The decision rule (Z3): the person's own rule, stated before the data (option, quantity, threshold, optionally the confidence needed), judged as written; the default confidence 0.90 / 0.10 only when the rule names none, said on the page; no rule, no recommendation (R2); dominance beside it; internal until the Monte Carlo method is registered", "wave": "W3"}, {"id": "CR8", "done": false, "text": "The method on screen: the data-check review on Data; on Výsledky the range table, dominance and flip inputs, the probability and zone, the difference's distribution, the Sobol or rank-correlation bars, the forecast with its backtest, the value-of-information table; every ESTIMATED value marked odhad (interní) until registered", "wave": "W3"}, {"id": "CR9", "done": false, "text": "The method in the report: blocks for each layer, a method appendix naming each method's id, version and register status, the client report carrying only CALCULATED and registered ESTIMATED numbers", "wave": "W3"}, {"id": "CS1", "done": false, "text": "The properties table: objects are the run's scenarios; properties are chosen results (CALCULATED or ESTIMATED refs) and stated scenario attributes, each with declared scale extremes and direction", "wave": "W3"}, {"id": "CS2", "done": false, "text": "The objects × properties fuzzy matrix (new FuzzySource): Euclidean, Manhattan or correlation similarity after scale extremes, converted to 0-1 by the registered rule; checked against SOMECS Input fig. 6", "wave": "W3"}, {"id": "CS3", "done": false, "text": "Layout and fit: the H-Model candidate or the -5 layout (A. Bahbouh's choice), Spearman accuracy, significance through sociomapping-engine 2c; results stored, the rerun equal in bytes", "wave": "W3"}, {"id": "CS4", "done": false, "text": "The WIND height on the layout: one chosen property, the surface from sociomapping-engine 4b with the registered exponent, radius and grid; ESTIMATED, internal until registered", "wave": "W3"}, {"id": "CS5", "done": false, "text": "The map on Výsledky and in the report: the WIND view from sociomapping-engine 11, the property chosen as height, fit and its significance, odhad (interní) until registered; beside a linked survey's respondent map, never merged", "wave": "W3"}, {"id": "CR10", "done": false, "text": "The method validation pack: each method against its published reference as tests (Ishigami, PERT moments, Iman-Conover, MASE, a closed-form EVPPI), and the report the method owner signs", "wave": "W3"}], "quantitative-families": [{"id": "ACC1", "done": false, "text": "The chart-of-accounts mapping in a dataset's data contract: each account to a statement line and sign, period and currency per column", "wave": "W3"}, {"id": "ACC2", "done": false, "text": "Statements: profit and loss and balance sheet from a trial balance or ledger export through the mapping; balance checks refused by name", "wave": "W3"}, {"id": "ACC3", "done": false, "text": "Ratios: a closed, defined list (liquidity, leverage, margins, turnover), each with its formula and a division by zero named", "wave": "W3"}, {"id": "ACC4", "done": false, "text": "Budget against actual: variance per line, with price, volume and mix decomposition where the contract declares quantities", "wave": "W3"}, {"id": "ACC5", "done": false, "text": "Accounting stages, charts and report blocks", "wave": "W3"}, {"id": "FIN1", "done": false, "text": "The cash-flow schedule: flows by year with a stated discount rate and horizon", "wave": "W3"}, {"id": "FIN2", "done": false, "text": "IRR (a stated root rule; several or no roots refused by name) over the MVP's NPV and payback, extended to any cash-flow schedule", "wave": "W3"}, {"id": "FIN3", "done": false, "text": "Scenarios and one-way sensitivity on NPV and IRR, reusing cost scenarios' machinery", "wave": "W3"}, {"id": "FIN4", "done": false, "text": "Pricing break-even: contribution margin, units and revenue to break even", "wave": "W3"}, {"id": "FIN5", "done": false, "text": "Price elasticity fitted from the client's price and volume data (ESTIMATED; its method owner's register entry)", "wave": "W3"}, {"id": "FIN6", "done": false, "text": "Finance stages, charts and report blocks", "wave": "W3"}, {"id": "OR1", "done": false, "text": "EOQ and reorder point (CALCULATED); safety stock from a stated demand deviation (CALCULATED) or one fitted from data (ESTIMATED)", "wave": "W3"}, {"id": "OR2", "done": false, "text": "Linear optimisation: variables, constraints and an objective as typed elements; HiGHS pinned through scipy; the optimum, binding constraints and shadow prices in words; infeasible and unbounded as named results", "wave": "W3"}, {"id": "OR3", "done": false, "text": "Demand forecasting as a model type of its own, on the MVP's backtested methods (cost-model-study CR5), for any demand series", "wave": "W3"}, {"id": "OR4", "done": false, "text": "Monte Carlo, global sensitivity and value of information on any CALCULATED type, generalising the MVP's (cost-model-study CR3, CR4, CR6)", "wave": "W3"}, {"id": "OR5", "done": false, "text": "Operations research stages, charts and report blocks", "wave": "W3"}, {"id": "MKT1", "done": false, "text": "The research_result provenance: one admitted claim of an approved research run of the same client, carrying its own grade (modelled under ADR 0024), its run, ref and artifact SHA-256", "wave": "PARKED"}, {"id": "MKT2", "done": false, "text": "TAM, SAM and SOM top-down as a chain of inputs, each step its own label, the chain printing the weakest", "wave": "W3"}, {"id": "MKT3", "done": false, "text": "Bottom-up from a survey's admitted share × a population count (research_result), its interval carried, labelled modelováno", "wave": "PARKED"}, {"id": "MKT4", "done": false, "text": "A market-sizing Deep Research purpose (an ADR 0021 amendment): queries from a person's Class B focus, never from the model; findings enter only as public_source", "wave": "W3"}, {"id": "MKT5", "done": false, "text": "Market-sizing stages, charts and report blocks", "wave": "W3"}, {"id": "LINK1", "done": false, "text": "The survey beside a model: a model revision cites one approved research run of the same client, and its report gains the run's approved map snapshot and admitted key numbers as a chapter, never combined into a model number", "wave": "PARKED"}], "analysis-frameworks": [{"id": "AF0", "done": false, "text": "The catalogue as data: every framework with its id, group, the question it answers, how it is produced (computed by code, cited Deep Research points, synthesis, named experts), its inputs (client data, Deep Research, experts), its grade, its report outline chapter kind and its MVP flag; versioned, one fixture read by Python and TypeScript; a framework point is a typed reference (an accepted finding, an admitted client-data claim, a model result, an expert's score) or the researcher's own judgement, labelled with its grade and author (ADR 0046 A3), never unlabelled free text (W1)", "wave": "W1"}, {"id": "AF1", "done": false, "text": "The default sets: decision type to the frameworks Ada proposes, as data the owner approves; the Lead proposes a set with one reason per framework, the researcher accepts per change (ADR 0026); a framework that needs register fields naming persons is never proposed before its balancing test (W2)", "wave": "W2"}, {"id": "AF2", "done": false, "text": "The Zadání picker (prototype board Z4): the groups, a toggle per framework, what each needs, the Deep Research cost ceiling of the selection, the report outline chapters and the expert forms it creates; saved on the study's working copy; post-MVP frameworks shown and disabled (W2)", "wave": "W2"}, {"id": "AF3", "done": false, "text": "The selection drives Deep Research: each framework that needs research becomes subjects of the Design Research plan, its ceiling pinned at enqueue; a deselected framework takes its subjects out of the next run (W2, after deep-research-v2 DRV0)", "wave": "W2"}, {"id": "AF4", "done": false, "text": "The selection drives the model: each computed framework switches on its view on Výsledky (Finance, Účetnictví, Provoz, Logistika, Trh) through cost-model-study and quantitative-families; a framework whose data contract is missing says which file it waits for (W3)", "wave": "W3"}, {"id": "AF5", "done": false, "text": "The selection drives the experts: each expert-scored framework (the Blue Ocean strategy canvas, the risk register, RACI, the architecture frameworks) creates a scoring form for named raters, through situation-reports EX1's expert panel (W3)", "wave": "W3"}, {"id": "AF6", "done": false, "text": "The selection drives the report outline: each framework a chapter or a part of one, with its point slots (SWOT's four quadrants, PESTEL's six factors, Porter's five forces); a point without a resolving source link is refused (research-findings-stage FND2) (W2)", "wave": "W2"}, {"id": "AF7", "done": false, "text": "Logistics frameworks: cost-to-serve, make-or-buy and 3PL total cost of ownership, network and warehouse location (centre of gravity), service level and OTIF, transport cost by zone, warehouse sizing, each computed by code from client data under its contract and public inputs (W3)", "wave": "W3"}, {"id": "AF8", "done": false, "text": "Corporate governance and enterprise architecture frameworks: ownership and group structure (after register-personal-data RPD2), RACI, risk management (COSO ERM, ISO 31000), compliance obligations, internal control; the capability map, current and target state with the gap, systems and data flows, the operating model; expert-scored or cited, never written by a model (W3)", "wave": "W3"}, {"id": "AF9", "done": false, "text": "The journey: a fictional study picks its frameworks in Zadání and gets a report outline with SWOT, PESTEL, Porter, TAM/SAM/SOM and cost-to-serve chapters, every point linked to its source; recorded doubles, zero paid calls (W4)", "wave": "W4"}, {"id": "AF10", "done": false, "text": "After the MVP: the portfolio frameworks (Ansoff, BCG, GE-McKinsey, VRIO, value chain, McKinsey 7S) enabled in the picker", "wave": "POST"}], "sociomapa-systemu": [{"id": "SYS0", "done": false, "text": "The methodology owner's ten questions (the pivot research's § Questions for the methodology lead) sent to A. Bahbouh as one message with each recommendation, with the SOMECS name and the published method's licence for him to check (ADR 0046 Q4); each answer recorded here as it comes; no replaced statistic built before its answer", "wave": "W1"}, {"id": "SYS1", "done": false, "text": "The synthetic validation suite, generators only: null worlds (independent random walks, AR(1) at 0.3, 0.7 and 0.95, seasonal series with no cross-relation), known factors (12 KPIs from 3 factors), a sparse VAR(1), contamination (10 % outliers, one level shift), compositional shares, 40 units × 10 drivers, 800 scenarios × 7 options from a cost model with a known Iman-Conover correlation; 1,000 seeded replicates at T or n 24, 36, 60, 120; fixtures pinned by SHA-256 like F1-F9", "wave": "W1"}, {"id": "SYS1b", "done": false, "text": "The suite run over today's -5 statistics, as the baseline the replacements are judged against; the spike's three sets (36 × 12, 40 × 10, 800 × 7) re-run with planted ground truth and its script committed", "wave": "W1"}, {"id": "SYS2", "done": false, "text": "Declared preprocessing per variable before results are seen: unit, transformation (log, log-ratio for shares), detrend or difference, deseasonalise only with two cycles, robust standardisation; reported beside every relation (answers 2, 6)", "wave": "W2"}, {"id": "SYS3", "done": false, "text": "The relation statistic: Pearson on the transformed series, or a skipped correlation where outliers are flagged, fixed before results are seen (answer 6)", "wave": "W2"}, {"id": "SYS4", "done": false, "text": "The baseline: per-variable surrogates (IAAFT by default) after detrending, checked to reproduce each series' autocorrelation; for scenarios, the imposed input correlation (answer 5)", "wave": "W2"}, {"id": "SYS5", "done": false, "text": "Pair floors replaced by an autocorrelation-adjusted effective-sample-size floor, the formula and the floor from the synthetic power curves (answer 3)", "wave": "W2"}, {"id": "SYS6", "done": false, "text": "Multiple testing: Benjamini-Yekutieli by default, q and the method reported; a resampling-calibrated FDR only on the methodology owner's approval after the suite (answer 1)", "wave": "W2"}, {"id": "SYS7", "done": false, "text": "Credibility: a block bootstrap of rows (block length declared) with Procrustes-aligned displacement per object in place of split-half; stability only, no intervals, below the minimum length (answer 4); for the scenario map no block bootstrap: stability across seeds and assumptions, with and without each future's mean (ADR 0046 decision 5)", "wave": "W2"}, {"id": "SYS8", "done": false, "text": "Fit beside the layout: stress-1 and stress per point against a random-data benchmark and a permutation test; the layout, terrain and determinism unchanged", "wave": "W2"}, {"id": "SYS9", "done": false, "text": "The scenario mode: rows a model's Monte Carlo scenarios (>= 800, cost-model-study CR3), the imposed correlation as the baseline, grade MODELLED, the claim 'in this model, A and B move together'; consumed by cost-model-study CS1-CS5", "wave": "W3"}, {"id": "SYS10", "done": false, "text": "The expert mode: options or competitors scored by named people on criteria, grade MODELLED with the inputs stated; consumed by situation-reports EX1-EX2", "wave": "W3"}, {"id": "SYS11", "done": false, "text": "The unit and period modes, only after the suite passes at the methodology owner's thresholds (answer 7): units placed with density above a stated n, periods as a trajectory, failing edges not drawn, regimes only from a declared break; ESTIMATED, INTERNAL_ONLY until registered", "wave": "W4"}, {"id": "SYS12", "done": false, "text": "Each mode a Metodika register entry of its own (ADR 0023), INTERNAL_ONLY until approved; the never-claim list as copy on screen and in the report; the name Sociomapa systémů, never SOMECS, and A. Bahbouh's check of the name and the published method's licence recorded before any client reads it (ADR 0046 Q4, A12)", "wave": "W4"}], "situation-reports": [{"id": "SR0", "done": false, "text": "ADR 0045 accepted; the legal counsel who approves the terms library (Q18) named", "wave": "W2"}, {"id": "RC1", "done": false, "text": "Chapter kinds and the outline: a registry of versioned chapter kinds, ReportOutline, the four recipes as preset outlines composed byte for byte as today; generalises cost-model-study CP8's frame", "wave": "W3"}, {"id": "EX1", "done": false, "text": "Expert scoring: an expert panel (named experts, role, internal or the client's), a scoring form over objects × criteria with scale extremes and direction, the expert_rating provenance, aggregation by the registered weights and discrepancy threshold; a missing score stays missing", "wave": "W3"}, {"id": "EX2", "done": false, "text": "The somecs_expert model type on ADR 0044's platform, reusing cost-model-study CS2-CS5 (fuzzy matrix, layout and fit, WIND, view) with criteria as properties", "wave": "W3"}, {"id": "RC2", "done": false, "text": "The outline proposed by the Lead and approved by a person (ledger subject report_outline), per change", "wave": "W4"}, {"id": "RC3", "done": false, "text": "Chapters across studies of one client: artifacts pinned by id and SHA-256, another client's refused, every source in the manifest", "wave": "W4"}, {"id": "RC4", "done": false, "text": "Fixed method texts as versioned data, signed by the methodology owner; a report pins the versions it printed", "wave": "W4"}, {"id": "RC5", "done": false, "text": "Contract parties and terms: the client profile's registration fields (Class A), the organization's own, a terms text library approved as Q18 decides", "wave": "W4"}, {"id": "RC6", "done": false, "text": "New chapter kinds: segment profiling and prioritisation, competitor profiles (Deep Research, cited), phased strategy, risks with mitigation, KPI framework; every number a ref, prose through the writer and the sentence check", "wave": "W4"}, {"id": "EX3", "done": false, "text": "SOMECS's native output table (Incons, Cons, Asymm, Card, Card*, S(i), S(i)_Sd, d(i), Hm(i)) once each has a register entry with its formula; export E10 as the check", "wave": "W4"}, {"id": "MM1", "done": false, "text": "Bulk maps: one stored snapshot per height variable of a model, coded labels with their key, an appendix without comment", "wave": "W4"}, {"id": "MM2", "done": false, "text": "Cut-out maps (výřezové): zooms on regions or coherence groups chosen by the registered selection rule, each commented where cited", "wave": "W4"}, {"id": "FW1", "done": false, "text": "Imported fieldwork: the origin Q17 decides, a questionnaire's answers imported under a data contract and mapped to the study's design items, MQ-18's survey rule, its own Sociomap, never merged with the AI panel", "wave": "UNSCHEDULED"}], "research-findings-stage": [{"id": "FND0", "done": false, "text": "The report outline (Osnova zprávy) as data, and the ADR it needs: the report's structure (chapters and sections in the report's own order) where each section holds points, not prose; a point is a claim or a number with its kind (finding, data point, method point, conclusion, recommendation), its visual (table, graph, process diagram, map or none) and its provenance link; the stage after Sociomapa and before Zpráva on the study's working project (revision-checked saves); a stop as a named checkpoint the researcher closes; the ADR 0026 decision-4 record for this new kind of report material (W1, a contract before any code)", "wave": "W1"}, {"id": "FND1", "done": false, "text": "The one study's stage track (ADR 0046 decision 3, A2 \"One merged study\"): the canvas's nine steps in five groups (Zadání; Data, Rešerše, Předpoklady; Model; Výsledky, Sociomapa; Osnova zprávy, Zpráva), the model steps shown only when Zadání says a model is needed; the survey stages (Dotazník to Analýza) left out of new studies and read-only on a study that holds survey content or runs, the routes refusing a write by name (survey_lane_frozen), nothing deleted before the lane is archived (mvp-master-plan#MP19)", "wave": "W1"}, {"id": "FND2", "done": false, "text": "The provenance link: every number and claim in the report outline is a hyperlink to what stands behind it, resolved by code from stored ids: a Deep Research finding's quote in its captured snapshot, a typed value and its route response, a client dataset's column under its accepted contract version, a model run's result and its method entry in Metodika, a map and its method; a point whose link does not resolve shows as unverified and cannot reach Zpráva", "wave": "W1"}, {"id": "FND3", "done": false, "text": "Findings in: every accepted Design Research and Interpretation Research finding and every typed value (deep-research-v2 DRV3) offered as a point; the researcher's check per finding (kept, set aside, needs checking) recorded in the approval ledger, never changing the sealed bundle; a point whose source is set aside goes stale, named", "wave": "W2"}, {"id": "FND4", "done": false, "text": "Tables: built from accepted points, every cell a ref with its link, units and periods carried; never a number written by a model or typed without a source", "wave": "W2"}, {"id": "FND5", "done": false, "text": "Graphs from those tables (bar, line, stacked, scatter), drawn with the viz tokens, every mark linked to its point; the same drawing on screen and in the DOCX (report_docx charts)", "wave": "W2"}, {"id": "FND6", "done": false, "text": "Process diagrams and other visuals: a registry of visual kinds; a process diagram as typed data (steps, actors, decisions, flows) edited in place (input standard I1-I11), each element that states a fact linked to its point; rendered as SVG in the stage and the report", "wave": "W2"}, {"id": "FND7", "done": false, "text": "The Lead in the stage: it reads the report outline, the findings and the data through its read tools, proposes the outline, a point, a visual or a move per change, and a person accepts (ADR 0026); a paid lookup only through the card (lead-orchestration)", "wave": "W2"}, {"id": "FND8", "done": false, "text": "Stops: the researcher opens, names and closes each; the closed stops are what Zpráva receives; reopening one marks the report draft stale and names the points that moved; an unverified point holds the hand-off until its source is found or it is removed (ADR 0046 W25)", "wave": "W2"}, {"id": "FND9", "done": false, "text": "Zpráva written from the report outline: the report's prose around the closed points in the same outline, every printed number and claim keeping its provenance link (with artifact-report RPT8a's tagged content controls); the report states no point the report outline does not hold, checked before approval; an external finding labelled as external context; Czech in the MVP, English after (ADR 0046 W28)", "wave": "W3"}, {"id": "FND10", "done": false, "text": "The Sociomapa stage, before the report outline: the scenario map (cost-model-study CS1-CS5) when the study has a model, an expert map (situation-reports EX1-EX2), or a unit or period map once sociomapa-systemu SYS11 passes; its option clusters and hedges (ADR 0046 A6) offered to the report outline as points with their method link", "wave": "W3"}, {"id": "FND11", "done": false, "text": "The journey: a fictional research study from the brief to an approved report through a report outline holding one table, one graph, one process diagram and an expert map, every link resolving, over recorded Deep Research; zero paid calls", "wave": "W4"}, {"id": "FND12", "done": false, "text": "The shared review (ADR 0046 W26): a closed stop shared with the client's decision-makers as a read-only page (points, visuals, sources), their comments and agreement recorded on the approval ledger (a subject admitted by migration before its writer); optional, the report then written from it", "wave": "W3"}], "diagrams": [{"id": "DG0", "done": false, "text": "The spike, before any dependency is added: every MVP visual type in the coverage table below rendered server-side through its proposed engine, on fictional data, with IBM Plex, the design tokens' palette and Czech number formats (7,2 %, 41 000); bytes equal on a second render; each engine's licence and the map boundaries' data licence read and recorded; all six stacks are in the MVP (ADR 0046 A13, \"All six in MVP\"), so the spike proves each for its types and reports a type it cannot render, never dropping a stack (no product code, zero paid calls)", "wave": "W1"}, {"id": "DG1", "done": false, "text": "The visual as a type: kind (chart, diagram, table, framework template), engine, spec, a source reference on every element that states a fact or a number, alt text and long description, spec version; validated per engine (the Vega-Lite and Vega schemas, the Mermaid parser, bpmn-moddle against BPMN 2.0, the template's own schema) before anything is shown; one fixture read by Python and TypeScript", "wave": "W1"}, {"id": "DG2", "done": false, "text": "The renderer in the worker: deterministic SVG and PNG from a stored spec (vl-convert for Vega-Lite and Vega; Graphviz; a pinned headless renderer for Mermaid, bpmn-js and ECharts, refused by name when absent); fonts and palette from the tokens; stored as artifacts keyed by the spec's hash; the same spec renders the same bytes", "wave": "W2"}, {"id": "DG3", "done": false, "text": "Charts on Vega-Lite and Vega: every chart type of the coverage table as a tested preset (forest plot, tornado, waterfall, fan chart, Gantt, heat map, strategy canvas, quadrant bubble matrix, treemap, radar, choropleth and flow map), each number a reference; Sankey and chord on ECharts only if DG0 finds Mermaid's Sankey insufficient", "wave": "W2"}, {"id": "DG4", "done": false, "text": "Process and system diagrams: BPMN 2.0 (pools, lanes, gateways, events) on bpmn-js; flowchart, state, sequence, entity-relationship, mind map, timeline, Gantt, C4 and Sankey on Mermaid; data-flow diagrams, causal loops with polarity and decision trees on Graphviz; free node diagrams on React Flow with elkjs layout", "wave": "W2"}, {"id": "DG5", "done": false, "text": "Framework templates: typed data drawn by AIA's own deterministic SVG layout, one template per shape (SWOT 2×2, PESTEL six factors, Porter's five forces, Ansoff 2×2, value chain, McKinsey 7S, business model canvas, ERRC grid, Ishikawa, DuPont tree, SIPOC, capability map, current and target state); BCG and GE-McKinsey drawn as DG3 quadrant charts", "wave": "W2"}, {"id": "DG6", "done": false, "text": "Tables as one typed spec: plain, cross-tab, matrix (RACI), heat table, comparison with conditional marks, financial statement with indented subtotals; every cell a reference; the same table on screen (TanStack Table) and in the DOCX (report_docx tables)", "wave": "W2"}, {"id": "DG7", "done": false, "text": "The Lead's visual tools: it proposes a visual as a typed spec, per change  ["Q-SPINE","all","Which scope is the MVP: everything, or one study as the spine?","Two records in the repo disagree. The master plan and ADR 0046 keep your decision A1 of 2 Nov: everything stays in the MVP and no single study is its spine. This page is built on that. The scope record of 9 Nov (prototypes/obchodni-model/MVP-SCOPE.md, version 3) says your words of 8 Nov replaced A1: the study behind report 2, a site decision, is the spine. It parks the analysis frameworks, accounting and market size, operations research, the data connectors, Sobol sensitivity, the diagram stacks, the shared client review and the personal-data register. It plans five two-week waves, and accepts the MVP on an independent calculation with known answers before the case. If the 9 Nov record stands, the steps, the build order and the Done-when tab here have to be cut down to it.","owner"],

const inputsOf=id=>ARTS.filter(a=>a.to.includes(id)), outputsOf=id=>ARTS.filter(a=>a.from===id);
const nodeOf=id=>NODES.find(x=>x.id===id);
const nodeName=id=>{const n=nodeOf(id);return n.n?`${n.n} ${n.name}`:n.name};
const colOf=id=>({g0:"var(--world)",g1:"var(--v1)",g2:"var(--v3)",g3:"var(--v4)",g4:"var(--v2)",g5:"var(--v6)"})[nodeOf(id).g];
function hopChip(id){const n=nodeOf(id);return n.n?`<button class="hop ${n.g}" data-stage="${id}" title="Open step ${n.n}">${ico(n.icon,"ico sm")}${n.n} ${esc(n.name)}</button>`:`<span class="hop src ${n.g}">${ico(n.icon,"ico sm")}${esc(n.name)}</span>`}

function renderIPO(){
  const v=$("#v-ipo"), sel=state.ipoSel||null;
  const W=1600, base=360, N=NODES.length, dx=W/N, X=i=>dx*(i+.5), idx=Object.fromEntries(NODES.map((n,i)=>[n.id,i]));
  const edges=[];ARTS.forEach(a=>a.to.forEach(t=>edges.push({a,from:a.from,to:t})));
  const seen={};
  const paths=edges.map(e=>{const i=idx[e.from],j=idx[e.to],key=e.from+">"+e.to,k=(seen[key]=(seen[key]||0)+1)-1,span=j-i,h=50+span*30+k*22;
    const x1=X(i)+10+k*6,x2=X(j)-12-k*6,on=!sel||e.from===sel||e.to===sel,col=colOf(e.from),g=nodeOf(e.from).g;
    return `<path d="M${x1},${base-16} C${x1},${base-16-h} ${x2},${base-16-h} ${x2},${base-16}" fill="none" stroke="${col}" stroke-width="${sel&&on?4.5:3}" opacity="${on?.9:.1}" marker-end="url(#ah-${g})"><title>${esc(e.a.name)}: ${esc(nodeName(e.from))} → ${esc(nodeName(e.to))}</title></path>`}).join("");

  const nodes=NODES.map((n,i)=>{const on=!sel||n.id===sel||edges.some(e=>(e.from===sel&&e.to===n.id)||(e.to===sel&&e.from===n.id));const col=colOf(n.id);const words=n.name.split(" ");const l1=n.n?`Step ${n.n}`:"";
    return `<g data-ipo="${n.id}" style="cursor:pointer" opacity="${on?1:.35}"><rect x="${X(i)-dx/2+6}" y="${base-14}" width="${dx-12}" height="${n.n?96:80}" rx="12" fill="${n.id===sel?col:"var(--raised)"}" fill-opacity="${n.id===sel?.18:1}" stroke="${col}" stroke-width="${n.id===sel?3:1.5}"/>
      <circle cx="${X(i)}" cy="${base-14}" r="7" fill="${col}"/>

      <text x="${X(i)}" y="${base+(l1?40:22)}" text-anchor="middle" font-size="18" font-weight="600" fill="var(--ink)">${words.length>1&&n.name.length>12?`<tspan x="${X(i)}">${esc(words[0])}</tspan><tspan x="${X(i)}" dy="21">${esc(words.slice(1).join(" "))}</tspan>`:esc(n.name)}</text>
      <text x="${X(i)}" y="${base+(n.n?78:62)}" text-anchor="middle" font-size="14" fill="var(--faint)">${inputsOf(n.id).length} in · ${outputsOf(n.id).length} out</text></g>`}).join("");
  const selN=sel&&nodeOf(sel);
  const selHtml=sel?`<div class="two" style="margin-top:16px"><div class="panel ${selN.g}"><div class="ph">${ico("arrow")}<h3>Into ${esc(nodeName(sel))}</h3><span class="chip">${inputsOf(sel).length}</span></div><div class="pb">${inputsOf(sel).map(a=>artCard(a,"in")).join("")||'<p class="empty">Nothing comes in: this is where material starts.</p>'}</div></div>
     <div class="panel ${selN.g}"><div class="ph">${ico("arrow")}<h3>Out of ${esc(nodeName(sel))}</h3><span class="chip">${outputsOf(sel).length}</span></div><div class="pb">${outputsOf(sel).map(a=>artCard(a,"out")).join("")||'<p class="empty">Nothing goes further: this is where it ends.</p>'}</div></div></div>`
    :``;

    <td>${inputsOf(s.id).map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">from</span>${hopChip(a.from)}</div></div>`).join("")}</td>
    <td>${SPEC[s.id]?(()=>{const g={};SPEC[s.id].process.forEach(p=>(g[p.phase]=g[p.phase]||[]).push(p.action));return Object.entries(g).map(([ph,xs])=>`<div class="ia"><b>${esc(ph)}</b><div class="cap">${xs.map(esc).join(" · ")}</div></div>`).join("")})():`<ol>${s.does.map(d=>`<li>${esc(d[0])}</li>`).join("")}</ol>`}</td>
    <td>${outputsOf(s.id).map(a=>`<div class="ia"><b>${esc(a.name)}</b><div class="hops" style="margin-top:4px"><span class="cap">to</span>${a.to.map(hopChip).join("")}</div></div>`).join("")}</td>

  v.innerHTML=`<h2>Inputs and outputs</h2><p class="lede">Every arrow is one hand-off, from the step that makes it to each step that uses it. Click a step to see only what goes into it and out of it. Use it to check that nothing is made that nobody uses, and nothing is used that nobody makes.</p>

   </tbody></table></div></div>`;
}

function label(id){
  if(id.startsWith("chunk:")){const [,p,c]=id.split(":");const ch=(PLANS[p]||[]).find(x=>x.id===c);return `${p}#${c} — ${ch?ch.text.slice(0,140):""}`}
  if(id.startsWith("dec:")){const d=DECISIONS.find(x=>"dec:"+x[0]===id);return d?`${d[0]} — ${d[2]}`:id}
  if(id.startsWith("q:")){const d=QUESTIONS.find(x=>"q:"+x[0]===id);return d?`Open: ${d[2]}`:id}
  if(id.startsWith("acc:")){const a=ACCEPT.find(x=>"acc:"+x[0]===id);return a?`Acceptance ${a[0]} — ${a[2]}`:id}
  if(id.startsWith("aq:")){const a=AQ.find(x=>"aq:"+x[0]===id);return `Methodology Q${a[0]} — ${a[1]}`}
  if(id.startsWith("view:")){const w=VIEWS.find(x=>"view:"+x.id===id);return `Map view — ${w?w.name:id}`}
  if(id.startsWith("mode:")){const m=MODES.find(x=>"mode:"+x.id===id);return `Map type — ${m?m.name:id}`}
  if(id.startsWith("pipe:")){const p=PIPE.find(x=>"pipe:"+x.n===id);return `Map step ${p.n} — ${p.t}`}
  if(id.startsWith("does:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — ${st.does[+i][0]}`}
  if(id.startsWith("lane:")){const [,l,i]=id.split(":");const ln=LANES.find(x=>x.id===l);return `${ln.name} — ${ln.items[+i]}`}
  if(id.startsWith("idea:")){const v=ideas[id.slice(5)];return v?`New ${v.kind} (${STAGES.find(s=>s.id===v.stage).name}) — ${v.text}`:id}
  if(id.startsWith("ml:")){const a=ML.find(x=>"ml:"+x.id===id),b=ML_LATER.find(x=>"ml:"+x[0]===id);return `Machine learning — ${a?a.name:b?b[1]:id}`}
  if(id.startsWith("proc:")){const [,s,n]=id.split(":");const p=(SPEC[s]?.process||[]).find(x=>x.n===+n);const st=STAGES.find(x=>x.id===s);return p?`${st.name} process ${n} — ${p.action} (${p.actor})`:id}
  if(id.startsWith("mt:")){const k=id.slice(3);const t=k.startsWith("tpl:")?MT.templates.find(x=>x.id===k.slice(4)):k.startsWith("fam:")?MT.families.find(x=>x.id===k.slice(4)):MT[k];return `Model type — ${t?t.name:k}`}
  if(id.startsWith("gap:")){const [,s,i]=id.split(":");const st=STAGES.find(x=>x.id===s);return `${st.name} — not designed yet: ${(SPEC[s]?.gaps||[])[+i]}`}
  if(id.startsWith("art:")){const a=ARTS.find(x=>"art:"+x.id===id);return a?`Hand-off — ${a.name} (${nodeName(a.from)} → ${a.to.map(nodeName).join(", ")})`:id}
  if(id.startsWith("gate:")){const s=STAGES.find(x=>"gate:"+x.id===id);return `${s.name} — before it moves on: ${GATES[s.id]}`}
  if(id==="socio:kept")return "Sociomapa — what's kept from today's engine";
  if(id==="profile:pipeline")return "Sociomapa — the proposed indicator profile map";
  return id}
function summaryText(){

  for(const [k,l] of STANCES){const ids=Object.keys(marks).filter(i=>marks[i].stance===k);if(!ids.length)continue;L.push("","## "+l);for(const i of ids)L.push("- "+label(i)+(marks[i].note?"\n  Note: "+marks[i].note:""))}

  return L.join("\n");
}

nd sum, row, page) and its kind (z dat klienta, veřejné zdroje); a dataset input is the sum, count or mean of a contract column over a stated filter and period.", "fields": ["Číslo", "Hodnota", "Odkud", "Druh"], "rule": "'nic se nedopočítává': nothing is computed that has no place in a file.", "output": "Data bindings for Předpoklady and Model.", "onFail": "A number with no place stays missing.", "screen": "M1 · 02 Co model z dat bere", "source": "cost-model-study#CP4 · KM1Data", "status": "planned"}, {"n": 11, "phase": "Checks", "actor": "Code", "action": "Run data checks before use", "detail": "Reconciliation of declared pairs across files and stated totals (difference in unit and as a share), period coverage and currency, outliers by modified z (MAD > 3,5), seasonality only with two full cycles; the canvas adds hall capacity against the forecast.", "fields": ["Kontrola", "Výsledek", "Stav"], "rule": "Seasonality without two cycles reads 'nelze ověřit'; check report versioned and hashed.", "output": "Check report ('Kontrola dat 7/7').", "onFail": "A missing month is named; an input reading a missing value is unknown.", "screen": "M1 · 03 Kontrola dat před výpočtem", "source": "cost-model-study#CR1", "status": "planned"}, {"n": 12, "phase": "Checks", "actor": "Researcher", "action": "Decide flags and accept the check report", "detail": "Each outlier is kept or excluded on record (e.g. November 2025, Black Friday, kept); capacity findings decided ('od 2030 přebytek přes 3PL CZ'); the check report is accepted with the binding.", "fields": ["outlier: keep/exclude", "decision note", "accepted by", "date"], "rule": "Accepted by the person as part of the binding; missing stays missing.", "output": "'přijal výzkumník 15. 10.'", "onFail": null, "screen": "M1 · 03 rozhodl výzkumník", "source": "cost-model-study#CR1", "status": "planned"}, {"n": 13, "phase": "Estimates", "actor": "Code", "action": "Estimate a quantity from client rows", "detail": "A Metodika method computes
