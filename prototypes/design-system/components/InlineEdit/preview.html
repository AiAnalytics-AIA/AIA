<!-- @dsCard group="Vstupy" height=230 -->
<div class="aia ds">
<style>
.ie{display:inline-flex;align-items:center;gap:8px;min-width:0}
.ie .ipt{min-width:320px;border:0;border-bottom:2px solid var(--signal);background:var(--stint);border-radius:0}
.ie .ie-note{font-size:12px;line-height:16px;color:var(--muted)}
.ie .ie-note.bad{color:var(--fault)}
.ie .inplace[data-empty]{color:var(--faint)}
</style>
<div class="ds-col">
 <div class="ds-row"><span class="ds-lbl">Klikněte</span><span class="ie" data-ie><button class="inplace" data-ie-value>Ověřit, zda zvednout cenu o 3 Kč</button><span class="ie-note" aria-live="polite"></span></span></div>
 <div class="ds-row"><span class="ds-lbl">Prázdné</span><span class="ie" data-ie data-ie-ph="Doplňte rozhodnutí, které výzkum podpoří"><button class="inplace" data-ie-value data-empty>Doplňte rozhodnutí, které výzkum podpoří</button><span class="ie-note" aria-live="polite"></span></span></div>
 <div class="ds-row"><span class="ds-lbl">Odmítne</span><span class="ie" data-ie data-ie-refuse="Název musí mít aspoň 3 znaky."><button class="inplace" data-ie-value>Značka A</button><span class="ie-note" aria-live="polite"></span></span></div>
 <div class="ds-row"><span class="ds-lbl">Jen ke čtení</span><button class="inplace" disabled>Rozpočet studie</button></div>
 <p class="cap" style="margin:0">Klik, Enter nebo F2 otevře · Enter nebo odchod uloží · Esc vrátí · „Uloženo" 3 s · odmítnutí zůstane u pole i s textem</p>
</div>
<script>
(function () {
  function open(host) {
    var btn = host.querySelector("[data-ie-value]");
    var note = host.querySelector(".ie-note");
    var was = btn.hasAttribute("data-empty") ? "" : btn.textContent;
    var input = document.createElement("input");
    input.className = "ipt"; input.type = "text"; input.value = was;
    input.placeholder = host.getAttribute("data-ie-ph") || "";
    input.setAttribute("aria-label", "Upravit");
    btn.hidden = true; host.insertBefore(input, note); note.textContent = ""; note.className = "ie-note";
    input.focus(); input.select();
    var done = false;
    function close(save) {
      if (done) return;
      var next = input.value.trim();
      var refuse = host.getAttribute("data-ie-refuse");
      if (save && next !== was && refuse && next.length < 3) {
        note.textContent = refuse; note.className = "ie-note bad"; input.focus(); return;
      }
      done = true;
      if (save && next !== was) {
        if (next) { btn.textContent = next; btn.removeAttribute("data-empty"); }
        else { btn.textContent = host.getAttribute("data-ie-ph") || ""; btn.setAttribute("data-empty", ""); }
        note.textContent = "Uloženo"; setTimeout(function () { note.textContent = ""; }, 3000);
      }
      input.remove(); btn.hidden = false; btn.focus();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); close(true); }
      else if (e.key === "Escape") { e.preventDefault(); done = false; input.value = was; close(false); }
    });
    input.addEventListener("blur", function () { close(true); });
  }
  document.querySelectorAll("[data-ie]").forEach(function (host) {
    var btn = host.querySelector("[data-ie-value]");
    btn.addEventListener("click", function () { open(host); });
    btn.addEventListener("keydown", function (e) { if (e.key === "F2") { e.preventDefault(); open(host); } });
  });
})();
</script>
</div>
