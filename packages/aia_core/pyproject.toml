[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aia-core"
version = "0.1.0"
description = "AIA domain and application layer: projects, revisions, stages, artifacts, providers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
# The DOCX report renderer (infrastructure/report_docx): python-docx for the
# package, matplotlib for charts and evidence marks. Imported only there, so
# aia_core installs and imports without them; the worker image that renders
# reports installs them.
report = ["python-docx>=1.2,<2", "matplotlib>=3.9,<4"]
# The Bedrock route (ADR 0010): botocore's SigV4 signer and urllib3, its own HTTP
# dependency, for the one live transport. No boto3 client is built for Bedrock.
bedrock = ["botocore>=1.35,<2", "urllib3>=1.26,<3"]
# Reading a brief attachment's text (infrastructure/document_text, ADR 0018): the
# libraries 18.6.6 read them with, so the analysis reads the same text. Imported
# only there, only when a file of that kind is attached; the API image installs
# them. pypdf from 6.1, whose stream decompression is bounded.
# pdfplumber (MIT; pdfminer.six MIT, pypdfium2 BSD-3/Apache-2.0) extracts a PDF's tables with
# their cells (Deep Research plan chunk 6; the owner's choice of 2026-10-09).
# olefile (BSD-2, pure Python) opens a Word 97-2003 .doc's compound file for a client's
# sources (client-knowledge-lifecycle K2b; the owner's format list of 2026-10-13); the
# text itself is read from the WordDocument stream by AIA's own code. xlrd (BSD, pure Python;
# 2.x reads .xls only) reads a Word-era Excel workbook's cells for the same list (K2c).
documents = [
    "pypdf>=6.1,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<0.12",
    "olefile>=0.47,<0.48",
    "xlrd>=2.0.1,<3",
]
# The error reporter (infrastructure/error_tracking, plan error-tracking): the Sentry SDK,
# which GlitchTip speaks. Imported only there, lazily, and only when AIA_ERROR_TRACKING_DSN
# is set; the API and worker images install it. 2.72 for `data_collection`.
errors = ["sentry-sdk>=2.72,<3"]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-lxml>=2024.11",
    # The import contracts in the root pyproject.toml ([tool.importlinter]), run by
    # `make layer_check`: the import-graph half of the layering rules. 2.12 is the
    # first that allows a forbidden contract's sources to overlap the forbidden
    # package (aia_core.infrastructure.* holds model_adapters); 2.11 reports
    # model_adapters' own imports as BROKEN.
    "import-linter>=2.12,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aia_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "parity: compares this implementation against the legacy prototype (needs AIA_LEGACY_REFERENCE)",
    "postgres: requires a live PostgreSQL instance via DATABASE_URL",
    "golden: compares production against a golden fixture from the reference repository (needs AIA_REFERENCE_REPO)",
    "oracle: reaches the running 18.6.6 unit over HTTP (needs AIA_LEGACY_REFERENCE_URL and its basic-auth credentials)",
]

[tool.ruff]
# One lint configuration for every Python tree: the root pyproject.toml's. Ruff reads
# the nearest [tool.ruff], so a copy here would silently shadow a rule added there
# (the network-egress ban, TID251, is the one that made this matter).
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# boto3 ships no type stubs and is an optional dependency, imported lazily inside
# S3ArtifactStore so that nothing else in the codebase loads an AWS SDK. The
# untyped boundary is one function; adding boto3-stubs would pull a large
# dependency in for it.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
