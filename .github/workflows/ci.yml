name: CI

# Quality gate for the migration. The rule from the migration brief is that no
# step may leave main unable to start, so this workflow proves on every change
# that the schema migrates, the API boots, and the domain invariants hold.

# `develop` is the integration branch (ADR 0009): CI runs on every push to it,
# and dispatches deploy-develop.yml only after all checks succeed. The dispatch
# uses the develop ref so its environment branch protection remains effective.
# `main` stays the release branch.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's older run is cancelled by its newer push. A push to develop never
  # cancels a run in progress: with back-to-back merges every develop run was cancelled
  # and none deployed for ~5 h 40 min (OI-191). GitHub keeps one pending run per group,
  # so a burst of merges still runs at most the one in progress plus the newest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  changes:
    # Most of what a pull request can change is code, and CI exists to prove the
    # code. A pull request that touches only plans and decision records cannot
    # change what any test, type check or build sees, so it skips the suites and
    # runs `docs-checks` instead. Anything else, an unknown path included, runs
    # everything; a push to main or develop always runs everything, because the
    # deploy dispatch below depends on it. The list is short on purpose: add a
    # path only after confirming that no test, tool or build reads it. The root
    # documents CLAUDE.md, AGENTS.md and ARCHITECTURE.md were added after a search
    # of tests, tools, the Docker build contexts and the workflows (2026-10-02,
    # .planning/plans/ci-skip-docs-only.md): they are cited in comments and in a
    # label string, and nothing opens them. docs/migration/** stays out, because
    # the parity tests read it.
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request checkout is a merge commit: HEAD^1 is the base, so
          # one parent of history is enough to list exactly what the PR changes.
          fetch-depth: 2

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only HEAD^1 HEAD)"
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  .planning/*|docs/architecture/adr/*|CLAUDE.md|AGENTS.md|ARCHITECTURE.md) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
            printf 'Changed files:\n%s\n' "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  docs-checks:
    # What a documentation-only change can still break: a client-identifying
    # name (history keeps it even in a private repository), a committed key, a
    # layering comment that names a path, or a plan whose front-matter no longer
    # parses. Seconds, no installs.
    name: Documentation checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Layering rules
        run: ./tools/layer_check.sh

      - name: Reference-exposure rules
        run: ./tools/exposure_check.sh

      - name: Plans are well-formed
        run: python3 tools/progress.py --check

      - name: No secrets committed
        run: |
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{12,}|sk-proj-[A-Za-z0-9_-]{12,}' \
               --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=tests --exclude-dir=.venv . ; then
            echo "::error::A provider API key appears to be committed."
            exit 1
          fi

  backend:
    name: Backend (lint, types, tests)
    # Pinned, not ubuntu-latest: on Ubuntu 26.04 (glibc 2.43) the aia-sociomap-5 kernels' last
    # bits differ, and the byte-exact pins (test_object_map_web_fixture.py,
    # test_sociomap_signed_off_segments.py) were written on 24.04. Move with the fixtures, never alone.
    runs-on: ubuntu-24.04
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    services:
      postgres:
        # Same major version as production, so a dialect difference fails here.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: aia_ci
          POSTGRES_DB: aia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d aia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aia:aia_ci@localhost:5432/aia_test
      AIA_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        # The API's dev extra names aia-worker and aia-executors (its slice test
        # drives a real worker), so those install first.
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,postgres,report,bedrock,documents,errors]"
          pip install -e "apps/worker[dev]"
          pip install -e "apps/executors[dev]"
          pip install -e "apps/api[dev]"

      - name: Layering rules
        # Enforcement of ARCHITECTURE.md: the grep rules (tools/layer_check.sh) and
        # the import contracts (lint-imports, [tool.importlinter] in pyproject.toml),
        # both through `make layer_check`, so CI and a contributor run the same
        # thing. Runs before the expensive steps: a layer violation is cheaper to
        # report in five seconds than after a full PostgreSQL suite.
        run: make layer_check

      - name: Reference-exposure rules
        # The legacy reference is client work. Blocking, and early: once a commit
        # carrying client-identifying names is pushed, removing it from the tree
        # does not remove it from history -- and that is true of a private
        # repository too. See docs/migration/public-exposure-remediation.md.
        run: ./tools/exposure_check.sh

      - name: Lint
        run: |
          ruff check packages/aia_core apps/api apps/worker apps/executors migrations tests
          ruff format --check packages/aia_core apps/api apps/worker apps/executors migrations tests

      - name: Python version
        # The runner's Python is PYTHON_VERSION; make python-version also fails when
        # .python-version (what make deps builds a local venv with) disagrees with it,
        # so the two cannot drift apart in a merged change.
        run: make python-version

      - name: Type check
        # One invocation over every source tree: aia_core ships no py.typed, so a
        # tree checked on its own sees aia_core as untyped (AGENTS.md § mypy).
        run: mypy packages/aia_core/src apps/api/src apps/worker/src apps/executors/src

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Schema matches models (no drift)
        # Fails when a model changed without a migration, which would otherwise
        # surface as a runtime error after deploy.
        run: alembic check

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Every test tree collects in one session
        # The SQLite step below runs all four trees in one pytest session and only
        # on a push to develop. Two test modules with one basename in different
        # trees collect apart but not together ("import file mismatch"), and the
        # collection error then runs no test at all. 3f7fc500 did exactly that and
        # was found only after it merged. Collection alone takes about 16 s. The
        # acceptance tree is collected here too, so a module of its that cannot import
        # or an unregistered marker (--strict-markers) fails before its own step.
        env:
          DATABASE_URL: ""
        run: >-
          pytest packages/aia_core apps/api apps/worker apps/executors tests/acceptance -q
          --collect-only --junit-xml=tmp/junit/collect.xml -o junit_family=xunit1

      # Every pytest step writes JUnit XML. tools/parity_status.py reads it to
      # tell a parity gate that passed from one that was skipped or never
      # collected -- the exit code alone cannot, which is how 94 skipped parity
      # tests read as a green job (OI-1). xunit1 carries each test's file path.
      - name: Domain and repository tests (PostgreSQL)
        run: pytest packages/aia_core -q --junit-xml=tmp/junit/core-postgres.xml -o junit_family=xunit1

      - name: API tests (PostgreSQL)
        run: pytest apps/api -q --junit-xml=tmp/junit/api-postgres.xml -o junit_family=xunit1

      - name: Concurrency and transaction semantics (PostgreSQL only)
        # These must actually RUN, not skip. They use real concurrent
        # transactions and are the only thing that detects two workers claiming
        # one step, a lock convoy, or a budget overspend race -- each of which
        # passed the sequential suite. `--no-skips` turns a skip into a failure,
        # so a missing DATABASE_URL cannot masquerade as a pass.
        env:
          # Turns a missing database into a failure rather than a skip.
          AIA_REQUIRE_POSTGRES: "1"
        run: >-
          pytest packages/aia_core/tests/test_workflow_concurrency.py -q
          --junit-xml=tmp/junit/concurrency.xml -o junit_family=xunit1

      - name: Worker tests, including real worker processes (PostgreSQL only)
        # Starts `python -m aia_worker` processes and SIGKILLs / SIGTERMs them
        # mid-step and mid-paid-call. These are the only tests that exercise two
        # workers contending, a worker dying, and a clean shutdown -- so, like the
        # concurrency suite, a missing database must fail rather than skip.
        env:
          AIA_REQUIRE_POSTGRES: "1"
        run: pytest apps/worker -q --junit-xml=tmp/junit/worker-postgres.xml -o junit_family=xunit1

      - name: Executor, seed and smoke-module tests (PostgreSQL)
        # The develop_snapshot executor driven by the real worker loop, the
        # idempotent develop seed, and the smoke module that proves a deployment.
        env:
          AIA_REQUIRE_POSTGRES: "1"
        run: pytest apps/executors -q --junit-xml=tmp/junit/executors-postgres.xml -o junit_family=xunit1

      - name: MVP acceptance, tier A (over HTTP, recorded providers)
        # MVP-ACCEPT-2's tier A (docs/migration/mvp-acceptance.md): tests/acceptance starts
        # the topology production runs -- the API and a worker as processes of their own,
        # over PostgreSQL -- after one declared operator bootstrap, and drives it over HTTP
        # alone, every model request answered by a recording behind the real gateway.
        # A database of its own, so nothing another step left behind is read. Blocking:
        # a failing criterion fails CI, and parity_status.py gives each criterion its
        # verdict from this JUnit (a test it lists that did not run is a FAIL there).
        # A stuck process (an API that never answers, a worker that never drains) fails the
        # step in minutes, not at the job's six-hour limit; the tree takes about 30 s.
        timeout-minutes: 15
        env:
          AIA_ACCEPTANCE_DATABASE_URL: postgresql+psycopg://aia:aia_ci@localhost:5432/aia_acceptance
          PGPASSWORD: aia_ci
        run: |
          createdb -h localhost -U aia aia_acceptance
          pytest tests/acceptance -q -m acceptance --junit-xml=tmp/junit/acceptance.xml -o junit_family=xunit1

      - name: Domain tests on SQLite
        # The offline development path must keep working too. The worker's
        # process suite skips here by design: SQLite cannot express contention.
        # Not on a pull request: it re-runs the whole suite a second time (about
        # 3.7 of this job's 11.6 minutes), so a SQLite-only failure is found on
        # the push to develop, before the deploy dispatch, not on the PR.
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ""
        run: pytest packages/aia_core apps/api apps/worker apps/executors -q --junit-xml=tmp/junit/sqlite.xml -o junit_family=xunit1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend
          path: tmp/junit/
          if-no-files-found: warn

  parity:
    # Needs the extracted reference archive, which is withheld pending a licence
    # decision and is deliberately NOT a CI dependency. Until it has an approved
    # EU-resident home these tests skip here, and parity-status reports them as
    # NOT_EXECUTED rather than letting the skip read as a pass.
    name: Parity against legacy prototype (needs the withheld archive)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,report]"

      - name: Run parity suite
        # The prototype is not vendored into this repository. When it is not
        # present the parity tests skip, and this step reports that honestly
        # instead of implying the comparison ran.
        # No `|| true`: when the prototype is absent every reference test skips
        # and pytest exits 0 on its own, so the only thing `|| true` ever hid
        # was a real failure in a parity-marked test that runs without it.
        run: |
          if [ ! -f "${AIA_LEGACY_REFERENCE:-../npc-panel-reference}/project_pipeline.py" ]; then
            echo "::warning::Legacy prototype not available in CI; its parity tests are skipped and reported as NOT_EXECUTED."
          fi
          pytest packages/aia_core -q -m parity -rs \
            --junit-xml=tmp/junit/parity-legacy.xml -o junit_family=xunit1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-parity-legacy
          path: tmp/junit/
          if-no-files-found: warn

  golden-fixtures:
    # The golden fixtures are committed JSON in the private reference
    # repository and need no raw archive. F1-F9 are vendored and gated in the
    # backend job; this job checks out the reference at the commit pinned in
    # docs/migration/parity-matrix.json, refuses any fixture that does not hash
    # to its pin, proves each vendored copy is byte-identical to its original,
    # and runs the F10/F11, population-contract and evidence-contract gates
    # that read the checkout.
    #
    # Access is a read-only deploy key on AiAnalytics-AIA/AIA-reference, stored
    # as the AIA_REFERENCE_DEPLOY_KEY secret. Without it (forks, or before it is
    # provisioned) the gates skip and parity-status reports NOT_EXECUTED. Once it
    # exists, set the repository variable AIA_REQUIRE_REFERENCE_REPO=1 and an
    # absent checkout becomes a failure -- the same ratchet as AIA_REQUIRE_POSTGRES.
    name: Golden fixtures (reference repository)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      HAS_REFERENCE_KEY: ${{ secrets.AIA_REFERENCE_DEPLOY_KEY != '' }}
      AIA_REQUIRE_REFERENCE_REPO: ${{ vars.AIA_REQUIRE_REFERENCE_REPO }}
    outputs:
      reference: ${{ steps.reference.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the reference repository at the pinned commit
        if: env.HAS_REFERENCE_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: AiAnalytics-AIA/AIA-reference
          # Must equal parity-matrix.json reference.commit; a test enforces it.
          ref: 678e298ad9ca0263da53cc8920d153fdfb956c93
          path: .reference/aia-reference
          ssh-key: ${{ secrets.AIA_REFERENCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Record whether the reference is present
        id: reference
        run: |
          if [ -f .reference/aia-reference/golden-fixtures/manifest.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Reference repository not available (no AIA_REFERENCE_DEPLOY_KEY); golden-fixture gates are skipped and reported as NOT_EXECUTED."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,report]"

      - name: Run golden-fixture gates
        # F1-F9 are vendored and run in the backend job with no checkout; what
        # needs the reference repository is the pin check against its manifest
        # and parity plan, F10/F11, and the population and evidence contract parity.
        env:
          AIA_REFERENCE_REPO: ${{ github.workspace }}/.reference/aia-reference
        run: >-
          pytest packages/aia_core/tests/test_golden_fixtures.py
          packages/aia_core/tests/test_population_reference_parity.py
          packages/aia_core/tests/test_evidence_gate_parity.py -q -rs
          --junit-xml=tmp/junit/golden.xml -o junit_family=xunit1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-golden
          path: tmp/junit/
          if-no-files-found: warn

  oracle-parity:
    # Differential tests against the RUNNING 18.6.6 unit (ADR 0011): the
    # reference setup on the develop host (deploy/reference, ADR 0018), behind its
    # basic-auth gate on the host's loopback, which a hosted runner cannot reach.
    # The endpoint and its credentials are repository secrets; without them the
    # `oracle` tests skip and parity-status reports their gates as NOT_EXECUTED,
    # never as a pass. With them present, `AIA_REQUIRE_LEGACY_ORACLE=1` turns an
    # unreachable oracle into a failure -- the same ratchet as AIA_REQUIRE_POSTGRES.
    # Never a `|| true`: an oracle that answers differently is a finding.
    name: Parity against the running 18.6.6 unit (needs the oracle secrets)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      HAS_ORACLE: ${{ secrets.AIA_LEGACY_REFERENCE_URL != '' }}
    outputs:
      oracle: ${{ steps.oracle.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,report]"

      - name: Record whether the oracle is configured
        id: oracle
        run: |
          if [ "$HAS_ORACLE" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AIA_LEGACY_REFERENCE_URL is not configured; oracle parity tests are skipped and reported as NOT_EXECUTED."
          fi

      - name: Run the oracle suite
        env:
          AIA_LEGACY_REFERENCE_URL: ${{ secrets.AIA_LEGACY_REFERENCE_URL }}
          AIA_LEGACY_REFERENCE_USER: ${{ secrets.AIA_LEGACY_REFERENCE_USER }}
          AIA_LEGACY_REFERENCE_PASSWORD: ${{ secrets.AIA_LEGACY_REFERENCE_PASSWORD }}
          AIA_REQUIRE_LEGACY_ORACLE: ${{ env.HAS_ORACLE == 'true' && '1' || '' }}
        run: >-
          pytest packages/aia_core -q -m oracle -rs
          --junit-xml=tmp/junit/oracle.xml -o junit_family=xunit1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-oracle
          path: tmp/junit/
          if-no-files-found: warn

  parity-status:
    # One verdict per capability, from every JUnit file above. FAIL (a gate ran
    # and failed, or could have run and did not) fails this job. NOT_EXECUTED
    # and NOT_RUNNABLE are reported in the step summary beside the passes, so a
    # skip can no longer be read as one.
    name: Parity status
    runs-on: ubuntu-latest
    needs: [changes, backend, parity, golden-fixtures, oracle-parity]
    # Not `always()`: that also runs when the workflow is cancelled, and a run
    # superseded by a newer push then reported a parity failure that was only
    # its missing artifacts.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: tmp/junit
          merge-multiple: true

      - name: Compute parity verdicts
        env:
          REFERENCE_AVAILABLE: ${{ needs.golden-fixtures.outputs.reference }}
          ORACLE_AVAILABLE: ${{ needs.oracle-parity.outputs.oracle }}
        run: |
          # The backend job runs the acceptance step whenever it runs at all.
          available="postgres acceptance"
          if [ "$REFERENCE_AVAILABLE" = "true" ]; then available="$available reference_repo"; fi
          if [ "$ORACLE_AVAILABLE" = "true" ]; then available="$available legacy_oracle"; fi
          set +e
          python tools/parity_status.py --junit tmp/junit/*.xml --available $available \
            --json parity-status.json --markdown parity-status.md
          status=$?
          set -e
          cat parity-status.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-status
          path: |
            parity-status.json
            parity-status.md

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        # apps/api[dev] names aia-worker and aia-executors (AGENTS.md § Python
        # packaging), so they install first even though this job runs no test.
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,report]"
          pip install -e "apps/worker"
          pip install -e "apps/executors"
          pip install -e "apps/api[dev]"

      - name: Generate OpenAPI document
        run: make openapi

      - name: Validate the document
        run: |
          python - <<'PY'
          import json, sys
          spec = json.load(open("openapi.json"))
          assert spec["openapi"].startswith("3."), spec["openapi"]
          paths = spec["paths"]
          # Projects live under a study: the study is the access boundary, so a
          # bare /projects path would mean scope had leaked out of the URL.
          required = [
              "/api/v1/health",
              "/api/v1/ready",
              "/api/v1/clients",
              "/api/v1/studies",
              "/api/v1/studies/{study_id}",
              "/api/v1/studies/{study_id}/budget",
              "/api/v1/studies/{study_id}/projects",
              "/api/v1/studies/{study_id}/projects/{project_id}",
              "/api/v1/studies/{study_id}/projects/{project_id}/content",
              "/api/v1/studies/{study_id}/projects/{project_id}/impact",
              "/api/v1/studies/{study_id}/projects/{project_id}/runs",
              "/api/v1/studies/{study_id}/projects/{project_id}/runs/{run_id}",
              "/api/v1/studies/{study_id}/projects/{project_id}/runs/{run_id}/events",
              "/api/v1/studies/{study_id}/projects/{project_id}/artifacts/{artifact_id}",
              "/api/v1/access-audit",
              # The client workspace (ADR 0015): the directory, one client, its
              # studies, its knowledge, and one study's frame.
              "/api/v1/workspace/me",
              "/api/v1/workspace/clients",
              "/api/v1/clients/{client_id}",
              "/api/v1/clients/{client_id}/studies",
              "/api/v1/clients/{client_id}/overview",
              "/api/v1/clients/{client_id}/knowledge",
              "/api/v1/clients/{client_id}/knowledge/proposals",
              "/api/v1/studies/{study_id}/workspace",
              "/api/v1/studies/{study_id}/context",
              # A research study's working content, in AIA (ADR 0018, OI-58).
              "/api/v1/studies/{study_id}/workspace/content",
              "/api/v1/studies/{study_id}/workspace/revisions",
              "/api/v1/studies/{study_id}/workspace/attachments",
              "/api/v1/studies/{study_id}/workspace/attachments/{attachment_id}",
              # The class of each brief material (artifact-brief BRF3).
              "/api/v1/studies/{study_id}/workspace/materials",
              "/api/v1/studies/{study_id}/workspace/questionnaire-import",
              "/api/v1/studies/{study_id}/workspace/questionnaire-template",
              # Research execution (ADR 0016): the Design Revisions a run executes.
              "/api/v1/studies/{study_id}/design/revisions",
              "/api/v1/studies/{study_id}/design/revisions/{revision_id}",
              # ... and the runs that execute them.
              "/api/v1/studies/{study_id}/research/readiness",
              # Readiness on a working revision, nothing submitted (working-copy-edit-ops WCE7a).
              "/api/v1/studies/{study_id}/research/readiness/working",
              # Each stage against the working copy, nothing submitted (working-copy-edit-ops WCE7c).
              "/api/v1/studies/{study_id}/research/impact",
              # Dimenze's persona-topic chip before any run (artifact-dimensions DIM2).
              "/api/v1/studies/{study_id}/research/persona-topics",
              "/api/v1/studies/{study_id}/research/runs",
              "/api/v1/studies/{study_id}/research/runs/{run_id}",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/events",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/cancel",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/retry",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/artifacts/{artifact_id}",
              # One report variant, the same draft in DOCX and PDF (research-integrity-report 3).
              "/api/v1/studies/{study_id}/research/runs/{run_id}/report/context",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/report/context/download",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/report/context/pdf",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/report/context/pdf/download",
              "/api/v1/studies/{study_id}/research/runs/{run_id}/report/pdf",
              # AIA's own session and the gate in front of /app (ADR 0018); Caddy's
              # forward_auth names /session/gate, so a rename breaks the site.
              "/api/v1/session",
              "/api/v1/session/gate",
              # Native design proposals over a Design Revision
              # (docs/architecture/research-agents.md); accept writes a new revision.
              "/api/v1/studies/{study_id}/research/agent-jobs",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/cancel",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/resume",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/result",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/accept",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/dismiss",
              "/api/v1/studies/{study_id}/research/agent-jobs/{run_id}/rebuild",
              # The settings page (.planning/plans/settings-control-panel.md).
              "/api/v1/settings",
              "/api/v1/self-approval",
              "/api/v1/clients/{client_id}/status",
          ]
          missing = [p for p in required if p not in paths]
          if missing:
              sys.exit(f"OpenAPI is missing documented routes: {missing}")

          # ADR 0018: nothing binds a study to an 18.6.6 unit project. The study's
          # frame is read-only; its content is saved at /workspace/content.
          if "put" in paths.get("/api/v1/studies/{study_id}/workspace", {}):
              sys.exit("PUT /studies/{study_id}/workspace (the 18.6.6 binding) is back")
          # ... and nothing opens or gates the 18.6.6 unit: its panel gate went with it.
          panel = [p for p in paths if p.startswith("/api/v1/panel")]
          if panel:
              sys.exit(f"the 18.6.6 panel's routes are back: {panel}")

          # A client-derived resource outside a study prefix would mean scope is
          # no longer carried in the path, which is how isolation gets lost.
          # The one other scope: the client's own work (client-budget), which by
          # design names no study and carries its client in the path instead.
          unscoped = [
              p
              for p in paths
              if any(k in p for k in ("/projects", "/runs", "/artifacts", "/agent-jobs"))
              and not p.startswith(("/api/v1/studies/", "/api/v1/clients/{client_id}/work/"))
          ]
          if unscoped:
              sys.exit(f"project routes must sit under a study scope: {unscoped}")

          # Client knowledge is reached through a client or a study in the path
          # (ADR 0015): a bare /knowledge route would be an unscoped pool.
          loose = [
              p
              for p in paths
              if "knowledge" in p
              and not p.startswith(("/api/v1/clients/{client_id}/", "/api/v1/studies/{study_id}/"))
          ]
          if loose:
              sys.exit(f"knowledge routes must sit under a client or a study: {loose}")

          print(f"OpenAPI OK: {len(paths)} paths, all project routes study-scoped")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The security job's gate is the audit; this install's own would only wait on the same endpoint.
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npx tsc --noEmit
      # tokens.json is the one source: the generated CSS/TS must match it, and
      # the contrast, palette and client-accent evidence is re-measured from it.
      - run: npm run tokens:check
      - run: npm run check:design
      # No unused file, dependency or export (knip.jsonc says what is kept on purpose).
      - run: npm run knip
      - run: npm test
      - run: npm run build

  startup-smoke:
    name: Application starts
    runs-on: ubuntu-latest
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: aia_ci
          POSTGRES_DB: aia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d aia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aia:aia_ci@localhost:5432/aia_test
      AIA_ENV: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/aia_core[dev,postgres,report,bedrock,documents,errors]"
          pip install -e "apps/worker[dev]"
          pip install -e "apps/executors[dev]"
          pip install -e "apps/api[dev]"

      - name: Migrate and boot the API
        # Proves the real ASGI server starts against a real database and serves
        # a request. A unit test passing does not prove the process boots.
        run: |
          alembic upgrade head
          uvicorn aia_api.main:app --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/v1/ready  | tee /dev/stderr | grep -q '"database":"ok"'

      - name: End-to-end project lifecycle over HTTP
        run: |
          # Every project route is study-scoped and a study belongs to an
          # organization the caller is a member of (ADR 0019: membership is the
          # access), so an end-to-end HTTP smoke test needs a provisioned world.
          # Provisioning runs through the same authorisation path production
          # uses -- there is no back door that skips it.
          eval "$(python - <<'PROVISION'
          import os
          from aia_core.application.scope import AuthenticatedPrincipal, ScopeResolver
          from aia_core.infrastructure.db import create_app_engine, create_session_factory
          from aia_core.infrastructure.repositories import ProjectRepository
          from aia_core.infrastructure.scope_repository import ScopeRepository

          engine = create_app_engine(os.environ["DATABASE_URL"])
          with create_session_factory(engine)() as s:
              repo, resolver = ScopeRepository(s), ScopeResolver(s)
              org, owner = repo.create_organization(
                  slug="aia", name="AIA", owner_email="ci@art-chain.io"
              )
              admin = resolver.organization_context(
                  AuthenticatedPrincipal(
                      user_id=owner.user_id, organization_id=org.organization_id
                  )
              )
              client = repo.create_client(admin, slug="ci-client", name="CI Client")
              study = repo.create_study(
                  admin, client_id=client.client_id, slug="ci-study",
                  name="CI Study", budget_usd=10.0,
              )
              s.commit()
              print(f"export STUDY_ID={study.study_id}")
          PROVISION
          )"
          # A failure inside the substitution leaves STUDY_ID empty; stop here
          # rather than at a 404 three requests later.
          test -n "$STUDY_ID"
          echo "provisioned study $STUDY_ID"

          H='-H Content-Type:application/json -H X-AIA-Subject:ci@art-chain.io'
          BASE="http://localhost:8000/api/v1/studies/$STUDY_ID/projects"

          PID=$(curl -fsS $H -X POST "$BASE" \
                 -d '{"title":"CI smoke","content":{"goal":"g"}}' \
                 | python -c 'import json,sys; print(json.load(sys.stdin)["project_id"])')
          echo "created $PID"

          curl -fsS $H "$BASE/$PID" | grep -q '"current_revision":1'
          curl -fsS $H -X PUT "$BASE/$PID/content" \
               -d '{"content":{"title":"CI smoke","goal":"g","audience":{"m":1}}}' \
               | grep -q '"root_stage":"AUDIENCE"'

          # Unauthenticated access must be refused, not merely unhandled.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE")" = "401"
          echo "project lifecycle OK; unauthenticated access refused"

      - name: The worker boots against the migrated schema and stops on SIGTERM
        # A passing unit test does not prove the process starts: the console
        # entry point, settings from the environment, executor loading and the
        # signal handling are all exercised only here -- with the real executor
        # registry the develop host runs, over a filesystem store.
        env:
          AIA_WORKER_EXECUTORS: aia_executors.registry:build_registry
          AIA_STORAGE_BACKEND: filesystem
          AIA_STORAGE_ROOT: ./tmp/artifacts
          AIA_BUILD_SHA: ${{ github.sha }}
        run: |
          aia-worker > worker.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if grep -q '"worker started"' worker.log; then break; fi
            sleep 1
          done
          kill -TERM "$PID"
          wait "$PID"
          cat worker.log
          grep -q '"worker stopped"' worker.log
          # It must have *worked*, not merely survived: the loop outlives a
          # database error by design, so an unmigrated schema would still exit 0.
          ! grep -q '"level": "ERROR"' worker.log

  develop-host-config:
    name: Develop host configuration (Caddy, Compose, scripts)
    # The Caddyfile decides what the product hostname is -- AIA and nothing of
    # 18.6.6 (ADR 0015, 0018) -- and ships in the deploy bundle; a syntax error
    # would first show as a failed deployment on the host. Validated here with
    # the Caddy image the host runs and placeholder values, never real
    # configuration. So is the separate 18.6.6 reference setup (deploy/reference).
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e AIA_PUBLIC_HOSTNAME=aia.example.test \
            -e AIA_ACME_EMAIL=ops@example.test \
            -v "$PWD/deploy/develop/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: The product hostname is AIA, and nothing of 18.6.6 is served
        run: |
          # tools/caddy_routes.py says what must never go missing (ADR 0015, 0018):
          # one hostname; / is a redirect to /app/clients; /app is behind AIA's own
          # gate, without the session cookie passed on; nothing serves the 18.6.6
          # document, and /classic is the web client's page; nothing reaches the
          # unit or any upstream but the API and the web client. The old oracle
          # hostname is set so that a site for it, if one came back, shows up.
          docker run --rm \
            -e AIA_PUBLIC_HOSTNAME=aia.example.test -e AIA_LEGACY_HOSTNAME=legacy.example.test \
            -e AIA_ACME_EMAIL=ops@example.test \
            -v "$PWD/deploy/develop/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > caddy.json
          python3 tools/caddy_routes.py caddy.json

      - name: Validate the Compose file
        run: |
          cat > placeholder.env <<'ENV'
          AIA_ACME_EMAIL=ops@example.test
          AIA_COGNITO_CLIENT_ID=placeholder
          AIA_COGNITO_DOMAIN=auth.example.test
          AIA_COGNITO_USER_POOL_ID=eu-central-1_placeholder
          AIA_IMAGE_REGISTRY=registry.example.test
          AIA_IMAGE_TAG=0000000000000000000000000000000000000000
          AIA_PUBLIC_HOSTNAME=aia.example.test
          AIA_STORAGE_BUCKET=placeholder
          AWS_REGION=eu-central-1
          POSTGRES_PASSWORD=placeholder
          ENV
          docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml config -q
          # A saved SSM setting is ineffective unless Compose passes it to the API.
          # Check both values through Compose's real interpolation, not YAML text.
          for flag_value in false true; do
            AIA_SOCIOMAPPING_EXPERIMENTAL_ENABLED="$flag_value" \
              docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml \
              config --format json > composed.json
            python3 -c 'import json,sys; assert json.load(open("composed.json"))["services"]["api"]["environment"]["AIA_SOCIOMAPPING_EXPERIMENTAL_ENABLED"] == sys.argv[1]' "$flag_value"
          done
          # The answerability gate is on for develop (the owner's D1, 2026-10-17, ADR 0025): with no
          # value the API gets true, and an SSM value of false still turns it off there.
          docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml \
            config --format json > composed.json
          python3 -c 'import json; assert json.load(open("composed.json"))["services"]["api"]["environment"]["AIA_RESEARCH_ANSWERABILITY_GATE"] == "true"'
          AIA_RESEARCH_ANSWERABILITY_GATE=false \
            docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml \
            config --format json > composed.json
          python3 -c 'import json; assert json.load(open("composed.json"))["services"]["api"]["environment"]["AIA_RESEARCH_ANSWERABILITY_GATE"] == "false"'
          # ADR 0018 decision 5: the product stack is AIA's five services, nothing else.
          services="$(docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml config --services | sort | tr '\n' ' ')"
          test "$services" = "api caddy postgres web worker " || { echo "::error::product services: $services"; exit 1; }

      - name: Validate GlitchTip's Compose project
        run: |
          # deploy/develop/errors: GlitchTip and its own database, a project of its own on
          # the product's network (plan error-tracking). Its two secrets are required.
          if docker compose --env-file placeholder.env -f deploy/develop/errors/docker-compose.yml config -q 2>/dev/null; then
            echo "::error::GlitchTip's project starts without its secrets"; exit 1
          fi
          printf 'GLITCHTIP_DB_PASSWORD=placeholder\nGLITCHTIP_SECRET_KEY=placeholder\n' > errors.env
          cat placeholder.env >> errors.env
          docker compose --env-file errors.env -f deploy/develop/errors/docker-compose.yml config -q
          # The product's services are told where to report only through these two keys.
          AIA_ERROR_TRACKING_DSN=http://k@glitchtip:8000/1 AIA_WEB_ERROR_TRACKING_DSN=https://k@errors.aia.example.test/2 \
            docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml config --format json > composed.json
          python3 - <<'PY'
          import json
          env = {name: s["environment"] for name, s in json.load(open("composed.json"))["services"].items()}
          assert env["api"]["AIA_ERROR_TRACKING_DSN"] == "http://k@glitchtip:8000/1"
          assert env["worker"]["AIA_ERROR_TRACKING_DSN"] == "http://k@glitchtip:8000/1"
          assert env["web"]["AIA_WEB_ERROR_TRACKING_DSN"] == "https://k@errors.aia.example.test/2"
          assert "AIA_ERROR_TRACKING_DSN" not in env["web"], "the backend DSN stays inside"
          PY

      - name: Validate the report editor's Compose project
        run: |
          # deploy/develop/docs: ONLYOFFICE Docs, a project of its own (plan
          # report-editor-hosting). Its JWT secret is required; its image is upstream's,
          # pinned by digest; its request filter, plugins and ports stay as the plan says;
          # only Caddy shares its network.
          if docker compose --env-file placeholder.env -f deploy/develop/docs/docker-compose.yml config -q 2>/dev/null; then
            echo "::error::the Document Server's project starts without its JWT secret"; exit 1
          fi
          printf 'AIA_ONLYOFFICE_JWT_SECRET=placeholder\n' > docs.env
          cat placeholder.env >> docs.env
          docker compose --env-file docs.env -f deploy/develop/docs/docker-compose.yml config --format json > docs.json
          docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml config --format json > composed.json
          python3 - <<'PY'
          import json
          docs = json.load(open("docs.json"))
          (name, oo), = docs["services"].items()
          env = oo["environment"]
          assert name == "onlyoffice"
          assert oo["image"].startswith("onlyoffice/documentserver:") and "@sha256:" in oo["image"], oo["image"]
          assert "ports" not in oo, "the Document Server publishes no port"
          assert env["JWT_ENABLED"] == "true" and env["JWT_SECRET"] == "placeholder"
          for key in ("ALLOW_PRIVATE_IP_ADDRESS", "ALLOW_META_IP_ADDRESS", "PLUGINS_ENABLED",
                      "USE_UNAUTHORIZED_STORAGE", "WOPI_ENABLED", "EXAMPLE_ENABLED"):
              assert env[key] == "false", key
          assert docs["networks"]["docs"]["name"] == "aia-docs" and docs["networks"]["docs"]["external"]
          # Its one configuration file: a timed force-save and nothing else, read-only, and never
          # local.json, which the image's start script writes with the JWT secret.
          conf = "/etc/onlyoffice/documentserver/local-production-linux.json"
          start = "/aia/start-fixed-cache-tag.sh"
          mounts = [v for v in oo["volumes"] if v["type"] == "bind"]
          assert [(m["target"], m.get("read_only")) for m in mounts] == [(conf, True), (start, True)], mounts
          local = json.load(open("deploy/develop/docs/local-production-linux.json"))
          assert local == {"services": {"CoAuthoring": {"autoAssembly": {"enable": True, "interval": "5m"}}}}, local
          # api.js under a fixed cache tag (RPT8e's integrity): upstream's entrypoint, then its own
          # flush-cache script with -h; healthy only once api.js carries the tag. Word characters
          # only, as tools/caddy_routes.py's version prefix reads them.
          # The tag is md5("aia-documentserver-" + the image's tag), so a new image forces a new tag
          # (it is upstream's only cache-buster) and, with it, a new integrity.
          import hashlib, os, re
          assert oo["entrypoint"] == [start], oo["entrypoint"]
          assert os.access("deploy/develop/docs/start-fixed-cache-tag.sh", os.X_OK)
          version = oo["image"].split(":", 1)[1].split("@", 1)[0]
          tag = hashlib.md5(f"aia-documentserver-{version}".encode()).hexdigest()
          assert env["AIA_DS_CACHE_TAG"] == tag, (env["AIA_DS_CACHE_TAG"], version)
          health = " ".join(oo["healthcheck"]["test"])
          prefix = ".".join(version.split(".")[:3])  # api.js's own version prefix, /9.4.0-<tag>
          # The variable as the container's shell expands it ($$ escaped in the file). Spelled in
          # parts, so Actions never reads an expression in it.
          assert prefix + "-$$" + "{AIA_DS_CACHE_TAG}'" in health, health
          product = json.load(open("composed.json"))
          on_docs = sorted(n for n, s in product["services"].items() if "docs" in s.get("networks", {}))
          assert on_docs == ["caddy"], on_docs
          assert product["networks"]["docs"]["name"] == "aia-docs"
          assert not any("ONLYOFFICE" in k for k in product["services"]["web"]["environment"]), \
              "the web client gets nothing of the editor's secret"
          api = product["services"]["api"]["environment"]
          assert api["AIA_ONLYOFFICE_URL"] == "" and api["AIA_ONLYOFFICE_JWT_SECRET"] == "", \
              "the editor is off unless SSM switches it on"
          # The integrity is versioned beside the tag (docs/), so a rollback carries its own.
          assert re.fullmatch(r"sha384-[A-Za-z0-9+/]{64}", api["AIA_ONLYOFFICE_API_INTEGRITY"]), \
              api["AIA_ONLYOFFICE_API_INTEGRITY"]
          assert not any("ONLYOFFICE" in k for k in product["services"]["worker"]["environment"])
          PY

      - name: The deploy bundle of an older SHA
        run: |
          # deploy-develop.yml runs from develop's head but checks out the SHA it deploys, which
          # can predate a directory the bundle names (run 39811181434: docs/ at 013f2e11). Its
          # "Ship the deploy bundle" step is run as written, in the shell Actions gives a step
          # (bash -eo pipefail), S3 stubbed, on that SHA and on this tree: each bundle holds what
          # its tree has, docs/ only where it exists.
          old=013f2e11250a55b4754711f7cb256d3ccc7dbd6d
          git fetch --no-tags --depth=1 origin "$old"
          git worktree add --detach /tmp/old-sha "$old"
          python3 - <<'PY' > /tmp/bundle-step.sh
          import re
          text = open(".github/workflows/deploy-develop.yml").read()
          step = text.split("- name: Ship the deploy bundle", 1)[1].split("\n      - name:", 1)[0]
          body = step.split("run: |\n", 1)[1]
          print("\n".join(line[10:] for line in body.splitlines()))
          PY
          mkdir -p /tmp/stub && printf '#!/bin/sh\ncp "$3" "/tmp/stub/$(basename "$4")"\n' > /tmp/stub/aws
          chmod +x /tmp/stub/aws
          for tree in /tmp/old-sha "$PWD"; do
            (cd "$tree" && PATH="/tmp/stub:$PATH" OPS_BUCKET=b SHA=bundle GITHUB_STEP_SUMMARY=/dev/null \
              bash --noprofile --norc -eo pipefail /tmp/bundle-step.sh)
            tar -tzf /tmp/stub/bundle.tar.gz | cut -d/ -f1 | sort -u > "/tmp/stub/$(basename "$tree").txt"
          done
          grep -qx docs "/tmp/stub/$(basename "$PWD").txt" || { echo "::error::this tree's bundle has no docs/"; exit 1; }
          ! grep -qx docs /tmp/stub/old-sha.txt || { echo "::error::the old SHA's bundle names docs/"; exit 1; }
          for item in docker-compose.yml Caddyfile bin population errors; do
            grep -qx "$item" /tmp/stub/old-sha.txt || { echo "::error::the old SHA's bundle lacks $item"; exit 1; }
          done

      - name: Caddy loads through Compose
        run: |
          # The same check bin/deploy.sh makes before it replaces anything (run 10,
          # 2026-09-23, found a Caddyfile unparseable with the host's env and the
          # site down): the product's Caddyfile needs nothing but the product's
          # settings.
          docker compose --env-file placeholder.env -f deploy/develop/docker-compose.yml \
            run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate the 18.6.6 reference setup
        run: |
          # deploy/reference: the unit behind a basic-auth gate on the host's
          # loopback, on its external working volume (ADR 0018). Its settings come
          # from the host's env file; the quoted hash must reach Caddy unmangled.
          hash="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext placeholder)"
          cat > reference.env <<'ENV'
          AIA_IMAGE_REGISTRY=registry.example.test
          AWS_REGION=eu-central-1
          AIA_OPS_BUCKET=placeholder
          AIA_LEGACY_BASIC_USER='oracle'
          ENV
          printf "AIA_LEGACY_BASIC_HASH='%s'\n" "$hash" >> reference.env
          AIA_REFERENCE_TAG=0000000 docker compose --env-file reference.env -f deploy/reference/docker-compose.yml config -q
          # Compose refuses even a `run` without the external volume; a throwaway
          # one, through the override, stands in for the host's here.
          docker volume create aia-ci-reference-state >/dev/null
          resolved="$(AIA_REFERENCE_TAG=0000000 AIA_REFERENCE_STATE_VOLUME=aia-ci-reference-state \
            docker compose --env-file reference.env -f deploy/reference/docker-compose.yml \
            run --rm --no-deps -T gate printenv AIA_LEGACY_BASIC_HASH)"
          test "$resolved" = "$hash" || { echo "::error::the quoted hash was mangled on its way to the gate"; exit 1; }
          docker run --rm -e AIA_LEGACY_BASIC_USER=oracle -e AIA_LEGACY_BASIC_HASH="$hash" \
            -v "$PWD/deploy/reference/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Shell scripts parse
        run: for f in deploy/develop/bin/*.sh deploy/reference/bin/*.sh; do bash -n "$f"; done

      - name: Host Python scripts parse
        run: python3 -m py_compile deploy/develop/bin/*.py

  security:
    name: Security and dependency scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The runner's own pip is installed in the same environment and audited with
      # everything else; the image's is old enough to carry advisories of its own.
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Blocking on any known advisory: pip-audit has no severity filter. An exception
      # is a dated, individually justified --ignore-vuln with a comment (ARCHITECTURE.md §8).
      # AIA's own packages are not on PyPI, so --strict would fail on them, and
      # --skip-editable counts each skip as a failure under --strict; the audit reads
      # every installed third-party distribution, frozen, instead.
      - name: Audit Python dependencies
        run: |
          pip install -e "packages/aia_core[postgres,s3,report,bedrock,documents,errors]" -e "apps/worker" -e "apps/executors" -e "apps/api"
          pip freeze --all --exclude-editable > "$RUNNER_TEMP/third-party.txt"
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/third-party.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Blocking on every high or critical advisory, production and dev, except one
      # audit-allowlist.json names by GHSA id until its recheck date (ARCHITECTURE.md §8).
      # npm ci's own audit is skipped: it judges nothing and asks the same endpoint the gate does.
      - name: Audit npm dependencies
        working-directory: apps/web
        run: |
          npm ci --no-audit
          node scripts/audit-gate.mjs

      - name: No secrets committed
        run: |
          # Fails the build if a provider key shape is committed outside tests.
          # Test directories are excluded deliberately: the secret-redaction tests
          # must contain realistic key shapes in order to prove they are scrubbed,
          # and a real key would never live there. Everything else is scanned.
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{12,}|sk-proj-[A-Za-z0-9_-]{12,}' \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude-dir=tests \
               --exclude-dir=.venv \
               . ; then
            echo "::error::A provider API key appears to be committed."
            exit 1
          fi
          echo "no committed provider keys found outside test fixtures"

  dispatch-develop:
    name: Dispatch verified develop deployment
    needs: [backend, parity, golden-fixtures, oracle-parity, parity-status, api-contract, frontend, startup-smoke, develop-host-config, security]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Deploy the SHA that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-develop.yml --repo "$GITHUB_REPOSITORY" --ref develop \
            -f sha="$GITHUB_SHA" -f migrate=true
          echo "Dispatched develop deployment for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
