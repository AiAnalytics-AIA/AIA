name: Reference unit (18.6.6)

# Build the vendored NPC Panel 18.6.6 unit's image for one SHA and ship
# deploy/reference as a bundle (deploy/reference/README.md). The unit is the
# parity oracle and the behavioural reference, never part of AIA (ADR 0018
# decision 5): the product's deploy (deploy-develop.yml) neither builds nor pulls
# it. Dispatched by hand only, and it changes nothing on the host: starting the
# reference there is an operator's command (deploy/reference/bin/up.sh).
#
# It assumes the deploy role through GitHub's OIDC provider in the develop
# environment, as the deploy does; the role may push the images in
# infra/develop local.images (aia-legacy-panel among them) and put objects
# under deploy/ in the ops bucket, and nothing else it uses here.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA whose legacy/npc-panel-18.6.6 to build (defaults to the head of the dispatching ref)"
        required: false
        default: ""

concurrency:
  group: reference-unit
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and ship the reference unit
    runs-on: ubuntu-latest
    environment: develop
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.AIA_ECR_REGISTRY }}
      OPS_BUCKET: ${{ vars.AIA_OPS_BUCKET }}
    steps:
      - name: Resolve the SHA
        id: pick
        run: |
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected a full 40-character SHA, got '$sha'"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          persist-credentials: false

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AIA_DEPLOY_ROLE_ARN }}
          role-session-name: aia-reference-unit-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push aia-legacy-panel
        # Its own Dockerfile and context: the code tree is baked in, the
        # licence-bound data is mounted on the host at start.
        uses: docker/build-push-action@v6
        with:
          context: legacy/npc-panel-18.6.6
          push: true
          tags: |
            ${{ env.REGISTRY }}/aia-legacy-panel:${{ env.SHA }}
          build-args: |
            AIA_BUILD_SHA=${{ env.SHA }}
          cache-from: type=gha,scope=legacy
          cache-to: type=gha,scope=legacy,mode=max
          provenance: false

      - name: Ship the reference bundle
        run: |
          tar -czf reference-bundle.tar.gz -C deploy/reference docker-compose.yml Caddyfile README.md bin
          aws s3 cp reference-bundle.tar.gz "s3://$OPS_BUCKET/deploy/reference-$SHA.tar.gz" --only-show-errors
          {
            echo "image $REGISTRY/aia-legacy-panel:$SHA"
            echo "bundle s3://$OPS_BUCKET/deploy/reference-$SHA.tar.gz"
            echo "on the host: deploy/reference/README.md § Getting it onto the host"
          } >> "$GITHUB_STEP_SUMMARY"
