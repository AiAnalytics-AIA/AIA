<!-- @dsCard group="Identity" height=150 subtitle="One set, 24 grid, 1.5 stroke" -->
<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>Icon</title><style>html,body{margin:0;background:var(--surface);}</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.AIA, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h("div",{className:"aia",style:{padding:16,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(92px,1fr))",gap:12}},Object.keys(A.ICONS).map(function(n){return h("div",{key:n,style:{display:"grid",justifyItems:"center",gap:4}},h(A.Icon,{name:n,size:24}),h("span",{className:"aia-enum"},n));})));
</script>
</body>
</html>
