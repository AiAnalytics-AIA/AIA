# The develop environment: one host, five services, ADR 0009.
#
#   caddy         public HTTPS entrypoint (80/443), proxies to web and api: the
#                 product hostname is AIA (ADR 0015) and nothing else
#   web           Next.js standalone, internal only
#   api           FastAPI under uvicorn, internal only
#   worker        aia-worker, no inbound port
#   postgres      PostgreSQL 16 on a named volume, internal only
#
# NPC Panel 18.6.6 is not part of this stack (ADR 0018 decision 5): no image,
# service, volume, hostname, credential, data sync or health check of it. The
# vendored unit runs, when a comparison needs it, from deploy/reference/ beside
# this stack, on the working volume this file used to mount, which neither
# file ever removes.
#
# Every image is pulled by immutable git SHA (AIA_IMAGE_TAG), never by a floating
# tag, so the running deployment is always traceable to one commit. Migrations
# are NOT run by any service here: bin/deploy.sh runs `alembic upgrade head`
# once, from the api image, after a backup and before the services are replaced.
#
# Configuration comes from /opt/aia/develop/.env (root-only, written from SSM
# Parameter Store by bin/write-env.sh); see env.example. Nothing in this file is
# a secret.

name: aia-develop

x-app-env: &app-env
  # develop: a deployed environment (every guard: Cognito, S3, build SHA) that always hosts
  # fictional data, which staging and production refuse (aia_core.domain.deployment).
  AIA_ENV: develop
  AIA_LOG_FORMAT: json
  AIA_LOG_LEVEL: ${AIA_LOG_LEVEL:-INFO}
  AIA_AI_ANALYSIS_ENABLED: ${AIA_AI_ANALYSIS_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://aia:${POSTGRES_PASSWORD}@postgres:5432/aia
  AIA_STORAGE_BACKEND: s3
  AIA_STORAGE_BUCKET: ${AIA_STORAGE_BUCKET}
  AIA_STORAGE_REGION: ${AWS_REGION}
  AIA_STORAGE_PREFIX: ${AIA_STORAGE_PREFIX:-}
  AIA_STORAGE_KMS_KEY_ID: ${AIA_STORAGE_KMS_KEY_ID:-}
  AWS_REGION: ${AWS_REGION}
  AWS_DEFAULT_REGION: ${AWS_REGION}
  # Credentials are deliberately absent: boto3 finds the instance role through
  # IMDS. The containers reach 169.254.169.254 through the host's default route.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AIA_PUBLIC_HOSTNAME: ${AIA_PUBLIC_HOSTNAME}
      AIA_ACME_EMAIL: ${AIA_ACME_EMAIL}
    # The Caddyfile's hash, so a changed file changes this service's
    # configuration and `compose up` recreates Caddy; Caddy reads the file only
    # at start (bin/lib.sh, OI-45). Unset outside the deploy scripts.
    labels:
      aia.caddyfile-sha256: ${AIA_CADDYFILE_SHA256:-unset}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ${AIA_IMAGE_REGISTRY}/aia-web:${AIA_IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Read at request time by the web container's /config route and handed to
      # the browser, so one SHA-tagged image serves any environment. Same-origin:
      # the browser calls /api/v1 on the public hostname and Caddy routes it, so
      # no CORS configuration exists anywhere and AIA_API_BASE stays empty.
      AIA_API_BASE: ""
      # Public configuration display only; no role credentials reach the web.
      AIA_AI_RUNTIME_ENABLED: ${AIA_AI_RUNTIME_ENABLED:-false}
      AIA_AI_RESEARCH_AGENTS_ENABLED: ${AIA_AI_RESEARCH_AGENTS_ENABLED:-false}
      AIA_AI_ANALYSIS_ENABLED: ${AIA_AI_ANALYSIS_ENABLED:-false}
      AIA_BEDROCK_REGION: ${AIA_BEDROCK_REGION:-}
      AIA_BEDROCK_MODEL_ID: ${AIA_BEDROCK_MODEL_ID:-}
      AIA_AI_ROUTE_APPROVED_FOR: ${AIA_AI_ROUTE_APPROVED_FOR:-}
      AIA_COGNITO_DOMAIN: ${AIA_COGNITO_DOMAIN}
      AIA_COGNITO_CLIENT_ID: ${AIA_COGNITO_CLIENT_ID}
      AIA_PUBLIC_ORIGIN: https://${AIA_PUBLIC_HOSTNAME}
    expose: ["3000"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  api:
    image: ${AIA_IMAGE_REGISTRY}/aia-api:${AIA_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      AIA_IDENTITY_PROVIDER: cognito
      AIA_COGNITO_REGION: ${AWS_REGION}
      AIA_COGNITO_USER_POOL_ID: ${AIA_COGNITO_USER_POOL_ID}
      AIA_COGNITO_CLIENT_ID: ${AIA_COGNITO_CLIENT_ID}
      AIA_COGNITO_TOKEN_USE: id
      # Same-origin through Caddy: an empty list means no CORS middleware at all.
      AIA_CORS_ORIGINS: "[]"
      # Where an administrator may try a draft system prompt (ADR 0020): the same list the
      # worker reads below, so the API can refuse a draft on any other client before a job
      # exists. Empty means no draft can be run anywhere.
      AIA_AI_FICTIONAL_CLIENT_IDS: ${AIA_AI_FICTIONAL_CLIENT_IDS:-}
      # What the worker reserves per model request, read by the API too so it can say what a
      # run can cost at most before it starts (the spend confirmation, plan 5b.2). Unset means
      # the ceiling is unknown, and a study with a spend limit does not start such a run.
      AIA_AI_FIELDWORK_RESERVATION_USD: ${AIA_AI_FIELDWORK_RESERVATION_USD:-}
      AIA_AI_ANALYSIS_RESERVATION_USD: ${AIA_AI_ANALYSIS_RESERVATION_USD:-}
      # The same for a Deep Research run (deep-research-web-search.md chunks 22-23): each kind
      # of request's reservation is derived from the route's prices, the model's window, the
      # research output limit and the thinking budget, as the worker derives it; then the
      # public route and the mode switches the worker composes from.
      AIA_BEDROCK_INPUT_USD_PER_MTOK: ${AIA_BEDROCK_INPUT_USD_PER_MTOK:-}
      AIA_BEDROCK_OUTPUT_USD_PER_MTOK: ${AIA_BEDROCK_OUTPUT_USD_PER_MTOK:-}
      AIA_BEDROCK_CACHE_READ_USD_PER_MTOK: ${AIA_BEDROCK_CACHE_READ_USD_PER_MTOK:-}
      AIA_BEDROCK_CACHE_WRITE_USD_PER_MTOK: ${AIA_BEDROCK_CACHE_WRITE_USD_PER_MTOK:-}
      AIA_BEDROCK_CONTEXT_WINDOW_TOKENS: ${AIA_BEDROCK_CONTEXT_WINDOW_TOKENS:-}
      AIA_AI_RESEARCH_MAX_OUTPUT_TOKENS: ${AIA_AI_RESEARCH_MAX_OUTPUT_TOKENS:-}
      AIA_DEEP_RESEARCH_THINKING_BUDGET_TOKENS: ${AIA_DEEP_RESEARCH_THINKING_BUDGET_TOKENS:-}
      AIA_DEEP_RESEARCH_WIKIPEDIA_ENABLED: ${AIA_DEEP_RESEARCH_WIKIPEDIA_ENABLED:-false}
      AIA_DEEP_RESEARCH_AGENT_DIRECTED: ${AIA_DEEP_RESEARCH_AGENT_DIRECTED:-false}
      AIA_DEEP_RESEARCH_LEAD: ${AIA_DEEP_RESEARCH_LEAD:-false}
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  worker:
    image: ${AIA_IMAGE_REGISTRY}/aia-worker:${AIA_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      AIA_WORKER_EXECUTORS: aia_executors.registry:build_registry
      AIA_WORKER_LEASE_SECONDS: ${AIA_WORKER_LEASE_SECONDS:-120}
      AIA_WORKER_HEARTBEAT_SECONDS: ${AIA_WORKER_HEARTBEAT_SECONDS:-30}
      AIA_WORKER_POLL_SECONDS: ${AIA_WORKER_POLL_SECONDS:-2}
      # The AI runtime (ADR 0010, aia_executors/ai_runtime.py). Off unless
      # AIA_AI_RUNTIME_ENABLED is true; when on, every key must be set or the
      # worker refuses to start. Values come from SSM /aia/develop/<lower_case_key>
      # through bin/write-env.sh; none has a default here. Credentials are the
      # instance role's (IMDS), never a key.
      AIA_AI_RUNTIME_ENABLED: ${AIA_AI_RUNTIME_ENABLED:-false}
      AIA_AI_ROUTE_ID: ${AIA_AI_ROUTE_ID:-}
      AIA_BEDROCK_REGION: ${AIA_BEDROCK_REGION:-}
      AIA_BEDROCK_MODEL_ID: ${AIA_BEDROCK_MODEL_ID:-}
      AIA_AI_POLICY_VERSION: ${AIA_AI_POLICY_VERSION:-}
      AIA_BEDROCK_INPUT_USD_PER_MTOK: ${AIA_BEDROCK_INPUT_USD_PER_MTOK:-}
      AIA_BEDROCK_OUTPUT_USD_PER_MTOK: ${AIA_BEDROCK_OUTPUT_USD_PER_MTOK:-}
      AIA_BEDROCK_CACHE_READ_USD_PER_MTOK: ${AIA_BEDROCK_CACHE_READ_USD_PER_MTOK:-}
      AIA_BEDROCK_CACHE_WRITE_USD_PER_MTOK: ${AIA_BEDROCK_CACHE_WRITE_USD_PER_MTOK:-}
      AIA_BEDROCK_MAX_OUTPUT_TOKENS: ${AIA_BEDROCK_MAX_OUTPUT_TOKENS:-}
      AIA_BEDROCK_CONTEXT_WINDOW_TOKENS: ${AIA_BEDROCK_CONTEXT_WINDOW_TOKENS:-}
      AIA_BEDROCK_TIMEOUT_SECONDS: ${AIA_BEDROCK_TIMEOUT_SECONDS:-}
      AIA_AI_ROUTE_EU_PROCESSING_APPROVED: ${AIA_AI_ROUTE_EU_PROCESSING_APPROVED:-}
      AIA_AI_ROUTE_EXCLUDED_FROM_TRAINING: ${AIA_AI_ROUTE_EXCLUDED_FROM_TRAINING:-}
      AIA_AI_ROUTE_APPROVED_FOR: ${AIA_AI_ROUTE_APPROVED_FOR:-}
      AIA_AI_ROUTE_RETENTION_DAYS: ${AIA_AI_ROUTE_RETENTION_DAYS:-}
      AIA_AI_RESEARCH_AGENTS_ENABLED: ${AIA_AI_RESEARCH_AGENTS_ENABLED:-false}
      AIA_AI_ANALYSIS_ENABLED: ${AIA_AI_ANALYSIS_ENABLED:-false}
      AIA_AI_ANALYSIS_MAX_OUTPUT_TOKENS: ${AIA_AI_ANALYSIS_MAX_OUTPUT_TOKENS:-}
      AIA_AI_ANALYSIS_RESERVATION_USD: ${AIA_AI_ANALYSIS_RESERVATION_USD:-}
      AIA_DEEP_RESEARCH_ENABLED: ${AIA_DEEP_RESEARCH_ENABLED:-false}
      AIA_DEEP_RESEARCH_WIKIPEDIA_ENABLED: ${AIA_DEEP_RESEARCH_WIKIPEDIA_ENABLED:-false}
      AIA_DEEP_RESEARCH_THINKING_BUDGET_TOKENS: ${AIA_DEEP_RESEARCH_THINKING_BUDGET_TOKENS:-}
      AIA_DEEP_RESEARCH_AGENT_DIRECTED: ${AIA_DEEP_RESEARCH_AGENT_DIRECTED:-false}
      AIA_DEEP_RESEARCH_LEAD: ${AIA_DEEP_RESEARCH_LEAD:-false}
      AIA_DEEP_RESEARCH_FAN_OUT: ${AIA_DEEP_RESEARCH_FAN_OUT:-false}
      AIA_DEEP_RESEARCH_MODEL_CONCURRENCY: ${AIA_DEEP_RESEARCH_MODEL_CONCURRENCY:-}
      AIA_AI_RESEARCH_MAX_OUTPUT_TOKENS: ${AIA_AI_RESEARCH_MAX_OUTPUT_TOKENS:-}
      AIA_AI_RESEARCH_RESERVATION_USD: ${AIA_AI_RESEARCH_RESERVATION_USD:-}
      AIA_AI_MATERIAL_CLASSIFICATIONS: ${AIA_AI_MATERIAL_CLASSIFICATIONS:-[]}
      AIA_AI_FIELDWORK_MAX_OUTPUT_TOKENS: ${AIA_AI_FIELDWORK_MAX_OUTPUT_TOKENS:-}
      AIA_AI_FIELDWORK_RESERVATION_USD: ${AIA_AI_FIELDWORK_RESERVATION_USD:-}
      AIA_AI_FICTIONAL_CLIENT_IDS: ${AIA_AI_FICTIONAL_CLIENT_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    # A first SIGTERM releases the executing step; give it the lease's worth of
    # time to reach a checkpoint before Compose sends SIGKILL.
    stop_grace_period: 60s
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aia
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # No `ports:` entry, deliberately. The database is reachable only on the
    # internal Compose network; bin/smoke.sh asserts nothing listens on 5432 on
    # the host.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aia -d aia"]
      interval: 10s
      timeout: 3s
      retries: 10
    shm_size: 256m
    logging: *logging

networks:
  edge:
  internal:
    # No outbound NAT is needed by web; api and worker reach S3 and IMDS, so the
    # network stays a normal bridge. It is simply not published.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  # Not legacy_state: the 18.6.6 unit's working volume (aia-develop_legacy_state)
  # is deploy/reference's, declared external there. Undeclared here, nothing this
  # file runs -- `up --remove-orphans` included -- can remove it.
