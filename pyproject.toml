# Root tool configuration for the Python workspace.
#
# This file holds *only* shared tool settings. Each deployable unit keeps its own
# pyproject.toml with its dependencies and build config:
#
#   packages/aia_core   domain, application and infrastructure library
#   apps/api            FastAPI service
#
# Tool config lives here because ruff and mypy are invoked from the repository
# root by CI and by `make check`, and per-package config is not discovered from
# there -- which silently dropped a mypy override until this file existed.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "TID251"]
# N818 requires an "Error" suffix on every exception. Our exception names are
# domain vocabulary that reads better as-is -- `raise ScopeDenied(...)`,
# `except ExpiredToken` -- and they match the terms used in the architecture
# docs. Renaming them would make the code read worse for no safety gain.
ignore = ["N818"]

# Network egress is fenced (TID251). A socket opened outside the transport modules
# has no residency check, no host pacing, no TLS-refusal handling and no record:
# web reads go through RetrievalGate (application/web_retrieval.py) over the wires in
# infrastructure/web_retrieval_live.py, model calls through GovernedModelGateway over
# model_adapters/live_transport.py. The ban is by import, so importlib and
# __import__ are not seen; tools/layer_check.sh's rules and review cover those.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib3".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"httpx".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"requests".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"urllib.request".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"http.client".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"socket".msg = "Network egress goes through the transport modules: RetrievalGate over infrastructure/web_retrieval_live.py, or GovernedModelGateway over model_adapters/live_transport.py"
"ssl".msg = "TLS handling lives in the transport modules: infrastructure/http_transport.py (certificate_refused) and the live wires behind RetrievalGate and GovernedModelGateway"

[tool.ruff.lint.per-file-ignores]
# Tests assert on private behaviour deliberately, and fixture-heavy signatures
# trip the unused-argument and boolean-trap rules without being wrong. They also
# stand up local stub servers (CLAUDE.md §7), which needs sockets: TID251. Anchored to
# the four test trees by name: "**/tests/**" also exempted any source package named
# tests (measured: infrastructure/tests/egress.py importing urllib3 passed), and so does
# "packages/*/tests/**", because ruff's * crosses a "/".
"packages/aia_core/tests/**" = ["SLF001", "PLR2004", "TID251"]
"apps/api/tests/**" = ["SLF001", "PLR2004", "TID251"]
"apps/worker/tests/**" = ["SLF001", "PLR2004", "TID251"]
"apps/executors/tests/**" = ["SLF001", "PLR2004", "TID251"]
# The egress fence's exits (TID251), each the one module that owns its wire.
"packages/aia_core/src/aia_core/infrastructure/model_adapters/live_transport.py" = ["TID251"]  # urllib3: the model routes' HTTPS
"packages/aia_core/src/aia_core/infrastructure/web_retrieval_live.py" = ["TID251"]  # urllib3 + socket.getaddrinfo: public web reads, resolved then pinned
"packages/aia_core/src/aia_core/infrastructure/web_retrieval_brave.py" = ["TID251"]  # urllib3: the Brave search API
"packages/aia_core/src/aia_core/infrastructure/common_crawl.py" = ["TID251"]  # urllib3: Athena's JSON POST
"packages/aia_core/src/aia_core/infrastructure/http_transport.py" = ["TID251"]  # ssl: certificate_refused reads SSLCertVerificationError
"apps/api/src/aia_api/identity/cognito.py" = ["TID251"]  # urllib.request: the Cognito JWKS fetch
"apps/worker/src/aia_worker/settings.py" = ["TID251"]  # socket.gethostname for the worker id; no egress

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Alembic revisions are generated code; they are linted for syntax by being
# executed in CI rather than type-checked.
exclude = ["migrations/versions/"]

# boto3 ships no type stubs and is an optional dependency, imported lazily inside
# S3ArtifactStore so that nothing else in the codebase loads an AWS SDK. The
# untyped boundary is one function; pulling in boto3-stubs for it is not worth
# the dependency.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# openpyxl ships no type stubs either, and is read in one function
# (aia_core.infrastructure.document_text._xlsx), which turns every value into str.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# olefile ships no type stubs; it is used in one function
# (aia_core.infrastructure.source_reading._doc_text), only to open a compound file and
# read two streams as bytes.
[[tool.mypy.overrides]]
module = ["olefile", "olefile.*"]
ignore_missing_imports = true

# xlrd ships no type stubs; it is read in one function
# (aia_core.infrastructure.source_reading._xls), whose cells become str.
[[tool.mypy.overrides]]
module = ["xlrd", "xlrd.*"]
ignore_missing_imports = true

# Import contracts, checked by `lint-imports` from `make layer_check`
# (tools/layer_check.sh is the grep half; this is the import-graph half, for a rule
# a grep cannot state exactly). ARCHITECTURE.md §3.
[tool.importlinter]
root_packages = ["aia_core", "aia_api", "aia_worker", "aia_executors"]
include_external_packages = false

# ADR 0005: a model call goes through GovernedModelGateway, which an executor
# composition builds over an adapter. The adapters are therefore imported by the
# three compositions that build a route and by nothing else -- not the gateway,
# which receives them through its protocol, not the API, not a web route. An
# import anywhere else is a second model-call path the gateway never sees.
# Direct imports only: a module that imports a composition (the registry, a test
# harness) reaches the adapters through the composition, which is the point.
# "aia_core.infrastructure.*", not the package: a source that contains the
# forbidden package finds no chain to it, and an infrastructure module's import
# went unreported (measured). The two __init__ modules the wildcard leaves out are
# a grep rule in tools/layer_check.sh. Every ignore below must match an import, or
# lint-imports fails: an allowance outlives nothing it was for.
[[tool.importlinter.contracts]]
name = "only the executor compositions import the model adapters (ADR 0005)"
type = "forbidden"
source_modules = [
    "aia_core.domain",
    "aia_core.application",
    "aia_core.infrastructure.*",
    "aia_api",
    "aia_worker",
    "aia_executors",
]
forbidden_modules = ["aia_core.infrastructure.model_adapters"]
allow_indirect_imports = true
ignore_imports = [
    "aia_core.infrastructure.model_adapters.** -> aia_core.infrastructure.model_adapters.**",
    "aia_executors.ai_runtime -> aia_core.infrastructure.model_adapters.**",
    "aia_executors.ai_runtime -> aia_core.infrastructure.model_adapters",
    "aia_executors.deep_research_live -> aia_core.infrastructure.model_adapters.**",
    "aia_executors.deep_research_runtime -> aia_core.infrastructure.model_adapters.**",
    "aia_executors.deep_research_runtime -> aia_core.infrastructure.model_adapters",
]

# Live network wires are imported by the compositions that build a route and by
# nothing else: deep_research_live and deep_research_runtime (web search, Common
# Crawl), ai_runtime (the model route's transport). A module importing a wire would
# open a connection no composition configured -- no residency check, pacing or record.
# Ruff's TID251 keeps urllib3 and socket inside these modules; this keeps the modules
# inside the compositions. Every app is a source, and the core's domain and
# application layers; no source names a forbidden module's ancestor, so the
# containment blind spot of the contract above does not apply (probed).
# Indirect imports count too: the compositions' own edges are the ignores below, so
# a module that imports a composition (the registry, a test harness) is not flagged
# through them, and anything else that reaches a wire is. RetrievalGate reaches the
# index and the archive through infrastructure/archive_index.py, which loads no wire.
# Every ignore must match an import, or lint-imports fails.
[[tool.importlinter.contracts]]
name = "only the executor compositions import a live network wire"
type = "forbidden"
source_modules = [
    "aia_core.domain",
    "aia_core.application",
    "aia_api",
    "aia_worker",
    "aia_executors",
]
forbidden_modules = [
    "aia_core.infrastructure.web_retrieval_live",
    "aia_core.infrastructure.web_retrieval_brave",
    "aia_core.infrastructure.common_crawl",
    "aia_core.infrastructure.model_adapters.live_transport",
]
allow_indirect_imports = false
ignore_imports = [
    "aia_executors.deep_research_live -> aia_core.infrastructure.common_crawl",
    "aia_executors.deep_research_live -> aia_core.infrastructure.web_retrieval_brave",
    "aia_executors.deep_research_live -> aia_core.infrastructure.web_retrieval_live",
    "aia_executors.deep_research_runtime -> aia_core.infrastructure.common_crawl",
    "aia_executors.deep_research_runtime -> aia_core.infrastructure.web_retrieval_brave",
    "aia_executors.deep_research_runtime -> aia_core.infrastructure.web_retrieval_live",
    "aia_executors.ai_runtime -> aia_core.infrastructure.model_adapters.live_transport",
]

# ARCHITECTURE.md §2: the core's three layers, each importing only the layers
# below it. The domain is pure (no I/O); infrastructure implements what the domain
# names; application orchestrates both. The grep rule this replaces matched only
# `from ..application` / `from aia_core.application`, so `from ...application`
# written from a domain subpackage and `import aia_core.application.x` passed it
# (probed); the import graph sees every form, and indirect chains too. Dynamic
# imports are invisible to both: there is one in the domain
# (domain/methodology/resolution.py, importlib.import_module of a declared
# function's module), checked by its own tests.
[[tool.importlinter.contracts]]
name = "the core's layers: application above infrastructure above domain"
type = "layers"
containers = ["aia_core"]
layers = ["application", "infrastructure", "domain"]

# ARCHITECTURE.md §2: infrastructure owns "SQLAlchemy tables and repositories".
# A use case that selects over the tables itself bypasses the repository that
# carries a table's isolation predicate (owner=, the client, the study), so the
# next query written beside it can forget the predicate and nothing notices.
# Decided 2026-10-16 (architecture-enforcement chunk 5): the application layer
# reads and writes rows only through a repository. The three modules below are
# a ratchet: they predate the rule, each leaves the list when its queries move
# behind a repository, and a line that no longer matches fails the run.
[[tool.importlinter.contracts]]
name = "the application reaches the tables only through a repository"
type = "forbidden"
source_modules = ["aia_core.application"]
forbidden_modules = ["aia_core.infrastructure.tables"]
allow_indirect_imports = true
ignore_imports = [
    "aia_core.application.develop_seed -> aia_core.infrastructure.tables",
    "aia_core.application.scope -> aia_core.infrastructure.tables",
    "aia_core.application.workspace_migration -> aia_core.infrastructure.tables",
]

# The three apps meet only through aia_core and one seam: a step implementation
# depends on the worker's executor protocol (aia_worker.executor), never on the
# loop, and nothing reaches the API. The worker finds the executors at run time
# through AIA_WORKER_EXECUTORS (aia_worker/registry.py, importlib), which no
# graph sees, by design. Source only: the tests cross on purpose (the API's slice
# test drives a real worker).
[[tool.importlinter.contracts]]
name = "the API, the worker and the executors are independent but for the executor seam"
type = "independence"
modules = ["aia_api", "aia_worker", "aia_executors"]
ignore_imports = ["aia_executors.** -> aia_worker.executor"]

# ARCHITECTURE.md §2: transport validates, delegates, serialises. A route that
# imports infrastructure can query, store or decide without the application layer
# seeing it. A ratchet, decided 2026-10-16 (plan architecture-enforcement, chunk 4):
# the routers below imported infrastructure when the contract landed, and are listed
# edge by edge -- a listed router may not take a new infrastructure module either. A
# new router complies. A router leaves the list when it is next touched: move what it
# needs behind the application layer (an error it only catches is re-exported from
# aia_core/application/errors.py), then delete its lines; an entry no import matches
# fails lint-imports, so the list only shrinks. The composition root
# (aia_api.dependencies, main, config, observability) is not a router and is not
# held to this. Direct imports only: a router reaches infrastructure through the
# application layer, which is the point.
[[tool.importlinter.contracts]]
name = "routers reach infrastructure only through the application layer (ratchet)"
type = "forbidden"
source_modules = ["aia_api.routers"]
forbidden_modules = ["aia_core.infrastructure"]
allow_indirect_imports = true
ignore_imports = [
    "aia_api.routers.client_sources -> aia_core.infrastructure.client_source_repository",
    "aia_api.routers.client_sources -> aia_core.infrastructure.storage",
    "aia_api.routers.deep_research -> aia_core.infrastructure.deep_research_settings_repository",
    "aia_api.routers.deep_research -> aia_core.infrastructure.storage",
    "aia_api.routers.deep_research -> aia_core.infrastructure.study_design_repository",
    "aia_api.routers.deep_research_settings -> aia_core.infrastructure.deep_research_settings_repository",
    "aia_api.routers.methodology -> aia_core.infrastructure.methodology_repository",
    "aia_api.routers.population -> aia_core.infrastructure.population_repository",
    "aia_api.routers.research -> aia_core.infrastructure.artifact_repository",
    "aia_api.routers.research -> aia_core.infrastructure.report_pdf",
    "aia_api.routers.research -> aia_core.infrastructure.storage",
    "aia_api.routers.research -> aia_core.infrastructure.study_design_repository",
    "aia_api.routers.research -> aia_core.infrastructure.workflow_repository",
    "aia_api.routers.runs -> aia_core.infrastructure.artifact_repository",
    "aia_api.routers.runs -> aia_core.infrastructure.repositories",
    "aia_api.routers.runs -> aia_core.infrastructure.storage",
    "aia_api.routers.runs -> aia_core.infrastructure.workflow_repository",
    "aia_api.routers.system_prompts -> aia_core.infrastructure.prompt_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.artifact_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.client_knowledge_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.client_profile_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.client_source_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.questionnaire_file",
    "aia_api.routers.workspace -> aia_core.infrastructure.storage",
    "aia_api.routers.workspace -> aia_core.infrastructure.study_design_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.study_workspace_repository",
    "aia_api.routers.workspace -> aia_core.infrastructure.workflow_repository",
]

[tool.pytest.ini_options]
# Both test directories are called `tests`, so they are not importable packages.
# Helpers are shared through conftest fixtures rather than imports.
addopts = "-ra --strict-markers"
markers = [
    "parity: compares this implementation against the legacy prototype (needs AIA_LEGACY_REFERENCE) or the reference repository's contracts (needs AIA_REFERENCE_REPO)",
    "postgres: requires a live PostgreSQL instance via DATABASE_URL",
    "golden: compares production against a golden fixture from the reference repository (needs AIA_REFERENCE_REPO)",
    "oracle: reaches the running 18.6.6 unit over HTTP (needs AIA_LEGACY_REFERENCE_URL and its basic-auth credentials)",
]
